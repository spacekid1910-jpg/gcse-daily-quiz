opic":"Food security and farming","q":"Keeping animals in small warm pens improves efficiency of food production but...","a":"Raises ethical concerns","w":["Reduces growth rate","Increases energy loss","Lowers meat production"],"why":"Less movement means less energy is wasted."},{"id":"chem-001","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Atoms, elements and compounds","q":"Which of these is a mixture?","a":"Air","w":["Water","Carbon dioxide","Sodium chloride"],"why":"A mixture is not chemically joined and can be separated by physical methods."},{"id":"chem-002","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Atoms, elements and compounds","q":"How many different elements are in a molecule of sulfuric acid, H₂SO₄?","a":"3","w":["2","4","7"],"why":"Hydrogen, sulfur and oxygen."},{"id":"chem-003","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Mixtures and separation","q":"Which method would you use to obtain pure water from salt solution?","a":"Simple distillation","w":["Filtration","Chromatography","Fractional distillation"],"why":"The water evaporates and is condensed, leaving the salt behind."},{"id":"chem-004","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Mixtures and separation","q":"Which method separates an insoluble solid from a liquid?","a":"Filtration","w":["Crystallisation","Simple distillation","Chromatography"],"why":"The solid stays in the filter paper."},{"id":"chem-005","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Development of the model of the atom","q":"What did Rutherford's alpha scattering experiment show about the nucleus?","a":"It is small, dense and positively charged","w":["It is large and negative","It contains electrons","It is made of solid spheres"],"why":"A few alpha particles bounced back from the tiny positive centre."},{"id":"chem-006","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Development of the model of the atom","q":"What did Niels Bohr add to the model of the atom?","a":"Electrons orbit the nucleus at fixed distances in shells","w":["Atoms are solid spheres","Atoms contain neutrons","Atoms are a ball of positive charge with electrons embedded"],"why":"His ideas matched experimental results."},{"id":"chem-007","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Subatomic particles","q":"How many neutrons are in an atom of ²³₁₁Na?","a":"12","w":["11","23","34"],"why":"Neutrons = mass number − atomic number = 23 − 11."},{"id":"chem-008","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Subatomic particles","q":"A chloride ion, Cl⁻, has 17 protons. How many electrons does it have?","a":"18","w":["17","16","35"],"why":"It has gained one electron."},{"id":"chem-009","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Subatomic particles","q":"Chlorine has two isotopes: Cl-35 (75%) and Cl-37 (25%). What is its relative atomic mass?","a":"35.5","w":["36","35.25","36.5"],"why":"(35 × 75 + 37 × 25) ÷ 100 = 35.5."},{"id":"chem-010","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Electronic structure","q":"What is the electronic structure of calcium (atomic number 20)?","a":"2,8,8,2","w":["2,8,10","2,8,2","2,8,8,4"],"why":"Fill each shell up in order."},{"id":"chem-011","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Electronic structure","q":"Which element has the electronic structure 2,8,3?","a":"Aluminium","w":["Sodium","Magnesium","Silicon"],"why":"It is in Group 3, Period 3."},{"id":"chem-012","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"The periodic table","q":"What does the period number of an element tell you?","a":"The number of shells containing electrons","w":["The number of protons","The number of outer electrons","The number of neutrons"],"why":"The group number gives the outer electrons."},{"id":"chem-013","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"The periodic table","q":"The modern periodic table is arranged in order of...","a":"Atomic (proton) number","w":["Atomic mass","Date of discovery","Reactivity"],"why":"This fixed problems with Mendeleev's order."},{"id":"chem-014","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Development of the periodic table","q":"Why did Mendeleev swap the order of some elements?","a":"So that elements with similar properties lined up in the same group","w":["To make the table symmetrical","Because he had measured new atomic numbers","To put all the metals together"],"why":"He ordered them by atomic weight but prioritised properties."},{"id":"chem-015","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Development of the periodic table","q":"Why were Newlands' Law of Octaves not accepted?","a":"It only worked for the lighter elements and mixed up different types of elements","w":["He used atomic numbers","He put all metals together","He added unknown elements"],"why":"Mendeleev's table was more successful."},{"id":"chem-016","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Group 0, Group 1 and Group 7","q":"What forms when sodium reacts with water?","a":"Sodium hydroxide and hydrogen","w":["Sodium oxide and hydrogen","Sodium chloride and oxygen","Sodium hydroxide and oxygen"],"why":"The solution is alkaline."},{"id":"chem-017","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Group 0, Group 1 and Group 7","q":"Why does reactivity increase down Group 1?","a":"The outer electron is further from the nucleus so is lost more easily","w":["The nucleus attracts the outer electron more","The atoms have more neutrons","The atoms have fewer shells"],"why":"Less attraction means an easier electron loss."},{"id":"chem-018","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Group 0, Group 1 and Group 7","q":"Why does reactivity decrease down Group 7?","a":"The outer shell is further from the nucleus so it is harder to gain an electron","w":["Atoms lose electrons more easily","They have more outer electrons","The nucleus is smaller"],"why":"Halogens gain one electron to form 1- ions."},{"id":"chem-019","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Group 0, Group 1 and Group 7","q":"How do the boiling points of the noble gases change down Group 0?","a":"They increase","w":["They decrease","They stay the same","They vary randomly"],"why":"Larger atoms have stronger intermolecular forces."},{"id":"chem-020","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Transition metals","q":"Which of these is a typical property of transition metal compounds?","a":"They are often coloured","w":["They are always white","They always have 1+ ions","They are gases"],"why":"They can also form ions with different charges (Fe²⁺, Fe³⁺)."},{"id":"chem-021","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Ionic bonding and compounds","q":"What happens to the electrons when sodium bonds with chlorine?","a":"Sodium transfers one electron to chlorine","w":["They share one electron pair","Chlorine transfers one electron to sodium","They share all outer electrons"],"why":"Na⁺ and Cl⁻ ions are held together by electrostatic attraction."},{"id":"chem-022","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Ionic bonding and compounds","q":"What ions are in magnesium oxide?","a":"Mg²⁺ and O²⁻","w":["Mg⁺ and O⁻","Mg²⁺ and O⁻","Mg⁺ and O²⁻"],"why":"Mg loses 2 electrons; O gains 2."},{"id":"chem-023","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Ionic bonding and compounds","q":"Why do ionic compounds have high melting points?","a":"Many strong electrostatic forces between oppositely charged ions need lots of energy to overcome","w":["Their molecules are very heavy","Covalent bonds are very strong","They have delocalised electrons"],"why":"The giant lattice makes them hard to melt."},{"id":"chem-024","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Covalent bonding","q":"How many electrons are shared in a double covalent bond, like in O₂?","a":"4","w":["2","3","1"],"why":"Each shared pair is one covalent bond."},{"id":"chem-025","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Covalent bonding","q":"Which compound has only covalent bonds?","a":"Methane (CH₄)","w":["Sodium chloride","Magnesium oxide","Potassium bromide"],"why":"Non-metals bond covalently."},{"id":"chem-026","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Metallic bonding","q":"Why are metals malleable?","a":"The layers of ions can slide over each other","w":["The ions are tightly locked","The electrons are fixed","They have weak covalent bonds"],"why":"The delocalised electrons keep holding the structure together."},{"id":"chem-027","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Metallic bonding","q":"Why are alloys harder than pure metals?","a":"Different sized atoms distort the layers, making it harder for them to slide","w":["They have no delocalised electrons","They are covalent","They are lighter"],"why":"Steel is an alloy of iron with carbon."},{"id":"chem-028","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"States of matter and changes of state","q":"What does the state symbol (aq) mean?","a":"Dissolved in water","w":["Gas","Solid","Liquid"],"why":"(s) solid, (l) liquid, (g) gas."},{"id":"chem-029","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"States of matter and changes of state","q":"Which statement is a limitation of the particle model?","a":"It shows particles as solid spheres with no forces between them","w":["It explains changes of state","It shows density","It explains diffusion"],"why":"Real particles have forces between them."},{"id":"chem-030","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Properties of substances","q":"Why can't solid sodium chloride conduct electricity?","a":"The ions are held in fixed positions and cannot move","w":["It has no ions","It has no electrons","It is a gas"],"why":"When molten or dissolved, the ions can move."},{"id":"chem-031","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Properties of substances","q":"Why don't simple molecular substances conduct electricity?","a":"They have no free electrons or ions to carry charge","w":["They have delocalised electrons","They are metals","They contain ions"],"why":"The molecules are neutral."},{"id":"chem-032","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Properties of substances","q":"Which of these has a giant covalent structure?","a":"Silicon dioxide","w":["Carbon dioxide","Methane","Water"],"why":"It has a very high melting point."},{"id":"chem-033","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Structure and bonding of carbon","q":"Why is diamond very hard?","a":"Each carbon atom forms four strong covalent bonds in a rigid structure","w":["Its layers slide","It has delocalised electrons","It has weak intermolecular forces"],"why":"This also gives it a very high melting point."},{"id":"chem-034","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Structure and bonding of carbon","q":"What is a fullerene?","a":"A molecule of carbon atoms in a hollow shape, such as a ball or tube","w":["A layer of graphite","A type of diamond","A polymer"],"why":"Buckminsterfullerene is C₆₀."},{"id":"chem-035","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Structure and bonding of carbon","q":"Why are carbon nanotubes used to strengthen materials?","a":"They have very high tensile strength and are very light","w":["They are soft","They are insulators","They are cheap"],"why":"They also conduct electricity and heat."},{"id":"chem-036","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Nanoparticles","q":"What happens to the surface area to volume ratio as particles get smaller?","a":"It increases","w":["It decreases","It stays the same","It disappears"],"why":"This makes nanoparticles very reactive."},{"id":"chem-037","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Nanoparticles","q":"What is a concern about using nanoparticles?","a":"Their effects on health and the environment are not fully known","w":["They are too large","They are not reactive","They have no uses"],"why":"Research is still developing."},{"id":"chem-038","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Conservation of mass and balanced equations","q":"Why might the mass appear to decrease when a carbonate reacts with acid in an open flask?","a":"The carbon dioxide gas escapes","w":["Mass is destroyed","The carbonate loses mass","Water absorbs it"],"why":"Mass is conserved overall."},{"id":"chem-039","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Conservation of mass and balanced equations","q":"Which is the balanced equation for magnesium and hydrochloric acid?","a":"Mg + 2HCl → MgCl₂ + H₂","w":["Mg + HCl → MgCl₂ + H₂","Mg + 2HCl → MgCl + H₂","2Mg + HCl → MgCl₂ + H₂"],"why":"Atoms must balance on both sides."},{"id":"chem-040","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Relative formula mass","q":"What is the relative formula mass of Ca(OH)₂? (Ca = 40, O = 16, H = 1)","a":"74","w":["57","58","114"],"why":"40 + 2 × (16 + 1) = 74."},{"id":"chem-041","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Relative formula mass","q":"What is the relative formula mass of H₂SO₄? (H = 1, S = 32, O = 16)","a":"98","w":["49","82","114"],"why":"2 + 32 + 64 = 98."},{"id":"chem-042","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Moles","q":"How many moles are in 4.0 g of sodium hydroxide, NaOH? (Mr = 40)","a":"0.10 mol","w":["1.0 mol","10 mol","0.40 mol"],"why":"Moles = mass ÷ Mr."},{"id":"chem-043","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Moles","q":"What mass of calcium carbonate (Mr = 100) is 0.25 mol?","a":"25 g","w":["2.5 g","250 g","0.25 g"],"why":"Mass = moles × Mr."},{"id":"chem-044","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Amounts of substances in equations","q":"CaCO₃ → CaO + CO₂. What mass of carbon dioxide forms from 10 g of CaCO₃? (Mr: CaCO₃ = 100, CO₂ = 44)","a":"4.4 g","w":["10 g","44 g","5.6 g"],"why":"10 g is 0.1 mol, which gives 0.1 mol of CO₂ (4.4 g)."},{"id":"chem-045","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Limiting reactants","q":"2Mg + O₂ → 2MgO. 1 mol of Mg is reacted with 1 mol of O₂. Which is the limiting reactant?","a":"Magnesium","w":["Oxygen","Neither","Magnesium oxide"],"why":"Only 0.5 mol of oxygen is needed."},{"id":"chem-046","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Concentration of solutions","q":"20 g of salt is dissolved in 500 cm³ of solution. What is the concentration in g/dm³?","a":"40","w":["10","4","0.04"],"why":"500 cm³ = 0.5 dm³; 20 ÷ 0.5 = 40."},{"id":"chem-047","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Concentration of solutions","q":"What is the concentration (mol/dm³) of a solution with 0.5 mol in 250 cm³?","a":"2.0","w":["0.5","0.125","1.0"],"why":"0.5 mol ÷ 0.25 dm³ = 2.0."},{"id":"chem-048","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Percentage yield and atom economy","q":"A reaction makes a desired product with Mr 60. The total Mr of all reactants is 100. What is the atom economy?","a":"60%","w":["40%","100%","160%"],"why":"Atom economy = (Mr of desired product ÷ Mr of all reactants) × 100."},{"id":"chem-049","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Percentage yield and atom economy","q":"Why is a high atom economy good for sustainability?","a":"Less waste is made and fewer resources are used","w":["More waste is made","The reaction is faster","The product costs more"],"why":"It is greener."},{"id":"chem-050","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Using concentrations - titrations","q":"What do we call titration results that agree within 0.10 cm³?","a":"Concordant","w":["Accurate","Valid","Anomalous"],"why":"You then take a mean of the concordant results."},{"id":"chem-051","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Using concentrations - titrations","q":"Which piece of apparatus is used to measure exactly 25.0 cm³ of alkali in a titration?","a":"A pipette","w":["A beaker","A burette","A measuring cylinder"],"why":"The acid is added from the burette."},{"id":"chem-052","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Volumes of gases","q":"What volume does 0.10 mol of carbon dioxide occupy at room temperature and pressure?","a":"2.4 dm³","w":["24 dm³","0.24 dm³","4.4 dm³"],"why":"1 mole of any gas = 24 dm³."},{"id":"chem-053","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Reactivity of metals","q":"Which metal will NOT displace copper from copper sulfate solution?","a":"Silver","w":["Zinc","Iron","Magnesium"],"why":"Silver is less reactive than copper."},{"id":"chem-054","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Reactivity of metals","q":"Why is aluminium extracted by electrolysis rather than heating with carbon?","a":"It is more reactive than carbon","w":["It is less reactive than carbon","It has a low melting point","It is cheaper"],"why":"Metals above carbon cannot be reduced by carbon."},{"id":"chem-055","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Reactivity of metals","q":"Which metals react with cold water?","a":"Potassium, sodium, lithium and calcium","w":["Copper and silver","Iron and zinc","Gold and platinum"],"why":"They form a metal hydroxide and hydrogen."},{"id":"chem-056","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Oxidation and reduction in terms of electrons","q":"In the reaction Zn + Cu²⁺ → Zn²⁺ + Cu, which species is reduced?","a":"Copper ions","w":["Zinc","Zinc ions","Copper atoms"],"why":"Cu²⁺ gains two electrons."},{"id":"chem-057","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Reactions of acids","q":"How can you make crystals of copper sulfate from copper oxide?","a":"Add excess copper oxide to sulfuric acid, filter, then crystallise the filtrate","w":["Add sodium to copper","Add acid to copper metal","Electrolyse copper chloride"],"why":"Excess insoluble base ensures all acid is used up."},{"id":"chem-058","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Reactions of acids","q":"Which salt is made from nitric acid?","a":"A nitrate","w":["A chloride","A sulfate","A carbonate"],"why":"Hydrochloric acid → chlorides; sulfuric acid → sulfates."},{"id":"chem-059","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"pH, neutralisation and titrations","q":"Which colour is universal indicator in an alkaline solution?","a":"Purple or dark blue","w":["Red","Green","Yellow"],"why":"Green is neutral; red is strongly acidic."},{"id":"chem-060","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"pH, neutralisation and titrations","q":"Which ions make a solution alkaline?","a":"OH⁻","w":["H⁺","Cl⁻","Na⁺"],"why":"H⁺ ions make it acidic."},{"id":"chem-061","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Strong and weak acids","q":"What is the difference between concentrated and strong?","a":"Concentrated is about the amount of acid per volume; strong is about how much it ionises","w":["They mean the same","Strong means more acid","Concentrated means fully ionised"],"why":"Ethanoic acid is weak, hydrochloric acid is strong."},{"id":"chem-062","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Electrolysis","q":"What is produced at the cathode when sodium chloride solution is electrolysed?","a":"Hydrogen","w":["Sodium","Chlorine","Oxygen"],"why":"Sodium is more reactive than hydrogen, so hydrogen is discharged."},{"id":"chem-063","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Electrolysis","q":"Why must the electrolyte be molten or in solution?","a":"The ions must be free to move","w":["It needs to be cold","It needs to be solid","It needs electrons"],"why":"Solid ionic compounds don't conduct."},{"id":"chem-064","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Electrolysis","q":"Why do the carbon anodes need replacing in aluminium extraction?","a":"They react with oxygen to form carbon dioxide","w":["They melt","They dissolve in cryolite","They become coated with aluminium"],"why":"The oxygen is made at the anode."},{"id":"chem-065","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Half equations at electrodes","q":"Which half equation shows aluminium ions being reduced?","a":"Al³⁺ + 3e⁻ → Al","w":["Al → Al³⁺ + 3e⁻","Al³⁺ → Al + 3e⁻","Al + 3e⁻ → Al³⁺"],"why":"Reduction is gain of electrons at the cathode."},{"id":"chem-066","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Half equations at electrodes","q":"Which half equation is for the formation of hydrogen at the cathode?","a":"2H⁺ + 2e⁻ → H₂","w":["2H⁺ → H₂ + 2e⁻","H₂ → 2H⁺ + 2e⁻","2H⁺ + 2e⁻ → 2H"],"why":"Hydrogen ions gain electrons."},{"id":"chem-067","subject":"Chemistry","unit":"5.5 Energy changes","topic":"Exothermic and endothermic reactions","q":"Which is an example of an exothermic reaction?","a":"Neutralisation","w":["Thermal decomposition","Photosynthesis","Dissolving ammonium nitrate"],"why":"Combustion and oxidation are also exothermic."},{"id":"chem-068","subject":"Chemistry","unit":"5.5 Energy changes","topic":"Exothermic and endothermic reactions","q":"A cold pack for sports injuries uses...","a":"An endothermic reaction","w":["An exothermic reaction","Combustion","Neutralisation"],"why":"The temperature of the surroundings drops."},{"id":"chem-069","subject":"Chemistry","unit":"5.5 Energy changes","topic":"Reaction profiles","q":"On a reaction profile for an exothermic reaction, where are the products?","a":"At a lower energy than the reactants","w":["At a higher energy than the reactants","At the same energy","At the top of the curve"],"why":"The difference is the overall energy change."},{"id":"chem-070","subject":"Chemistry","unit":"5.5 Energy changes","topic":"Reaction profiles","q":"What does the \"hump\" on a reaction profile represent?","a":"The activation energy","w":["The overall energy change","The products","The catalyst"],"why":"It is the minimum energy for particles to react."},{"id":"chem-071","subject":"Chemistry","unit":"5.5 Energy changes","topic":"Bond energy calculations","q":"H₂ + Cl₂ → 2HCl. Bond energies: H–H 436, Cl–Cl 243, H–Cl 432 kJ/mol. What is the energy change?","a":"−185 kJ/mol","w":["+185 kJ/mol","−864 kJ/mol","+679 kJ/mol"],"why":"Bonds broken 679; bonds made 864; 679 − 864 = −185 (exothermic)."},{"id":"chem-072","subject":"Chemistry","unit":"5.5 Energy changes","topic":"Bond energy calculations","q":"If more energy is released making bonds than is needed to break bonds, the reaction is...","a":"Exothermic","w":["Endothermic","Neutral","Reversible"],"why":"The overall energy change is negative."},{"id":"chem-073","subject":"Chemistry","unit":"5.5 Energy changes","topic":"Chemical cells and fuel cells","q":"What is the overall reaction in a hydrogen fuel cell?","a":"2H₂ + O₂ → 2H₂O","w":["H₂O → H₂ + O₂","H₂ + O → H₂O","2H₂O → 2H₂ + O₂"],"why":"Water is the only product."},{"id":"chem-074","subject":"Chemistry","unit":"5.5 Energy changes","topic":"Chemical cells and fuel cells","q":"Which is an advantage of hydrogen fuel cells over rechargeable batteries?","a":"They produce only water and need no recharging","w":["They are cheaper to make","They store hydrogen easily","They use less energy"],"why":"A disadvantage is that hydrogen is flammable and difficult to store."},{"id":"chem-075","subject":"Chemistry","unit":"5.5 Energy changes","topic":"Chemical cells and fuel cells","q":"Which type of battery cannot be recharged?","a":"Alkaline battery","w":["Lithium-ion","Nickel–metal hydride","Lead–acid"],"why":"The reactants are used up."},{"id":"chem-076","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Atoms, elements and compounds","q":"What is a compound?","a":"Two or more elements chemically bonded together","w":["Two or more substances mixed but not bonded","A substance made of only one type of atom","A mixture of gases"],"why":"Compounds can only be separated by chemical reactions."},{"id":"chem-077","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Atoms, elements and compounds","q":"Which of these is an element?","a":"Oxygen (O2)","w":["Water","Carbon dioxide","Sodium chloride"],"why":"Elements contain only one type of atom."},{"id":"chem-078","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Mixtures and separation","q":"Which technique separates a soluble solid from its solution?","a":"Crystallisation","w":["Filtration","Chromatography","Fractional distillation"],"why":"Filtration separates an insoluble solid from a liquid."},{"id":"chem-079","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Mixtures and separation","q":"Fractional distillation separates liquids with different...","a":"Boiling points","w":["Densities","Colours","Particle sizes"],"why":"The liquid with the lowest boiling point evaporates first."},{"id":"chem-080","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Development of the model of the atom","q":"In Rutherford's alpha scattering experiment, most alpha particles...","a":"Passed straight through the gold foil","w":["Bounced straight back","Were absorbed by the foil","Turned into gold atoms"],"why":"This showed that most of the atom is empty space."},{"id":"chem-081","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Development of the model of the atom","q":"Who discovered the neutron?","a":"James Chadwick","w":["Niels Bohr","J. J. Thomson","Ernest Rutherford"],"why":"Bohr suggested electrons orbit in shells."},{"id":"chem-082","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Development of the model of the atom","q":"The plum pudding model was proposed by...","a":"J. J. Thomson","w":["Rutherford","Bohr","Chadwick"],"why":"It pictured a ball of positive charge with electrons embedded in it."},{"id":"chem-083","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Subatomic particles","q":"An atom has 17 protons and 18 neutrons. What is its mass number?","a":"35","w":["17","18","52"],"why":"Mass number = protons + neutrons."},{"id":"chem-084","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Subatomic particles","q":"What is the relative charge of an electron?","a":"-1","w":["+1","0","-2"],"why":"Protons are +1 and neutrons are 0."},{"id":"chem-085","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Subatomic particles","q":"Isotopes of an element have different numbers of...","a":"Neutrons","w":["Protons","Electrons","Shells"],"why":"They have the same number of protons, so the same atomic number."},{"id":"chem-086","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Electronic structure","q":"What is the electronic structure of sodium (atomic number 11)?","a":"2,8,1","w":["2,8,8","2,1","2,9"],"why":"Fill the shells 2, 8, 8 in order."},{"id":"chem-087","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Electronic structure","q":"How many electrons can the second shell hold?","a":"8","w":["2","18","10"],"why":"The first shell holds 2."},{"id":"chem-088","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"The periodic table","q":"Elements in the same group have the same number of...","a":"Outer-shell electrons","w":["Protons","Shells","Neutrons"],"why":"This gives them similar chemical properties."},{"id":"chem-089","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"The periodic table","q":"Metals tend to ___ electrons to form ___ ions.","a":"Lose; positive","w":["Gain; positive","Lose; negative","Gain; negative"],"why":"Non-metals gain electrons to form negative ions."},{"id":"chem-090","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Development of the periodic table","q":"Why did Mendeleev leave gaps in his periodic table?","a":"He predicted that undiscovered elements would fit there","w":["He ran out of space","Those elements were radioactive","He had not measured atomic masses"],"why":"His predictions of the properties of missing elements later proved correct."},{"id":"chem-091","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Development of the periodic table","q":"Newlands arranged the elements in order of...","a":"Atomic weight","w":["Melting point","Density","Colour"],"why":"His Law of Octaves noticed repeating properties."},{"id":"chem-092","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Group 0, Group 1 and Group 7","q":"Why are the noble gases unreactive?","a":"They have full outer shells","w":["They have one outer electron","They are all metals","They have no electrons"],"why":"Full outer shells are very stable."},{"id":"chem-093","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Group 0, Group 1 and Group 7","q":"Going down Group 1, reactivity...","a":"Increases","w":["Decreases","Stays the same","Increases then decreases"],"why":"The outer electron is further from the nucleus and easier to lose."},{"id":"chem-094","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Group 0, Group 1 and Group 7","q":"What happens when chlorine is bubbled through potassium bromide solution?","a":"Bromine is displaced and an orange solution forms","w":["Iodine is displaced","Nothing happens","Chlorine is displaced"],"why":"A more reactive halogen displaces a less reactive one."},{"id":"chem-095","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Group 0, Group 1 and Group 7","q":"Going down Group 7, the melting point...","a":"Increases","w":["Decreases","Stays the same","Falls to zero"],"why":"Larger molecules have stronger intermolecular forces."},{"id":"chem-096","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Transition metals","q":"Compared with Group 1 metals, transition metals have...","a":"Higher melting points and higher density","w":["Lower melting points","Lower density","Higher reactivity"],"why":"They are also harder and stronger."},{"id":"chem-097","subject":"Chemistry","unit":"5.1 Atomic structure and the periodic table","topic":"Transition metals","q":"Transition metals and their compounds are often used as...","a":"Catalysts","w":["Fuels","Insulators","Solvents"],"why":"They also form coloured compounds."},{"id":"chem-098","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Chemical bonds","q":"Which type of bonding occurs between a metal and a non-metal?","a":"Ionic","w":["Covalent","Metallic","Hydrogen"],"why":"Electrons are transferred from the metal to the non-metal."},{"id":"chem-099","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Chemical bonds","q":"Which type of bonding occurs between non-metal atoms?","a":"Covalent","w":["Ionic","Metallic","Electrostatic"],"why":"Electrons are shared."},{"id":"chem-100","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Ionic bonding and compounds","q":"What is the formula of magnesium chloride?","a":"MgCl2","w":["MgCl","Mg2Cl","MgCl3"],"why":"Mg forms 2+ and Cl forms 1-, so two chlorides are needed."},{"id":"chem-101","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Ionic bonding and compounds","q":"Which describes a giant ionic lattice?","a":"A regular arrangement of oppositely charged ions held by strong electrostatic forces","w":["Small molecules held by weak forces","Atoms sharing pairs of electrons","Positive ions in a sea of delocalised electrons"],"why":"This gives ionic compounds high melting points."},{"id":"chem-102","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Covalent bonding","q":"What is a covalent bond?","a":"A shared pair of electrons between two atoms","w":["A transfer of electrons","An attraction between ions","A sea of delocalised electrons"],"why":"Covalent bonds are strong."},{"id":"chem-103","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Covalent bonding","q":"How many covalent bonds does a carbon atom usually form?","a":"4","w":["1","2","6"],"why":"Carbon has four outer electrons."},{"id":"chem-104","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Metallic bonding","q":"Why can metals conduct electricity?","a":"Delocalised electrons can move through the structure","w":["Ions can move freely","They have covalent bonds","They contain free protons"],"why":"Delocalised electrons also carry thermal energy."},{"id":"chem-105","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Metallic bonding","q":"Metallic bonding is...","a":"The attraction between positive metal ions and delocalised electrons","w":["The attraction between oppositely charged ions","The sharing of electrons between atoms","The attraction between molecules"],"why":"The bonding is strong, which gives metals high melting points."},{"id":"chem-106","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"States of matter and changes of state","q":"In a gas the particles are...","a":"Far apart and moving randomly at high speed","w":["Close together and vibrating in fixed positions","Close together and sliding past each other","Arranged in a regular pattern"],"why":"Liquids slide past each other. Solids vibrate in fixed positions."},{"id":"chem-107","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"States of matter and changes of state","q":"Which change of state is condensing?","a":"Gas to liquid","w":["Liquid to gas","Solid to liquid","Solid to gas"],"why":"Gas to solid is deposition, and solid to gas is sublimation."},{"id":"chem-108","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Properties of substances","q":"Why do simple molecular substances have low boiling points?","a":"Weak intermolecular forces need little energy to overcome","w":["Strong covalent bonds break easily","They have delocalised electrons","They are made of ions"],"why":"The covalent bonds inside the molecules do not break."},{"id":"chem-109","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Properties of substances","q":"Ionic compounds conduct electricity when...","a":"Molten or dissolved","w":["Solid","Always","Never"],"why":"Ions are free to move only when molten or dissolved."},{"id":"chem-110","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Properties of substances","q":"Why does diamond have a very high melting point?","a":"Many strong covalent bonds must be broken","w":["Weak forces between molecules","Delocalised electrons","It is an ionic lattice"],"why":"It is a giant covalent structure."},{"id":"chem-111","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Structure and bonding of carbon","q":"Why can graphite conduct electricity?","a":"It has delocalised electrons between its layers","w":["It has free ions","It is a metal","It has free protons"],"why":"Each carbon forms only 3 bonds, leaving one delocalised electron."},{"id":"chem-112","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Structure and bonding of carbon","q":"What is a single layer of graphite called?","a":"Graphene","w":["Diamond","A fullerene","A nanotube"],"why":"Graphene is very strong and conducts electricity."},{"id":"chem-113","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Structure and bonding of carbon","q":"Graphite is soft because...","a":"Its layers can slide over each other","w":["It has weak covalent bonds","It has ionic bonds","It is a liquid"],"why":"There are only weak forces between the layers."},{"id":"chem-114","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Nanoparticles","q":"Nanoparticles are roughly what size?","a":"1 to 100 nm","w":["1 to 100 mm","0.1 to 1 mm","100 to 1000 micrometres"],"why":"1 nm is 10^-9 m."},{"id":"chem-115","subject":"Chemistry","unit":"5.2 Bonding, structure and properties","topic":"Nanoparticles","q":"A use of nanoparticles is in...","a":"Sun creams","w":["Fuels","Building bricks","Alloys"],"why":"Their large surface area to volume ratio makes them very effective."},{"id":"chem-116","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Conservation of mass and balanced equations","q":"When magnesium burns in air, the mass of the solid increases because...","a":"Oxygen from the air combines with it","w":["Mass is created in the reaction","Magnesium absorbs light","Nitrogen is destroyed"],"why":"Mass is conserved overall. The oxygen was not counted at the start."},{"id":"chem-117","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Conservation of mass and balanced equations","q":"Which is the correct balanced equation for the formation of water?","a":"2H2 + O2 -> 2H2O","w":["H2 + O2 -> 2H2O","2H2 + 2O2 -> 2H2O","H2 + 2O2 -> H2O"],"why":"The same number of each atom must be on both sides."},{"id":"chem-118","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Relative formula mass","q":"What is the Mr of CO2? (C = 12, O = 16)","a":"44","w":["28","32","56"],"why":"12 + 16 + 16 = 44."},{"id":"chem-119","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Relative formula mass","q":"What is the Mr of water, H2O? (H = 1, O = 16)","a":"18","w":["17","16","34"],"why":"1 + 1 + 16 = 18."},{"id":"chem-120","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Moles","q":"How many moles are in 44 g of CO2 (Mr = 44)?","a":"1 mole","w":["44 moles","0.5 mole","2 moles"],"why":"Moles = mass / Mr."},{"id":"chem-121","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Moles","q":"How many moles are in 9 g of water (Mr = 18)?","a":"0.5 mole","w":["2 moles","9 moles","0.05 mole"],"why":"9 / 18 = 0.5."},{"id":"chem-122","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Moles","q":"The Avogadro constant is...","a":"6.02 x 10^23","w":["6.02 x 10^32","3.01 x 10^23","6.02 x 10^-23"],"why":"It is the number of particles in one mole."},{"id":"chem-123","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Amounts of substances in equations","q":"2Mg + O2 -> 2MgO. What mass of MgO forms from 24 g of Mg? (Mg = 24, O = 16)","a":"40 g","w":["24 g","80 g","64 g"],"why":"1 mol Mg gives 1 mol MgO, which has Mr 40."},{"id":"chem-124","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Limiting reactants","q":"The limiting reactant is the one that...","a":"Is used up first, so stops the reaction","w":["Is in excess","Is a catalyst","Has the highest Mr"],"why":"The amount of product depends on the limiting reactant."},{"id":"chem-125","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Concentration of solutions","q":"5 g of solute is dissolved in 0.5 dm3 of solution. What is the concentration in g/dm3?","a":"10","w":["2.5","5","0.1"],"why":"Concentration = mass / volume = 5 / 0.5."},{"id":"chem-126","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Concentration of solutions","q":"What is the concentration of a solution containing 2 mol in 4 dm3?","a":"0.5 mol/dm3","w":["8 mol/dm3","2 mol/dm3","0.25 mol/dm3"],"why":"Concentration = moles / volume."},{"id":"chem-127","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Percentage yield and atom economy","q":"Percentage yield is calculated as...","a":"(actual yield / theoretical yield) x 100","w":["(theoretical yield / actual yield) x 100","actual yield x theoretical yield","(actual yield - theoretical yield) / actual yield"],"why":"The actual yield is always less than or equal to the theoretical yield."},{"id":"chem-128","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Percentage yield and atom economy","q":"A reaction has a theoretical yield of 20 g and an actual yield of 15 g. What is the percentage yield?","a":"75%","w":["133%","25%","5%"],"why":"15 / 20 x 100 = 75%."},{"id":"chem-129","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Using concentrations - titrations","q":"25.0 cm3 of NaOH is neutralised by 20.0 cm3 of 0.10 mol/dm3 HCl (1:1). What is the concentration of the NaOH?","a":"0.080 mol/dm3","w":["0.125 mol/dm3","0.10 mol/dm3","0.0020 mol/dm3"],"why":"Moles HCl = 0.020 x 0.10 = 0.0020. Concentration = 0.0020 / 0.025."},{"id":"chem-130","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Volumes of gases","q":"At room temperature and pressure, one mole of any gas occupies...","a":"24 dm3","w":["22.4 dm3","12 dm3","1 dm3"],"why":"This is the molar volume used in GCSE."},{"id":"chem-131","subject":"Chemistry","unit":"5.3 Quantitative chemistry","topic":"Volumes of gases","q":"What volume does 0.5 mol of gas occupy at room temperature and pressure?","a":"12 dm3","w":["24 dm3","48 dm3","6 dm3"],"why":"0.5 x 24 = 12."},{"id":"chem-132","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Reactivity of metals","q":"Which of these metals is the most reactive?","a":"Potassium","w":["Magnesium","Zinc","Copper"],"why":"The order is K, Na, Ca, Mg, Al, C, Zn, Fe, H, Cu."},{"id":"chem-133","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Reactivity of metals","q":"What is produced when iron is added to copper sulfate solution?","a":"Iron sulfate and copper","w":["No reaction","Copper sulfate and iron","Iron oxide and copper"],"why":"Iron is more reactive than copper, so it displaces it."},{"id":"chem-134","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Reactivity of metals","q":"Metals less reactive than carbon can be extracted by...","a":"Heating with carbon","w":["Electrolysis","Filtration","Crystallisation"],"why":"Carbon takes the oxygen from the metal oxide. This is reduction."},{"id":"chem-135","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Oxidation and reduction in terms of electrons","q":"What does OIL RIG stand for?","a":"Oxidation Is Loss, Reduction Is Gain (of electrons)","w":["Oxidation Is Gain, Reduction Is Loss","Oxygen In Liquid, Reduction In Gas","Oxidation In Liquid, Reduction In Gas"],"why":"A useful memory aid for redox questions."},{"id":"chem-136","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Oxidation and reduction in terms of electrons","q":"In Mg -> Mg2+ + 2e-, the magnesium is...","a":"Oxidised","w":["Reduced","Neutralised","Displaced"],"why":"It loses electrons."},{"id":"chem-137","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Reactions of acids","q":"Acid + metal carbonate produces...","a":"A salt, water and carbon dioxide","w":["A salt and hydrogen","A salt and water only","A salt and oxygen"],"why":"Metal + acid gives a salt and hydrogen."},{"id":"chem-138","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Reactions of acids","q":"Which salts does sulfuric acid produce?","a":"Sulfates","w":["Chlorides","Nitrates","Carbonates"],"why":"Hydrochloric acid gives chlorides. Nitric acid gives nitrates."},{"id":"chem-139","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Reactions of acids","q":"Which gas is produced when zinc reacts with hydrochloric acid?","a":"Hydrogen","w":["Carbon dioxide","Oxygen","Chlorine"],"why":"Test: it burns with a squeaky pop."},{"id":"chem-140","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"pH, neutralisation and titrations","q":"Which pH is neutral?","a":"7","w":["0","14","1"],"why":"Below 7 is acidic and above 7 is alkaline."},{"id":"chem-141","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"pH, neutralisation and titrations","q":"In neutralisation, H+ ions react with OH- ions to make...","a":"Water","w":["Hydrogen gas","Hydrogen peroxide","Oxygen"],"why":"H+ + OH- -> H2O."},{"id":"chem-142","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Strong and weak acids","q":"A strong acid is one that...","a":"Completely ionises in water","w":["Is very concentrated","Has a pH of exactly 7","Only partially ionises"],"why":"Concentration and strength are different things."},{"id":"chem-143","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Strong and weak acids","q":"Each decrease of 1 in pH changes the hydrogen ion concentration by a factor of...","a":"10","w":["2","100","1"],"why":"pH is a logarithmic scale."},{"id":"chem-144","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Electrolysis","q":"What forms at the cathode during electrolysis of molten lead bromide?","a":"Lead","w":["Bromine","Oxygen","Hydrogen"],"why":"Metals form at the negative electrode. Bromine forms at the anode."},{"id":"chem-145","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Electrolysis","q":"What is formed at the anode when aqueous copper chloride is electrolysed?","a":"Chlorine","w":["Copper","Hydrogen","Oxygen"],"why":"Halide ions are discharged at the anode."},{"id":"chem-146","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Electrolysis","q":"Why is cryolite added when extracting aluminium?","a":"It lowers the melting point of aluminium oxide","w":["It reacts with oxygen","It is a catalyst","It conducts electricity to the anode"],"why":"This saves energy and money."},{"id":"chem-147","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Electrolysis","q":"In electrolysis, positive ions move to the...","a":"Cathode","w":["Anode","Salt bridge","Electrolyte only"],"why":"Opposites attract: the cathode is negative."},{"id":"chem-148","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Half equations at electrodes","q":"Which is the correct half equation for copper ions being discharged?","a":"Cu2+ + 2e- -> Cu","w":["Cu -> Cu2+ + 2e-","Cu2+ -> Cu + 2e-","Cu2+ + e- -> Cu"],"why":"Positive ions gain electrons at the cathode. This is reduction."},{"id":"chem-149","subject":"Chemistry","unit":"5.4 Chemical changes","topic":"Half equations at electrodes","q":"2Cl- -> Cl2 + 2e- takes place at the...","a":"Anode (oxidation)","w":["Cathode (reduction)","Cathode (oxidation)","Anode (reduction)"],"why":"Negative ions lose electrons at the anode."},{"id":"chem-150","subject":"Chemistry","unit":"5.5 Energy changes","topic":"Exothermic and endothermic reactions","q":"An exothermic reaction...","a":"Transfers energy to the surroundings, so the temperature rises","w":["Takes in energy, so the temperature falls","Has no energy change","Only happens at high temperatures"],"why":"Combustion and neutralisation are exothermic."},{"id":"chem-151","subject":"Chemistry","unit":"5.5 Energy changes","topic":"Exothermic and endothermic reactions","q":"Which is an endothermic process?","a":"Thermal decomposition","w":["Combustion","Neutralisation","Respiration"],"why":"Endothermic reactions take in energy from the surroundings."},{"id":"chem-152","subject":"Chemistry","unit":"5.5 Energy changes","topic":"Reaction profiles","q":"Activation energy is...","a":"The minimum energy needed for a reaction to start","w":["The energy released in the reaction","The energy of the products","The difference between reactants and products"],"why":"Shown as the hump on a reaction profile."},{"id":"chem-153","subject":"Chemistry","unit":"5.5 Energy changes","topic":"Reaction profiles","q":"A catalyst works by...","a":"Lowering the activation energy","w":["Raising the activation energy","Changing the overall energy change","Being used up in the reaction"],"why":"It provides an alternative pathway."},{"id":"chem-154","subject":"Chemistry","unit":"5.5 Energy changes","topic":"Bond energy calculations","q":"Bonds broken need 2000 kJ/mol and bonds made release 2500 kJ/mol. What is the energy change?","a":"-500 kJ/mol (exothermic)","w":["+500 kJ/mol (endothermic)","-4500 kJ/mol","+4500 kJ/mol"],"why":"Energy change = broken - made."},{"id":"chem-155","subject":"Chemistry","unit":"5.5 Energy changes","topic":"Bond energy calculations","q":"Breaking bonds is...","a":"Endothermic","w":["Exothermic","Neither","Both at once"],"why":"Energy must be put in to break bonds."},{"id":"chem-156","subject":"Chemistry","unit":"5.5 Energy changes","topic":"Chemical cells and fuel cells","q":"A hydrogen fuel cell produces...","a":"Water","w":["Carbon dioxide","Methane","Hydrogen peroxide"],"why":"Hydrogen and oxygen react to give water and release energy."},{"id":"chem-157","subject":"Chemistry","unit":"5.5 Energy changes","topic":"Chemical cells and fuel cells","q":"The voltage of a simple cell depends on...","a":"The difference in reactivity of the two metals","w":["The size of the electrodes","The colour of the electrolyte","The temperature only"],"why":"A bigger difference gives a bigger voltage."},{"id":"chem-158","subject":"Chemistry","unit":"5.6 Rate and extent of chemical change","topic":"Calculating rates of reaction","q":"The mean rate of reaction is...","a":"The amount of product formed (or reactant used) divided by time","w":["Time divided by the amount formed","Mass multiplied by time","Concentration multiplied by volume"],"why":"Units might be g/s or cm3/s."},{"id":"chem-159","subject":"Chemistry","unit":"5.6 Rate and extent of chemical change","topic":"Calculating rates of reaction","q":"10 cm3 of gas is made in 5 seconds. What is the mean rate?","a":"2 cm3/s","w":["50 cm3/s","0.5 cm3/s","15 cm3/s"],"why":"10 / 5 = 2."},{"id":"chem-160","subject":"Chemistry","unit":"5.6 Rate and extent of chemical change","topic":"Factors affecting rate","q":"Which change would NOT increase the rate of reaction?","a":"Decreasing the temperature","w":["Increasing the concentration","Increasing the surface area","Adding a catalyst"],"why":"Higher temperature, concentration and surface area all speed up reactions."},{"id":"chem-161","subject":"Chemistry","unit":"5.6 Rate and extent of chemical change","topic":"Factors affecting rate","q":"Powdered marble reacts faster than lumps because...","a":"The larger surface area exposes more particles","w":["It has more energy","It is a different substance","It has a lower activation energy"],"why":"More collisions can occur per second."},{"id":"chem-162","subject":"Chemistry","unit":"5.6 Rate and extent of chemical change","topic":"Collision theory and catalysts","q":"According to collision theory, reactions happen when particles...","a":"Collide with enough energy","w":["Just touch each other","Are heated to boiling","Collide slowly"],"why":"The minimum energy is the activation energy."},{"id":"chem-163","subject":"Chemistry","unit":"5.6 Rate and extent of chemical change","topic":"Collision theory and catalysts","q":"Why does raising the temperature increase the rate?","a":"Particles move faster, so collide more often and with more energy","w":["The activation energy falls","More particles are created","The concentration increases"],"why":"More collisions become successful."},{"id":"chem-164","subject":"Chemistry","unit":"5.6 Rate and extent of chemical change","topic":"Reversible reactions and equilibrium","q":"Dynamic equilibrium means...","a":"The forward and reverse reactions happen at the same rate in a closed system","w":["The reaction has stopped","All the reactants have been used up","The concentrations are always equal"],"why":"The concentrations stay constant."},{"id":"chem-165","subject":"Chemistry","unit":"5.6 Rate and extent of chemical change","topic":"Reversible reactions and equilibrium","q":"Which symbol shows a reversible reaction?","a":"A double arrow (⇌)","w":["A single arrow (->)","An equals sign (=)","A reverse arrow (\u003c-)"],"why":"If the forward reaction is exothermic, the reverse is endothermic."},{"id":"chem-166","subject":"Chemistry","unit":"5.6 Rate and extent of chemical change","topic":"Le Chatelier's Principle","q":"If temperature is increased for a reaction where the forward direction is exothermic, the equilibrium shifts...","a":"Towards the reactants","w":["Towards the products","It does not shift","In both directions at once"],"why":"The system opposes the change by favouring the endothermic direction."},{"id":"chem-167","subject":"Chemistry","unit":"5.6 Rate and extent of chemical change","topic":"Le Chatelier's Principle","q":"Increasing the pressure shifts the equilibrium towards the side with...","a":"Fewer gas molecules","w":["More gas molecules","Equal numbers of gas molecules","No gases"],"why":"The system opposes the increase in pressure."},{"id":"cs-001","subject":"Computer Science","unit":"3.1 Fundamentals of algorithms","topic":"Representing algorithms","q":"Which flowchart symbol is used for a decision?","a":"Diamond","w":["Rectangle","Parallelogram","Rounded rectangle"],"why":"A rectangle is a process, a parallelogram is input/output, a rounded rectangle is start/stop."},{"id":"cs-002","subject":"Computer Science","unit":"3.1 Fundamentals of algorithms","topic":"Representing algorithms","q":"What is the purpose of a trace table?","a":"To follow the values of variables as an algorithm runs and find errors","w":["To draw a flowchart","To store data in a database","To compile code"],"why":"It records each variable's value after every step."},{"id":"cs-003","subject":"Computer Science","unit":"3.1 Fundamentals of algorithms","topic":"Decomposition and abstraction","q":"Why is abstraction useful when designing a program?","a":"It removes unnecessary detail so you can focus on what matters","w":["It makes the program slower","It adds more detail","It converts code into machine code"],"why":"An example is a tube map."},{"id":"cs-004","subject":"Computer Science","unit":"3.1 Fundamentals of algorithms","topic":"Searching algorithms","q":"A binary search is used to find 11 in the list 1, 3, 5, 7, 9, 11, 13. Which value is checked first?","a":"7","w":["1","11","13"],"why":"The middle item is checked first, then the correct half."},{"id":"cs-005","subject":"Computer Science","unit":"3.1 Fundamentals of algorithms","topic":"Searching algorithms","q":"What is an advantage of binary search over linear search?","a":"It is usually much faster for large sorted lists","w":["It works on unsorted lists","It checks every item","It is easier to write"],"why":"It halves the search area each time."},{"id":"cs-006","subject":"Computer Science","unit":"3.1 Fundamentals of algorithms","topic":"Sorting algorithms","q":"In a bubble sort, what happens in each pass?","a":"Neighbouring items are compared and swapped if in the wrong order","w":["The list is split in half","The smallest item is moved to the front","Items are chosen at random"],"why":"The sort stops when a pass has no swaps."},{"id":"cs-007","subject":"Computer Science","unit":"3.1 Fundamentals of algorithms","topic":"Sorting algorithms","q":"Which sorting algorithm uses a divide and conquer approach?","a":"Merge sort","w":["Bubble sort","Linear search","Binary search"],"why":"It splits the list repeatedly, then merges the sorted pieces."},{"id":"cs-008","subject":"Computer Science","unit":"3.2 Programming","topic":"Data types","q":"Which data type would you use to store a name?","a":"String","w":["Integer","Real","Boolean"],"why":"Whole numbers are integers; decimals are reals."},{"id":"cs-009","subject":"Computer Science","unit":"3.2 Programming","topic":"Data types","q":"What does casting do?","a":"Converts a value from one data type to another","w":["Deletes a variable","Creates a constant","Stores data in a file"],"why":"For example converting the string \"5\" to the integer 5."},{"id":"cs-010","subject":"Computer Science","unit":"3.2 Programming","topic":"Programming concepts","q":"What is the difference between a variable and a constant?","a":"A variable's value can change while the program runs; a constant's cannot","w":["A constant can change","They are the same","A variable stores only text"],"why":"Constants are used for values like VAT."},{"id":"cs-011","subject":"Computer Science","unit":"3.2 Programming","topic":"Programming concepts","q":"Which loop repeats a set number of times?","a":"FOR loop (count-controlled)","w":["WHILE loop (condition-controlled)","IF statement","SELECT CASE"],"why":"A WHILE loop runs while a condition is true."},{"id":"cs-012","subject":"Computer Science","unit":"3.2 Programming","topic":"Data structures","q":"What is a 2D array?","a":"An array of arrays, such as a table with rows and columns","w":["A list of one item","A file","A single variable"],"why":"For example, grid[2][3]."},{"id":"cs-013","subject":"Computer Science","unit":"3.2 Programming","topic":"Data structures","q":"What is a record?","a":"A collection of related fields that can be of different data types","w":["A list of the same data type","A sound file","A type of loop"],"why":"For example a student's name, age and grade."},{"id":"cs-014","subject":"Computer Science","unit":"3.2 Programming","topic":"Subroutines (procedures and functions)","q":"What is returned by a function?","a":"A value","w":["Nothing","A procedure","A program"],"why":"A procedure does not return a value."},{"id":"cs-015","subject":"Computer Science","unit":"3.2 Programming","topic":"Structured programming and passing data","q":"Why are local variables useful?","a":"They only exist inside their subroutine, so they don't clash with other parts of the program","w":["They are shared by every subroutine","They use more memory","They can't be changed"],"why":"Global variables can be used anywhere."},{"id":"cs-016","subject":"Computer Science","unit":"3.2 Programming","topic":"Robust and secure programming","q":"A valid range is 1 to 10. Which pair are boundary test data values?","a":"1 and 10 (and 0 and 11)","w":["5 and 6","-100 and 100","2 and 9"],"why":"Boundary data tests the edges of a valid range."},{"id":"cs-017","subject":"Computer Science","unit":"3.2 Programming","topic":"Robust and secure programming","q":"What is a logic error?","a":"The program runs but gives incorrect results","w":["The program will not run","A spelling mistake in code","A missing bracket"],"why":"A syntax error stops the program running."},{"id":"cs-018","subject":"Computer Science","unit":"3.2 Programming","topic":"Classification of programming languages","q":"Which is an advantage of a high-level language?","a":"It is easier to read, write and debug","w":["It runs directly on the processor","It is always faster","It is specific to one processor"],"why":"Low-level languages are closer to the machine."},{"id":"cs-019","subject":"Computer Science","unit":"3.2 Programming","topic":"Classification of programming languages","q":"What does an assembler do?","a":"Translates assembly language into machine code","w":["Translates high-level code line by line","Translates the whole high-level program","Corrects errors"],"why":"Compilers and interpreters translate high-level languages."},{"id":"cs-020","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Number bases","q":"What is binary 10110 in denary?","a":"22","w":["26","18","32"],"why":"16 + 4 + 2 = 22."},{"id":"cs-021","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Number bases","q":"What is the largest number that can be stored in 8 bits?","a":"255","w":["256","128","127"],"why":"2⁸ − 1 = 255."},{"id":"cs-022","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Converting between bases","q":"What is hexadecimal A5 in denary?","a":"165","w":["105","85","155"],"why":"10 × 16 + 5 = 165."},{"id":"cs-023","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Converting between bases","q":"What is binary 11010110 in hexadecimal?","a":"D6","w":["B6","D8","C6"],"why":"1101 = D and 0110 = 6."},{"id":"cs-024","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Units of information","q":"How many bytes are in a megabyte (AQA specification)?","a":"1 000 000","w":["1024","1 048 576","1000"],"why":"AQA uses decimal prefixes."},{"id":"cs-025","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Binary arithmetic and shifts","q":"What does a left shift by 2 do to a binary number?","a":"Multiplies it by 4","w":["Divides it by 4","Multiplies it by 2","Adds 2"],"why":"Each left shift multiplies by 2."},{"id":"cs-026","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Character encoding","q":"In ASCII, how many characters can be represented using 7 bits?","a":"128","w":["256","64","65 536"],"why":"2⁷ = 128."},{"id":"cs-027","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Character encoding","q":"If A is 65 in ASCII, what is C?","a":"67","w":["66","68","97"],"why":"The codes are sequential."},{"id":"cs-028","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Representing images","q":"A 100 × 100 pixel image uses 8 bits per pixel. What is its file size in bytes?","a":"10 000","w":["80 000","1250","100 000"],"why":"10 000 pixels × 8 bits = 80 000 bits = 10 000 bytes."},{"id":"cs-029","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Representing sound","q":"What does a higher bit depth do to a sound file?","a":"Increases quality and file size","w":["Reduces quality","Reduces file size","Has no effect"],"why":"More bits give more precise sample values."},{"id":"cs-030","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Data compression","q":"Using run length encoding, how can AAAABBB be stored?","a":"4A3B","w":["A4B3","7AB","AAAA3B"],"why":"Count then value."},{"id":"cs-031","subject":"Computer Science","unit":"3.4 Computer systems","topic":"Boolean logic","q":"What is the output of NOT (A AND B) if A = 1 and B = 1?","a":"0","w":["1","2","Undefined"],"why":"A AND B = 1, and NOT 1 = 0."},{"id":"cs-032","subject":"Computer Science","unit":"3.4 Computer systems","topic":"Boolean logic","q":"What is the output of (A OR B) AND NOT C when A = 1, B = 0 and C = 1?","a":"0","w":["1","2","Undefined"],"why":"(1 OR 0) = 1; NOT 1 = 0; 1 AND 0 = 0."},{"id":"cs-033","subject":"Computer Science","unit":"3.4 Computer systems","topic":"Systems software","q":"Which is a function of the operating system?","a":"Managing memory and files","w":["Creating spreadsheets","Editing photos","Browsing the web"],"why":"It also handles peripherals, multitasking and the user interface."},{"id":"cs-034","subject":"Computer Science","unit":"3.4 Computer systems","topic":"Systems software","q":"What does defragmentation do?","a":"Reorganises files on a hard disk so they are stored together","w":["Deletes viruses","Encrypts files","Compresses files"],"why":"It speeds up access on magnetic hard disks."},{"id":"cs-035","subject":"Computer Science","unit":"3.5 Systems architecture","topic":"Von Neumann architecture","q":"Which part of the CPU carries out calculations and logic operations?","a":"The ALU","w":["The control unit","The cache","The MAR"],"why":"The control unit decodes instructions and coordinates the CPU."},{"id":"cs-036","subject":"Computer Science","unit":"3.5 Systems architecture","topic":"Von Neumann architecture","q":"What does the Program Counter (PC) hold?","a":"The address of the next instruction","w":["The current instruction","The result of a calculation","The data to be written"],"why":"It increments after each fetch."},{"id":"cs-037","subject":"Computer Science","unit":"3.5 Systems architecture","topic":"CPU performance","q":"Which of these is NOT a factor affecting CPU performance?","a":"Screen resolution","w":["Clock speed","Number of cores","Cache size"],"why":"More cores can run more instructions at once."},{"id":"cs-038","subject":"Computer Science","unit":"3.5 Systems architecture","topic":"Memory and storage","q":"Which type of memory is volatile?","a":"RAM","w":["ROM","Flash memory","A hard disk"],"why":"Volatile memory loses its data when power is off."},{"id":"cs-039","subject":"Computer Science","unit":"3.5 Systems architecture","topic":"Memory and storage","q":"Which is an advantage of solid-state storage over magnetic storage?","a":"It has no moving parts so is faster and more durable","w":["It is always cheaper per GB","It has a larger capacity","It can be written to only once"],"why":"Magnetic disks have moving parts."},{"id":"cs-040","subject":"Computer Science","unit":"3.6 Fundamentals of computer networks","topic":"Networks and their benefits","q":"What is a LAN?","a":"A network covering a small geographical area, such as a school","w":["A network across a country","A wireless router","The internet"],"why":"A WAN covers a large area."},{"id":"cs-041","subject":"Computer Science","unit":"3.6 Fundamentals of computer networks","topic":"Networks and their benefits","q":"Which is a benefit of networking computers?","a":"Sharing files and resources such as printers","w":["Slower communication","Fewer security issues","Higher power use"],"why":"Central backup and management are also benefits."},{"id":"cs-042","subject":"Computer Science","unit":"3.6 Fundamentals of computer networks","topic":"Networks and their benefits","q":"What is the main feature of a client-server network?","a":"A central server provides files and services to the client computers","w":["Every computer is equal and shares directly","There are no servers","It cannot be backed up"],"why":"Peer-to-peer networks have no central server."},{"id":"cs-043","subject":"Computer Science","unit":"3.6 Fundamentals of computer networks","topic":"Network topologies","q":"In a star network, what happens if the central switch fails?","a":"The whole network stops working","w":["Only one computer is affected","Nothing changes","Data takes another route"],"why":"If a single cable fails, only that device is affected."},{"id":"cs-044","subject":"Computer Science","unit":"3.6 Fundamentals of computer networks","topic":"Network topologies","q":"Which topology has all devices connected to a single backbone cable?","a":"Bus","w":["Star","Ring","Mesh"],"why":"It can suffer from data collisions."},{"id":"cs-045","subject":"Computer Science","unit":"3.6 Fundamentals of computer networks","topic":"Protocols and layers","q":"What is a network protocol?","a":"A set of rules for how data is sent and received","w":["A type of cable","A wireless router","A hardware address"],"why":"Examples: HTTP, HTTPS, FTP, SMTP."},{"id":"cs-046","subject":"Computer Science","unit":"3.6 Fundamentals of computer networks","topic":"Protocols and layers","q":"Which protocol is used to send email?","a":"SMTP","w":["FTP","HTTP","IMAP"],"why":"IMAP is used to retrieve email."},{"id":"cs-047","subject":"Computer Science","unit":"3.6 Fundamentals of computer networks","topic":"Protocols and layers","q":"What does TCP do?","a":"Splits data into packets and makes sure they arrive and are reassembled in order","w":["Gives devices IP addresses","Encrypts websites","Translates domain names"],"why":"IP is responsible for addressing and routing."},{"id":"cs-048","subject":"Computer Science","unit":"3.6 Fundamentals of computer networks","topic":"Protocols and layers","q":"What information does a data packet contain?","a":"The source and destination address, a packet number and the data","w":["Only the data","A password","The user's name"],"why":"Packets can take different routes."},{"id":"cs-049","subject":"Computer Science","unit":"3.6 Fundamentals of computer networks","topic":"Protocols and layers","q":"What does DNS do?","a":"Translates a domain name into an IP address","w":["Encrypts web traffic","Assigns MAC addresses","Sends email"],"why":"You type a name; the computer needs an IP address."},{"id":"cs-050","subject":"Computer Science","unit":"3.6 Fundamentals of computer networks","topic":"Protocols and layers","q":"Which is the order of the four-layer TCP/IP model, from top to bottom?","a":"Application, Transport, Internet (Network), Link","w":["Link, Internet, Transport, Application","Application, Internet, Transport, Link","Transport, Application, Link, Internet"],"why":"Each layer has its own protocols."},{"id":"cs-051","subject":"Computer Science","unit":"3.6 Fundamentals of computer networks","topic":"Network security","q":"What does a firewall do?","a":"Monitors and blocks unauthorised network traffic","w":["Speeds up the network","Stores backups","Removes viruses from files"],"why":"It checks incoming and outgoing packets."},{"id":"cs-052","subject":"Computer Science","unit":"3.6 Fundamentals of computer networks","topic":"Network security","q":"What is the purpose of encryption?","a":"To scramble data so it cannot be understood if intercepted","w":["To compress data","To delete data","To speed up transmission"],"why":"Only someone with the key can decrypt it."},{"id":"cs-053","subject":"Computer Science","unit":"3.7 Cyber security","topic":"Cyber security threats","q":"What is phishing?","a":"Fake emails or messages that trick people into revealing personal information","w":["A virus that deletes files","Guessing passwords","Flooding a server"],"why":"A type of social engineering."},{"id":"cs-054","subject":"Computer Science","unit":"3.7 Cyber security","topic":"Cyber security threats","q":"What is a brute-force attack?","a":"Trying many possible passwords until the right one is found","w":["Sending a fake email","Watching someone enter a PIN","Flooding a website"],"why":"Strong passwords make it harder."},{"id":"cs-055","subject":"Computer Science","unit":"3.7 Cyber security","topic":"Cyber security threats","q":"What happens in a denial-of-service (DoS) attack?","a":"A server is flooded with requests so legitimate users cannot access it","w":["Data is quietly stolen","A password is guessed","Files are encrypted for ransom"],"why":"A DDoS uses many computers."},{"id":"cs-056","subject":"Computer Science","unit":"3.7 Cyber security","topic":"Cyber security threats","q":"What does ransomware do?","a":"Encrypts files and demands payment to unlock them","w":["Records keystrokes","Floods a server","Sends spam"],"why":"It is a type of malware."},{"id":"cs-057","subject":"Computer Science","unit":"3.7 Cyber security","topic":"Cyber security threats","q":"What is shouldering (shoulder surfing)?","a":"Watching someone enter their PIN or password","w":["Guessing passwords","Sending phishing emails","Installing a virus"],"why":"A type of social engineering."},{"id":"cs-058","subject":"Computer Science","unit":"3.7 Cyber security","topic":"Cyber security threats","q":"What is SQL injection?","a":"Entering SQL code into an input to access or damage a database","w":["Flooding a server","Guessing a password","Intercepting a phone call"],"why":"Input validation helps to prevent it."},{"id":"cs-059","subject":"Computer Science","unit":"3.7 Cyber security","topic":"Penetration testing","q":"What is penetration testing?","a":"Authorised attempts to find weaknesses in a system's security","w":["Illegal hacking","Installing anti-virus","Deleting old files"],"why":"Weaknesses can then be fixed before criminals use them."},{"id":"cs-060","subject":"Computer Science","unit":"3.7 Cyber security","topic":"Penetration testing","q":"What is a \"white-box\" penetration test?","a":"A test where the tester knows details of the system's structure","w":["A test with no knowledge of the system","A test using a firewall","A physical break-in"],"why":"Black-box testers have no inside knowledge."},{"id":"cs-061","subject":"Computer Science","unit":"3.7 Cyber security","topic":"Detecting and preventing threats","q":"Which measure helps protect against malware?","a":"Anti-malware software","w":["Reusing passwords","Opening all attachments","Disabling the firewall"],"why":"Keep software updated, too."},{"id":"cs-062","subject":"Computer Science","unit":"3.7 Cyber security","topic":"Detecting and preventing threats","q":"Why are user access levels used?","a":"To restrict who can see or change certain data","w":["To make the network faster","To compress files","To stop spam"],"why":"Only authorised users can access sensitive files."},{"id":"cs-063","subject":"Computer Science","unit":"3.7 Cyber security","topic":"Detecting and preventing threats","q":"Which is an example of biometric authentication?","a":"A fingerprint scan","w":["A password","A PIN","A security question"],"why":"It uses a unique physical feature."},{"id":"cs-064","subject":"Computer Science","unit":"3.8 Relational databases and SQL","topic":"Relational databases","q":"What is a primary key?","a":"A field that uniquely identifies each record in a table","w":["A password for the database","The first field in a table","A field that repeats data"],"why":"For example, a StudentID."},{"id":"cs-065","subject":"Computer Science","unit":"3.8 Relational databases and SQL","topic":"Relational databases","q":"What is a foreign key?","a":"A field in one table that links to the primary key in another table","w":["A key used to encrypt the database","A duplicate primary key","The last field in a table"],"why":"It creates the relationship between tables."},{"id":"cs-066","subject":"Computer Science","unit":"3.8 Relational databases and SQL","topic":"Relational databases","q":"What is an advantage of a relational database over a flat-file database?","a":"It reduces data redundancy and inconsistency","w":["It stores everything in one table","It is always simpler","It needs no keys"],"why":"Data is stored once and linked."},{"id":"cs-067","subject":"Computer Science","unit":"3.8 Relational databases and SQL","topic":"Relational databases","q":"In a database table, what is a record?","a":"One row of data about a single item","w":["One column","The name of a table","A data type"],"why":"A field is a single column, such as Surname."},{"id":"cs-068","subject":"Computer Science","unit":"3.8 Relational databases and SQL","topic":"SQL","q":"Which SQL statement retrieves the Name field from the Students table?","a":"SELECT Name FROM Students","w":["GET Name FROM Students","SELECT Students FROM Name","FIND Name IN Students"],"why":"SELECT ... FROM ... WHERE is the main pattern."},{"id":"cs-069","subject":"Computer Science","unit":"3.8 Relational databases and SQL","topic":"SQL","q":"What does this do? SELECT * FROM Students WHERE Age > 15","a":"Retrieves all fields for students older than 15","w":["Deletes students older than 15","Updates the age to 15","Counts the students"],"why":"* means all fields."},{"id":"cs-070","subject":"Computer Science","unit":"3.8 Relational databases and SQL","topic":"SQL","q":"Which keyword sorts the results of a query?","a":"ORDER BY","w":["GROUP BY","SORT FROM","WHERE"],"why":"ASC or DESC sets the direction."},{"id":"cs-071","subject":"Computer Science","unit":"3.8 Relational databases and SQL","topic":"SQL","q":"Which SQL statement adds a new record?","a":"INSERT INTO","w":["ADD TO","UPDATE","SELECT"],"why":"For example INSERT INTO Students (Name, Age) VALUES ('Ali', 15)."},{"id":"cs-072","subject":"Computer Science","unit":"3.8 Relational databases and SQL","topic":"SQL","q":"What does the SQL command UPDATE do?","a":"Changes the data in existing records","w":["Adds a new table","Removes a table","Selects data"],"why":"Use WHERE to say which records."},{"id":"cs-073","subject":"Computer Science","unit":"3.8 Relational databases and SQL","topic":"SQL","q":"What does the % wildcard do in LIKE 'A%'?","a":"Matches any text that starts with A","w":["Matches only the letter A","Matches 100%","Matches any text that ends with A"],"why":"% stands for any number of characters."},{"id":"cs-074","subject":"Computer Science","unit":"3.9 Ethical, legal and environmental impacts","topic":"Legislation","q":"Which law makes it illegal to access computer data without permission?","a":"The Computer Misuse Act 1990","w":["The Data Protection Act","The Copyright, Designs and Patents Act","The Freedom of Information Act"],"why":"It covers hacking, spreading malware and unauthorised changes."},{"id":"cs-075","subject":"Computer Science","unit":"3.9 Ethical, legal and environmental impacts","topic":"Legislation","q":"Which of these is a principle of the Data Protection Act 2018?","a":"Data must be accurate and kept no longer than necessary","w":["Data can be shared with anyone","Data must never be stored","Data can be used for any purpose"],"why":"It protects personal data."},{"id":"cs-076","subject":"Computer Science","unit":"3.9 Ethical, legal and environmental impacts","topic":"Ethical and cultural issues","q":"Which is a privacy concern about technology?","a":"Companies collecting and selling personal data","w":["Faster internet","Cheaper phones","Better batteries"],"why":"Users should know how their data is used."},{"id":"cs-077","subject":"Computer Science","unit":"3.9 Ethical, legal and environmental impacts","topic":"Environmental issues","q":"What is e-waste?","a":"Discarded electronic devices, which can contain harmful materials","w":["Email spam","Unused software","Old files"],"why":"Recycling reduces the impact."},{"id":"cs-078","subject":"Computer Science","unit":"3.1 Fundamentals of algorithms","topic":"Representing algorithms","q":"What is an algorithm?","a":"A step-by-step set of instructions to solve a problem","w":["A programming language","A type of hardware","A file format"],"why":"Algorithms can be shown as pseudo-code or flowcharts."},{"id":"cs-079","subject":"Computer Science","unit":"3.1 Fundamentals of algorithms","topic":"Representing algorithms","q":"Which is a way of representing an algorithm?","a":"A flowchart","w":["A compiler","A bitmap","A router"],"why":"Pseudo-code is another way."},{"id":"cs-080","subject":"Computer Science","unit":"3.1 Fundamentals of algorithms","topic":"Decomposition and abstraction","q":"What is decomposition?","a":"Breaking a problem down into smaller, more manageable sub-problems","w":["Removing unnecessary detail","Repeating a set of instructions","Converting code into machine code"],"why":"Abstraction is hiding unnecessary detail."},{"id":"cs-081","subject":"Computer Science","unit":"3.1 Fundamentals of algorithms","topic":"Decomposition and abstraction","q":"What is abstraction?","a":"Removing unnecessary detail to focus on what matters","w":["Splitting a program into files","Fixing errors in code","Making code run faster"],"why":"A tube map is an abstraction of a real map."},{"id":"cs-082","subject":"Computer Science","unit":"3.1 Fundamentals of algorithms","topic":"Searching algorithms","q":"A binary search can only be used on a list that is...","a":"Sorted","w":["Very short","
