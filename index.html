urrais, pourrais, pourrait..."},{"id":"fr-591","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"Put devoir into the conditional: Si j’avais le choix, il ___ (devoir) faire plus d’efforts.","a":"devrait","w":["devrions","devriez","devraient"],"why":"Conditional = future stem + imperfect endings: devrais, devrais, devrait..."},{"id":"fr-592","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"Put vouloir into the conditional: Si j’avais le choix, nous ___ (vouloir) visiter Rome.","a":"voudrions","w":["voudriez","voudraient","voudrais"],"why":"Conditional = future stem + imperfect endings: voudrais, voudrais, voudrait..."},{"id":"fr-593","subject":"French","unit":"Grammar (Higher)","topic":"Present tense","q":"What are the present-tense endings of regular -er verbs (je, tu, il, nous, vous, ils)?","a":"-e, -es, -e, -ons, -ez, -ent","w":["-s, -s, -t, -ons, -ez, -ent","-ai, -as, -a, -ons, -ez, -ont","-is, -is, -it, -issons, -issez, -issent"],"why":"For example: je parle, tu parles, il parle, nous parlons, vous parlez, ils parlent."},{"id":"fr-594","subject":"French","unit":"Grammar (Higher)","topic":"Present tense","q":"What are the present-tense endings of regular -ir verbs like finir?","a":"-is, -is, -it, -issons, -issez, -issent","w":["-e, -es, -e, -ons, -ez, -ent","-s, -s, -t, -ons, -ez, -ent","-ais, -ais, -ait, -ions, -iez, -aient"],"why":"je finis, tu finis, il finit, nous finissons, vous finissez, ils finissent."},{"id":"fr-595","subject":"French","unit":"Grammar (Higher)","topic":"Present tense","q":"What are the present-tense endings of regular -re verbs like vendre?","a":"-s, -s, (nothing), -ons, -ez, -ent","w":["-e, -es, -e, -ons, -ez, -ent","-is, -is, -it, -issons, -issez, -issent","-ai, -as, -a, -ons, -ez, -ont"],"why":"je vends, tu vends, il vend, nous vendons, vous vendez, ils vendent."},{"id":"fr-596","subject":"French","unit":"Grammar (Higher)","topic":"Present tense","q":"Which is the correct present tense of finir for \"nous\"?","a":"finissons","w":["finons","finirons","finions"],"why":"-ir verbs add -iss- in the nous, vous and ils forms."},{"id":"fr-597","subject":"French","unit":"Grammar (Higher)","topic":"Present tense","q":"How do you say \"I have to go\" using the verb devoir?","a":"Je dois partir","w":["Je devoir partir","Je doit partir","Je dois partis"],"why":"devoir + infinitive: je dois, tu dois, il doit..."},{"id":"fr-598","subject":"French","unit":"Grammar (Higher)","topic":"Present tense","q":"Which verb is irregular in the present tense?","a":"faire","w":["parler","jouer","regarder"],"why":"Regular -er verbs like parler, jouer and regarder follow the same pattern; faire does not (nous faisons, vous faites)."},{"id":"fr-599","subject":"French","unit":"Grammar (Higher)","topic":"Present tense","q":"What is the vous form of faire in the present tense?","a":"faites","w":["faisez","faisons","font"],"why":"faire: fais, fais, fait, faisons, faites, font."},{"id":"fr-600","subject":"French","unit":"Grammar (Higher)","topic":"Present tense","q":"What is the vous form of être in the present tense?","a":"êtes","w":["êtez","sont","sommes"],"why":"être: suis, es, est, sommes, êtes, sont."},{"id":"fr-601","subject":"French","unit":"Grammar (Higher)","topic":"Present tense","q":"What is the ils form of aller in the present tense?","a":"vont","w":["allent","vais","vas"],"why":"aller: vais, vas, va, allons, allez, vont."},{"id":"fr-602","subject":"French","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"How is the perfect tense (passé composé) formed for most verbs?","a":"Present tense of avoir + past participle","w":["Present tense of être + infinitive","Imperfect of avoir + infinitive","Aller + infinitive"],"why":"For example: j’ai mangé, elle a fini."},{"id":"fr-603","subject":"French","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Which verb takes être (not avoir) in the perfect tense?","a":"aller","w":["faire","prendre","voir"],"why":"Verbs of movement and change like aller, venir, partir, arriver and rester use être, as do reflexive verbs."},{"id":"fr-604","subject":"French","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"What is the past participle of regular -er verbs such as parler?","a":"parlé","w":["parlu","parlis","parlant"],"why":"-er → -é, -ir → -i, -re → -u."},{"id":"fr-605","subject":"French","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"What is the past participle of regular -re verbs such as vendre?","a":"vendu","w":["vendé","vendi","vendant"],"why":"-er → -é, -ir → -i, -re → -u."},{"id":"fr-606","subject":"French","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"What is the past participle of prendre?","a":"pris","w":["prendu","prené","pri"],"why":"Irregular: prendre → pris (also comprendre → compris)."},{"id":"fr-607","subject":"French","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"What is the past participle of voir?","a":"vu","w":["voyé","voi","voit"],"why":"Irregular: voir → vu."},{"id":"fr-608","subject":"French","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"What is the past participle of faire?","a":"fait","w":["faisé","fai","fais"],"why":"Irregular: faire → fait."},{"id":"fr-609","subject":"French","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"What is the past participle of vouloir?","a":"voulu","w":["voulé","veulu","voulant"],"why":"Irregular: vouloir → voulu."},{"id":"fr-610","subject":"French","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"With être in the perfect tense, the past participle must agree with the subject. How do you write \"Marie went to Paris\"?","a":"Marie est allée à Paris","w":["Marie est allé à Paris","Marie a allé à Paris","Marie a allée à Paris"],"why":"Add -e for feminine and -s for plural: allé, allée, allés, allées."},{"id":"fr-611","subject":"French","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"How do you form the imperfect (imparfait) stem?","a":"Take the nous form of the present tense and remove -ons","w":["Take the infinitive and remove -er","Take the il form of the present tense","Use the past participle"],"why":"nous faisons → fais-; nous allons → all-. The only exception is être (ét-)."},{"id":"fr-612","subject":"French","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"What are the imperfect endings (je, tu, il, nous, vous, ils)?","a":"-ais, -ais, -ait, -ions, -iez, -aient","w":["-ai, -as, -a, -ons, -ez, -ont","-e, -es, -e, -ons, -ez, -ent","-ais, -ais, -ait, -ons, -ez, -aient"],"why":"These endings are the same for every verb."},{"id":"fr-613","subject":"French","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Which tense do you use to describe what something was like in the past or what you used to do regularly?","a":"Imperfect (imparfait)","w":["Perfect (passé composé)","Simple future","Conditional"],"why":"For example: quand j’étais petit, je jouais au foot tous les jours."},{"id":"fr-614","subject":"French","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Which tense do you use for a completed, one-off event in the past?","a":"Perfect (passé composé)","w":["Imperfect (imparfait)","Present","Conditional"],"why":"For example: hier, j’ai regardé un film."},{"id":"fr-615","subject":"French","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"How do you say \"they finished\" in the perfect tense?","a":"Ils ont fini","w":["Ils sont fini","Ils ont finis","Ils avons fini"],"why":"Verbs using avoir do not make the participle agree with the subject."},{"id":"fr-616","subject":"French","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Which sentence is in the imperfect tense?","a":"Nous habitions à Lyon","w":["Nous habitons à Lyon","Nous avons habité à Lyon","Nous habiterons à Lyon"],"why":"-ions ending = nous in the imperfect."},{"id":"fr-617","subject":"French","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Which sentence is in the perfect tense?","a":"Elle a vu ses amis","w":["Elle voit ses amis","Elle voyait ses amis","Elle verra ses amis"],"why":"a + past participle (vu)."},{"id":"fr-618","subject":"French","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"How do you say \"I was\" in French using the imperfect?","a":"j’étais","w":["je suis","j’ai été","je serai"],"why":"être (imperfect): étais, étais, était, étions, étiez, étaient."},{"id":"fr-619","subject":"French","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"\"Il pleuvait quand je suis arrivé.\" Why are two different tenses used?","a":"Imperfect for the background (raining), perfect for the single event (arrived)","w":["Both are the same tense","Imperfect for the future, perfect for the past","Perfect for descriptions, imperfect for one-off events"],"why":"The imperfect sets the scene; the passé composé is for the action that happened."},{"id":"fr-620","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"How is the near future (futur proche) formed?","a":"Present tense of aller + infinitive","w":["Infinitive + future endings","Avoir + past participle","Imperfect of aller + infinitive"],"why":"For example: je vais manger, nous allons sortir."},{"id":"fr-621","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"Complete in the near future: Demain, nous ___ visiter le musée.","a":"allons","w":["irons","allions","sommes allés"],"why":"Near future = aller (present) + infinitive."},{"id":"fr-622","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"Which sentence is in the near future?","a":"Je vais jouer au tennis","w":["Je jouerai au tennis","J’ai joué au tennis","Je jouais au tennis"],"why":"vais + infinitive."},{"id":"fr-623","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"How is the simple future formed for regular -er and -ir verbs?","a":"Infinitive + -ai, -as, -a, -ons, -ez, -ont","w":["Infinitive + -ais, -ais, -ait, -ions, -iez, -aient","Present tense of aller + infinitive","Past participle + -ons"],"why":"je parlerai, tu parleras, il parlera..."},{"id":"fr-624","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"For -re verbs in the simple future, what happens to the infinitive?","a":"The final -e is dropped before the endings","w":["-re becomes -rez","Nothing changes","An -s is added"],"why":"vendre → je vendrai, prendre → je prendrai."},{"id":"fr-625","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"What is the future stem of aller?","a":"ir-","w":["all-","aller-","vai-"],"why":"j’irai, tu iras, il ira..."},{"id":"fr-626","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"What is the future stem of être?","a":"ser-","w":["êtr-","ét-","sui-"],"why":"je serai, tu seras, il sera..."},{"id":"fr-627","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"What is the future stem of avoir?","a":"aur-","w":["av-","ai-","avoir-"],"why":"j’aurai, tu auras, il aura..."},{"id":"fr-628","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"What is the future stem of faire?","a":"fer-","w":["fais-","fai-","faire-"],"why":"je ferai, tu feras, il fera..."},{"id":"fr-629","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"How is the conditional formed?","a":"Future stem + imperfect endings","w":["Future stem + future endings","Present of avoir + past participle","Aller + infinitive"],"why":"je mangerais, tu mangerais, il mangerait..."},{"id":"fr-630","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"How do you say \"I would like to go to Spain\" politely?","a":"Je voudrais aller en Espagne","w":["Je veux aller en Espagne","Je voudrai aller en Espagne","Je voulais aller en Espagne"],"why":"Je voudrais = I would like (conditional of vouloir)."},{"id":"fr-631","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"Which French tense does the sentence \"S’il fait beau, nous irons à la plage\" use after the si-clause?","a":"Simple future","w":["Conditional","Imperfect","Perfect"],"why":"si + present → future."},{"id":"fr-632","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"Complete: \"Si j’avais de l’argent, j’___ en Italie.\"","a":"irais","w":["irai","vais","allais"],"why":"si + imperfect → conditional."},{"id":"fr-633","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"Which sentence is in the conditional?","a":"Nous mangerions au restaurant","w":["Nous mangeons au restaurant","Nous mangerons au restaurant","Nous mangions au restaurant"],"why":"-ions on the future stem."},{"id":"fr-634","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"Which sentence is in the simple future?","a":"Elle partira demain","w":["Elle partait demain","Elle va partir demain","Elle partirait demain"],"why":"-a on the future stem (partir-)."},{"id":"fr-635","subject":"French","unit":"Grammar (Higher)","topic":"Imperative and verb constructions","q":"What form of the verb follows a modal verb like pouvoir, devoir or vouloir?","a":"The infinitive","w":["The past participle","The imperfect","The present participle"],"why":"For example: je peux sortir, tu dois travailler, il veut manger."},{"id":"fr-636","subject":"French","unit":"Grammar (Higher)","topic":"Imperative and verb constructions","q":"How do you say \"I can play tennis\"?","a":"Je peux jouer au tennis","w":["Je peux joue au tennis","Je pouvoir jouer au tennis","Je peut jouer au tennis"],"why":"Je peux = I can; the second verb stays in the infinitive."},{"id":"fr-637","subject":"French","unit":"Grammar (Higher)","topic":"Imperative and verb constructions","q":"How do you say \"we must leave\"?","a":"Nous devons partir","w":["Nous devez partir","Nous devrons partons","Nous doivent partir"],"why":"devoir: dois, dois, doit, devons, devez, doivent."},{"id":"fr-638","subject":"French","unit":"Grammar (Higher)","topic":"Imperative and verb constructions","q":"Which is the correct \"ils\" form of vouloir?","a":"veulent","w":["voulent","veuvent","voulons"],"why":"vouloir: veux, veux, veut, voulons, voulez, veulent."},{"id":"fr-639","subject":"French","unit":"Grammar (Higher)","topic":"Imperative and verb constructions","q":"Which is the correct \"ils\" form of pouvoir?","a":"peuvent","w":["pouvent","peuxent","pouvons"],"why":"pouvoir: peux, peux, peut, pouvons, pouvez, peuvent."},{"id":"fr-640","subject":"French","unit":"Grammar (Higher)","topic":"Imperative and verb constructions","q":"What does \"je voudrais\" mean?","a":"I would like","w":["I wanted","I will want","I want"],"why":"Voudrais is the conditional of vouloir."},{"id":"fr-641","subject":"French","unit":"Grammar (Higher)","topic":"Imperative and verb constructions","q":"What does \"il faut\" + infinitive mean?","a":"It is necessary to / you must","w":["It is possible to","He wants to","He used to"],"why":"For example: il faut manger sainement."},{"id":"fr-642","subject":"French","unit":"Grammar (Higher)","topic":"Imperative and verb constructions","q":"How is the \"tu\" imperative formed for -er verbs such as parler?","a":"Parle (the -s is dropped)","w":["Parles","Parler","Parlez"],"why":"Imperative uses the present tense without the subject; -er verbs lose the -s in tu."},{"id":"fr-643","subject":"French","unit":"Grammar (Higher)","topic":"Imperative and verb constructions","q":"Which is the \"vous\" imperative (a command) of prendre?","a":"Prenez","w":["Prends","Prenons","Prendre"],"why":"Prends (tu), prenons (nous), prenez (vous)."},{"id":"fr-644","subject":"French","unit":"Grammar (Higher)","topic":"Imperative and verb constructions","q":"What does \"venir de\" + infinitive mean, as in \"je viens de manger\"?","a":"Have just (done something)","w":["Am going to","Used to","Would like to"],"why":"Venir de = the recent past: I have just eaten."},{"id":"fr-645","subject":"French","unit":"Grammar (Higher)","topic":"Imperative and verb constructions","q":"How do you say \"I like swimming\"?","a":"J’aime nager","w":["J’aime nagé","J’aime nage","Je aime nagez"],"why":"Verbs of liking are followed by the infinitive."},{"id":"fr-646","subject":"French","unit":"Grammar (Higher)","topic":"Imperative and verb constructions","q":"What is the structure to say \"I want to buy a car\"?","a":"Je veux acheter une voiture","w":["Je veux acheté une voiture","Je veut acheter une voiture","Je voulons acheter une voiture"],"why":"vouloir (conjugated) + infinitive."},{"id":"fr-647","subject":"French","unit":"Grammar (Higher)","topic":"Imperative and verb constructions","q":"How would you say \"you (informal) must do your homework\"?","a":"Tu dois faire tes devoirs","w":["Tu doit faire tes devoirs","Tu dois fais tes devoirs","Tu devoir faire tes devoirs"],"why":"dois (tu), then faire in the infinitive."},{"id":"de-001","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of haben: Ich ___ einen Hund.","a":"habe","w":["hast","hat","haben"],"why":"haben (present): ich habe, du hast, er hat, wir haben, ihr habt, sie haben."},{"id":"de-002","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of haben: Er ___ einen Hund.","a":"hat","w":["haben","habt","habe"],"why":"haben (present): ich habe, du hast, er hat, wir haben, ihr habt, sie haben."},{"id":"de-003","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of haben: Ihr ___ einen Hund.","a":"habt","w":["haben","habe","hast"],"why":"haben (present): ich habe, du hast, er hat, wir haben, ihr habt, sie haben."},{"id":"de-004","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of sein: Du ___ müde.","a":"bist","w":["ist","sind","seid"],"why":"sein (present): ich bin, du bist, er ist, wir sind, ihr seid, sie sind."},{"id":"de-005","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of sein: Wir ___ müde.","a":"sind","w":["seid","bin","bist"],"why":"sein (present): ich bin, du bist, er ist, wir sind, ihr seid, sie sind."},{"id":"de-006","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of sein: Sie ___ müde.","a":"sind","w":["bin","bist","ist"],"why":"sein (present): ich bin, du bist, er ist, wir sind, ihr seid, sie sind."},{"id":"de-007","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of gehen: Er ___ ins Kino.","a":"geht","w":["gehen","gehe","gehst"],"why":"gehen (present): ich gehe, du gehst, er geht, wir gehen, ihr geht, sie gehen."},{"id":"de-008","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of gehen: Ihr ___ ins Kino.","a":"geht","w":["gehen","gehe","gehst"],"why":"gehen (present): ich gehe, du gehst, er geht, wir gehen, ihr geht, sie gehen."},{"id":"de-009","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of gehen: Ich ___ ins Kino.","a":"gehe","w":["gehst","geht","gehen"],"why":"gehen (present): ich gehe, du gehst, er geht, wir gehen, ihr geht, sie gehen."},{"id":"de-010","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of fahren: Wir ___ mit dem Bus.","a":"fahren","w":["fahrt","fahre","fährst"],"why":"fahren (present): ich fahre, du fährst, er fährt, wir fahren, ihr fahrt, sie fahren."},{"id":"de-011","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of fahren: Sie ___ mit dem Bus.","a":"fahren","w":["fahre","fährst","fährt"],"why":"fahren (present): ich fahre, du fährst, er fährt, wir fahren, ihr fahrt, sie fahren."},{"id":"de-012","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of fahren: Du ___ mit dem Bus.","a":"fährst","w":["fährt","fahren","fahrt"],"why":"fahren (present): ich fahre, du fährst, er fährt, wir fahren, ihr fahrt, sie fahren."},{"id":"de-013","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of sehen: Ihr ___ einen Film.","a":"seht","w":["sehen","sehe","siehst"],"why":"sehen (present): ich sehe, du siehst, er sieht, wir sehen, ihr seht, sie sehen."},{"id":"de-014","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of sehen: Ich ___ einen Film.","a":"sehe","w":["siehst","sieht","sehen"],"why":"sehen (present): ich sehe, du siehst, er sieht, wir sehen, ihr seht, sie sehen."},{"id":"de-015","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of sehen: Er ___ einen Film.","a":"sieht","w":["sehen","seht","sehe"],"why":"sehen (present): ich sehe, du siehst, er sieht, wir sehen, ihr seht, sie sehen."},{"id":"de-016","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of lesen: Sie ___ ein Buch.","a":"lesen","w":["lese","liest","lest"],"why":"lesen (present): ich lese, du liest, er liest, wir lesen, ihr lest, sie lesen."},{"id":"de-017","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of lesen: Du ___ ein Buch.","a":"liest","w":["lesen","lest","lese"],"why":"lesen (present): ich lese, du liest, er liest, wir lesen, ihr lest, sie lesen."},{"id":"de-018","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of lesen: Wir ___ ein Buch.","a":"lesen","w":["lest","lese","liest"],"why":"lesen (present): ich lese, du liest, er liest, wir lesen, ihr lest, sie lesen."},{"id":"de-019","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of bleiben: Ich ___ zu Hause.","a":"bleibe","w":["bleibst","bleibt","bleiben"],"why":"bleiben (present): ich bleibe, du bleibst, er bleibt, wir bleiben, ihr bleibt, sie bleiben."},{"id":"de-020","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of bleiben: Er ___ zu Hause.","a":"bleibt","w":["bleiben","bleibe","bleibst"],"why":"bleiben (present): ich bleibe, du bleibst, er bleibt, wir bleiben, ihr bleibt, sie bleiben."},{"id":"de-021","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of bleiben: Ihr ___ zu Hause.","a":"bleibt","w":["bleiben","bleibe","bleibst"],"why":"bleiben (present): ich bleibe, du bleibst, er bleibt, wir bleiben, ihr bleibt, sie bleiben."},{"id":"de-022","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of essen: Du ___ eine Pizza.","a":"isst","w":["essen","esst","esse"],"why":"essen (present): ich esse, du isst, er isst, wir essen, ihr esst, sie essen."},{"id":"de-023","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of essen: Wir ___ eine Pizza.","a":"essen","w":["esst","esse","isst"],"why":"essen (present): ich esse, du isst, er isst, wir essen, ihr esst, sie essen."},{"id":"de-024","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of essen: Sie ___ eine Pizza.","a":"essen","w":["esse","isst","esst"],"why":"essen (present): ich esse, du isst, er isst, wir essen, ihr esst, sie essen."},{"id":"de-025","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of kommen: Er ___ aus England.","a":"kommt","w":["kommen","komme","kommst"],"why":"kommen (present): ich komme, du kommst, er kommt, wir kommen, ihr kommt, sie kommen."},{"id":"de-026","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of kommen: Ihr ___ aus England.","a":"kommt","w":["kommen","komme","kommst"],"why":"kommen (present): ich komme, du kommst, er kommt, wir kommen, ihr kommt, sie kommen."},{"id":"de-027","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of kommen: Ich ___ aus England.","a":"komme","w":["kommst","kommt","kommen"],"why":"kommen (present): ich komme, du kommst, er kommt, wir kommen, ihr kommt, sie kommen."},{"id":"de-028","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of können (can / to be able to): Ich ___ gut schwimmen.","a":"kann","w":["kannst","können","könnt"],"why":"können (present): ich kann, du kannst, er kann, wir können, ihr könnt, sie können. The other verb goes to the end as an infinitive."},{"id":"de-029","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of können (can / to be able to): Wir ___ gut schwimmen.","a":"können","w":["könnt","kann","kannst"],"why":"können (present): ich kann, du kannst, er kann, wir können, ihr könnt, sie können. The other verb goes to the end as an infinitive."},{"id":"de-030","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of müssen (must / to have to): Du ___ heute arbeiten.","a":"musst","w":["muss","müssen","müsst"],"why":"müssen (present): ich muss, du musst, er muss, wir müssen, ihr müsst, sie müssen. The other verb goes to the end as an infinitive."},{"id":"de-031","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of müssen (must / to have to): Ihr ___ heute arbeiten.","a":"müsst","w":["müssen","muss","musst"],"why":"müssen (present): ich muss, du musst, er muss, wir müssen, ihr müsst, sie müssen. The other verb goes to the end as an infinitive."},{"id":"de-032","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of wollen (to want to): Er ___ ins Kino gehen.","a":"will","w":["wollen","wollt","willst"],"why":"wollen (present): ich will, du willst, er will, wir wollen, ihr wollt, sie wollen. The other verb goes to the end as an infinitive."},{"id":"de-033","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of wollen (to want to): Sie ___ ins Kino gehen.","a":"wollen","w":["will","willst","wollt"],"why":"wollen (present): ich will, du willst, er will, wir wollen, ihr wollt, sie wollen. The other verb goes to the end as an infinitive."},{"id":"de-034","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of sollen (should / to be supposed to): Wir ___ mehr Obst essen.","a":"sollen","w":["sollt","soll","sollst"],"why":"sollen (present): ich soll, du sollst, er soll, wir sollen, ihr sollt, sie sollen. The other verb goes to the end as an infinitive."},{"id":"de-035","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of sollen (should / to be supposed to): Ich ___ mehr Obst essen.","a":"soll","w":["sollst","sollen","sollt"],"why":"sollen (present): ich soll, du sollst, er soll, wir sollen, ihr sollt, sie sollen. The other verb goes to the end as an infinitive."},{"id":"de-036","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of dürfen (may / to be allowed to): Ihr ___ hier parken.","a":"dürft","w":["dürfen","darf","darfst"],"why":"dürfen (present): ich darf, du darfst, er darf, wir dürfen, ihr dürft, sie dürfen. The other verb goes to the end as an infinitive."},{"id":"de-037","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of dürfen (may / to be allowed to): Du ___ hier parken.","a":"darfst","w":["darf","dürfen","dürft"],"why":"dürfen (present): ich darf, du darfst, er darf, wir dürfen, ihr dürft, sie dürfen. The other verb goes to the end as an infinitive."},{"id":"de-038","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of mögen (to like): Sie ___ Pizza.","a":"mögen","w":["mag","magst","mögt"],"why":"mögen (present): ich mag, du magst, er mag, wir mögen, ihr mögt, sie mögen. The other verb goes to the end as an infinitive."},{"id":"de-039","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Complete with the correct present-tense form of mögen (to like): Er ___ Pizza.","a":"mag","w":["mögen","mögt","magst"],"why":"mögen (present): ich mag, du magst, er mag, wir mögen, ihr mögt, sie mögen. The other verb goes to the end as an infinitive."},{"id":"de-040","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Put this sentence into the perfect tense (Perfekt): \"Er hat viel Spaß.\"","a":"Er hat viel Spaß gehabt","w":["Er ist viel Spaß gehabt","Er hat viel Spaß haben","Er hat gehabt viel Spaß"],"why":"haben uses haben in the perfect tense and the past participle \"gehabt\" goes at the end of the clause."},{"id":"de-041","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Put this sentence into the perfect tense (Perfekt): \"Er ist in Berlin.\"","a":"Er ist in Berlin gewesen","w":["Er hat in Berlin gewesen","Er ist in Berlin sein","Er ist gewesen in Berlin"],"why":"sein uses sein in the perfect tense and the past participle \"gewesen\" goes at the end of the clause."},{"id":"de-042","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Put this sentence into the perfect tense (Perfekt): \"Er geht ins Kino.\"","a":"Er ist ins Kino gegangen","w":["Er hat ins Kino gegangen","Er ist ins Kino gehen","Er ist gegangen ins Kino"],"why":"gehen uses sein in the perfect tense and the past participle \"gegangen\" goes at the end of the clause."},{"id":"de-043","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Put this sentence into the perfect tense (Perfekt): \"Er fährt nach Berlin.\"","a":"Er ist nach Berlin gefahren","w":["Er hat nach Berlin gefahren","Er ist nach Berlin fahren","Er ist gefahren nach Berlin"],"why":"fahren uses sein in the perfect tense and the past participle \"gefahren\" goes at the end of the clause."},{"id":"de-044","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Put this sentence into the perfect tense (Perfekt): \"Er sieht einen Film.\"","a":"Er hat einen Film gesehen","w":["Er ist einen Film gesehen","Er hat einen Film sehen","Er hat gesehen einen Film"],"why":"sehen uses haben in the perfect tense and the past participle \"gesehen\" goes at the end of the clause."},{"id":"de-045","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Put this sentence into the perfect tense (Perfekt): \"Er liest ein Buch.\"","a":"Er hat ein Buch gelesen","w":["Er ist ein Buch gelesen","Er hat ein Buch lesen","Er hat gelesen ein Buch"],"why":"lesen uses haben in the perfect tense and the past participle \"gelesen\" goes at the end of the clause."},{"id":"de-046","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Put this sentence into the perfect tense (Perfekt): \"Er bleibt zu Hause.\"","a":"Er ist zu Hause geblieben","w":["Er hat zu Hause geblieben","Er ist zu Hause bleiben","Er ist geblieben zu Hause"],"why":"bleiben uses sein in the perfect tense and the past participle \"geblieben\" goes at the end of the clause."},{"id":"de-047","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Put this sentence into the perfect tense (Perfekt): \"Er isst eine Pizza.\"","a":"Er hat eine Pizza gegessen","w":["Er ist eine Pizza gegessen","Er hat eine Pizza essen","Er hat gegessen eine Pizza"],"why":"essen uses haben in the perfect tense and the past participle \"gegessen\" goes at the end of the clause."},{"id":"de-048","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Put this sentence into the perfect tense (Perfekt): \"Er kommt spät nach Hause.\"","a":"Er ist spät nach Hause gekommen","w":["Er hat spät nach Hause gekommen","Er ist spät nach Hause kommen","Er ist gekommen spät nach Hause"],"why":"kommen uses sein in the perfect tense and the past participle \"gekommen\" goes at the end of the clause."},{"id":"de-049","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Put sein into the imperfect (Imperfekt): Letztes Jahr ___ du sehr schüchtern.","a":"warst","w":["war","waren","wart"],"why":"sein (imperfect): ich war, du warst, er war, wir waren, ihr wart, sie waren."},{"id":"de-050","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Put sein into the imperfect (Imperfekt): Letztes Jahr ___ ihr sehr schüchtern.","a":"wart","w":["waren","war","warst"],"why":"sein (imperfect): ich war, du warst, er war, wir waren, ihr wart, sie waren."},{"id":"de-051","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Put haben into the imperfect (Imperfekt): Letztes Jahr ___ er viele Freunde.","a":"hatte","w":["hatten","hattet","hattest"],"why":"haben (imperfect): ich hatte, du hattest, er hatte, wir hatten, ihr hattet, sie hatten."},{"id":"de-052","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Put haben into the imperfect (Imperfekt): Letztes Jahr ___ sie viele Freunde.","a":"hatten","w":["hatte","hattest","hattet"],"why":"haben (imperfect): ich hatte, du hattest, er hatte, wir hatten, ihr hattet, sie hatten."},{"id":"de-053","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Put können into the imperfect (Imperfekt): Letztes Jahr ___ er gut schwimmen.","a":"konnte","w":["konnten","konntet","konntest"],"why":"Modal verbs are usually used in the imperfect, not the perfect: ich konnte, du konntest, er konnte, wir konnten, ihr konntet, sie konnten."},{"id":"de-054","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Put müssen into the imperfect (Imperfekt): Letztes Jahr ___ wir viel arbeiten.","a":"mussten","w":["musstet","musste","musstest"],"why":"Modal verbs are usually used in the imperfect, not the perfect: ich musste, du musstest, er musste, wir mussten, ihr musstet, sie mussten."},{"id":"de-055","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Put wollen into the imperfect (Imperfekt): Letztes Jahr ___ ihr Pilot werden.","a":"wolltet","w":["wollten","wollte","wolltest"],"why":"Modal verbs are usually used in the imperfect, not the perfect: ich wollte, du wolltest, er wollte, wir wollten, ihr wolltet, sie wollten."},{"id":"de-056","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Put sollen into the imperfect (Imperfekt): Letztes Jahr ___ sie mehr lernen.","a":"sollten","w":["sollte","solltest","solltet"],"why":"Modal verbs are usually used in the imperfect, not the perfect: ich sollte, du solltest, er sollte, wir sollten, ihr solltet, sie sollten."},{"id":"de-057","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Put dürfen into the imperfect (Imperfekt): Letztes Jahr ___ ich lange aufbleiben.","a":"durfte","w":["durftest","durften","durftet"],"why":"Modal verbs are usually used in the imperfect, not the perfect: ich durfte, du durftest, er durfte, wir durften, ihr durftet, sie durften."},{"id":"de-058","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Put mögen into the imperfect (Imperfekt): Letztes Jahr ___ du Pizza.","a":"mochtest","w":["mochte","mochten","mochtet"],"why":"Modal verbs are usually used in the imperfect, not the perfect: ich mochte, du mochtest, er mochte, wir mochten, ihr mochtet, sie mochten."},{"id":"de-059","subject":"German","unit":"Grammar (Higher)","topic":"Future, conditional and pluperfect","q":"Complete the future tense: Nächstes Jahr ___ ich nach Spanien fahren.","a":"werde","w":["wirst","wird","werden"],"why":"Future = werden + infinitive at the end: ich werde, du wirst, er wird, wir werden, ihr werdet, sie werden."},{"id":"de-060","subject":"German","unit":"Grammar (Higher)","topic":"Future, conditional and pluperfect","q":"Complete the future tense: Nächstes Jahr ___ du nach Spanien fahren.","a":"wirst","w":["wird","werden","werdet"],"why":"Future = werden + infinitive at the end: ich werde, du wirst, er wird, wir werden, ihr werdet, sie werden."},{"id":"de-061","subject":"German","unit":"Grammar (Higher)","topic":"Future, conditional and pluperfect","q":"Complete the future tense: Nächstes Jahr ___ er nach Spanien fahren.","a":"wird","w":["werden","werdet","werde"],"why":"Future = werden + infinitive at the end: ich werde, du wirst, er wird, wir werden, ihr werdet, sie werden."},{"id":"de-062","subject":"German","unit":"Grammar (Higher)","topic":"Future, conditional and pluperfect","q":"Complete the future tense: Nächstes Jahr ___ wir nach Spanien fahren.","a":"werden","w":["werdet","werde","wirst"],"why":"Future = werden + infinitive at the end: ich werde, du wirst, er wird, wir werden, ihr werdet, sie werden."},{"id":"de-063","subject":"German","unit":"Grammar (Higher)","topic":"Future, conditional and pluperfect","q":"Complete the future tense: Nächstes Jahr ___ ihr nach Spanien fahren.","a":"werdet","w":["werden","werde","wirst"],"why":"Future = werden + infinitive at the end: ich werde, du wirst, er wird, wir werden, ihr werdet, sie werden."},{"id":"de-064","subject":"German","unit":"Grammar (Higher)","topic":"Future, conditional and pluperfect","q":"Complete the future tense: Nächstes Jahr ___ sie nach Spanien fahren.","a":"werden","w":["werde","wirst","wird"],"why":"Future = werden + infinitive at the end: ich werde, du wirst, er wird, wir werden, ihr werdet, sie werden."},{"id":"de-065","subject":"German","unit":"Grammar (Higher)","topic":"Future, conditional and pluperfect","q":"Complete the conditional: Mit mehr Geld ___ ich um die Welt reisen.","a":"würde","w":["würdest","würden","würdet"],"why":"Conditional = würde + infinitive: ich würde, du würdest, er würde, wir würden, ihr würdet, sie würden."},{"id":"de-066","subject":"German","unit":"Grammar (Higher)","topic":"Future, conditional and pluperfect","q":"Complete the conditional: Mit mehr Geld ___ er um die Welt reisen.","a":"würde","w":["würden","würdet","würdest"],"why":"Conditional = würde + infinitive: ich würde, du würdest, er würde, wir würden, ihr würdet, sie würden."},{"id":"de-067","subject":"German","unit":"Grammar (Higher)","topic":"Future, conditional and pluperfect","q":"Complete the conditional: Mit mehr Geld ___ wir um die Welt reisen.","a":"würden","w":["würdet","würde","würdest"],"why":"Conditional = würde + infinitive: ich würde, du würdest, er würde, wir würden, ihr würdet, sie würden."},{"id":"de-068","subject":"German","unit":"Grammar (Higher)","topic":"Future, conditional and pluperfect","q":"Complete the conditional: Mit mehr Geld ___ sie um die Welt reisen.","a":"würden","w":["würde","würdest","würdet"],"why":"Conditional = würde + infinitive: ich würde, du würdest, er würde, wir würden, ihr würdet, sie würden."},{"id":"de-069","subject":"German","unit":"Grammar (Higher)","topic":"Future, conditional and pluperfect","q":"Complete: Wenn ich reich ___, hätte ich ein großes Haus.","a":"wäre","w":["würde","bin","war"],"why":"wenn ich reich wäre = if I were rich (conditional of sein)."},{"id":"de-070","subject":"German","unit":"Grammar (Higher)","topic":"Future, conditional and pluperfect","q":"Complete: Wenn ich mehr Zeit ___, würde ich mehr lesen.","a":"hätte","w":["habe","hatte","würde"],"why":"wenn ich mehr Zeit hätte = if I had more time."},{"id":"de-071","subject":"German","unit":"Grammar (Higher)","topic":"Future, conditional and pluperfect","q":"How do you form the future tense in German?","a":"The present tense of werden + an infinitive at the end","w":["The present tense of haben + a past participle","Würde + a past participle","The imperfect of werden + an infinitive"],"why":"Ich werde nach Berlin fahren = I will travel to Berlin."},{"id":"de-072","subject":"German","unit":"Grammar (Higher)","topic":"Future, conditional and pluperfect","q":"How do you form the conditional (\"would\") for most verbs?","a":"Würde + infinitive at the end","w":["Werde + infinitive","Hat + past participle","The imperfect of the verb"],"why":"Ich würde gern nach Japan fahren = I would like to go to Japan."},{"id":"de-073","subject":"German","unit":"Grammar (Higher)","topic":"Future, conditional and pluperfect","q":"How is the pluperfect tense (Plusquamperfekt) formed?","a":"The imperfect of haben or sein + a past participle","w":["Werden + infinitive","The present of haben or sein + a past participle","Würde + infinitive"],"why":"Ich hatte gegessen = I had eaten; er war gefahren = he had travelled."},{"id":"de-074","subject":"German","unit":"Grammar (Higher)","topic":"Future, conditional and pluperfect","q":"Which sentence is in the future tense?","a":"Ich werde morgen arbeiten","w":["Ich arbeite morgen nicht","Ich habe gestern gearbeitet","Ich würde gern arbeiten"],"why":"werden + infinitive."},{"id":"de-075","subject":"German","unit":"Grammar (Higher)","topic":"Future, conditional and pluperfect","q":"Which sentence is in the conditional?","a":"Ich würde gern nach Italien fahren","w":["Ich werde nach Italien fahren","Ich bin nach Italien gefahren","Ich fuhr nach Italien"],"why":"würde + infinitive."},{"id":"de-076","subject":"German","unit":"Grammar (Higher)","topic":"Future, conditional and pluperfect","q":"Which sentence is in the pluperfect?","a":"Er hatte schon gegessen","w":["Er hat schon gegessen","Er aß schon","Er wird schon essen"],"why":"hatte + past participle."},{"id":"de-077","subject":"German","unit":"Grammar (Higher)","topic":"Future, conditional and pluperfect","q":"Complete: Ich ___ gern ein Eis essen. (I would like to eat an ice cream.)","a":"würde","w":["werde","wurde","wäre"],"why":"würde gern + infinitive = would like to."},{"id":"de-078","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"How is the perfect tense formed in German?","a":"Present tense of haben or sein + past participle at the end","w":["Werden + infinitive at the end","Imperfect of haben + infinitive","Würde + past participle"],"why":"Ich habe Fußball gespielt; ich bin nach Berlin gefahren."},{"id":"de-079","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Which verbs take sein in the perfect tense?","a":"Verbs of movement or change of state, e.g. gehen, fahren, bleiben","w":["All verbs that end in -en","Verbs with a separable prefix","Modal verbs only"],"why":"Also sein itself (ich bin gewesen) and werden (ich bin geworden)."},{"id":"de-080","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"What is the past participle of a regular verb like spielen?","a":"gespielt","w":["gespielen","spielt","gespiel"],"why":"Regular verbs: ge- + stem + -t."},{"id":"de-081","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"What is the past participle of fahren?","a":"gefahren","w":["gefahrt","gefuhren","gefährt"],"why":"Strong verbs: ge- + stem + -en. Remember the auxiliary is sein: ich bin gefahren."},{"id":"de-082","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"What is the past participle of essen?","a":"gegessen","w":["geesst","gegesst","gesessen"],"why":"Strong verb: ge- + essen: ich habe eine Pizza gegessen."},{"id":"de-083","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"What is the past participle of sehen?","a":"gesehen","w":["gesieht","gesehnt","gesahen"],"why":"ich habe einen Film gesehen."},{"id":"de-084","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"What is the past participle of lesen?","a":"gelesen","w":["geliest","gelest","gelasen"],"why":"ich habe ein Buch gelesen."},{"id":"de-085","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"What is the past participle of bleiben?","a":"geblieben","w":["gebleibt","gebleiben","bleibt"],"why":"ich bin zu Hause geblieben (sein verb)."},{"id":"de-086","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"What is the past participle of kommen?","a":"gekommen","w":["gekommt","gekam","gekommet"],"why":"er ist spät gekommen (sein verb)."},{"id":"de-087","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"What is the past participle of aufstehen (to get up)?","a":"aufgestanden","w":["gestanden auf","geaufstanden","aufgestehen"],"why":"Separable verbs put -ge- between the prefix and the stem."},{"id":"de-088","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"What is the past participle of besuchen (to visit)?","a":"besucht","w":["gebesucht","besuchen","begesucht"],"why":"Inseparable prefixes (be-, ge-, ver-, er-, ent-) do not add ge-."},{"id":"de-089","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"What is the past participle of telefonieren?","a":"telefoniert","w":["getelefoniert","telefonieren","getelefonieren"],"why":"Verbs ending in -ieren do not add ge-."},{"id":"de-090","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Where does the past participle go in a main clause?","a":"At the end","w":["Straight after the subject","At the start","Before the auxiliary verb"],"why":"Ich habe gestern Fußball gespielt."},{"id":"de-091","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Which sentence is correct? (Yesterday I went to the cinema.)","a":"Gestern bin ich ins Kino gegangen","w":["Gestern habe ich ins Kino gegangen","Gestern ich bin ins Kino gegangen","Gestern bin ich gegangen ins Kino"],"why":"Verb second, and the past participle goes at the end."},{"id":"de-092","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Which tense is usually used for sein, haben and modal verbs when talking about the past?","a":"Imperfect (Imperfekt)","w":["Perfect","Pluperfect","Future"],"why":"ich war, ich hatte, ich konnte..."},{"id":"de-093","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"Which tense do you normally use to say \"I played football\" in conversation?","a":"Perfect (ich habe Fußball gespielt)","w":["Imperfect (ich spielte Fußball)","Future","Conditional"],"why":"The perfect is the usual spoken past tense; the imperfect is more common in writing and with sein/haben/modals."},{"id":"de-094","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"What is the imperfect of \"ich bin\" (I was)?","a":"ich war","w":["ich wurde","ich bin gewesen (imperfect)","ich wäre"],"why":"sein (imperfect): war, warst, war, waren, wart, waren."},{"id":"de-095","subject":"German","unit":"Grammar (Higher)","topic":"Perfect and imperfect tense","q":"What is the imperfect of \"ich habe\" (I had)?","a":"ich hatte","w":["ich hätte","ich habe gehabt (imperfect)","ich hab"],"why":"haben (imperfect): hatte, hattest, hatte, hatten, hattet, hatten."},{"id":"de-096","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Where does the second verb go after a modal verb in a main clause?","a":"At the end, as an infinitive","w":["Straight after the modal","At the end, as a past participle","At the start"],"why":"Ich kann gut schwimmen; wir müssen heute arbeiten."},{"id":"de-097","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"What does \"ich möchte\" mean?","a":"I would like","w":["I must","I am allowed to","I can"],"why":"Möchte is the polite \"would like\" form of mögen."},{"id":"de-098","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"What does \"ich darf\" mean?","a":"I am allowed to / I may","w":["I must","I should","I want to"],"why":"dürfen = to be allowed to."},{"id":"de-099","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"What does \"ich soll\" mean?","a":"I should / I am supposed to","w":["I want to","I can","I like"],"why":"sollen = to be supposed to."},{"id":"de-100","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"The du form of fahren is...","a":"fährst","w":["fahrst","fährt","fahrt"],"why":"fahren has a vowel change in du and er/sie/es: fährst, fährt."},{"id":"de-101","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"The er form of lesen is...","a":"liest","w":["lest","lesst","lässt"],"why":"lesen: e becomes ie in du and er/sie/es."},{"id":"de-102","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"The du form of sehen is...","a":"siehst","w":["sehst","sihst","sieht"],"why":"sehen: e becomes ie in du and er/sie/es."},{"id":"de-103","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"The er form of essen is...","a":"isst","w":["esst","ist","eßt"],"why":"essen: e becomes i in du and er/sie/es (du isst, er isst)."},{"id":"de-104","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"The wir form of sein is...","a":"sind","w":["seid","sein","sinden"],"why":"sein: bin, bist, ist, sind, seid, sind."},{"id":"de-105","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"The ihr form of haben is...","a":"habt","w":["hat","haben","habet"],"why":"haben: habe, hast, hat, haben, habt, haben."},{"id":"de-106","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Which verb is irregular in the present tense?","a":"sein","w":["spielen","machen","wohnen"],"why":"Regular verbs add -e, -st, -t, -en, -t, -en to the stem; sein is very irregular."},{"id":"de-107","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"What are the present-tense endings of regular verbs (ich, du, er, wir, ihr, sie)?","a":"-e, -st, -t, -en, -t, -en","w":["-e, -es, -e, -ons, -ez, -ent","-e, -t, -t, -en, -t, -en","-st, -st, -t, -en, -t, -en"],"why":"ich spiele, du spielst, er spielt, wir spielen, ihr spielt, sie spielen."},{"id":"de-108","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"How do you say \"I am going to the cinema\" in German?","a":"Ich gehe ins Kino","w":["Ich bin gehen ins Kino","Ich gehe zu Kino","Ich ging in Kino"],"why":"German uses the simple present for \"I am going\"."},{"id":"de-109","subject":"German","unit":"Grammar (Higher)","topic":"Present tense","q":"Which pronoun goes with \"seid\"?","a":"ihr","w":["wir","du","sie"],"why":"ihr seid = you (plural) are."},{"id":"de-110","subject":"German","unit":"Grammar (Higher)","topic":"Subordinating conjunctions and word order","q":"In a main clause, the verb is always the ___ idea.","a":"Second","w":["First","Last","Third"],"why":"Verb second: Heute gehe ich ins Kino (not \"Heute ich gehe...\")."},{"id":"de-111","subject":"German","unit":"Grammar (Higher)","topic":"Subordinating conjunctions and word order","q":"Which sentence has the correct word order?","a":"Am Wochenende spiele ich Fußball","w":["Am Wochenende ich spiele Fußball","Ich am Wochenende spiele Fußball","Am Wochenende Fußball spiele ich"],"why":"After a time phrase the verb comes next, then the subject (inversion)."},{"id":"de-112","subject":"German","unit":"Grammar (Higher)","topic":"Subordinating conjunctions and word order","q":"What does weil do to the word order of the clause it introduces?","a":"The verb goes to the end of the clause","w":["The verb goes first","Nothing changes","The subject goes to the end"],"why":"Ich bleibe zu Hause, weil ich krank bin."},{"id":"de-113","subject":"German","unit":"Grammar (Higher)","topic":"Subordinating conjunctions and word order","q":"Which sentence is correct? (I like eating fruit because it is healthy.)","a":"Ich esse gern Obst, weil es gesund ist","w":["Ich esse gern Obst, weil es ist gesund","Ich esse gern Obst, weil ist es gesund","Ich esse gern Obst, weil gesund es ist"],"why":"weil sends the verb to the end of the clause."},{"id":"de-114","subject":"German","unit":"Grammar (Higher)","topic":"Subordinating conjunctions and word order","q":"Which of these conjunctions sends the verb to the end?","a":"dass","w":["und","aber","denn"],"why":"und, aber, denn, oder do not change the word order; weil, dass, wenn, ob, obwohl, als do."},{"id":"de-115","subject":"German","unit":"Grammar (Higher)","topic":"Subordinating conjunctions and word order","q":"Which of these conjunctions does NOT change the word order?","a":"denn","w":["weil","obwohl","wenn"],"why":"denn (because) is a co-ordinating conjunction: Ich bleibe zu Hause, denn ich bin krank."},{"id":"de-116","subject":"German","unit":"Grammar (Higher)","topic":"Subordinating conjunctions and word order","q":"Which sentence is correct? (I know that he is coming tomorrow.)","a":"Ich weiß, dass er morgen kommt","w":["Ich weiß, dass er kommt morgen","Ich weiß, dass kommt er morgen","Ich weiß, dass morgen kommt er"],"why":"dass sends the verb to the end."},{"id":"de-117","subject":"German","unit":"Grammar (Higher)","topic":"Subordinating conjunctions and word order","q":"Which sentence is correct? (If it rains, I stay at home.)","a":"Wenn es regnet, bleibe ich zu Hause","w":["Wenn es regnet, ich bleibe zu Hause","Wenn es regnet ich bleibe, zu Hause","Wenn regnet es, bleibe ich zu Hause"],"why":"A wenn-clause at the start: the verb goes to the end of that clause, then the main verb comes straight after the comma."},{"id":"de-118","subject":"German","unit":"Grammar (Higher)","topic":"Subordinating conjunctions and word order","q":"In \"Obwohl es kalt war, ging ich schwimmen\", what is special about \"ging\"?","a":"It comes straight after the comma because the subordinate clause counts as the first idea","w":["It should be at the end","It should come before the comma","Nothing; it is a normal subordinate clause verb"],"why":"Subordinate clause first → verb of the main clause comes immediately after the comma."},{"id":"de-119","subject":"German","unit":"Grammar (Higher)","topic":"Subordinating conjunctions and word order","q":"Which sentence uses a modal verb correctly?","a":"Ich muss heute meine Hausaufgaben machen","w":["Ich muss machen heute meine Hausaufgaben","Ich muss heute machen meine Hausaufgaben","Ich machen muss heute meine Hausaufgaben"],"why":"Modal in second position, infinitive at the end."},{"id":"de-120","subject":"German","unit":"Grammar (Higher)","topic":"Subordinating conjunctions and word order","q":"Where does the separable prefix go in the present tense, e.g. aufstehen?","a":"At the end of the clause","w":["Straight after the verb","At the start","It stays attached to the verb"],"why":"Ich stehe um sieben Uhr auf."},{"id":"de-121","subject":"German","unit":"Grammar (Higher)","topic":"Subordinating conjunctions and word order","q":"Which sentence is correct? (I get up at seven.)","a":"Ich stehe um sieben Uhr auf","w":["Ich aufstehe um sieben Uhr","Ich stehe auf um sieben Uhr","Ich auf stehe um sieben Uhr"],"why":"Separable verbs split in main clauses."},{"id":"de-122","subject":"German","unit":"Grammar (Higher)","topic":"Subordinating conjunctions and word order","q":"In the perfect tense, which sentence is correct? (I have played football.)","a":"Ich habe Fußball gespielt","w":["Ich habe gespielt Fußball","Ich gespielt habe Fußball","Ich Fußball habe gespielt"],"why":"Auxiliary second, past participle last."},{"id":"de-123","subject":"German","unit":"Grammar (Higher)","topic":"Subordinating conjunctions and word order","q":"Which sentence is correct? (Tomorrow I will visit my grandma.)","a":"Morgen werde ich meine Oma besuchen","w":["Morgen ich werde meine Oma besuchen","Morgen werde ich besuchen meine Oma","Morgen besuchen werde ich meine Oma"],"why":"werden second, infinitive at the end."},{"id":"de-124","subject":"German","unit":"Grammar (Higher)","topic":"Subordinating conjunctions and word order","q":"Which word means \"because\" and changes the word order?","a":"weil","w":["denn","und","aber"],"why":"weil = because (verb to the end); denn = because (no change)."},{"id":"de-125","subject":"German","unit":"Grammar (Higher)","topic":"Subordinating conjunctions and word order","q":"What does \"obwohl\" mean?","a":"Although","w":["Because","If","Whether"],"why":"Obwohl sends the verb to the end."},{"id":"de-126","subject":"German","unit":"Grammar (Higher)","topic":"Subordinating conjunctions and word order","q":"What does \"ob\" mean?","a":"Whether / if","w":["Although","That","Because"],"why":"Ich weiß nicht, ob er kommt."},{"id":"de-127","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"What does \"heiß\" mean?","a":"hot","w":["cold","warm","healthy, healthily"],"why":"heiß = hot."},{"id":"de-128","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"How do you say \"cold\" in German?","a":"kalt","w":["lecker","heiß","warm"],"why":"kalt = cold."},{"id":"de-129","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"What does \"lecker\" mean?","a":"tasty, delicious","w":["sweet, sugary","warm","hot"],"why":"lecker = tasty, delicious."},{"id":"de-130","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"How do you say \"sharp, spicy\" in German?","a":"scharf","w":["lecker","kalt","süß"],"why":"scharf = sharp, spicy, hot."},{"id":"de-131","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"What does \"süß\" mean?","a":"sweet, sugary","w":["warm","tasty, delicious","sharp, spicy"],"why":"süß = sweet, sugary, cute."},{"id":"de-132","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"How do you say \"warm\" in German?","a":"warm","w":["gesund","süß","frisch"],"why":"warm = warm."},{"id":"de-133","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"What does \"frisch\" mean?","a":"fresh, freshly","w":["cold","sharp, spicy","sweet, sugary"],"why":"frisch = fresh, freshly."},{"id":"de-134","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"How do you say \"healthy, healthily\" in German?","a":"gesund","w":["frisch","kalt","süß"],"why":"gesund = healthy, healthily."},{"id":"de-135","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"What does \"die Cola\" mean?","a":"cola","w":["sugar","vegan","product"],"why":"die Cola = cola."},{"id":"de-136","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"How do you say \"bottle\" in German?","a":"die Flasche","w":["die Pommes (frites)","der Durst","der Vegetarier"],"why":"die Flasche = bottle."},{"id":"de-137","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"What does \"die Gesundheit\" mean?","a":"health","w":["food, diet","meat, flesh","water"],"why":"die Gesundheit = health."},{"id":"de-138","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"How do you say \"card, ticket\" in German?","a":"die Karte","w":["der Wein","das Produkt","die Gesundheit"],"why":"die Karte = card, ticket, menu."},{"id":"de-139","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"What does \"die Küche\" mean?","a":"kitchen, cuisine","w":["fruit","drink","bottle"],"why":"die Küche = kitchen, cuisine."},{"id":"de-140","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"How do you say \"milk\" in German?","a":"die Milch","w":["der Fisch","das Gemüse","das Protein"],"why":"die Milch = milk."},{"id":"de-141","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"What does \"die Speisekarte\" mean?","a":"menu","w":["sausage","cake","fish"],"why":"die Speisekarte = menu."},{"id":"de-142","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"How do you say \"sausage\" in German?","a":"die Wurst","w":["das Ei","der Imbiss","das Fastfood"],"why":"die Wurst = sausage."},{"id":"de-143","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"What does \"der Durst\" mean?","a":"thirst","w":["protein","egg","card, ticket"],"why":"der Durst = thirst."},{"id":"de-144","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"How do you say \"fish\" in German?","a":"der Fisch","w":["die Pommes (frites)","das Essen","die Ernährung"],"why":"der Fisch = fish."},{"id":"de-145","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"What does \"der Hunger\" mean?","a":"hunger","w":["bottle","restaurant","fast food"],"why":"der Hunger = hunger."},{"id":"de-146","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"How do you say \"snack, refreshment\" in German?","a":"der Imbiss","w":["das Gericht","das Wasser","das Eis"],"why":"der Imbiss = snack, refreshment, snack bar, take away, diner."},{"id":"de-147","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"What does \"der Kaffee\" mean?","a":"coffee","w":["glass","cake","fish"],"why":"der Kaffee = coffee."},{"id":"de-148","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"How do you say \"cheese\" in German?","a":"der Käse","w":["die Speisekarte","das Gemüse","das Obst"],"why":"der Käse = cheese."},{"id":"de-149","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"What does \"der Kuchen\" mean?","a":"cake","w":["fish","fast food","breakfast"],"why":"der Kuchen = cake."},{"id":"de-150","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"How do you say \"vegan\" in German?","a":"der Veganer","w":["das Produkt","die Cola","das Bier"],"why":"der Veganer = vegan."},{"id":"de-151","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"What does \"der Vegetarier\" mean?","a":"vegetarian","w":["snack, refreshment","chicken","breakfast"],"why":"der Vegetarier = vegetarian."},{"id":"de-152","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"How do you say \"wine\" in German?","a":"der Wein","w":["das Eis","der Kaffee","der Fisch"],"why":"der Wein = wine."},{"id":"de-153","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"What does \"der Zucker\" mean?","a":"sugar","w":["vegetables","chicken","fish"],"why":"der Zucker = sugar."},{"id":"de-154","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"How do you say \"beer\" in German?","a":"das Bier","w":["die Gesundheit","der Wein","der Vegetarier"],"why":"das Bier = beer."},{"id":"de-155","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"What does \"das Brot\" mean?","a":"bread","w":["drink","vegetables","cheese"],"why":"das Brot = bread."},{"id":"de-156","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"How do you say \"egg\" in German?","a":"das Ei","w":["das Glas","der Veganer","das Gericht"],"why":"das Ei = egg."},{"id":"de-157","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"What does \"das Eis\" mean?","a":"ice, ice cream","w":["breakfast","kitchen, cuisine","menu"],"why":"das Eis = ice, ice cream."},{"id":"de-158","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"How do you say \"food, meal\" in German?","a":"das Essen","w":["der Kaffee","der Imbiss","das Hähnchen"],"why":"das Essen = food, meal."},{"id":"de-159","subject":"German","unit":"Theme 1: People and lifestyle","topic":"Healthy living and lifestyle","q":"What does \"das Fastfood\" mean?","a":"fast food","w":["protein","restaurant","bread"],"why":"das
