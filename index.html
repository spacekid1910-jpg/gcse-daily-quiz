 to seize the crown."},{"id":"lit-157","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"There's daggers in men's ___.\"","a":"smiles","w":["hands","eyes","hearts"],"why":"Donalbain says this after Duncan's murder."},{"id":"lit-158","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"The raven himself is ___ that croaks the fatal entrance of Duncan.\"","a":"hoarse","w":["silent","black","weary"],"why":"Lady Macbeth uses nature imagery to foreshadow the murder."},{"id":"lit-159","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"Sleep no more! Macbeth does murder ___.\"","a":"sleep","w":["peace","trust","sense"],"why":"Macbeth hears a voice after killing Duncan."},{"id":"lit-160","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"Will all great Neptune's ocean wash this blood clean from my ___?\"","a":"hand","w":["heart","soul","face"],"why":"Macbeth realises the murder will stain him forever."},{"id":"lit-161","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"Had he not resembled my father as he slept, I had ___ 't.\"","a":"done","w":["killed","struck","stabbed"],"why":"Lady Macbeth could not kill Duncan herself."},{"id":"lit-162","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"When shall we three meet again? In thunder, lightning, or in ___?\"","a":"rain","w":["snow","fire","storm"],"why":"The opening of the play sets an atmosphere of chaos."},{"id":"lit-163","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"He was a gentleman on whom I built an absolute ___.\"","a":"trust","w":["faith","hope","love"],"why":"Duncan on the traitorous Thane of Cawdor. He then trusts Macbeth."},{"id":"lit-164","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote (witches to Banquo): \"Lesser than Macbeth, and ___.\"","a":"greater","w":["equal","worse","stronger"],"why":"The witches speak in riddles and paradoxes."},{"id":"lit-165","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Who says: \"Out, damned spot! Out, I say!\"?","a":"Lady Macbeth","w":["Macbeth","Banquo","Macduff"],"why":"She is sleepwalking and imagining blood on her hands."},{"id":"lit-166","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Who says: \"There's daggers in men's smiles\"?","a":"Donalbain","w":["Macduff","Malcolm","Banquo"],"why":"He suspects danger and flees to Ireland."},{"id":"lit-167","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Plot and structure","q":"What title is Macbeth already holding when the play begins?","a":"Thane of Glamis","w":["Thane of Cawdor","Thane of Fife","King of Scotland"],"why":"He is then made Thane of Cawdor and becomes king."},{"id":"lit-168","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Plot and structure","q":"Why does Duncan give the title Thane of Cawdor to Macbeth?","a":"The old Thane of Cawdor was executed for treason","w":["He was killed in battle","He retired","He was a witch"],"why":"This fulfils part of the witches' prophecy."},{"id":"lit-169","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Plot and structure","q":"Where does Macbeth murder Duncan?","a":"In Macbeth's castle at Inverness","w":["On the battlefield","At Dunsinane","In the woods near Forres"],"why":"Duncan is a guest there."},{"id":"lit-170","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Plot and structure","q":"Why does Macbeth have Banquo murdered?","a":"The witches said Banquo's descendants would be kings","w":["Banquo saw him kill Duncan","Banquo wanted to marry Lady Macbeth","Banquo joined Malcolm's army"],"why":"Fleance escapes."},{"id":"lit-171","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Plot and structure","q":"Whose ghost appears to Macbeth at the banquet?","a":"Banquo's","w":["Duncan's","Lady Macduff's","Old Siward's"],"why":"Only Macbeth can see it."},{"id":"lit-172","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Plot and structure","q":"Whom does Macbeth order to be killed after Macduff flees to England?","a":"Macduff's wife and children","w":["Malcolm and Donalbain","Fleance","The doctor"],"why":"It shows Macbeth's tyranny."},{"id":"lit-173","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Plot and structure","q":"What is Lady Macbeth doing in her sleepwalking scene?","a":"Trying to wash imaginary blood from her hands","w":["Praying at an altar","Writing a letter","Plotting another murder"],"why":"The scene shows her guilt."},{"id":"lit-174","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Plot and structure","q":"How does Macbeth die?","a":"He is killed by Macduff","w":["He is executed by Malcolm","He is poisoned by Lady Macbeth","He dies of guilt"],"why":"Macduff was not 'of woman born'. He was cut from his mother's womb."},{"id":"lit-175","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Plot and structure","q":"What do Malcolm's soldiers carry to disguise their numbers?","a":"Branches from Birnam Wood","w":["Shields from Dunsinane","White flags","Torches"],"why":"This fulfils the prophecy of 'Birnam Wood to Dunsinane'."},{"id":"lit-176","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Plot and structure","q":"Who becomes king at the end of the play?","a":"Malcolm","w":["Macduff","Fleance","Donalbain"],"why":"Order is restored with a legitimate king."},{"id":"lit-177","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Plot and structure","q":"In which act is Duncan murdered?","a":"Act 2","w":["Act 1","Act 3","Act 5"],"why":"The murder happens offstage."},{"id":"lit-178","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Characters","q":"How is Macbeth described at the start of the play?","a":"A brave and loyal soldier","w":["A cowardly deserter","A cruel tyrant","A weak king"],"why":"The Captain calls him 'brave Macbeth'."},{"id":"lit-179","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Characters","q":"What does Lady Macbeth mean when she asks the spirits to 'unsex' her?","a":"She wants to lose feminine gentleness so she can commit murder","w":["She wants to become a man","She wants to become a witch","She wants to leave Scotland"],"why":"It links masculinity with violence."},{"id":"lit-180","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Characters","q":"How does Banquo differ from Macbeth?","a":"He resists the temptation of the witches' prophecies","w":["He becomes king","He kills Duncan","He believes everything the witches say"],"why":"He stays loyal to Duncan."},{"id":"lit-181","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Characters","q":"How is King Duncan presented?","a":"As a kind, trusting and virtuous king","w":["As a cruel tyrant","As a weak fool","As a violent warrior"],"why":"He misjudges the Thane of Cawdor and Macbeth."},{"id":"lit-182","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Themes","q":"Which theme is shown by the phrase 'vaulting ambition'?","a":"Ambition","w":["Friendship","Loyalty","Justice"],"why":"Macbeth's fatal flaw is his ambition."},{"id":"lit-183","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Themes","q":"What does the repeated imagery of blood show in Macbeth?","a":"Guilt","w":["Happiness","Friendship","Justice"],"why":"Blood cannot be washed away."},{"id":"lit-184","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Themes","q":"Which theme is shown by 'Fair is foul, and foul is fair'?","a":"Appearance versus reality","w":["Friendship","Kingship","Justice"],"why":"Nothing is as it seems."},{"id":"lit-185","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Themes","q":"How is kingship explored through Duncan and Macbeth?","a":"Duncan is a virtuous king. Macbeth becomes a tyrant","w":["Both are cruel","Both are weak","Macbeth is a better king"],"why":"Malcolm restores order at the end."},{"id":"lit-186","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Language, form and structure","q":"What is a soliloquy?","a":"A speech in which a character speaks their thoughts aloud while alone on stage","w":["A conversation between two characters","A speech by a narrator","A comic scene"],"why":"Soliloquies reveal a character's private thoughts."},{"id":"lit-187","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Language, form and structure","q":"What verse form do most noble characters in Macbeth speak in?","a":"Blank verse (unrhymed iambic pentameter)","w":["Rhyming couplets","Free verse","Prose only"],"why":"The witches use rhyming couplets and short lines."},{"id":"lit-188","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Language, form and structure","q":"Why do the witches speak in rhyming couplets?","a":"It makes them sound like chants and marks them as supernatural","w":["They are poets","It is more realistic","Shakespeare ran out of ideas"],"why":"It sets them apart from the other characters."},{"id":"lit-189","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Language, form and structure","q":"Duncan praises the pleasant look of Macbeth's castle before being murdered there. This is...","a":"Dramatic irony","w":["A soliloquy","An aside","A simile"],"why":"The audience knows what is planned."},{"id":"lit-190","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Language, form and structure","q":"Macbeth's 'fatal flaw' that leads to his downfall is...","a":"Ambition","w":["Cowardice","Kindness","Honesty"],"why":"This makes him a tragic hero."},{"id":"lit-191","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Context","q":"Macbeth was written around 1606 during the reign of...","a":"James I","w":["Elizabeth I","Henry VIII","Charles I"],"why":"It is set in Scotland, James's home country."},{"id":"lit-192","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Context","q":"What was the Gunpowder Plot of 1605?","a":"A plan to blow up Parliament and kill King James I","w":["A war with Spain","A plague","A witch trial"],"why":"It made regicide a live fear."},{"id":"lit-193","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Context","q":"What did the 'Divine Right of Kings' mean?","a":"Kings were chosen by God, so killing one was a sin","w":["Kings were chosen by the people","Kings had no power","Only the Church could crown a king"],"why":"It explains why killing Duncan is so serious."},{"id":"lit-194","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Context","q":"Which book on witchcraft did James I write?","a":"Daemonologie","w":["Leviathan","The Faerie Queene","Malleus Maleficarum"],"why":"Belief in witches was widespread."},{"id":"lit-195","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Context","q":"The Great Chain of Being was...","a":"A belief in a divine order from God down to plants and objects","w":["A type of Elizabethan jewellery","A law about kings","A witches' spell"],"why":"Killing a king disrupts the natural order."},{"id":"lit-196","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Context","q":"Which historical figure did James I claim descent from, according to legend?","a":"Banquo","w":["Duncan","Macbeth","Macduff"],"why":"This is why Banquo is presented favourably."},{"id":"lit-197","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Plot and structure","q":"Complete the quote: \"We don't live alone. We are members of one ___.\"","a":"body","w":["family","community","nation"],"why":"The Inspector's final speech. It sums up Priestley's message."},{"id":"lit-198","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Plot and structure","q":"Complete the quote: \"...they will be taught it in fire and blood and ___.\"","a":"anguish","w":["tears","pain","war"],"why":"The Inspector warns of the consequences of ignoring social responsibility."},{"id":"lit-199","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Plot and structure","q":"Complete the quote (Sheila): \"But these girls aren't cheap ___ - they're people.\"","a":"labour","w":["help","servants","workers"],"why":"Sheila shows she has begun to change."},{"id":"lit-200","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Plot and structure","q":"Complete the quote (Birling): \"...unsinkable, absolutely ___.\"","a":"unsinkable","w":["safe","strong","perfect"],"why":"Dramatic irony: the audience knows the Titanic sank."},{"id":"lit-201","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Plot and structure","q":"Complete the quote (Birling): \"...as if we were all mixed up together like bees in a ___.\"","a":"hive","w":["nest","farm","field"],"why":"He mocks the idea of community."},{"id":"lit-202","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Plot and structure","q":"Complete the quote (Birling): \"Community and all that ___.\"","a":"nonsense","w":["rubbish","talk","business"],"why":"He rejects social responsibility."},{"id":"lit-203","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Plot and structure","q":"Complete the quote (Inspector): \"Public men, Mr Birling, have responsibilities as well as ___.\"","a":"privileges","w":["rights","profits","duties"],"why":"He challenges Birling's view of his own role."},{"id":"lit-204","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Plot and structure","q":"Complete the quote (Mrs Birling): \"I accept no ___ at all.\"","a":"blame","w":["help","guilt","shame"],"why":"She refuses to accept responsibility."},{"id":"lit-205","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Plot and structure","q":"Complete the quote (Inspector): \"One Eva Smith has gone - but there are millions and millions of Eva Smiths and John ___ still left with us.\"","a":"Smiths","w":["Browns","Joneses","Does"],"why":"Eva represents all working-class people."},{"id":"lit-206","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Plot and structure","q":"Complete the quote (Inspector): \"Each of you helped to ___ her.\"","a":"kill","w":["hurt","destroy","ruin"],"why":"He makes them face their shared responsibility."},{"id":"lit-207","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Plot and structure","q":"Complete the quote (Eric): \"You're not the kind of ___ a chap could go to when he's in trouble.\"","a":"father","w":["brother","friend","man"],"why":"Eric criticises his father."},{"id":"lit-208","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Plot and structure","q":"Where and when is An Inspector Calls set?","a":"The Birlings' dining room in Brumley in 1912","w":["London in 1945","Manchester in 1920","A courtroom in Brumley in 1912"],"why":"It was written in 1945."},{"id":"lit-209","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Plot and structure","q":"What is the Inspector's name?","a":"Goole","w":["Gould","Croft","Birling"],"why":"His name sounds like 'ghoul'."},{"id":"lit-210","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Plot and structure","q":"In which order does the Inspector question people about Eva Smith?","a":"Mr Birling, Sheila, Gerald, Mrs Birling, Eric","w":["Sheila, Mr Birling, Eric, Mrs Birling, Gerald","Gerald, Sheila, Eric, Mr Birling, Mrs Birling","Mr Birling, Mrs Birling, Sheila, Gerald, Eric"],"why":"Each interrogation links to the next."},{"id":"lit-211","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Plot and structure","q":"Why did Mr Birling dismiss Eva Smith in 1910?","a":"She led a strike for higher wages","w":["She stole money","She was often late","She insulted his wife"],"why":"He would not pay the workers more."},{"id":"lit-212","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Plot and structure","q":"Why did Sheila get Eva sacked from Milwards?","a":"She was jealous and angry because Eva seemed to laugh at her","w":["Eva stole a dress","Eva was rude to Gerald","Eva refused to work"],"why":"Sheila abused her position as a customer."},{"id":"lit-213","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Plot and structure","q":"What was Gerald Croft's relationship with Eva (Daisy Renton)?","a":"He kept her as his mistress for the summer of 1911","w":["He employed her at his factory","He was her landlord","He was her cousin"],"why":"He ended it and left her."},{"id":"lit-214","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Plot and structure","q":"What did Mrs Birling do to Eva?","a":"She refused her help as chair of a charity while Eva was pregnant","w":["She sacked her","She had her arrested","She gave her money"],"why":"She judged Eva by her class."},{"id":"lit-215","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Plot and structure","q":"What did Eric do?","a":"Got Eva pregnant and stole money from his father's business","w":["Sacked her","Lied to the police","Refused to help her"],"why":"He is the father of Eva's unborn child."},{"id":"lit-216","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Plot and structure","q":"How did Eva Smith die?","a":"By drinking disinfectant","w":["In a car accident","By drowning","From an illness"],"why":"The Inspector describes her painful death."},{"id":"lit-217","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Plot and structure","q":"How does the play end?","a":"A phone call says a girl has just died and a police inspector is on his way","w":["The Inspector arrests Birling","Gerald and Sheila marry","Eric confesses to the police"],"why":"The ending is cyclical."},{"id":"lit-218","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Characters","q":"How is Mr Birling presented?","a":"As e into the simple future (futur simple): Demain, ils ___ (faire) du ski.","a":"feront","w":["ferai","feras","fera"],"why":"Future stem of faire: fer- + -ai, -as, -a, -ons, -ez, -ont."},{"id":"fr-573","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"Put faire into the simple future (futur simple): Demain, il ___ (faire) du ski.","a":"fera","w":["ferons","ferez","feront"],"why":"Future stem of faire: fer- + -ai, -as, -a, -ons, -ez, -ont."},{"id":"fr-574","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"Put voir into the simple future (futur simple): Demain, je ___ (voir) la tour Eiffel.","a":"verrai","w":["verras","verra","verrons"],"why":"Future stem of voir: verr- + -ai, -as, -a, -ons, -ez, -ont."},{"id":"fr-575","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"Put voir into the simple future (futur simple): Demain, nous ___ (voir) la tour Eiffel.","a":"verrons","w":["verrez","verront","verrai"],"why":"Future stem of voir: verr- + -ai, -as, -a, -ons, -ez, -ont."},{"id":"fr-576","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"Put prendre into the simple future (futur simple): Demain, tu ___ (prendre) l’avion.","a":"prendras","w":["prendra","prendrons","prendrez"],"why":"Future stem of prendre: prendr- + -ai, -as, -a, -ons, -ez, -ont."},{"id":"fr-577","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"Put prendre into the simple future (futur simple): Demain, vous ___ (prendre) l’avion.","a":"prendrez","w":["prendront","prendrai","prendras"],"why":"Future stem of prendre: prendr- + -ai, -as, -a, -ons, -ez, -ont."},{"id":"fr-578","subject":"French","unit":"Grammar (Higher)","topic":"Near future, future and conditional","q":"Put pouvoir into the simple future (futur simple): Demain, il ___ (pouvoir) venir avec nous.","a":"pourra","w":["pour
