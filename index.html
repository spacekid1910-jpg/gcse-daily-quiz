Numeric only","Unsorted"],"why":"It repeatedly halves the search area."},{"id":"cs-083","subject":"Computer Science","unit":"3.1 Fundamentals of algorithms","topic":"Searching algorithms","q":"How does a linear search work?","a":"It checks each item in turn from the start","w":["It starts at the middle and halves the list","It sorts the list first","It starts at the end only"],"why":"It works on unsorted lists but is slow for large lists."},{"id":"cs-084","subject":"Computer Science","unit":"3.1 Fundamentals of algorithms","topic":"Sorting algorithms","q":"How does a bubble sort work?","a":"It compares adjacent items and swaps them if they are in the wrong order","w":["It splits the list into halves and merges them","It finds the smallest item and moves it first only","It inserts each item into a new list"],"why":"It repeats until no swaps are needed."},{"id":"cs-085","subject":"Computer Science","unit":"3.1 Fundamentals of algorithms","topic":"Sorting algorithms","q":"How does a merge sort work?","a":"It repeatedly splits the list into halves, then merges the sorted halves","w":["It swaps adjacent items repeatedly","It checks each item in turn","It guesses the order"],"why":"It is generally faster than bubble sort for large lists."},{"id":"cs-086","subject":"Computer Science","unit":"3.2 Programming","topic":"Data types","q":"Which data type would you use to store 3.14?","a":"Real (float)","w":["Integer","Boolean","Character"],"why":"Integers are whole numbers."},{"id":"cs-087","subject":"Computer Science","unit":"3.2 Programming","topic":"Data types","q":"Which data type stores only True or False?","a":"Boolean","w":["Integer","String","Real"],"why":"A character stores a single symbol."},{"id":"cs-088","subject":"Computer Science","unit":"3.2 Programming","topic":"Programming concepts","q":"Which programming construct is iteration?","a":"A WHILE loop","w":["An IF statement","A variable declaration","A subroutine call"],"why":"Iteration means repetition."},{"id":"cs-089","subject":"Computer Science","unit":"3.2 Programming","topic":"Programming concepts","q":"What is selection?","a":"Choosing which code to run based on a condition (IF)","w":["Repeating code","Running code in order","Storing data"],"why":"Sequence is running instructions in order."},{"id":"cs-090","subject":"Computer Science","unit":"3.2 Programming","topic":"Arithmetic and relational operators","q":"What is 17 MOD 5?","a":"2","w":["3","3.4","12"],"why":"MOD gives the remainder."},{"id":"cs-091","subject":"Computer Science","unit":"3.2 Programming","topic":"Arithmetic and relational operators","q":"What is 17 DIV 5?","a":"3","w":["2","3.4","12"],"why":"DIV gives the whole number part of a division."},{"id":"cs-092","subject":"Computer Science","unit":"3.2 Programming","topic":"Arithmetic and relational operators","q":"What does the operator != mean?","a":"Not equal to","w":["Equal to","Greater than","Assign to"],"why":"= assigns a value. == compares two values."},{"id":"cs-093","subject":"Computer Science","unit":"3.2 Programming","topic":"Boolean operators","q":"When is A AND B true?","a":"When both A and B are true","w":["When either is true","When both are false","When A is false"],"why":"OR is true when at least one is true."},{"id":"cs-094","subject":"Computer Science","unit":"3.2 Programming","topic":"Boolean operators","q":"What is the result of NOT True?","a":"False","w":["True","Null","0 and 1"],"why":"NOT reverses a Boolean value."},{"id":"cs-095","subject":"Computer Science","unit":"3.2 Programming","topic":"Data structures","q":"What is an array?","a":"A fixed-size collection of items of the same data type","w":["A single variable","A type of loop","A collection of different data types with named fields"],"why":"A record stores fields of different types."},{"id":"cs-096","subject":"Computer Science","unit":"3.2 Programming","topic":"Data structures","q":"In most programming languages, the first index of an array is...","a":"0","w":["1","-1","10"],"why":"Check the convention for your language or exam pseudo-code."},{"id":"cs-097","subject":"Computer Science","unit":"3.2 Programming","topic":"Input/output and file handling","q":"What should you do after reading from or writing to a file?","a":"Close it","w":["Delete it","Rename it","Leave it open"],"why":"Closing frees resources and saves the data."},{"id":"cs-098","subject":"Computer Science","unit":"3.2 Programming","topic":"Input/output and file handling","q":"Which file mode adds new data to the end of a file without erasing it?","a":"Append","w":["Write","Read","Delete"],"why":"Write mode overwrites existing content."},{"id":"cs-099","subject":"Computer Science","unit":"3.2 Programming","topic":"String handling","q":"What is string concatenation?","a":"Joining two or more strings together","w":["Splitting a string in two","Converting a string to a number","Finding the length of a string"],"why":"\"Hello\" + \" World\" gives \"Hello World\"."},{"id":"cs-100","subject":"Computer Science","unit":"3.2 Programming","topic":"String handling","q":"What does LEN(\"computer\") return?","a":"8","w":["7","9","1"],"why":"LEN counts the characters."},{"id":"cs-101","subject":"Computer Science","unit":"3.2 Programming","topic":"Random number generation","q":"Why might a program use random numbers?","a":"To simulate things like dice rolls or shuffling cards","w":["To speed up the CPU","To compress files","To encrypt data only"],"why":"Random numbers are often generated within a given range."},{"id":"cs-102","subject":"Computer Science","unit":"3.2 Programming","topic":"Subroutines (procedures and functions)","q":"What is the difference between a function and a procedure?","a":"A function returns a value","w":["A procedure returns a value","A function cannot take parameters","There is no difference"],"why":"Both are subroutines."},{"id":"cs-103","subject":"Computer Science","unit":"3.2 Programming","topic":"Subroutines (procedures and functions)","q":"Why are subroutines used?","a":"To reuse code and make programs easier to read and test","w":["To make programs run slower","To store more data","To avoid using variables"],"why":"They support structured programming."},{"id":"cs-104","subject":"Computer Science","unit":"3.2 Programming","topic":"Structured programming and passing data","q":"A local variable is...","a":"Only accessible within the subroutine where it is declared","w":["Accessible everywhere in the program","Stored on the hard drive","A constant"],"why":"A global variable can be used anywhere."},{"id":"cs-105","subject":"Computer Science","unit":"3.2 Programming","topic":"Structured programming and passing data","q":"A parameter is...","a":"A value passed into a subroutine","w":["A value returned from a program","A type of loop","A syntax error"],"why":"Parameters let subroutines work with different data."},{"id":"cs-106","subject":"Computer Science","unit":"3.2 Programming","topic":"Robust and secure programming","q":"What is data validation?","a":"Checking that input is reasonable and sensible before it is used","w":["Checking the data is true","Encrypting the data","Deleting invalid programs"],"why":"Validation cannot check that the data is actually correct."},{"id":"cs-107","subject":"Computer Science","unit":"3.2 Programming","topic":"Robust and secure programming","q":"What is authentication?","a":"Confirming that a user is who they claim to be","w":["Encrypting data","Checking data types","Compressing data"],"why":"An example is a username and password."},{"id":"cs-108","subject":"Computer Science","unit":"3.2 Programming","topic":"Robust and secure programming","q":"Why is input sanitisation used?","a":"To remove or neutralise harmful characters in user input","w":["To make input shorter","To convert input to binary","To speed up the program"],"why":"It helps to prevent attacks such as SQL injection."},{"id":"cs-109","subject":"Computer Science","unit":"3.2 Programming","topic":"Classification of programming languages","q":"Machine code is...","a":"A low-level language of binary instructions the CPU executes directly","w":["A high-level language","A language for web design","A type of pseudo-code"],"why":"Assembly language is also low-level."},{"id":"cs-110","subject":"Computer Science","unit":"3.2 Programming","topic":"Classification of programming languages","q":"What does a compiler do?","a":"Translates the whole program into machine code before it runs","w":["Translates and runs one line at a time","Converts assembly to English","Removes bugs automatically"],"why":"An interpreter runs one line at a time."},{"id":"cs-111","subject":"Computer Science","unit":"3.2 Programming","topic":"Classification of programming languages","q":"What does an interpreter do?","a":"Translates and executes a program one line at a time","w":["Translates the whole program at once","Only checks the spelling","Converts files to binary"],"why":"It stops at the first error."},{"id":"cs-112","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Number bases","q":"What is the binary number 1010 in decimal?","a":"10","w":["8","12","1010"],"why":"8 + 2 = 10."},{"id":"cs-113","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Number bases","q":"Why is hexadecimal used by programmers?","a":"It is a more compact and easier-to-read way of writing binary","w":["Computers use hexadecimal internally","It is faster to process","It uses fewer digits than decimal"],"why":"One hex digit represents 4 bits."},{"id":"cs-114","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Number bases","q":"What is hexadecimal F in decimal?","a":"15","w":["16","14","10"],"why":"A=10 up to F=15."},{"id":"cs-115","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Converting between bases","q":"What is decimal 45 in 8-bit binary?","a":"00101101","w":["00110101","00101011","00111001"],"why":"32 + 8 + 4 + 1 = 45."},{"id":"cs-116","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Converting between bases","q":"What is binary 11111111 in hexadecimal?","a":"FF","w":["EE","F0","1F"],"why":"1111 is F, and there are two groups of four bits."},{"id":"cs-117","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Units of information","q":"How many bits are in a byte?","a":"8","w":["4","16","1000"],"why":"A nibble is 4 bits."},{"id":"cs-118","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Units of information","q":"How many bytes are in a kilobyte in the AQA specification?","a":"1000","w":["100","10 000","8"],"why":"Megabyte = 1000 kilobytes."},{"id":"cs-119","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Binary arithmetic and shifts","q":"What is 0101 + 0011 in binary?","a":"1000","w":["0110","0111","1010"],"why":"5 + 3 = 8."},{"id":"cs-120","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Binary arithmetic and shifts","q":"What does a left binary shift by 1 do to a number?","a":"Multiplies it by 2","w":["Divides it by 2","Adds 1","Doubles the number of bits"],"why":"A right shift divides by 2."},{"id":"cs-121","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Binary arithmetic and shifts","q":"When does overflow occur?","a":"When a result is too large for the available bits","w":["When a number is negative","When a file is too big","When a program crashes"],"why":"The extra bit is lost."},{"id":"cs-122","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Character encoding","q":"Why was Unicode developed?","a":"To represent characters from many more languages and symbols than ASCII","w":["To use fewer bits","To encrypt text","To speed up printing"],"why":"ASCII only covers 128 or 256 characters."},{"id":"cs-123","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Character encoding","q":"What is a character set?","a":"A defined list of characters a computer can recognise, each with a binary code","w":["A group of fonts","A type of keyboard","A list of passwords"],"why":"ASCII and Unicode are examples."},{"id":"cs-124","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Representing images","q":"What is a pixel?","a":"The smallest element of a digital image","w":["A type of file","A unit of screen size","A colour code"],"why":"Images are made up of a grid of pixels."},{"id":"cs-125","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Representing images","q":"What is colour depth?","a":"The number of bits used to represent the colour of each pixel","w":["The number of pixels in an image","The brightness of the screen","The size of the file in bytes"],"why":"More bits give more possible colours."},{"id":"cs-126","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Representing images","q":"If you increase the resolution of an image, the file size...","a":"Increases","w":["Decreases","Stays the same","Halves"],"why":"There are more pixels to store."},{"id":"cs-127","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Representing sound","q":"What is sample rate?","a":"The number of samples taken per second","w":["The volume of the sound","The length of the recording","The number of speakers"],"why":"It is measured in hertz."},{"id":"cs-128","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Representing sound","q":"Increasing the sample rate will...","a":"Improve the quality and increase the file size","w":["Reduce the quality","Reduce the file size","Have no effect"],"why":"Bit depth also affects the quality and file size."},{"id":"cs-129","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Data compression","q":"What is lossless compression?","a":"Compression where no data is lost, so the original can be restored exactly","w":["Compression that permanently removes some data","Compression only for images","Compression that encrypts data"],"why":"Lossy compression removes some data permanently."},{"id":"cs-130","subject":"Computer Science","unit":"3.3 Fundamentals of data representation","topic":"Data compression","q":"Run length encoding (RLE) stores data as...","a":"A value and a count of how many times it repeats","w":["A list of unique values","A binary tree","A checksum"],"why":"It works best on data with lots of repeats."},{"id":"cs-131","subject":"Computer Science","unit":"3.4 Computer systems","topic":"Hardware and software","q":"Which of these is software?","a":"An operating system","w":["A hard drive","A keyboard","A motherboard"],"why":"Hardware is the physical components."},{"id":"cs-132","subject":"Computer Science","unit":"3.4 Computer systems","topic":"Hardware and software","q":"What is hardware?","a":"The physical components of a computer system","w":["The programs on a computer","The instructions to the CPU","The data stored in memory"],"why":"Software is the programs."},{"id":"cs-133","subject":"Computer Science","unit":"3.4 Computer systems","topic":"Boolean logic","q":"What is the output of a NOT gate when the input is 1?","a":"0","w":["1","Both","No output"],"why":"NOT inverts the input."},{"id":"cs-134","subject":"Computer Science","unit":"3.4 Computer systems","topic":"Boolean logic","q":"An AND gate outputs 1 only when...","a":"Both inputs are 1","w":["Either input is 1","Both inputs are 0","The first input is 1"],"why":"An OR gate outputs 1 when at least one input is 1."},{"id":"cs-135","subject":"Computer Science","unit":"3.4 Computer systems","topic":"Boolean logic","q":"What is the output of an OR gate when the inputs are 0 and 1?","a":"1","w":["0","01","Undefined"],"why":"OR outputs 1 if at least one input is 1."},{"id":"cs-136","subject":"Computer Science","unit":"3.4 Computer systems","topic":"Systems software","q":"What does an operating system do?","a":"Manages the hardware, memory, files and applications","w":["Only edits documents","Only browses the internet","Only connects to networks"],"why":"It also provides the user interface."},{"id":"cs-137","subject":"Computer Science","unit":"3.4 Computer systems","topic":"Systems software","q":"Which of these is a utility program?","a":"Anti-virus software","w":["A word processor","A web browser","A spreadsheet"],"why":"Utility programs help maintain and protect the computer."},{"id":"cs-138","subject":"Computer Science","unit":"3.5 Systems architecture","topic":"Von Neumann architecture","q":"What is the stored program concept?","a":"Instructions and data are stored together in main memory","w":["Programs are stored only on the hard drive","Instructions are stored in the CPU only","Data is stored separately from instructions"],"why":"The CPU fetches instructions from memory."},{"id":"cs-139","subject":"Computer Science","unit":"3.5 Systems architecture","topic":"Von Neumann architecture","q":"Which register holds the address of the next instruction to be fetched?","a":"Program counter (PC)","w":["Memory data register (MDR)","Accumulator (ACC)","Current instruction register (CIR)"],"why":"The MAR holds the address currently being accessed."},{"id":"cs-140","subject":"Computer Science","unit":"3.5 Systems architecture","topic":"Von Neumann architecture","q":"What does the Memory Address Register (MAR) hold?","a":"The address of the memory location being read or written","w":["The data being transferred","The result of a calculation","The next instruction"],"why":"The MDR holds the data."},{"id":"cs-141","subject":"Computer Science","unit":"3.5 Systems architecture","topic":"The fetch-decode-execute cycle","q":"What is the correct order of the CPU cycle?","a":"Fetch, decode, execute","w":["Decode, fetch, execute","Execute, fetch, decode","Fetch, execute, decode"],"why":"It repeats for every instruction."},{"id":"cs-142","subject":"Computer Science","unit":"3.5 Systems architecture","topic":"The fetch-decode-execute cycle","q":"In the fetch stage, an instruction is copied from...","a":"Main memory to the CPU","w":["The CPU to main memory","The hard drive to the monitor","The ALU to the registers"],"why":"The instruction is then decoded by the control unit."},{"id":"cs-143","subject":"Computer Science","unit":"3.5 Systems architecture","topic":"CPU performance","q":"Which of these would improve CPU performance?","a":"Having more cores","w":["Smaller cache","Lower clock speed","Less RAM"],"why":"A higher clock speed and larger cache also help."},{"id":"cs-144","subject":"Computer Science","unit":"3.5 Systems architecture","topic":"CPU performance","q":"What is clock speed measured in?","a":"Hertz (GHz)","w":["Bytes","Watts","Pixels"],"why":"It is the number of cycles per second."},{"id":"cs-145","subject":"Computer Science","unit":"3.5 Systems architecture","topic":"Memory and storage","q":"RAM is...","a":"Volatile: it loses its contents when the power is off","w":["Non-volatile","Read-only","Slower than a hard drive"],"why":"ROM holds boot instructions and is non-volatile."},{"id":"cs-146","subject":"Computer Science","unit":"3.5 Systems architecture","topic":"Memory and storage","q":"What is the purpose of cache memory?","a":"To store frequently used data close to the CPU for fast access","w":["To permanently store files","To replace RAM","To power the CPU"],"why":"It is faster than RAM."},{"id":"cs-147","subject":"Computer Science","unit":"3.5 Systems architecture","topic":"Memory and storage","q":"What is virtual memory?","a":"Part of secondary storage used as RAM when RAM is full","w":["Extra cache inside the CPU","Memory that is not real","A type of ROM"],"why":"It is much slower than RAM."},{"id":"cs-148","subject":"Computer Science","unit":"3.5 Systems architecture","topic":"Memory and storage","q":"Which type of storage has no moving parts?","a":"Solid state drive","w":["Hard disk drive","Optical disc","Floppy disk"],"why":"SSDs use flash memory."},{"id":"cs-149","subject":"Computer Science","unit":"3.5 Systems architecture","topic":"Embedded systems","q":"What is an embedded system?","a":"A computer built into a larger device to do a specific job","w":["A general-purpose computer","A server","A large network"],"why":"Examples are washing machines and car engine controllers."},{"id":"cs-150","subject":"Computer Science","unit":"3.5 Systems architecture","topic":"Embedded systems","q":"Which of these is an example of an embedded system?","a":"The controller in a washing machine","w":["A desktop PC","A laptop","A web server"],"why":"Embedded systems are usually dedicated to one task."},{"id":"cs-151","subject":"Computer Science","unit":"3.9 Ethical, legal and environmental impacts","topic":"Ethical and cultural issues","q":"What is the digital divide?","a":"The gap between those who have access to technology and those who do not","w":["The gap between two computers","A break in an internet connection","The difference between hardware and software"],"why":"It can be caused by cost, location or age."},{"id":"cs-152","subject":"Computer Science","unit":"3.9 Ethical, legal and environmental impacts","topic":"Ethical and cultural issues","q":"Which of these is an ethical concern about digital technology?","a":"Privacy of personal data","w":["Faster processors","Larger screens","Cheaper storage"],"why":"Other concerns include surveillance and bias in algorithms."},{"id":"cs-153","subject":"Computer Science","unit":"3.9 Ethical, legal and environmental impacts","topic":"Legislation","q":"Which Act makes hacking illegal in the UK?","a":"Computer Misuse Act 1990","w":["Data Protection Act 2018","Copyright, Designs and Patents Act 1988","Freedom of Information Act"],"why":"It covers unauthorised access and modification of computer material."},{"id":"cs-154","subject":"Computer Science","unit":"3.9 Ethical, legal and environmental impacts","topic":"Legislation","q":"What does the Data Protection Act 2018 cover?","a":"How personal data is collected, stored and used","w":["Illegal copying of software","Hacking into computers","Use of open-source software"],"why":"It protects individuals' rights over their data."},{"id":"cs-155","subject":"Computer Science","unit":"3.9 Ethical, legal and environmental impacts","topic":"Legislation","q":"Which Act covers illegal copying of software and media?","a":"Copyright, Designs and Patents Act 1988","w":["Computer Misuse Act 1990","Data Protection Act 2018","Health and Safety Act"],"why":"Software licences set out how software may be used."},{"id":"cs-156","subject":"Computer Science","unit":"3.9 Ethical, legal and environmental impacts","topic":"Environmental issues","q":"Which is an environmental problem caused by digital technology?","a":"Electronic waste containing toxic materials","w":["Faster internet speeds","More storage space","Better screens"],"why":"Devices should be recycled properly."},{"id":"cs-157","subject":"Computer Science","unit":"3.9 Ethical, legal and environmental impacts","topic":"Environmental issues","q":"Why do data centres have a large environmental impact?","a":"They use large amounts of energy for power and cooling","w":["They use no electricity","They are very small","They produce no heat"],"why":"Many are now powered by renewable energy."},{"id":"lit-001","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Plot and structure","q":"How many staves (chapters) are there in A Christmas Carol?","a":"Five","w":["Three","Four","Seven"],"why":"A \"stave\" is a musical term, linking the book to a carol."},{"id":"lit-002","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Plot and structure","q":"What is the title of Stave One?","a":"Marley's Ghost","w":["The First of the Three Spirits","The End of It","The Last of the Spirits"],"why":"Marley warns Scrooge that three spirits will visit him."},{"id":"lit-003","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Plot and structure","q":"What is the title of Stave Two?","a":"The First of the Three Spirits","w":["Marley's Ghost","The Second of the Three Spirits","The End of It"],"why":"The Ghost of Christmas Past shows Scrooge scenes from his earlier life."},{"id":"lit-004","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Plot and structure","q":"What is the title of Stave Three?","a":"The Second of the Three Spirits","w":["The First of the Three Spirits","The Last of the Spirits","Marley's Ghost"],"why":"The Ghost of Christmas Present takes Scrooge to the Cratchits and to Fred's party."},{"id":"lit-005","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Plot and structure","q":"What is the title of Stave Four?","a":"The Last of the Spirits","w":["The Second of the Three Spirits","The End of It","Marley's Ghost"],"why":"The Ghost of Christmas Yet to Come shows Scrooge's own death."},{"id":"lit-006","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Plot and structure","q":"What is the title of Stave Five?","a":"The End of It","w":["The Last of the Spirits","Marley's Ghost","A Merry Christmas"],"why":"Scrooge wakes up changed and makes amends."},{"id":"lit-007","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Plot and structure","q":"Who visits Scrooge first on Christmas Eve?","a":"The ghost of Jacob Marley","w":["The Ghost of Christmas Past","The Ghost of Christmas Present","Fred"],"why":"Marley appears in his door knocker and then in his room."},{"id":"lit-008","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Plot and structure","q":"How many spirits does Marley say will visit Scrooge?","a":"Three","w":["Two","Four","One"],"why":"They will come on three successive nights."},{"id":"lit-009","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Plot and structure","q":"Which of these does the Ghost of Christmas Past show Scrooge?","a":"His lonely schooldays and Fezziwig's Christmas party","w":["The Cratchits' Christmas dinner","His own grave","Ignorance and Want"],"why":"It also shows his broken engagement to Belle."},{"id":"lit-010","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Plot and structure","q":"Why does Belle end her engagement to Scrooge?","a":"He has come to love money more than her","w":["She falls in love with Fred","Her family disapproves of him","Scrooge goes abroad"],"why":"She says another idol, gain, has replaced her."},{"id":"lit-011","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Plot and structure","q":"Which character shows Scrooge a happy, generous employer in his youth?","a":"Mr Fezziwig","w":["Mr Cratchit","Mr Marley","Old Joe"],"why":"Fezziwig throws a Christmas Eve ball for his workers."},{"id":"lit-012","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Plot and structure","q":"What does the Ghost of Christmas Present show Scrooge?","a":"The Cratchits' Christmas, Fred's party and Ignorance and Want","w":["Scrooge's boyhood and schooldays","Scrooge's death and grave","Marley in chains"],"why":"It shows how happiness is possible even in poverty."},{"id":"lit-013","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Plot and structure","q":"What are the two children hidden under the Ghost of Christmas Present's robe?","a":"Ignorance and Want","w":["Hope and Charity","Poverty and Death","Peter and Belinda"],"why":"The ghost warns Scrooge to beware them, especially Ignorance."},{"id":"lit-014","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Plot and structure","q":"Which of the three spirits does not speak?","a":"The Ghost of Christmas Yet to Come","w":["The Ghost of Christmas Past","The Ghost of Christmas Present","Marley's ghost"],"why":"It points silently and wears a black hooded robe."},{"id":"lit-015","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Plot and structure","q":"What does the Ghost of Christmas Yet to Come show Scrooge?","a":"People stealing from a dead man, and his own neglected grave","w":["A joyful Christmas dinner","The streets of old London","Fezziwig's party"],"why":"Scrooge realises the dead man is himself."},{"id":"lit-016","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Plot and structure","q":"What does Scrooge do on Christmas morning after waking up?","a":"Sends a prize turkey to the Cratchits and gives to charity","w":["Goes back to work","Leaves London","Sells his business"],"why":"He also visits Fred's dinner and raises Bob's salary."},{"id":"lit-017","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Plot and structure","q":"What happens to Tiny Tim at the end of the story?","a":"He does not die; Scrooge becomes like a second father to him","w":["He dies of illness","He moves to Fred's house","He is sent to the workhouse"],"why":"The Ghost of Christmas Yet to Come showed a possible future in which Tim dies."},{"id":"lit-018","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"How is Scrooge described in Stave One?","a":"Tight-fisted, cold and solitary","w":["Warm and friendly","Cheerful and generous","Shy and nervous"],"why":"He is a \"covetous old sinner\" who keeps Christmas out of his life."},{"id":"lit-019","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"Who is Scrooge's nephew?","a":"Fred","w":["Bob","Peter","Jacob"],"why":"Fred repeatedly invites Scrooge to Christmas dinner."},{"id":"lit-020","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"Who is Scrooge's clerk?","a":"Bob Cratchit","w":["Fred Fezziwig","Jacob Marley","Old Joe"],"why":"He earns fifteen shillings a week and has a large family."},{"id":"lit-021","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"What is Tiny Tim's role in the story?","a":"He represents the vulnerable poor and the hope of change","w":["He is Scrooge's rival","He is Marley's son","He works for Fezziwig"],"why":"His illness makes Scrooge understand the cost of his selfishness."},{"id":"lit-022","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"What does Jacob Marley represent?","a":"The consequences of greed and a warning to Scrooge","w":["The poor of London","The joy of Christmas","Scrooge's good conscience"],"why":"He is condemned to wander in chains he \"forged in life\"."},{"id":"lit-023","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"What is Fred's attitude to Christmas?","a":"He loves it as a kind, forgiving, charitable time","w":["He thinks it is a waste of money","He ignores it completely","He thinks it is only for the rich"],"why":"Fred contrasts with Scrooge, who says \"Bah! Humbug!\"."},{"id":"lit-024","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"Why is Belle important in the story?","a":"She shows what Scrooge lost by choosing money over love","w":["She is Fred's wife","She is Marley's sister","She runs the workhouse"],"why":"The Ghost of Christmas Past shows her ending their engagement."},{"id":"lit-025","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"Who is Fan?","a":"Scrooge's kind younger sister","w":["Bob Cratchit's wife","Fezziwig's daughter","Belle's friend"],"why":"She comes to take him home from school; she is Fred's mother."},{"id":"lit-026","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"Which character is shown as proud to be poor but happy?","a":"Bob Cratchit","w":["Old Joe","Mr Fezziwig","Jacob Marley"],"why":"The Cratchits celebrate Christmas despite their poverty."},{"id":"lit-027","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"What do the charity collectors ask Scrooge for in Stave One?","a":"Money to help the poor at Christmas","w":["A job for the Cratchits","A room in his house","Candles for the church"],"why":"Scrooge asks if the prisons and workhouses are still open."},{"id":"lit-028","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"What does Scrooge feel when he sees his own grave?","a":"Terror and a desire to change","w":["Amusement","Anger at the spirit","Relief"],"why":"He begs to be allowed to change his future."},{"id":"lit-029","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"How does Scrooge's character change by the end?","a":"He becomes generous, warm and joyful","w":["He becomes more bitter","He becomes more religious but still mean","He gives up his business and leaves"],"why":"He says he will honour Christmas all year."},{"id":"lit-030","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"Which character is shown as a harsh, self-satisfied businessman who is later punished after death?","a":"Jacob Marley","w":["Fezziwig","Fred","Bob Cratchit"],"why":"Marley's fate warns Scrooge what will happen to him."},{"id":"lit-031","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"What does Mrs Cratchit say when Bob toasts \"the Founder of the Feast\"?","a":"She will not drink to Scrooge, who she calls an \"odious, stingy, hard, unfeeling man\"","w":["She happily toasts him","She asks Bob to quit his job","She says nothing"],"why":"Bob persuades her for the sake of Christmas Day."},{"id":"lit-032","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Plot and structure","q":"Complete the quote (opening line): \"Marley was ___: to begin with.\"","a":"dead","w":["dying","gone","rich"],"why":"Dickens begins with a plain fact so that the ghost story seems believable."},{"id":"lit-033","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"Complete the quote (Scrooge): \"Bah! ___!\"","a":"Humbug","w":["Nonsense","Christmas","Charity"],"why":"He dismisses Christmas as a fraud."},{"id":"lit-034","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"Complete the quote: \"Hard and sharp as ___, from which no steel had ever struck out generous fire.\"","a":"flint","w":["iron","stone","ice"],"why":"Flint is hard and cold; no kindness could be sparked from him."},{"id":"lit-035","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"Complete the quote: \"...secret, and self-contained, and solitary as an ___.\"","a":"oyster","w":["island","owl","orphan"],"why":"The simile shows how closed off he is."},{"id":"lit-036","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"Complete the quote: \"a squeezing, wrenching, grasping, scraping, clutching, covetous, old ___!\"","a":"sinner","w":["miser","fool","man"],"why":"The list of verbs builds up the image of Scrooge's greed."},{"id":"lit-037","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Themes","q":"Complete the quote (Scrooge): \"Are there no ___? ... And the Union workhouses?\"","a":"prisons","w":["schools","churches","hospitals"],"why":"He refers to the harsh institutions for the poor."},{"id":"lit-038","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Themes","q":"Complete the quote (Scrooge): \"If they would rather die, they had better do it, and decrease the surplus ___.\"","a":"population","w":["workforce","poverty","crowd"],"why":"The Spirit later throws these words back at him."},{"id":"lit-039","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"Complete the quote (Marley): \"I wear the ___ I forged in life.\"","a":"chain","w":["shame","burden","crown"],"why":"The chain symbolises the guilt created by his own greed."},{"id":"lit-040","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Themes","q":"Complete the quote (Marley): \"Mankind was my ___.\"","a":"business","w":["burden","concern","family"],"why":"He realises too late that he should have cared for others."},{"id":"lit-041","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Themes","q":"Complete the quote (the Ghost of Christmas Present): \"This boy is Ignorance. This girl is ___.\"","a":"Want","w":["Poverty","Hunger","Doom"],"why":"They represent the social problems that Dickens wanted readers to address."},{"id":"lit-042","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Themes","q":"Complete the quote (the Ghost of Christmas Present): \"...for on his brow I see that written which is ___.\"","a":"Doom","w":["Death","Shame","Fear"],"why":"The ghost warns that ignorance, above all, will destroy society."},{"id":"lit-043","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"Complete the quote (Tiny Tim): \"God bless us, every ___!\"","a":"one","w":["day","man","child"],"why":"Tim's blessing sums up the Christmas spirit of kindness."},{"id":"lit-044","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Themes","q":"Complete the quote (Fred): \"...a kind, forgiving, charitable, ___ time.\"","a":"pleasant","w":["quiet","happy","special"],"why":"Fred sees Christmas as a time for open hearts."},{"id":"lit-045","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"Complete the quote (Scrooge at the end): \"I will honour Christmas in my ___, and try to keep it all the year.\"","a":"heart","w":["home","life","church"],"why":"He promises to change for good."},{"id":"lit-046","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"Complete the quote (Scrooge at the end): \"I am as light as a ___, I am as happy as an angel.\"","a":"feather","w":["bird","cloud","child"],"why":"The similes show his joy and relief."},{"id":"lit-047","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"Complete the quote (about Scrooge at the end): \"...as good a friend, as good a master, and as good a ___, as the good old city knew.\"","a":"man","w":["neighbour","king","father"],"why":"The triple structure shows his full transformation."},{"id":"lit-048","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Characters","q":"Complete the quote: \"It was always said of him, that he knew how to keep ___ well, if any man alive possessed the knowledge.\"","a":"Christmas","w":["money","peace","house"],"why":"The final lines praise Scrooge's changed character."},{"id":"lit-049","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Themes","q":"Complete the quote (Fezziwig): \"The happiness he gives, is quite as great as if it cost a ___.\"","a":"fortune","w":["kiss","penny","lifetime"],"why":"A good employer can make others happy without spending much."},{"id":"lit-050","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Themes","q":"What is the main message of A Christmas Carol?","a":"People should care for others, and it is never too late to change","w":["Wealth always brings happiness","The poor are to blame for their poverty","Ghosts are real"],"why":"Dickens wanted to encourage generosity and social responsibility."},{"id":"lit-051","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Themes","q":"What does the story suggest about money and happiness?","a":"Money without kindness leaves a person lonely","w":["Money guarantees happiness","Poor people can never be happy","Happiness comes from fame"],"why":"The Cratchits are poor but happy; Scrooge is rich but miserable."},{"id":"lit-052","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Themes","q":"What do Ignorance and Want represent?","a":"The social problems caused by poverty and lack of education","w":["Scrooge's guilty thoughts","Marley's children","The two ghosts' servants"],"why":"Dickens uses them to challenge his readers."},{"id":"lit-053","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Themes","q":"Which theme is shown by the Cratchits' Christmas dinner?","a":"Family and happiness despite poverty","w":["Greed and selfishness","Religion and punishment","Social class conflict only"],"why":"Their small goose and pudding are treated as a feast."},{"id":"lit-054","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Themes","q":"Which theme is shown by Scrooge's transformation?","a":"Redemption","w":["Revenge","Isolation","Ambition"],"why":"He is given the chance to change before it is too late."},{"id":"lit-055","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Themes","q":"How does Dickens present the theme of time in the story?","a":"Through the three spirits of past, present and future","w":["Through one long flashback","Through a diary","Through a countdown clock"],"why":"Seeing all three helps Scrooge understand the consequences of his actions."},{"id":"lit-056","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Themes","q":"How does Fred contrast with Scrooge?","a":"Fred is warm, forgiving and generous; Scrooge is cold and selfish","w":["Fred is rich and Scrooge is poor","Fred is religious and Scrooge is not","They are identical"],"why":"Fred shows the Christmas spirit Scrooge lacks."},{"id":"lit-057","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Themes","q":"Which theme links Scrooge's treatment of Bob Cratchit to society?","a":"The unfair treatment of the poor by the rich","w":["The importance of education","The danger of the supernatural","The value of ambition"],"why":"Bob works long hours for low pay in a cold office."},{"id":"lit-058","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Themes","q":"What does the story suggest about people who ignore the suffering of others, like Marley?","a":"They will suffer for it after death","w":["They will be rewarded","They will become wealthy","Nothing will happen"],"why":"Marley is doomed to walk the earth in chains."},{"id":"lit-059","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Language, form and structure","q":"What type of narrator tells the story?","a":"A third-person narrator who sometimes speaks directly to the reader","w":["Scrooge in the first person","Bob Cratchit","Marley's ghost"],"why":"The narrator's friendly voice draws readers into the story."},{"id":"lit-060","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Language, form and structure","q":"Which technique is \"as solitary as an oyster\"?","a":"Simile","w":["Metaphor","Alliteration","Personification"],"why":"It compares Scrooge to a closed shell."},{"id":"lit-061","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Language, form and structure","q":"What does the list \"squeezing, wrenching, grasping, scraping, clutching\" show?","a":"Scrooge's relentless greed, built up through a list of verbs","w":["His love of money and charity","His ability to work hard","His joy at Christmas"],"why":"The sound of the verbs also feels harsh."},{"id":"lit-062","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Language, form and structure","q":"What does the weather (fog and frost) around Scrooge suggest?","a":"That his heart is cold and shuts people out","w":["That it is going to snow","That the spirits are near","That London is unhealthy"],"why":"It is an example of pathetic fallacy."},{"id":"lit-063","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Language, form and structure","q":"What do Marley's chains symbolise?","a":"The burden of guilt created by greed and selfishness","w":["Marley's imprisonment","The weight of Scrooge's money bags","The Victorian legal system"],"why":"Each link was made by his own actions: \"I made it link by link\"."},{"id":"lit-064","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Language, form and structure","q":"Why is A Christmas Carol described as a moral tale or allegory?","a":"It teaches a lesson about how people should behave","w":["It is based on true events","It has no characters","It is written as a poem"],"why":"Dickens wants readers to learn from Scrooge's mistakes."},{"id":"lit-065","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Language, form and structure","q":"Why does Dickens use a ghost story form?","a":"It was popular at Christmas and lets Scrooge see his life from outside","w":["He believed in ghosts","It was cheaper to print","It avoided censorship"],"why":"Ghost stories were a Victorian Christmas tradition."},{"id":"lit-066","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Language, form and structure","q":"What does light and dark imagery often represent in the novella?","a":"Light stands for warmth and goodness; dark stands for fear and misery","w":["Light stands for money","Dark stands for peace","Nothing"],"why":"The Ghost of Christmas Present carries a torch of light; Scrooge works in the dark."},{"id":"lit-067","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Language, form and structure","q":"Why does Dickens use repetition, such as \"Are there no prisons?\"","a":"To remind Scrooge of his own cruel words and increase their impact","w":["To pad out the story","To confuse readers","To show Scrooge is forgetful"],"why":"The Spirit throws his words back at him."},{"id":"lit-068","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Language, form and structure","q":"What effect does the structure of the five staves have on the story?","a":"It builds from Scrooge's hardness through the three visions to his change","w":["It shows time standing still","It repeats the same events","It starts at the end"],"why":"The pattern follows a journey of redemption."},{"id":"lit-069","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Context","q":"When was A Christmas Carol published?","a":"1843","w":["1813","1883","1901"],"why":"It came out on 19 December 1843."},{"id":"lit-070","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Context","q":"Why did Dickens write A Christmas Carol?","a":"To criticise the treatment of the poor and encourage charity","w":["To make Victorian ghost stories popular","To support the workhouse system","To celebrate the rich"],"why":"He had read reports on child poverty and wanted people to care."},{"id":"lit-071","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Context","q":"What was Dickens' own childhood experience of poverty?","a":"His father was imprisoned for debt and he worked in a factory as a boy","w":["He grew up rich and educated","He was a priest's son","He never went to school or work"],"why":"This inspired his concern for the poor."},{"id":"lit-072","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Context","q":"What was the Poor Law of 1834?","a":"A law that made workhouses harsh to discourage people from asking for help","w":["A law that abolished workhouses","A law that paid every poor person","A law that created the NHS"],"why":"Scrooge's \"Are there no workhouses?\" refers to this."},{"id":"lit-073","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Context","q":"What were workhouses?","a":"Places where poor people lived and worked in return for food and shelter","w":["Factories owned by the rich","Schools for rich children","Hospitals for soldiers"],"why":"They were deliberately unpleasant."},{"id":"lit-074","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Context","q":"Which economist's ideas about the \"surplus population\" does Scrooge echo?","a":"Thomas Malthus","w":["Karl Marx","Adam Smith","Charles Darwin"],"why":"Malthus argued that population growth would outstrip food supply."},{"id":"lit-075","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Context","q":"Which Victorian idea about the poor did Dickens challenge?","a":"That the poor were lazy and deserved their poverty","w":["That the poor should vote","That education was wasteful","That the rich were generous"],"why":"Dickens showed poverty as a social problem the rich were responsible for."},{"id":"lit-076","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Context","q":"Which Christmas traditions became popular in Victorian Britain?","a":"Christmas trees, cards and family gatherings","w":["Fireworks and bonfires","Easter eggs","Harvest festivals"],"why":"Prince Albert helped to popularise the Christmas tree."},{"id":"lit-077","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Context","q":"What religious idea is important in A Christmas Carol?","a":"Redemption and the Christian duty of charity","w":["Atheism and science","The importance of wealth","Fear of other faiths"],"why":"Scrooge is given a chance to repent and save his soul."},{"id":"lit-078","subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol","topic":"Context","q":"Which social change in the 1840s made inequality more obvious in cities like London?","a":"The Industrial Revolution","w":["The Great Fire","The Napoleonic Wars","The Reformation"],"why":"Factories brought wealth for some and crowded slums for many."},{"id":"lit-079","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Characters","q":"What is Arthur Birling's job?","a":"A wealthy factory owner","w":["A police officer","A bank manager","A magistrate only"],"why":"He is hoping for a knighthood."},{"id":"lit-080","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Characters","q":"How does Mrs Birling treat Eva Smith when she asks her charity for help?","a":"She refuses help and blames the girl and the father of the child","w":["She gives her money","She employs her","She is not told about her"],"why":"Mrs Birling is chair of the Brumley Women's Charity Organisation."},{"id":"lit-081","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Characters","q":"Which character is engaged to Sheila at the start of the play?","a":"Gerald Croft","w":["Eric Birling","Arthur Birling","Inspector Goole"],"why":"Their engagement is celebrated at the dinner party."},{"id":"lit-082","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Characters","q":"What had Eric done to Eva Smith?","a":"Got her pregnant and stole money from his father's office to support her","w":["Sacked her from the factory","Complained about her at a shop","Refused her help at a charity"],"why":"He was drunk when he first met her."},{"id":"lit-083","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Characters","q":"How does Sheila feel about her part in Eva's death?","a":"Deeply guilty and ashamed","w":["Proud of herself","Indifferent","Angry at Eva"],"why":"She accepts responsibility and wants to change."},{"id":"lit-084","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Characters","q":"How is Sheila presented at the start of the play?","a":"As a pretty, excited, rather spoilt young woman","w":["As a serious, political thinker","As a worried and bitter woman","As an angry rebel"],"why":"By the end she has learned a hard lesson."},{"id":"lit-085","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Characters","q":"How does Gerald Croft react when the Inspector's identity is questioned?","a":"He wants to believe it was a hoax and everything can go back to normal","w":["He confesses everything","He leaves the family","He calls the police"],"why":"He is quick to say there is no proof a girl has died."},{"id":"lit-086","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Characters","q":"Why does the Inspector's name, Goole, matter?","a":"It sounds like \"ghoul\", hinting that he may be a supernatural figure","w":["It is a common name in Brumley","It was Priestley's own name","It means \"police\""],"why":"Some read him as Priestley's moral voice."},{"id":"lit-087","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Characters","q":"How do Mr and Mrs Birling react at the end of the play, when they learn the Inspector was not a real police officer?","a":"They feel relieved and think they can ignore the lesson","w":["They apologise to Eva's family","They arrest Eric","They call the Inspector back"],"why":"Sheila and Eric still feel responsible."},{"id":"lit-088","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Characters","q":"What does Eric reveal about his relationship with his father?","a":"He feels he cannot go to him when he is in trouble","w":["He is proud of him","He hopes to take over the factory","He fears him because of the police"],"why":"\"You're not the kind of father a chap could go to when he's in trouble\"."},{"id":"lit-089","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Themes","q":"What does the play suggest about responsibility?","a":"Everyone is responsible for how their actions affect others","w":["Only the rich are responsible","Responsibility ends at home","People are not responsible for strangers"],"why":"The Inspector says \"We are members of one body\"."},{"id":"lit-090","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Themes","q":"What does the play say about class?","a":"That the upper classes often use their power to treat the working class unfairly","w":["That class is unimportant","That the working class has all the power","That money guarantees happiness"],"why":"Eva Smith is exploited by every member of the Birling circle."},{"id":"lit-091","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Themes","q":"How does Priestley show the generation gap?","a":"The younger characters are more willing to change than their parents","w":["All the family agrees on everything","The parents learn faster than the children","The parents are the most caring"],"why":"Sheila and Eric accept responsibility; Arthur and Sybil do not."},{"id":"lit-092","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Themes","q":"What does the play suggest about gender in 1912?","a":"Women, especially working-class women, had little power and were treated unfairly","w":["Men and women were equal","Only the Inspector respected women","Women ran the factories"],"why":"Eva is exploited by men and also dismissed by Mrs Birling."},{"id":"lit-093","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Themes","q":"Which theme is shown by Birling's speech about \"mind[ing] your own business\"?","a":"Capitalism and individualism","w":["Socialism and community","Friendship","Education"],"why":"The Inspector's reply argues the opposite."},{"id":"lit-094","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Themes","q":"Complete Birling's quote: \"If we were all responsible for everything that happened to everybody we'd had anything to do with, it would be very ___, wouldn't it?\"","a":"awkward","w":["difficult","terrible","simple"],"why":"He dismisses social responsibility."},{"id":"lit-095","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Themes","q":"Complete the Inspector's final speech: \"...with their lives, their hopes and fears, their ___ and chance of happiness...\"","a":"suffering","w":["work","anger","youth"],"why":"The speech tells the audience that Eva Smith represents many real people."},{"id":"lit-096","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Themes","q":"Complete the Inspector's quote: \"We don't live alone. We are members of one body. We are responsible for each ___.\"","a":"other","w":["family","person","day"],"why":"The message of collective responsibility."},{"id":"lit-097","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Themes","q":"Complete Mrs Birling's quote about Eva Smith: \"Girls of that ___\"","a":"class","w":["age","kind","type"],"why":"She looks down on working-class women."},{"id":"lit-098","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Language, form and structure","q":"What does Birling's confident speech about war and the Titanic achieve?","a":"It shows he is wrong and makes the audience distrust his views","w":["It proves he is clever","It is a clue to the murder","It makes the audience trust the Inspector less"],"why":"The audience in 1945 knows war came in 1914 and that the Titanic sank."},{"id":"lit-099","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Language, form and structure","q":"Why is the play set in one room, with the action in real time?","a":"It builds tension and keeps the audience focused on the family","w":["It was cheaper to stage","It lets the play move through several years","It stops characters from leaving"],"why":"This follows the unities of time, place and action."},{"id":"lit-100","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Language, form and structure","q":"What dramatic technique ends An Inspector Calls?","a":"A final twist: the phone call announcing a real police inspector is on his way","w":["A funeral","A wedding","A speech by Eric"],"why":"It leaves the audience thinking about whether the family has learned."},{"id":"lit-101","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Language, form and structure","q":"What does the stage direction describing the Inspector as creating \"an impression of massiveness, solidity and purposefulness\" suggest?","a":"He has authority and a strong presence","w":["He is nervous","He is secretly the murderer","He is a servant"],"why":"He dominates the room."},{"id":"lit-102","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Language, form and structure","q":"Why does Priestley have the Inspector question each character one at a time?","a":"To reveal how each person played a part and to build tension","w":["To make the play shorter","To hide the identity of the killer","To let the family relax"],"why":"Each confession links to the next."},{"id":"lit-103","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Language, form and structure","q":"What is the effect of cliffhangers at the end of each act?","a":"They keep the audience wanting to know what happens next","w":["They slow the play down","They stop the action","They repeat earlier events"],"why":"Priestley builds suspense through short, sharp endings."},{"id":"lit-104","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Context","q":"Where was An Inspector Calls first performed?","a":"In the Soviet Union (Moscow) in 1945","w":["In London in 1912","In New York in 1945","In Brumley in 1946"],"why":"It reached London in 1946."},{"id":"lit-105","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Context","q":"Which event during the war shaped the ideas in An Inspector Calls?","a":"The sense that society must be more fair after the Second World War","w":["The sinking of the Titanic","The General Strike of 1926","The Great Fire"],"why":"People wanted a fairer society, leading to the welfare state."},{"id":"lit-106","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Context","q":"In which year did the Titanic sink?","a":"1912","w":["1900","1918","1945"],"why":"The play is set in the same year."},{"id":"lit-107","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Context","q":"Which political group helped to shape Priestley's views?","a":"Socialists","w":["Conservatives","Fascists","Monarchists"],"why":"He helped found the Common Wealth Party in 1942."},{"id":"lit-108","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Context","q":"What movement for women's rights was active in 1912?","a":"The suffragettes","w":["The Chartists","The Luddites","The Levellers"],"why":"Sheila represents changing views of women."},{"id":"lit-109","subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls","topic":"Context","q":"Why is Birling's confidence about the future ironic in a 1945 audience?","a":"The audience knows about the world wars, the Titanic and the General Strike","w":["The audience has never heard of the Titanic","The audience was too young to remember","Birling was right about everything"],"why":"This is dramatic irony."},{"id":"lit-110","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Analysing an unseen poem","q":"What should you do first when you get an unseen poem?","a":"Read it carefully, and consider the title and who is speaking","w":["Start writing a conclusion","Count the syllables only","Ignore the title"],"why":"Plan your response after you understand the overall meaning."},{"id":"lit-111","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Analysing an unseen poem","q":"What is a simile?","a":"A comparison using \"like\" or \"as\"","w":["A comparison saying one thing is another","Giving human qualities to objects","Repeating the same sound at the start of words"],"why":"Example: as cold as ice."},{"id":"lit-112","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Analysing an unseen poem","q":"What is a metaphor?","a":"A comparison saying one thing is another","w":["A comparison using \"like\" or \"as\"","A sound word","A word with two meanings"],"why":"Example: the classroom was a zoo."},{"id":"lit-113","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Analysing an unseen poem","q":"What is personification?","a":"Giving human qualities to something that is not human","w":["Comparing two things with \"like\"","Repeating a consonant sound","Exaggeration"],"why":"Example: the wind whispered."},{"id":"lit-114","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Analysing an unseen poem","q":"What is alliteration?","a":"Repetition of the same sound at the start of nearby words","w":["Words that sound like what they describe","Repeating a vowel sound inside words","Lines that rhyme"],"why":"Example: wild and wandering waves."},{"id":"lit-115","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Analysing an unseen poem","q":"What is assonance?","a":"Repetition of the same vowel sound in nearby words","w":["Repetition of consonant sounds at the start of words","Rhyme at the end of lines","A word that sounds like its meaning"],"why":"Example: the rain in the plain."},{"id":"lit-116","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Analysing an unseen poem","q":"What is onomatopoeia?","a":"A word that sounds like the noise it describes","w":["A word with several meanings","A line without punctuation","A comparison"],"why":"Examples: hiss, crash, buzz."},{"id":"lit-117","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Analysing an unseen poem","q":"What is enjambment?","a":"A sentence or phrase running on from one line to the next without punctuation","w":["A line that ends with a full stop","A sudden change of subject","A short, repeated line"],"why":"It can create flow, speed or a sense of unease."},{"id":"lit-118","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Analysing an unseen poem","q":"What is a caesura?","a":"A pause in the middle of a line, often created by punctuation","w":["A rhyme in the middle of a line","A line without a verb","A repeated first word"],"why":"It slows down the rhythm."},{"id":"lit-119","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Analysing an unseen poem","q":"What is a volta?","a":"A turning point or shift in a poem's argument or mood","w":["The last line of a poem","A type of rhyme","A comparison between two poems"],"why":"It is common in sonnets."},{"id":"lit-120","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Analysing an unseen poem","q":"What is a stanza?","a":"A group of lines in a poem","w":["A single line","A type of rhyme","The poem's title"],"why":"A four-line stanza is called a quatrain."},{"id":"lit-121","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Analysing an unseen poem","q":"What is free verse?","a":"Poetry with no regular rhyme scheme or rhythm","w":["Poetry that rhymes every line","Poetry written in 14 lines","Poetry about nature only"],"why":"It can sound more like natural speech."},{"id":"lit-122","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Analysing an unseen poem","q":"What is a sonnet?","a":"A 14-line poem","w":["A 4-line poem","A poem with no stanzas","A poem about the sea"],"why":"It often explores love or ideas with a volta."},{"id":"lit-123","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Analysing an unseen poem","q":"What does \"tone\" mean in poetry?","a":"The writer's or speaker's attitude, such as angry, tender or ironic","w":["The length of the poem","The number of stanzas","The rhyme scheme"],"why":"Look for word choices that reveal tone."},{"id":"lit-124","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Analysing an unseen poem","q":"What does \"imagery\" mean in a poem?","a":"Descriptive language that creates pictures or sensory impressions in the reader's mind","w":["The number of illustrations","The title","The rhythm"],"why":"It includes sight, sound, touch, taste and smell."},{"id":"lit-125","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Analysing an unseen poem","q":"What is an oxymoron?","a":"Two contradictory words placed together","w":["A word that sounds like its meaning","Repetition of the first word","An exaggeration"],"why":"Example: bittersweet, deafening silence."},{"id":"lit-126","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Analysing an unseen poem","q":"What is end-stopped punctuation?","a":"A line that finishes with punctuation at the end of the line","w":["A line that runs on","A line with no verb","A repeated word"],"why":"It is the opposite of enjambment."},{"id":"lit-127","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Analysing an unseen poem","q":"Why is it useful to comment on structure as well as language?","a":"Structure shows how meaning and mood develop through the poem","w":["It lets you avoid quotations","It is shorter to write about","Examiners prefer it"],"why":"Eduqas rewards comments on form and structure."},{"id":"lit-128","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Analysing an unseen poem","q":"Which phrase is a good way to start analysing a quotation?","a":"The poet uses the word \"...\" to suggest...","w":["I like this word because it is nice","The poem is about...","Obviously..."],"why":"Focus on a precise word and its effect."},{"id":"lit-129","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Comparing two unseen poems","q":"What does comparing two poems mean?","a":"Writing about similarities and differences in ideas, language and structure","w":["Writing about one poem and ignoring the other","Listing the poems' rhymes","Retelling both stories"],"why":"Use links between the poems throughout."},{"id":"lit-130","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Comparing two unseen poems","q":"Which word helps show a contrast between two poems?","a":"Whereas","w":["Similarly","Likewise","Also"],"why":"Others: however, in contrast, on the other hand."},{"id":"lit-131","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Comparing two unseen poems","q":"Which word helps show a similarity between two poems?","a":"Similarly","w":["However","Whereas","In contrast"],"why":"Others: likewise, both, also."},{"id":"lit-132","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Comparing two unseen poems","q":"Which is a good way to structure a comparison?","a":"Compare a point about both poems in each paragraph","w":["Write about Poem 1 only, then Poem 2 only with no links","Describe only the rhyme","Write one very long paragraph"],"why":"An integrated comparison scores better than two separate essays."},{"id":"lit-133","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Comparing two unseen poems","q":"What should you compare in two unseen poems?","a":"Themes, attitudes, methods and structure","w":["Only the poets' lives","Only the titles","Only the line counts"],"why":"Always link methods to meaning."},{"id":"lit-134","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Comparing two unseen poems","q":"Why is it good to comment on how both poems end?","a":"Endings often show how the writer wants the reader to feel","w":["Endings are always the same","Endings are never important","It saves time"],"why":"Compare the final images or tone."},{"id":"lit-135","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Comparing two unseen poems","q":"If both poems use nature imagery, how might they differ?","a":"One might show nature as peaceful and the other as threatening","w":["They cannot differ","Only the rhyme can differ","One must be about people only"],"why":"Comment on the poets' attitudes."},{"id":"lit-136","subject":"English Literature","unit":"Component 2C: Unseen poetry","topic":"Comparing two unseen poems","q":"Which is the best way to use a quotation in a comparison?","a":"Use short, precise quotations and explain their effect","w":["Copy whole stanzas","Avoid quotations","Use quotations without comment"],"why":"Embed key words in your sentences."},{"id":"lit-137","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"Fair is foul, and foul is ___.\"","a":"fair","w":["false","good","true"],"why":"The witches, Act 1 Scene 1. It sets up the theme of appearance and reality."},{"id":"lit-138","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"Is this a dagger which I see before me, the ___ toward my hand?\"","a":"handle","w":["blade","point","hilt"],"why":"Macbeth's dagger soliloquy, Act 2 Scene 1, shows his guilt and confusion."},{"id":"lit-139","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"Out, damned ___! Out, I say!\"","a":"spot","w":["blood","stain","mark"],"why":"Lady Macbeth sleepwalking, Act 5 Scene 1."},{"id":"lit-140","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"Life's but a walking ___, a poor player.\"","a":"shadow","w":["dream","ghost","story"],"why":"Macbeth reacts to news of his wife's death, Act 5 Scene 5."},{"id":"lit-141","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"Look like th' innocent flower, but be the ___ under't.\"","a":"serpent","w":["thorn","weed","wolf"],"why":"Lady Macbeth advises Macbeth to hide his intentions from Duncan."},{"id":"lit-142","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"I have no spur to prick the sides of my intent, but only vaulting ___.\"","a":"ambition","w":["courage","anger","pride"],"why":"Macbeth admits that only ambition drives him to kill Duncan."},{"id":"lit-143","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"All the perfumes of Arabia will not sweeten this little ___.\"","a":"hand","w":["heart","soul","spot"],"why":"Lady Macbeth cannot wash away her guilt."},{"id":"lit-144","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"Stars, hide your ___!\"","a":"fires","w":["lights","eyes","faces"],"why":"Macbeth asks the darkness to hide his desires, Act 1 Scene 4."},{"id":"lit-145","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"Unsex me here, and fill me from the crown to the toe top-full of direst ___.\"","a":"cruelty","w":["hatred","malice","evil"],"why":"Lady Macbeth rejects her femininity to gain the strength to kill."},{"id":"lit-146","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"But screw your courage to the ___-place, and we'll not fail.\"","a":"sticking","w":["breaking","fighting","starting"],"why":"Lady Macbeth persuades Macbeth to go through with the murder."},{"id":"lit-147","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"What's done cannot be ___.\"","a":"undone","w":["forgotten","forgiven","repeated"],"why":"Lady Macbeth sleepwalking, Act 5 Scene 1."},{"id":"lit-148","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"I am in blood stepped in so far that, should I wade no more, returning were as ___ as go o'er.\"","a":"tedious","w":["easy","hard","hasty"],"why":"Macbeth feels it is too late to turn back."},{"id":"lit-149","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"Tomorrow, and tomorrow, and ___ creeps in this petty pace.\"","a":"tomorrow","w":["yesterday","today","forever"],"why":"Macbeth's despair, Act 5 Scene 5."},{"id":"lit-150","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"O, full of scorpions is my ___, dear wife!\"","a":"mind","w":["heart","bed","soul"],"why":"Macbeth reveals his torment and paranoia, Act 3 Scene 2."},{"id":"lit-151","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"So foul and fair a ___ I have not seen.\"","a":"day","w":["night","storm","deed"],"why":"Macbeth's first words echo the witches' 'fair is foul'."},{"id":"lit-152","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"Double, double toil and ___.\"","a":"trouble","w":["turmoil","strife","torment"],"why":"The witches chant around the cauldron, Act 4 Scene 1."},{"id":"lit-153","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"By the pricking of my thumbs, something wicked this way ___.\"","a":"comes","w":["goes","walks","creeps"],"why":"The second witch senses Macbeth arriving."},{"id":"lit-154","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"Nought's had, all's spent, where our desire is got without ___.\"","a":"content","w":["regret","reason","delay"],"why":"Lady Macbeth notes that getting what you want does not bring happiness."},{"id":"lit-155","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"Come, thick night, and pall thee in the dunnest smoke of ___.\"","a":"hell","w":["night","fire","death"],"why":"Lady Macbeth calls on darkness to hide the murder."},{"id":"lit-156","subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth","topic":"Key quotations","q":"Complete the quote: \"Yet do I fear thy nature; it is too full o' the milk of human ___.\"","a":"kindness","w":["sorrow","warmth","blood"],"why":"Lady Macbeth worries that Macbeth is too gentle
