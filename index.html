<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4e79">
<title>Daily GCSE Quiz</title>
<style>
  :root {
    --bg: #f3f6fa; --card: #ffffff; --ink: #172230; --muted: #56677a; --line: #d9e1ea;
    --accent: #1f4e79; --accent-ink: #ffffff; --sel: #e6f0fb;
    --good: #16783a; --good-bg: #e4f4ea; --bad: #b3261e; --bad-bg: #fbe9e7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1620; --card: #16212d; --ink: #e8eef5; --muted: #9db0c3; --line: #2a3a4a;
      --accent: #63a9e8; --accent-ink: #0a1520; --sel: #1d3349;
      --good: #6fcf8f; --good-bg: #123120; --bad: #f4948c; --bad-bg: #3a1c1a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .wrap { max-width: 580px; margin: 0 auto; padding: 16px 16px 40px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin: 4px 0 14px; }
  h1 { font-size: 21px; margin: 0; letter-spacing: -0.01em; }
  .date { color: var(--muted); font-size: 14px; }
  .streak { font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: var(--sel); color: var(--accent); white-space: nowrap; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .card + .card { margin-top: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
  .chip { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; color: #fff; background: var(--accent); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  button { font: inherit; cursor: pointer; }
  .primary {
    width: 100%; padding: 15px 18px; border: 0; border-radius: 13px; margin-top: 16px;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 17px;
  }
  .primary:disabled { opacity: .4; cursor: not-allowed; }
  .ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--line); border-radius: 13px; padding: 13px 16px; font-weight: 600; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 8px 0 14px; }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
  .qmeta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .q { font-size: 19px; font-weight: 650; line-height: 1.35; margin: 14px 0 10px; }
  .opt {
    display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left;
    padding: 13px 14px; margin: 9px 0; background: var(--card); color: var(--ink);
    border: 1.5px solid var(--line); border-radius: 13px; font-size: 16px;
  }
  .opt .l {
    flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    font-size: 13px; font-weight: 700; border: 1.5px solid var(--line); color: var(--muted);
  }
  .opt.sel { border-color: var(--accent); background: var(--sel); }
  .opt.sel .l { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .navbar { position: sticky; bottom: 0; padding: 10px 0 max(10px, env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); margin-top: 6px; }
  .navbar .primary { margin-top: 0; }
  .score { text-align: center; padding: 6px 0 2px; }
  .score b { font-size: 64px; line-height: 1; letter-spacing: -0.03em; }
  .score span { font-size: 26px; color: var(--muted); font-weight: 600; }
  .verdict { text-align: center; font-weight: 700; margin: 4px 0 2px; }
  .hist { display: flex; gap: 6px; margin-top: 12px; }
  .hist div { flex: 1; text-align: center; font-size: 11px; color: var(--muted); }
  .hist b { display: block; margin-top: 3px; padding: 5px 0; border-radius: 8px; background: var(--sel); color: var(--ink); font-size: 14px; }
  .hist b.empty { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
  .rev { border-left: 5px solid var(--line); padding: 4px 0 4px 12px; margin: 16px 0; }
  .rev.ok { border-color: var(--good); }
  .rev.no { border-color: var(--bad); }
  .rev h3 { margin: 0 0 4px; font-size: 15px; font-weight: 650; }
  .rev .tag { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .ans-ok { color: var(--good); font-weight: 650; }
  .ans-no { color: var(--bad); font-weight: 650; }
  .why { font-size: 13.5px; color: var(--muted); margin-top: 3px; }
  .revise { background: var(--bad-bg); border-radius: 12px; padding: 12px 14px; margin-top: 14px; font-size: 14px; }
  .revise ul { margin: 6px 0 0; padding-left: 18px; }
  footer { margin-top: 18px; text-align: center; color: var(--muted); font-size: 12px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Daily GCSE Quiz</h1>
      <div class="date" id="date"></div>
    </div>
    <div class="streak" id="streak" hidden></div>
  </header>
  <main id="app"><div class="card muted">Loading...</div></main>
  <footer id="foot"></footer>
</div>
<noscript><p style="padding:16px">This quiz needs JavaScript.</p></noscript>

<!--EMBED_START--><script id="embedded-data" type="application/json">{"questions":[{"id":"bio-001","subject":"Biology","unit":"4.1 Cell biology","topic":"Eukaryotes and prokaryotes","q":"Where is the genetic material found in a bacterial cell?","a":"In a single loop of DNA in the cytoplasm (and sometimes plasmids)","w":["In a nucleus bounded by a membrane","In the mitochondria","In the cell wall"],"why":"Prokaryotes have no nucleus."},{"id":"bio-002","subject":"Biology","unit":"4.1 Cell biology","topic":"Eukaryotes and prokaryotes","q":"What are plasmids?","a":"Small rings of DNA found in bacterial cells","w":["Organelles that make protein","Chloroplasts in plant cells","Membranes around the nucleus"],"why":"Plasmids carry extra genes, for example for antibiotic resistance."},{"id":"bio-003","subject":"Biology","unit":"4.1 Cell biology","topic":"Animal and plant cells","q":"What is the function of ribosomes?","a":"Protein synthesis","w":["Respiration","Photosynthesis","Storing genetic material"],"why":"They are found in the cytoplasm and on rough endoplasmic reticulum."},{"id":"bio-004","subject":"Biology","unit":"4.1 Cell biology","topic":"Animal and plant cells","q":"What is the cell wall of a plant cell made of?","a":"Cellulose","w":["Chitin","Protein","Starch"],"why":"It strengthens the cell and supports the plant."},{"id":"bio-005","subject":"Biology","unit":"4.1 Cell biology","topic":"Animal and plant cells","q":"What does the permanent vacuole contain?","a":"Cell sap","w":["Chlorophyll","DNA","Enzymes for respiration"],"why":"It helps keep the cell firm."},{"id":"bio-006","subject":"Biology","unit":"4.1 Cell biology","topic":"Cell specialisation","q":"How is a nerve cell adapted for its function?","a":"It has a long axon and branched endings (dendrites) to carry and pass on impulses","w":["It has many chloroplasts","It contains haemoglobin","It has a hair-like projection"],"why":"Its length lets electrical impulses travel long distances."},{"id":"bio-007","subject":"Biology","unit":"4.1 Cell biology","topic":"Cell specialisation","q":"Why do red blood cells have no nucleus?","a":"To make more room for haemoglobin to carry oxygen","w":["To make them heavier","To stop them dividing","To help them move faster"],"why":"Their biconcave shape also gives a large surface area."},{"id":"bio-008","subject":"Biology","unit":"4.1 Cell biology","topic":"Cell specialisation","q":"How are xylem cells adapted for transporting water?","a":"They are hollow tubes strengthened with lignin","w":["They contain many mitochondria","They are full of cytoplasm","They contain chloroplasts"],"why":"The end walls break down to form a continuous tube."},{"id":"bio-009","subject":"Biology","unit":"4.1 Cell biology","topic":"Cell differentiation","q":"How does differentiation in plants differ from animals?","a":"Many plant cells can differentiate throughout life","w":["Plant cells never differentiate","Only embryonic plant cells differentiate","Plants have no specialised cells"],"why":"Plant meristems keep producing new cells."},{"id":"bio-010","subject":"Biology","unit":"4.1 Cell biology","topic":"Microscopy","q":"A cell is 0.02 mm wide. What is its width in micrometres?","a":"20 µm","w":["2 µm","200 µm","0.2 µm"],"why":"1 mm = 1000 µm."},{"id":"bio-011","subject":"Biology","unit":"4.1 Cell biology","topic":"Microscopy","q":"A cell has an image size of 12 mm and a real size of 0.06 mm. What is the magnification?","a":"x200","w":["x20","x2000","x720"],"why":"Magnification = image size ÷ real size."},{"id":"bio-012","subject":"Biology","unit":"4.1 Cell biology","topic":"Microscopy","q":"Why are electron microscopes better than light microscopes for studying cell structure?","a":"They have a much higher resolution so sub-cellular structures can be seen in detail","w":["They are cheaper","They show living cells in colour","They are easier to use"],"why":"Electron microscopes can show ribosomes and the internal structure of mitochondria."},{"id":"bio-013","subject":"Biology","unit":"4.1 Cell biology","topic":"Culture of microorganisms","q":"Why are the culture medium and equipment sterilised before use?","a":"To kill unwanted microorganisms","w":["To make the bacteria grow faster","To add nutrients","To stop the agar melting"],"why":"Aseptic technique prevents contamination."},{"id":"bio-014","subject":"Biology","unit":"4.1 Cell biology","topic":"Culture of microorganisms","q":"A single bacterium divides every 20 minutes. How many bacteria are there after 2 hours?","a":"64","w":["12","32","128"],"why":"That is 6 divisions: 2^6 = 64."},{"id":"bio-015","subject":"Biology","unit":"4.1 Cell biology","topic":"Culture of microorganisms","q":"Why should the lid of a Petri dish be taped (not sealed completely) and the dish stored upside down?","a":"To stop contamination and condensation dripping onto the culture while allowing oxygen in","w":["To stop the agar drying","To keep the bacteria cold","To speed up growth"],"why":"Oxygen stops harmful anaerobic bacteria growing."},{"id":"bio-016","subject":"Biology","unit":"4.1 Cell biology","topic":"Culture of microorganisms","q":"A clear zone of radius 1.0 cm surrounds an antibiotic disc. What is the area of the clear zone? (π = 3.14)","a":"3.14 cm²","w":["6.28 cm²","2.0 cm²","1.57 cm²"],"why":"Area = πr²."},{"id":"bio-017","subject":"Biology","unit":"4.1 Cell biology","topic":"Chromosomes","q":"Which sex chromosomes does a human male have?","a":"XY","w":["XX","YY","X"],"why":"Females are XX."},{"id":"bio-018","subject":"Biology","unit":"4.1 Cell biology","topic":"Chromosomes","q":"What is a gene?","a":"A short section of DNA that codes for a protein","w":["A type of cell","A whole chromosome","A part of the cell membrane"],"why":"Genes control characteristics."},{"id":"bio-019","subject":"Biology","unit":"4.1 Cell biology","topic":"Mitosis and the cell cycle","q":"Why is mitosis important in a multicellular organism?","a":"For growth and the repair of damaged tissue","w":["To produce gametes","To create genetic variation","To halve the chromosome number"],"why":"It makes identical cells."},{"id":"bio-020","subject":"Biology","unit":"4.1 Cell biology","topic":"Mitosis and the cell cycle","q":"What happens to the cell's DNA and organelles before mitosis?","a":"They are copied (replicated)","w":["They are destroyed","They are halved","They are moved to the cell wall"],"why":"The cell grows and duplicates its sub-cellular structures first."},{"id":"bio-021","subject":"Biology","unit":"4.1 Cell biology","topic":"Stem cells","q":"Why are embryonic stem cells useful in medicine?","a":"They can differentiate into almost any type of cell","w":["They can only become blood cells","They never divide","They are the same as adult cells"],"why":"Adult stem cells are more limited."},{"id":"bio-022","subject":"Biology","unit":"4.1 Cell biology","topic":"Stem cells","q":"Which is an ethical concern about using embryonic stem cells?","a":"Embryos are destroyed to obtain them","w":["They cure all diseases","They are only found in plants","They are too cheap"],"why":"Some people believe embryos have the right to life."},{"id":"bio-023","subject":"Biology","unit":"4.1 Cell biology","topic":"Diffusion","q":"Which adaptation helps an exchange surface such as the alveoli work efficiently?","a":"A large surface area and a thin membrane","w":["A thick wall","A small surface area","Slow blood flow"],"why":"A short diffusion path and a good blood supply also help."},{"id":"bio-024","subject":"Biology","unit":"4.1 Cell biology","topic":"Diffusion","q":"A cube has sides of 2 cm. What is its surface area to volume ratio?","a":"3:1","w":["6:1","1:3","12:1"],"why":"Surface area 24 cm² ÷ volume 8 cm³ = 3."},{"id":"bio-025","subject":"Biology","unit":"4.1 Cell biology","topic":"Diffusion","q":"Why do large multicellular organisms need specialised exchange surfaces?","a":"They have a small surface area compared to their volume","w":["They do not need oxygen","They are made of one cell","They make food by diffusion alone"],"why":"Diffusion alone is too slow over long distances."},{"id":"bio-026","subject":"Biology","unit":"4.1 Cell biology","topic":"Osmosis","q":"A potato slice has a mass of 4.0 g at the start and 4.6 g at the end. What is its percentage change in mass?","a":"15% increase","w":["15% decrease","0.6% increase","13% increase"],"why":"(0.6 ÷ 4.0) × 100 = 15."},{"id":"bio-027","subject":"Biology","unit":"4.1 Cell biology","topic":"Osmosis","q":"A plant cell placed in pure water will...","a":"Take in water by osmosis and become turgid","w":["Lose water and shrivel","Burst because it has no cell wall","Stay exactly the same"],"why":"The cell wall prevents bursting."},{"id":"bio-028","subject":"Biology","unit":"4.1 Cell biology","topic":"Active transport","q":"Why does active transport need energy?","a":"It moves substances against a concentration gradient","w":["It moves substances down a gradient","It uses water","It needs light"],"why":"The energy comes from respiration."},{"id":"bio-029","subject":"Biology","unit":"4.1 Cell biology","topic":"Active transport","q":"Which cell structure would you expect to find in large numbers in a cell that carries out a lot of active transport?","a":"Mitochondria","w":["Chloroplasts","Cell wall","Vacuoles"],"why":"They release the energy needed."},{"id":"bio-030","subject":"Biology","unit":"4.2 Organisation","topic":"Principles of organisation","q":"The stomach is an organ made of which tissues?","a":"Muscular, glandular and epithelial tissue","w":["Only muscular tissue","Xylem and phloem","Only epithelial tissue"],"why":"Different tissues work together as an organ."},{"id":"bio-031","subject":"Biology","unit":"4.2 Organisation","topic":"The human digestive system","q":"Which organ makes bile?","a":"Liver","w":["Gall bladder","Pancreas","Stomach"],"why":"Bile is stored in the gall bladder."},{"id":"bio-032","subject":"Biology","unit":"4.2 Organisation","topic":"The human digestive system","q":"Why is the stomach acid important?","a":"It kills many bacteria and provides the right pH for protease","w":["It breaks down fat","It makes bile","It absorbs water"],"why":"Pepsin works best in acid conditions."},{"id":"bio-033","subject":"Biology","unit":"4.2 Organisation","topic":"The human digestive system","q":"Which organs produce digestive enzymes?","a":"Salivary glands, stomach, pancreas and small intestine","w":["Liver and gall bladder only","Large intestine only","Oesophagus and anus"],"why":"The pancreas makes amylase, protease and lipase."},{"id":"bio-034","subject":"Biology","unit":"4.2 Organisation","topic":"Enzymes","q":"Why does an enzyme stop working at high temperatures?","a":"The shape of the active site changes and the substrate no longer fits","w":["The substrate is used up","The enzyme is killed","The enzyme changes into starch"],"why":"This is denaturation."},{"id":"bio-035","subject":"Biology","unit":"4.2 Organisation","topic":"Enzymes","q":"Which enzyme works best at about pH 2?","a":"Pepsin (a protease in the stomach)","w":["Amylase","Lipase","Catalase"],"why":"Different enzymes have different optimum pH values."},{"id":"bio-036","subject":"Biology","unit":"4.2 Organisation","topic":"Digestion of food","q":"Which enzyme breaks down proteins, and into what?","a":"Protease, into amino acids","w":["Amylase, into glucose","Lipase, into fatty acids","Protease, into glycerol"],"why":"Amino acids are used to make new proteins."},{"id":"bio-037","subject":"Biology","unit":"4.2 Organisation","topic":"Digestion of food","q":"Which reagent is used to test for protein?","a":"Biuret solution","w":["Iodine solution","Benedict's solution","Ethanol"],"why":"It turns from blue to purple if protein is present."},{"id":"bio-038","subject":"Biology","unit":"4.2 Organisation","topic":"Digestion of food","q":"Which test shows that lipids are present?","a":"Adding ethanol then water: a cloudy white emulsion forms","w":["Adding iodine: it turns blue-black","Adding Benedict's and heating","Adding Biuret solution"],"why":"The emulsion test is used for lipids."},{"id":"bio-039","subject":"Biology","unit":"4.2 Organisation","topic":"The heart and blood vessels","q":"What is the function of the valves in the heart?","a":"To prevent backflow of blood","w":["To pump blood","To supply oxygen to the heart","To add oxygen to blood"],"why":"They keep blood flowing in one direction."},{"id":"bio-040","subject":"Biology","unit":"4.2 Organisation","topic":"The heart and blood vessels","q":"Which structure controls the resting heart rate?","a":"The pacemaker cells in the right atrium","w":["The left ventricle","The aorta","The valves"],"why":"An artificial pacemaker can correct irregular heart rhythms."},{"id":"bio-041","subject":"Biology","unit":"4.2 Organisation","topic":"The heart and blood vessels","q":"Which blood vessel brings oxygenated blood from the lungs to the heart?","a":"Pulmonary vein","w":["Pulmonary artery","Vena cava","Aorta"],"why":"The vena cava returns deoxygenated blood from the body."},{"id":"bio-042","subject":"Biology","unit":"4.2 Organisation","topic":"The heart and blood vessels","q":"Why do veins have valves?","a":"To stop blood flowing backwards, since blood is at low pressure","w":["To make them elastic","To carry blood at high pressure","To allow gas exchange"],"why":"Arteries do not need valves."},{"id":"bio-043","subject":"Biology","unit":"4.2 Organisation","topic":"Blood","q":"What is the function of plasma?","a":"To transport substances such as carbon dioxide, hormones and urea","w":["To carry oxygen","To fight pathogens","To clot the blood"],"why":"It is the liquid part of blood."},{"id":"bio-044","subject":"Biology","unit":"4.2 Organisation","topic":"Blood","q":"What is a platelet?","a":"A fragment of a cell that helps blood to clot","w":["A white blood cell","A red blood cell","A type of antibody"],"why":"They have no nucleus."},{"id":"bio-045","subject":"Biology","unit":"4.2 Organisation","topic":"Coronary heart disease","q":"What are statins used for?","a":"To reduce the amount of cholesterol in the blood","w":["To increase blood pressure","To dissolve blood clots in strokes","To replace faulty valves"],"why":"They slow the build-up of fatty deposits."},{"id":"bio-046","subject":"Biology","unit":"4.2 Organisation","topic":"Coronary heart disease","q":"Why might a patient with heart failure be given a donor heart?","a":"Their own heart can no longer pump effectively","w":["Their heart is too fast","They need a stent","They have a virus"],"why":"A risk is that the body rejects the donor organ."},{"id":"bio-047","subject":"Biology","unit":"4.2 Organisation","topic":"Health and disease","q":"Which is an example of a non-communicable disease?","a":"Cancer","w":["Measles","HIV","Salmonella"],"why":"Non-communicable diseases cannot be passed between people."},{"id":"bio-048","subject":"Biology","unit":"4.2 Organisation","topic":"Health and disease","q":"How can some viral infections lead to cancer?","a":"By triggering changes in cells, e.g. HPV and cervical cancer","w":["By boosting the immune system","By causing diabetes","By lowering blood pressure"],"why":"Diseases can interact."},{"id":"bio-049","subject":"Biology","unit":"4.2 Organisation","topic":"Risk factors for non-communicable disease","q":"What is a risk factor for liver disease?","a":"Excessive alcohol consumption","w":["Eating fruit","Exercise","Sleeping too much"],"why":"Alcohol also damages the brain and, in pregnancy, can affect the baby."},{"id":"bio-050","subject":"Biology","unit":"4.2 Organisation","topic":"Risk factors for non-communicable disease","q":"Which disease is linked to obesity?","a":"Type 2 diabetes","w":["Measles","Malaria","Rose black spot"],"why":"Obesity also increases the risk of cardiovascular disease."},{"id":"bio-051","subject":"Biology","unit":"4.2 Organisation","topic":"Cancer","q":"Which of these is a lifestyle risk factor for cancer?","a":"Smoking","w":["Eating a balanced diet","Using a seat belt","Taking vitamins"],"why":"Others: obesity, UV exposure, ionising radiation."},{"id":"bio-052","subject":"Biology","unit":"4.2 Organisation","topic":"Cancer","q":"Cancer is caused by...","a":"Uncontrolled cell division that forms a tumour","w":["Viral infection only","A lack of oxygen","Too much glucose"],"why":"Genetic changes can make cells divide uncontrollably."},{"id":"bio-053","subject":"Biology","unit":"4.2 Organisation","topic":"Plant tissues","q":"What is the function of guard cells?","a":"To open and close the stomata","w":["To make food","To transport water","To store starch"],"why":"They control gas exchange and water loss."},{"id":"bio-054","subject":"Biology","unit":"4.2 Organisation","topic":"Plant tissues","q":"Which leaf tissue contains air spaces to help gas exchange?","a":"Spongy mesophyll","w":["Palisade mesophyll","Upper epidermis","Xylem"],"why":"The air spaces let carbon dioxide diffuse to cells."},{"id":"bio-055","subject":"Biology","unit":"4.2 Organisation","topic":"Transpiration and translocation","q":"Which factor would DECREASE the rate of transpiration?","a":"High humidity","w":["High temperature","Strong wind","Bright light"],"why":"A smaller concentration gradient means slower diffusion of water vapour."},{"id":"bio-056","subject":"Biology","unit":"4.2 Organisation","topic":"Transpiration and translocation","q":"Why do plants need transpiration?","a":"It transports water and mineral ions up the plant and cools the leaves","w":["It makes glucose","It moves sugars to the roots","It stops photosynthesis"],"why":"Water is drawn up the xylem."},{"id":"bio-057","subject":"Biology","unit":"4.3 Infection and response","topic":"Communicable diseases","q":"Which way can pathogens be spread?","a":"Through the air, in water, by direct contact or by vectors","w":["Only by touching","Only through food","Only through water"],"why":"Examples: measles in the air, cholera in water, malaria by mosquitoes."},{"id":"bio-058","subject":"Biology","unit":"4.3 Infection and response","topic":"Viral, bacterial, fungal and protist diseases","q":"What is a symptom of measles?","a":"Fever and a red skin rash","w":["Thick yellow discharge","Black spots on leaves","Yellow leaves"],"why":"Measles is caused by a virus and prevented by vaccination."},{"id":"bio-059","subject":"Biology","unit":"4.3 Infection and response","topic":"Viral, bacterial, fungal and protist diseases","q":"How can the spread of malaria be reduced?","a":"By controlling mosquitoes, such as using nets","w":["By washing food","By vaccination only","By taking antibiotics"],"why":"The mosquito is the vector that carries the protist."},{"id":"bio-060","subject":"Biology","unit":"4.3 Infection and response","topic":"Viral, bacterial, fungal and protist diseases","q":"How can the spread of gonorrhoea be reduced?","a":"By using a condom","w":["By covering your mouth","By washing hands only","By drinking boiled water"],"why":"It is a sexually transmitted bacterial disease."},{"id":"bio-061","subject":"Biology","unit":"4.3 Infection and response","topic":"Viral, bacterial, fungal and protist diseases","q":"Rose black spot is caused by a...","a":"Fungus","w":["Virus","Bacterium","Protist"],"why":"It spreads by wind and water; fungicides and removing leaves help."},{"id":"bio-062","subject":"Biology","unit":"4.3 Infection and response","topic":"Viral, bacterial, fungal and protist diseases","q":"What is the effect of tobacco mosaic virus on a plant?","a":"Leaves become mottled and discoloured, reducing photosynthesis","w":["Fruit grows larger","Roots grow faster","Stems become stronger"],"why":"It reduces growth."},{"id":"bio-063","subject":"Biology","unit":"4.3 Infection and response","topic":"Human defence systems","q":"How does the nose help to defend the body?","a":"Hairs and mucus trap particles and microorganisms","w":["It kills bacteria with acid","It makes antibodies","It makes platelets"],"why":"Cilia and mucus in the trachea also trap pathogens."},{"id":"bio-064","subject":"Biology","unit":"4.3 Infection and response","topic":"Human defence systems","q":"What do white blood cells called lymphocytes do?","a":"Produce antibodies against specific antigens","w":["Carry oxygen","Help the blood clot","Digest food"],"why":"Some lymphocytes become memory cells."},{"id":"bio-065","subject":"Biology","unit":"4.3 Infection and response","topic":"Vaccination","q":"Why is the secondary immune response quicker and stronger?","a":"Memory cells produce the right antibodies faster","w":["Antibiotics help","The pathogen is weaker","White cells are larger"],"why":"This is why vaccination protects people."},{"id":"bio-066","subject":"Biology","unit":"4.3 Infection and response","topic":"Antibiotics and painkillers","q":"Why can antibiotics not be used to treat a cold?","a":"Colds are caused by viruses, which antibiotics do not kill","w":["Colds are caused by fungi","Colds are not infections","Antibiotics are only for plants"],"why":"Antibiotics target bacteria."},{"id":"bio-067","subject":"Biology","unit":"4.3 Infection and response","topic":"Antibiotics and painkillers","q":"Painkillers such as paracetamol...","a":"Relieve symptoms but do not kill pathogens","w":["Kill bacteria","Kill viruses","Prevent infection"],"why":"They treat pain, not the cause."},{"id":"bio-068","subject":"Biology","unit":"4.3 Infection and response","topic":"Discovery and development of drugs","q":"Why are new drugs tested on cells and animals before humans?","a":"To check they are safe and effective","w":["To make them cheaper","To make them taste better","To speed up approval"],"why":"Clinical trials on humans follow."},{"id":"bio-069","subject":"Biology","unit":"4.3 Infection and response","topic":"Discovery and development of drugs","q":"What is a placebo?","a":"A substance that looks like the drug but contains no active ingredient","w":["A stronger version of the drug","A vaccine","A new antibiotic"],"why":"It lets researchers see the real effect of the drug."},{"id":"bio-070","subject":"Biology","unit":"4.3 Infection and response","topic":"Discovery and development of drugs","q":"Who discovered penicillin?","a":"Alexander Fleming","w":["Louis Pasteur","Edward Jenner","Robert Koch"],"why":"He noticed mould killing bacteria on an agar plate in 1928."},{"id":"bio-071","subject":"Biology","unit":"4.3 Infection and response","topic":"Monoclonal antibodies","q":"How are monoclonal antibodies produced?","a":"By fusing a lymphocyte with a tumour cell to make a hybridoma","w":["By growing bacteria","By infecting a plant","By cutting DNA"],"why":"The hybridoma divides and makes identical antibodies."},{"id":"bio-072","subject":"Biology","unit":"4.3 Infection and response","topic":"Monoclonal antibodies","q":"How can monoclonal antibodies be used to treat cancer?","a":"They are attached to a drug and deliver it to cancer cells","w":["They replace the immune system","They remove all antibodies","They stop cell division in all cells"],"why":"This reduces damage to healthy cells."},{"id":"bio-073","subject":"Biology","unit":"4.3 Infection and response","topic":"Plant disease and defence","q":"Which mineral ion deficiency causes yellow leaves?","a":"Magnesium","w":["Nitrate","Iron","Calcium"],"why":"Magnesium is needed for chlorophyll; its lack causes chlorosis."},{"id":"bio-074","subject":"Biology","unit":"4.3 Infection and response","topic":"Plant disease and defence","q":"Which is a chemical defence of plants?","a":"Producing poisons or antibacterial chemicals","w":["Thorns","Waxy cuticle","Leaves that curl up"],"why":"Thorns and hairs are physical defences."},{"id":"bio-075","subject":"Biology","unit":"4.4 Bioenergetics","topic":"Photosynthesis reaction","q":"What is the balanced symbol equation for photosynthesis?","a":"6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂","w":["C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O","6CO₂ + 6O₂ → C₆H₁₂O₆ + 6H₂O","CO₂ + H₂O → C₆H₁₂O₆"],"why":"Light energy is absorbed by chlorophyll in the chloroplasts."},{"id":"bio-076","subject":"Biology","unit":"4.4 Bioenergetics","topic":"Photosynthesis reaction","q":"Where does photosynthesis happen in a plant cell?","a":"Chloroplasts","w":["Mitochondria","Nucleus","Vacuole"],"why":"Chlorophyll absorbs light."},{"id":"bio-077","subject":"Biology","unit":"4.4 Bioenergetics","topic":"Rate of photosynthesis","q":"Why does the rate of photosynthesis stop increasing as temperature rises above about 45°C?","a":"The enzymes begin to denature","w":["There is too much carbon dioxide","The leaf runs out of water","Light intensity decreases"],"why":"Enzymes control the reactions."},{"id":"bio-078","subject":"Biology","unit":"4.4 Bioenergetics","topic":"Rate of photosynthesis","q":"A lamp is moved from 5 cm to 15 cm from pondweed. By what factor does light intensity change?","a":"It falls to one ninth","w":["It falls to one third","It halves","It falls to one quarter"],"why":"Intensity is proportional to 1 ÷ distance²."},{"id":"bio-079","subject":"Biology","unit":"4.4 Bioenergetics","topic":"Rate of photosynthesis","q":"Why might a farmer add carbon dioxide to a greenhouse?","a":"To increase the rate of photosynthesis and so crop yield","w":["To reduce disease","To raise the temperature","To lower humidity"],"why":"Greenhouses control limiting factors."},{"id":"bio-080","subject":"Biology","unit":"4.4 Bioenergetics","topic":"Uses of glucose from photosynthesis","q":"What do plants use nitrate ions to make?","a":"Amino acids, and then proteins","w":["Starch","Cellulose","Lipids"],"why":"Glucose is combined with nitrates."},{"id":"bio-081","subject":"Biology","unit":"4.4 Bioenergetics","topic":"Uses of glucose from photosynthesis","q":"Why do some plants store glucose as lipids (oils) in their seeds?","a":"Lipids store a lot of energy in a small space","w":["Lipids are sweet","They can't make starch","Lipids help seeds float"],"why":"They give the seedling energy to grow."},{"id":"bio-082","subject":"Biology","unit":"4.4 Bioenergetics","topic":"Aerobic and anaerobic respiration","q":"Where does aerobic respiration occur in a cell?","a":"In the mitochondria","w":["In the nucleus","In the chloroplast","In the cell wall"],"why":"Anaerobic respiration happens in the cytoplasm."},{"id":"bio-083","subject":"Biology","unit":"4.4 Bioenergetics","topic":"Aerobic and anaerobic respiration","q":"What are the products of anaerobic respiration in yeast?","a":"Ethanol and carbon dioxide","w":["Lactic acid","Water and oxygen","Glucose"],"why":"This is fermentation, used in brewing and baking."},{"id":"bio-084","subject":"Biology","unit":"4.4 Bioenergetics","topic":"Aerobic and anaerobic respiration","q":"Why does anaerobic respiration release less energy than aerobic respiration?","a":"Glucose is only partially broken down","w":["It needs more oxygen","It makes more carbon dioxide","It happens in the nucleus"],"why":"Lactic acid and ethanol still contain energy."},{"id":"bio-085","subject":"Biology","unit":"4.4 Bioenergetics","topic":"Response to exercise","q":"What causes muscle fatigue during vigorous exercise?","a":"Lactic acid builds up during anaerobic respiration","w":["Too much oxygen","A lack of glucose in the mouth","Too much urea"],"why":"Blood flow later removes the lactic acid."},{"id":"bio-086","subject":"Biology","unit":"4.4 Bioenergetics","topic":"Response to exercise","q":"What is metabolism?","a":"The sum of all the chemical reactions in a cell or the body","w":["Breathing rate","The breakdown of glucose only","The movement of blood"],"why":"It includes building and breaking down molecules."},{"id":"bio-087","subject":"Biology","unit":"4.4 Bioenergetics","topic":"Response to exercise","q":"What happens to excess protein in the body?","a":"It is broken down in the liver to form urea","w":["It is stored as starch","It becomes glucose in the kidney","It is used to make bile"],"why":"Urea is removed in the urine."},{"id":"bio-088","subject":"Biology","unit":"4.1 Cell biology","topic":"Eukaryotes and prokaryotes","q":"What is a eukaryotic cell?","a":"A cell whose genetic material is enclosed in a nucleus","w":["A cell whose DNA floats free in the cytoplasm","A cell with no cell membrane","A cell that can only be seen with an electron microscope"],"why":"Eukaryotes (animal, plant, fungal and protist cells) have a nucleus. Prokaryotes such as bacteria do not."},{"id":"bio-089","subject":"Biology","unit":"4.1 Cell biology","topic":"Eukaryotes and prokaryotes","q":"Which of these is a prokaryotic cell?","a":"A bacterial cell","w":["A yeast cell","A plant leaf cell","A human muscle cell"],"why":"Bacteria are prokaryotes. Yeast is a fungus, so it is a eukaryote."},{"id":"bio-090","subject":"Biology","unit":"4.1 Cell biology","topic":"Animal and plant cells","q":"Which structure is found in plant cells but NOT in animal cells?","a":"Chloroplasts","w":["Mitochondria","Ribosomes","Cell membrane"],"why":"Plant cells also have a cellulose cell wall and a permanent vacuole."},{"id":"bio-091","subject":"Biology","unit":"4.1 Cell biology","topic":"Animal and plant cells","q":"Where does aerobic respiration mainly take place in a cell?","a":"Mitochondria","w":["Ribosomes","Nucleus","Chloroplasts"],"why":"Mitochondria release energy from glucose. Ribosomes make proteins."},{"id":"bio-092","subject":"Biology","unit":"4.1 Cell biology","topic":"Cell specialisation","q":"Which feature helps a root hair cell absorb water and mineral ions?","a":"A large surface area from its long hair-like extension","w":["A tail for swimming","Lots of chloroplasts","A thick lignin-reinforced wall"],"why":"The root hair increases the surface area for absorption."},{"id":"bio-093","subject":"Biology","unit":"4.1 Cell biology","topic":"Cell specialisation","q":"Sperm cells contain lots of mitochondria. Why?","a":"To release energy for swimming","w":["To store food for the embryo","To make proteins for the egg","To help the head grow"],"why":"Mitochondria provide the energy needed to swim to the egg."},{"id":"bio-094","subject":"Biology","unit":"4.1 Cell biology","topic":"Cell differentiation","q":"What is differentiation?","a":"The process by which a cell becomes specialised for its job","w":["Cell division producing identical copies","The movement of water across a membrane","The engulfing of a pathogen by a white blood cell"],"why":"Differentiated cells have the structures they need for their function."},{"id":"bio-095","subject":"Biology","unit":"4.1 Cell biology","topic":"Cell differentiation","q":"In most animals, when do cells differentiate?","a":"Early in development, as the organism grows","w":["Only when the animal is fully grown","Only during old age","Animal cells never differentiate"],"why":"Most animal cells differentiate early. Many plant cells keep the ability throughout life."},{"id":"bio-096","subject":"Biology","unit":"4.1 Cell biology","topic":"Microscopy","q":"A cell has an image size of 20 mm at x400 magnification. What is its real size?","a":"0.05 mm","w":["5 mm","0.5 mm","8000 mm"],"why":"Real size = image size / magnification = 20 / 400 = 0.05 mm."},{"id":"bio-097","subject":"Biology","unit":"4.1 Cell biology","topic":"Microscopy","q":"Which type of microscope gives the higher magnification and resolution?","a":"Electron microscope","w":["Light microscope","They are identical","Hand lens"],"why":"Electron microscopes show sub-cellular structures in far more detail."},{"id":"bio-098","subject":"Biology","unit":"4.1 Cell biology","topic":"Culture of microorganisms","q":"Why are school cultures incubated at about 25 C instead of 37 C?","a":"To reduce the chance of growing harmful human pathogens","w":["Because bacteria cannot grow above 25 C","To make the agar set faster","To kill all bacteria before the experiment"],"why":"37 C is body temperature, which favours human pathogens."},{"id":"bio-099","subject":"Biology","unit":"4.1 Cell biology","topic":"Culture of microorganisms","q":"A clear zone around an antibiotic disc on an agar plate shows that...","a":"Bacteria did not grow there","w":["Bacteria grew fastest there","The agar had dried out","The disc contained nutrients"],"why":"A bigger clear zone means the substance was more effective."},{"id":"bio-100","subject":"Biology","unit":"4.1 Cell biology","topic":"Chromosomes","q":"How many chromosomes are in a normal human body cell?","a":"46 (23 pairs)","w":["23","48 (24 pairs)","92"],"why":"Gametes have 23. Body cells have 23 pairs."},{"id":"bio-101","subject":"Biology","unit":"4.1 Cell biology","topic":"Chromosomes","q":"What is a chromosome?","a":"A long molecule of DNA carrying many genes","w":["A single gene","A protein made of amino acids","A membrane-bound organelle"],"why":"A gene is a short section of a chromosome coding for one protein."},{"id":"bio-102","subject":"Biology","unit":"4.1 Cell biology","topic":"Mitosis and the cell cycle","q":"What does mitosis produce?","a":"Two genetically identical daughter cells","w":["Four genetically different gametes","Two cells with half the chromosomes","One cell with double the DNA"],"why":"Mitosis is used for growth, repair and asexual reproduction."},{"id":"bio-103","subject":"Biology","unit":"4.1 Cell biology","topic":"Mitosis and the cell cycle","q":"When is DNA replicated in the cell cycle?","a":"Before mitosis begins","w":["During cytokinesis","After the cell has divided","Only in gamete cells"],"why":"The cell copies its DNA and grows before dividing."},{"id":"bio-104","subject":"Biology","unit":"4.1 Cell biology","topic":"Stem cells","q":"What is a stem cell?","a":"An undifferentiated cell that can divide and become different cell types","w":["A specialised nerve cell","A cell that cannot divide","A cell only found in adults"],"why":"Embryonic stem cells can become any cell type."},{"id":"bio-105","subject":"Biology","unit":"4.1 Cell biology","topic":"Stem cells","q":"Where are stem cells found in plants?","a":"Meristem tissue","w":["Xylem","Palisade layer","Guard cells"],"why":"Meristems at shoot and root tips can differentiate throughout life."},{"id":"bio-106","subject":"Biology","unit":"4.1 Cell biology","topic":"Diffusion","q":"Diffusion is the net movement of particles from...","a":"An area of high concentration to an area of low concentration","w":["Low to high concentration using energy","High to low pressure through a membrane only","The cell to the nucleus"],"why":"Diffusion is passive: it needs no energy."},{"id":"bio-107","subject":"Biology","unit":"4.1 Cell biology","topic":"Diffusion","q":"Which change would INCREASE the rate of diffusion?","a":"A steeper concentration gradient","w":["A lower temperature","A smaller surface area","A thicker exchange surface"],"why":"Higher temperature, larger surface area and thinner membranes also speed it up."},{"id":"bio-108","subject":"Biology","unit":"4.1 Cell biology","topic":"Osmosis","q":"Osmosis is the movement of water across a partially permeable membrane from...","a":"A dilute solution to a more concentrated solution","w":["A concentrated solution to a dilute solution","Low pressure to high pressure using energy","Any solution to any other solution using ATP"],"why":"Water moves down its concentration (water potential) gradient."},{"id":"bio-109","subject":"Biology","unit":"4.1 Cell biology","topic":"Osmosis","q":"A potato cylinder gains mass in a solution. What does this show?","a":"The solution was more dilute than the potato cells","w":["The solution was more concentrated than the potato cells","No osmosis happened","Sugar moved in by active transport"],"why":"Water moved into the potato by osmosis, so the outside solution was more dilute."},{"id":"bio-110","subject":"Biology","unit":"4.1 Cell biology","topic":"Active transport","q":"How does active transport differ from diffusion?","a":"It moves substances against a concentration gradient using energy","w":["It moves substances down a concentration gradient","It only moves water","It does not need a membrane"],"why":"Energy comes from respiration."},{"id":"bio-111","subject":"Biology","unit":"4.1 Cell biology","topic":"Active transport","q":"Which is an example of active transport?","a":"Root hair cells absorbing mineral ions from the soil","w":["Oxygen entering red blood cells","Water entering root hair cells","Urea leaving liver cells"],"why":"The soil has a lower concentration of ions than the root cell."},{"id":"bio-112","subject":"Biology","unit":"4.2 Organisation","topic":"Principles of organisation","q":"Which is the correct order from smallest to largest?","a":"Cell, tissue, organ, organ system","w":["Tissue, cell, organ, organ system","Cell, organ, tissue, organ system","Organ, tissue, cell, organ system"],"why":"Cells form tissues, tissues form organs, organs form organ systems."},{"id":"bio-113","subject":"Biology","unit":"4.2 Organisation","topic":"Principles of organisation","q":"A group of similar cells working together is called a...","a":"Tissue","w":["Organ","Organelle","Organ system"],"why":"Muscle tissue is an example."},{"id":"bio-114","subject":"Biology","unit":"4.2 Organisation","topic":"The human digestive system","q":"Where is bile stored?","a":"Gall bladder","w":["Liver","Pancreas","Small intestine"],"why":"Bile is made in the liver and stored in the gall bladder."},{"id":"bio-115","subject":"Biology","unit":"4.2 Organisation","topic":"The human digestive system","q":"Which reagent turns blue-black when starch is present?","a":"Iodine solution","w":["Benedict's solution","Biuret reagent","Ethanol"],"why":"Benedict's tests for sugars, Biuret for protein."},{"id":"bio-116","subject":"Biology","unit":"4.2 Organisation","topic":"The human digestive system","q":"What colour does Benedict's solution turn with a reducing sugar after heating?","a":"Brick red (via green/yellow/orange)","w":["Blue-black","Purple","Cloudy white"],"why":"It starts blue. More sugar gives a redder result."},{"id":"bio-117","subject":"Biology","unit":"4.2 Organisation","topic":"Enzymes","q":"What happens to an enzyme at a very high temperature?","a":"The active site changes shape (it is denatured)","w":["It works twice as fast","It becomes a different enzyme","It is used up"],"why":"A denatured enzyme can no longer bind its substrate."},{"id":"bio-118","subject":"Biology","unit":"4.2 Organisation","topic":"Enzymes","q":"What does the lock and key model say?","a":"Only a substrate with a matching shape fits the enzyme's active site","w":["Enzymes change shape to fit every substrate","Enzymes are used up in reactions","Enzymes lock onto DNA to copy it"],"why":"This is why enzymes are specific."},{"id":"bio-119","subject":"Biology","unit":"4.2 Organisation","topic":"Digestion of food","q":"Amylase breaks down...","a":"Starch into simple sugars","w":["Protein into amino acids","Fats into fatty acids and glycerol","Sugars into starch"],"why":"Amylase is made in the salivary glands, pancreas and small intestine."},{"id":"bio-120","subject":"Biology","unit":"4.2 Organisation","topic":"Digestion of food","q":"What is the role of bile?","a":"Neutralises stomach acid and emulsifies fat","w":["Breaks down protein","Digests starch","Absorbs water"],"why":"Emulsifying gives fat a bigger surface area for lipase."},{"id":"bio-121","subject":"Biology","unit":"4.2 Organisation","topic":"Digestion of food","q":"Lipase breaks down fats into...","a":"Fatty acids and glycerol","w":["Amino acids","Glucose","Starch"],"why":"Proteases make amino acids. Carbohydrases make sugars."},{"id":"bio-122","subject":"Biology","unit":"4.2 Organisation","topic":"The heart and blood vessels","q":"Which vessel carries blood from the heart to the lungs?","a":"Pulmonary artery","w":["Pulmonary vein","Aorta","Vena cava"],"why":"The pulmonary vein returns oxygenated blood to the heart."},{"id":"bio-123","subject":"Biology","unit":"4.2 Organisation","topic":"The heart and blood vessels","q":"Which chamber pumps blood around the whole body?","a":"Left ventricle","w":["Right ventricle","Left atrium","Right atrium"],"why":"It has the thickest muscular wall."},{"id":"bio-124","subject":"Biology","unit":"4.2 Organisation","topic":"The heart and blood vessels","q":"Why do arteries have thick, elastic walls?","a":"They carry blood at high pressure","w":["They carry blood at low pressure","They absorb nutrients","They contain valves to prevent backflow"],"why":"Veins have thin walls and valves."},{"id":"bio-125","subject":"Biology","unit":"4.2 Organisation","topic":"Blood","q":"Which blood component carries oxygen?","a":"Red blood cells","w":["Platelets","White blood cells","Plasma"],"why":"Haemoglobin in red cells binds oxygen."},{"id":"bio-126","subject":"Biology","unit":"4.2 Organisation","topic":"Blood","q":"What do platelets do?","a":"Help the blood to clot","w":["Carry oxygen","Produce antibodies","Engulf pathogens"],"why":"Clotting seals wounds and stops pathogens entering."},{"id":"bio-127","subject":"Biology","unit":"4.2 Organisation","topic":"Coronary heart disease","q":"What blocks the coronary arteries in coronary heart disease?","a":"A build-up of fatty material","w":["Bacteria","Too much haemoglobin","Blood clots in leg veins"],"why":"The heart muscle then gets too little oxygen."},{"id":"bio-128","subject":"Biology","unit":"4.2 Organisation","topic":"Coronary heart disease","q":"What is a stent?","a":"A tube that keeps a blocked artery open","w":["A drug that lowers cholesterol","An artificial heart valve","A machine that pumps blood"],"why":"Statins are the drugs that reduce cholesterol."},{"id":"bio-129","subject":"Biology","unit":"4.2 Organisation","topic":"Health and disease","q":"Health is best defined as...","a":"A state of physical and mental wellbeing","w":["The absence of infectious disease only","Being able to run a mile","Not visiting the doctor"],"why":"Health includes mental wellbeing too."},{"id":"bio-130","subject":"Biology","unit":"4.2 Organisation","topic":"Health and disease","q":"HIV weakens the immune system. What is a likely result?","a":"The person develops other infections more easily","w":["They develop type 1 diabetes","They become immune to viruses","They have a stronger immune response"],"why":"Diseases can interact. One can make another more likely."},{"id":"bio-131","subject":"Biology","unit":"4.2 Organisation","topic":"Risk factors for non-communicable disease","q":"Which is a lifestyle risk factor for type 2 diabetes?","a":"Obesity","w":["Vaccination","Viral infection","Breathing air"],"why":"Obesity is also linked to heart disease and some cancers."},{"id":"bio-132","subject":"Biology","unit":"4.2 Organisation","topic":"Risk factors for non-communicable disease","q":"Which disease is most strongly linked to smoking?","a":"Lung cancer","w":["Malaria","Cystic fibrosis","Type 1 diabetes"],"why":"Smoking also increases the risk of heart disease."},{"id":"bio-133","subject":"Biology","unit":"4.2 Organisation","topic":"Cancer","q":"What is a malignant tumour?","a":"Cancer cells that invade neighbouring tissue and can spread","w":["A lump that stays in one place","A group of healthy cells","A tumour caused only by infection"],"why":"Malignant cells can spread through the blood to form secondary tumours."},{"id":"bio-134","subject":"Biology","unit":"4.2 Organisation","topic":"Cancer","q":"A benign tumour...","a":"Grows but does not spread to other parts of the body","w":["Spreads through the blood to other organs","Is always fatal","Is a type of pathogen"],"why":"Benign tumours are not cancers."},{"id":"bio-135","subject":"Biology","unit":"4.2 Organisation","topic":"Plant tissues","q":"Which plant tissue transports water and minerals up the plant?","a":"Xylem","w":["Phloem","Epidermis","Palisade mesophyll"],"why":"Phloem carries sugars."},{"id":"bio-136","subject":"Biology","unit":"4.2 Organisation","topic":"Plant tissues","q":"Which leaf layer contains the most chloroplasts?","a":"Palisade mesophyll","w":["Spongy mesophyll","Lower epidermis","Waxy cuticle"],"why":"It is near the top of the leaf to absorb the most light."},{"id":"bio-137","subject":"Biology","unit":"4.2 Organisation","topic":"Transpiration and translocation","q":"Translocation is the movement of...","a":"Sugars (sucrose) in the phloem","w":["Water in the xylem","Gases through stomata","Minerals into root hairs"],"why":"It moves sugars from leaves to where they are used or stored."},{"id":"bio-138","subject":"Biology","unit":"4.2 Organisation","topic":"Transpiration and translocation","q":"Which change INCREASES the rate of transpiration?","a":"Higher temperature","w":["Higher humidity","Lower light intensity","Still air"],"why":"Warm, dry, windy, bright conditions all increase transpiration."},{"id":"bio-139","subject":"Biology","unit":"4.3 Infection and response","topic":"Communicable diseases","q":"Which is a type of pathogen?","a":"Virus","w":["Antibody","Platelet","Enzyme"],"why":"Pathogens are bacteria, viruses, fungi and protists."},{"id":"bio-140","subject":"Biology","unit":"4.3 Infection and response","topic":"Communicable diseases","q":"How can the spread of communicable disease be reduced?","a":"Good hygiene and vaccination","w":["Sharing personal items","Eating more sugar","Ignoring symptoms"],"why":"Also destroying vectors and isolating infected individuals."},{"id":"bio-141","subject":"Biology","unit":"4.3 Infection and response","topic":"Viral, bacterial, fungal and protist diseases","q":"Malaria is caused by a...","a":"Protist","w":["Virus","Bacterium","Fungus"],"why":"It is spread by mosquitoes, which are vectors."},{"id":"bio-142","subject":"Biology","unit":"4.3 Infection and response","topic":"Viral, bacterial, fungal and protist diseases","q":"HIV attacks which type of cell?","a":"White blood cells (immune cells)","w":["Red blood cells","Nerve cells","Skin cells"],"why":"It eventually leads to AIDS."},{"id":"bio-143","subject":"Biology","unit":"4.3 Infection and response","topic":"Viral, bacterial, fungal and protist diseases","q":"Salmonella food poisoning is caused by...","a":"Bacteria","w":["A virus","A fungus","A protist"],"why":"Symptoms include fever, cramps and diarrhoea."},{"id":"bio-144","subject":"Biology","unit":"4.3 Infection and response","topic":"Human defence systems","q":"What is phagocytosis?","a":"White blood cells engulfing and digesting pathogens","w":["Antibodies clumping pathogens together","Platelets forming a scab","Stomach acid killing bacteria"],"why":"Lymphocytes make antibodies. Phagocytes engulf pathogens."},{"id":"bio-145","subject":"Biology","unit":"4.3 Infection and response","topic":"Human defence systems","q":"What do antitoxins do?","a":"Neutralise toxins released by pathogens","w":["Engulf pathogens","Carry oxygen","Digest food"],"why":"They are produced by white blood cells."},{"id":"bio-146","subject":"Biology","unit":"4.3 Infection and response","topic":"Vaccination","q":"A vaccine contains...","a":"Dead or weakened pathogens (or their antigens)","w":["Antibiotics","Fully active live pathogens","White blood cells"],"why":"This triggers antibody production and memory cells."},{"id":"bio-147","subject":"Biology","unit":"4.3 Infection and response","topic":"Vaccination","q":"What is herd immunity?","a":"Enough of a population is vaccinated that disease cannot spread easily","w":["Everyone catches the disease once","Animals being vaccinated","Immunity passed on in milk"],"why":"It protects people who cannot be vaccinated."},{"id":"bio-148","subject":"Biology","unit":"4.3 Infection and response","topic":"Antibiotics and painkillers","q":"Antibiotics are effective against...","a":"Bacteria","w":["Viruses","Cancer cells","All pathogens"],"why":"Viruses live inside cells, so antibiotics do not work on them."},{"id":"bio-149","subject":"Biology","unit":"4.3 Infection and response","topic":"Antibiotics and painkillers","q":"Why is antibiotic resistance a problem?","a":"Resistant bacteria survive treatment and spread","w":["Antibiotics start to attack our own cells","Viruses evolve faster","Painkillers stop working"],"why":"Overuse of antibiotics increases resistance."},{"id":"bio-150","subject":"Biology","unit":"4.3 Infection and response","topic":"Discovery and development of drugs","q":"Penicillin was discovered from a...","a":"Mould (Penicillium)","w":["Foxglove plant","Willow bark","Bacterium"],"why":"Alexander Fleming noticed mould killing bacteria."},{"id":"bio-151","subject":"Biology","unit":"4.3 Infection and response","topic":"Discovery and development of drugs","q":"In a double-blind trial...","a":"Neither the doctors nor the patients know who gets the drug or placebo","w":["Only the patients know who has the drug","Two drugs are tested at once","The trial is done twice"],"why":"This avoids bias."},{"id":"bio-152","subject":"Biology","unit":"4.3 Infection and response","topic":"Discovery and development of drugs","q":"Digitalis, used for heart conditions, comes from...","a":"Foxglove","w":["Willow","Mould","Poppy"],"why":"Aspirin was originally from willow."},{"id":"bio-153","subject":"Biology","unit":"4.3 Infection and response","topic":"Monoclonal antibodies","q":"Monoclonal antibodies are...","a":"All identical and target one specific antigen","w":["Able to kill any pathogen","Made by red blood cells","Targeted at every antigen"],"why":"This makes them very specific."},{"id":"bio-154","subject":"Biology","unit":"4.3 Infection and response","topic":"Monoclonal antibodies","q":"A use of monoclonal antibodies is...","a":"Pregnancy tests","w":["Making vaccines from dead viruses","Replacing insulin","Testing for nitrate ions"],"why":"They also target cancer cells and detect pathogens."},{"id":"bio-155","subject":"Biology","unit":"4.3 Infection and response","topic":"Plant disease and defence","q":"Which mineral ion do plants need to make chlorophyll?","a":"Magnesium","w":["Sodium","Calcium","Chloride"],"why":"Lack of it causes chlorosis (yellow leaves)."},{"id":"bio-156","subject":"Biology","unit":"4.3 Infection and response","topic":"Plant disease and defence","q":"Which is a physical defence of plants against pathogens?","a":"Waxy cuticle and cellulose cell walls","w":["Producing antibodies","Phagocytosis","Stomach acid"],"why":"Plants also use chemical defences such as poisons."},{"id":"bio-157","subject":"Biology","unit":"4.4 Bioenergetics","topic":"Photosynthesis reaction","q":"What is the word equation for photosynthesis?","a":"Carbon dioxide + water -> glucose + oxygen","w":["Glucose + oxygen -> carbon dioxide + water","Glucose + water -> carbon dioxide + oxygen","Carbon dioxide + oxygen -> glucose + water"],"why":"Light energy is absorbed by chlorophyll."},{"id":"bio-158","subject":"Biology","unit":"4.4 Bioenergetics","topic":"Photosynthesis reaction","q":"Photosynthesis is an ___ reaction.","a":"Endothermic","w":["Exothermic","Combustion","Neutralisation"],"why":"It takes in energy from sunlight."},{"id":"bio-159","subject":"Biology","unit":"4.4 Bioenergetics","topic":"Rate of photosynthesis","q":"Which is NOT a limiting factor of photosynthesis?","a":"Amount of oxygen in the air","w":["Light intensity","Carbon dioxide concentration","Temperature"],"why":"Oxygen is a product, not a limiting factor."},{"id":"bio-160","subject":"Biology","unit":"4.4 Bioenergetics","topic":"Rate of photosynthesis","q":"If a lamp is moved to double the distance from pondweed, light intensity becomes...","a":"One quarter","w":["Half","Double","One eighth"],"why":"Inverse square law: intensity is proportional to 1/d squared."},{"id":"bio-161","subject":"Biology","unit":"4.4 Bioenergetics","topic":"Uses of glucose from photosynthesis","q":"Plants store glucose mainly as...","a":"Starch","w":["Glycogen","Cellulose","Protein"],"why":"Cellulose is used to build cell walls."},{"id":"bio-162","subject":"Biology","unit":"4.4 Bioenergetics","topic":"Uses of glucose from photosynthesis","q":"Glucose is used to make which cell wall material?","a":"Cellulose","w":["Starch","Chlorophyll","Lipase"],"why":"Glucose can also be converted to lipids and amino d":"bio-169","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"The nervous system","q":"What is the correct order of a reflex arc?","a":"Receptor, sensory neurone, relay neurone, motor neurone, effector","w":["Receptor, motor neurone, relay neurone, sensory neurone, effector","Effector, relay neurone, receptor","Receptor, brain, effector, sensory neurone"],"why":"Reflexes are fast and automatic."},{"id":"bio-170","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"The nervous system","q":"A reflex action is...","a":"Automatic and rapid, protecting the body from harm","w":["Slow and deliberate","Controlled by the conscious brain","Learned through practice"],"why":"The impulse bypasses the conscious brain."},{"id":"bio-171","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"The brain","q":"Which part of the brain controls balance and coordination?","a":"Cerebellum","w":["Cerebral cortex","Medulla","Pituitary"],"why":"The cerebral cortex handles consciousness, memory and language."},{"id":"bio-172","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"The brain","q":"The medulla controls...","a":"Unconscious activities such as heart rate and breathing","w":["Language","Memory","Vision"],"why":"It is at the base of the brain."},{"id":"bio-173","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"The eye","q":"Which part of the eye focuses light onto the retina?","a":"Lens","w":["Iris","Optic nerve","Pupil"],"why":"The cornea also refracts light."},{"id":"bio-174","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"The eye","q":"In bright light, the pupil...","a":"Gets smaller","w":["Gets larger","Stays the same","Closes completely"],"why":"Circular muscles of the iris contract."},{"id":"bio-175","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"The eye","q":"Short sight (myopia) is corrected using...","a":"A concave lens","w":["A convex lens","A prism","A frosted lens"],"why":"The image is focused in front of the retina."},{"id":"bio-176","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"Control of body temperature","q":"What monitors body temperature in the brain?","a":"The thermoregulatory centre","w":["The cerebellum","The retina","The pancreas"],"why":"It receives signals from temperature receptors."},{"id":"bio-177","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"Control of body temperature","q":"When you are too hot, blood vessels near the skin...","a":"Dilate (vasodilation)","w":["Constrict","Grow new capillaries","Close completely"],"why":"More blood near the surface means more heat loss."},{"id":"bio-178","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"Human endocrine system","q":"Which gland is the master gland?","a":"Pituitary","w":["Thyroid","Pancreas","Adrenal"],"why":"It releases hormones that control other glands."},{"id":"bio-179","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"Human endocrine system","q":"Compared with nervous responses, hormonal responses are...","a":"Slower and longer lasting","w":["Faster and shorter","The same speed","Only for muscles"],"why":"Hormones travel in the blood."},{"id":"bio-180","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"Control of blood glucose","q":"Which hormone lowers blood glucose?","a":"Insulin","w":["Glucagon","Adrenaline","Thyroxine"],"why":"Insulin makes cells take up glucose. The liver stores it as glycogen."},{"id":"bio-181","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"Control of blood glucose","q":"In type 1 diabetes...","a":"The pancreas does not produce enough insulin","w":["Body cells stop responding to insulin","The liver makes too much insulin","The person eats too much salt"],"why":"It is treated with insulin injections."},{"id":"bio-182","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"Control of blood glucose","q":"Glucagon causes the liver to...","a":"Convert glycogen into glucose","w":["Store glucose as glycogen","Make insulin","Remove glucose in urine"],"why":"This raises blood glucose."},{"id":"bio-183","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"Maintaining water and nitrogen balance","q":"Which organ filters urea from the blood?","a":"Kidney","w":["Liver","Bladder","Pancreas"],"why":"The liver makes urea from excess amino acids."},{"id":"bio-184","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"Maintaining water and nitrogen balance","q":"ADH is released when blood is too...","a":"Concentrated (low in water)","w":["Dilute","Warm","High in glucose"],"why":"ADH makes the kidney reabsorb more water."},{"id":"bio-185","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"Hormones in human reproduction","q":"Which hormone triggers ovulation?","a":"LH","w":["FSH","Progesterone","Testosterone"],"why":"FSH makes an egg mature."},{"id":"bio-186","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"Hormones in human reproduction","q":"Which hormone causes an egg to mature in the ovary?","a":"FSH","w":["LH","Progesterone","Insulin"],"why":"Oestrogen is released by the ovary and inhibits FSH."},{"id":"bio-187","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"Contraception","q":"Which method protects against sexually transmitted infections?","a":"Condom","w":["Contraceptive pill","Implant","Intrauterine device (IUD)"],"why":"Barrier methods also prevent pregnancy."},{"id":"bio-188","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"Contraception","q":"Oral contraceptive pills work by...","a":"Stopping eggs being released using hormones","w":["Killing sperm chemically","Blocking the sperm duct","Removing the uterus lining"],"why":"They contain oestrogen and/or progesterone."},{"id":"bio-189","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"Using hormones to treat infertility","q":"What is IVF?","a":"Fertilising eggs outside the body and returning embryos to the uterus","w":["Injecting sperm into the fallopian tube only","Removing the uterus","Transferring unfertilised eggs to another woman"],"why":"It is treatment for infertility."},{"id":"bio-190","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"Using hormones to treat infertility","q":"Which hormones are used as fertility drugs?","a":"FSH and LH","w":["Insulin and glucagon","Testosterone","Adrenaline and thyroxine"],"why":"They stimulate egg maturation and release."},{"id":"bio-191","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"Negative feedback (thyroxine and adrenaline)","q":"Adrenaline prepares the body for...","a":"Fight or flight","w":["Sleep","Digestion","Growth"],"why":"It increases heart rate and blood glucose."},{"id":"bio-192","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"Negative feedback (thyroxine and adrenaline)","q":"Thyroxine controls...","a":"Metabolic rate","w":["Blood glucose","Water balance","Ovulation"],"why":"It is controlled by negative feedback."},{"id":"bio-193","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"Plant hormones","q":"How does auxin make a shoot grow towards light?","a":"It builds up on the shaded side, making cells there elongate","w":["It builds up on the lit side","It kills cells on the shaded side","It stops all growth"],"why":"Uneven growth bends the shoot towards the light."},{"id":"bio-194","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"Plant hormones","q":"Growth of a root in response to gravity is called...","a":"Gravitropism (geotropism)","w":["Phototropism","Transpiration","Translocation"],"why":"Roots grow downwards."},{"id":"bio-195","subject":"Biology","unit":"4.5 Homeostasis and response","topic":"Use of plant hormones","q":"Ethene is used commercially to...","a":"Ripen fruit","w":["Kill weeds","Grow roots from cuttings","Stop seeds iation and evolution","topic":"DNA structure and protein synthesis","q":"A group of three bases codes for...","a":"One amino acid","w":["One protein","One gene","One chromosome"],"why":"Amino acid order determines the protein."},{"id":"bio-203","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Genetic inheritance","q":"An organism with two different alleles for a gene is...","a":"Heterozygous","w":["Homozygous","Recessive","Dominant"],"why":"Homozygous means two identical alleles."},{"id":"bio-204","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Genetic inheritance","q":"Cross Bb x Bb (B is dominant). What is the probability of a bb offspring?","a":"25%","w":["50%","75%","0%"],"why":"The Punnett square gives BB, Bb, Bb, bb."},{"id":"bio-205","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Genetic inheritance","q":"A genotype is...","a":"The combination of alleles an organism has","w":["The physical appearance","The number of chromosomes","The dominant allele only"],"why":"Appearance is the phenotype."},{"id":"bio-206","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Inherited disorders","q":"Cystic fibrosis is caused by...","a":"A recessive allele","w":["A dominant allele","An infection","An extra chromosome"],"why":"A child must inherit the allele from both parents."},{"id":"bio-207","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Inherited disorders","q":"Polydactyly is caused by...","a":"A dominant allele","w":["A recessive allele","A virus","An extra chromosome"],"why":"It results in extra fingers or toes."},{"id":"bio-208","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Sex determination","q":"Which sex chromosomes do females have?","a":"XX","w":["XY","XXY","YY"],"why":"Males are XY."},{"id":"bio-209","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Sex determination","q":"What is the chance a baby is male?","a":"50%","w":["25%","75%","100%"],"why":"Half of sperm carry X and half carry Y."},{"id":"bio-210","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Variation","q":"Which is a variation caused by the environment?","a":"A scar on an arm","w":["Blood group","Eye colour","Type of ear lobe"],"why":"Many features are a mixture of genes and environment."},{"id":"bio-211","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Variation","q":"New alleles arise from...","a":"Mutations","w":["Fertilisation","Mitosis of identical cells","Meiosis only"],"why":"Most mutations have no effect on the phenotype."},{"id":"bio-212","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Evolution by natural selection","q":"Natural selection favours individuals that...","a":"Are best adapted, so survive and breed more","w":["Are the biggest","Try hardest to change","Live longest regardless of breeding"],"why":"Beneficial alleles are passed on more often."},{"id":"bio-213","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Evolution by natural selection","q":"Evolution occurs when...","a":"A species changes over time through natural selection","w":["An individual changes during its life","A species stays the same","A population gets larger"],"why":"It takes many generations."},{"id":"bio-214","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Selective breeding","q":"Selective breeding is...","a":"Choosing parents with desired characteristics to breed together","w":["Adding genes from another species","Cloning an adult","Breeding randomly"],"why":"It is used for crops and animals."},{"id":"bio-215","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Selective breeding","q":"A risk of selective breeding is...","a":"Inbreeding, leading to inherited defects","w":["Faster evolution","Increased genetic variation","Losing all desirable traits immediately"],"why":"It reduces the gene pool."},{"id":"bio-216","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Genetic engineering","q":"Genetic engineering involves...","a":"Transferring a gene from one organism into another","w":["Breeding two varieties together","Growing cells on agar","Removing an embryo"],"why":"It can be used to make crops resistant to pests."},{"id":"bio-217","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Genetic engineering","q":"Bacteria producing human insulin is an example of...","a":"Genetic engineering","w":["Selective breeding","Cloning","Natural selection"],"why":"Bacteria carry the human insulin gene."},{"id":"bio-218","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Cloning","q":"In adult cell cloning, an adult body cell nucleus is transferred into...","a":"An egg cell with its nucleus removed","w":["A sperm cell","A red blood cell","A stem cell with its nucleus"],"why":"The embryo is then implanted into a surrogate."},{"id":"bio-219","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Cloning","q":"Taking cuttings is a form of cloning in...","a":"Plants","w":["Humans","Insects","Fish"],"why":"It gives genetically identical plants."},{"id":"bio-220","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Theories of evolution","q":"Lamarck suggested that...","a":"Characteristics acquired during life are passed on","w":["Species evolve by natural selection","Genes are inherited by dominant/recessive patterns","Evolution does not happen"],"why":"Darwin proposed natural selection."},{"id":"bio-221","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Theories of evolution","q":"Why was Darwin's theory not accepted immediately?","a":"There was limited evidence and it conflicted with religious views","w":["He had made no observations","DNA disproved it","It was never published"],"why":"The mechanism of inheritance was not yet understood."},{"id":"bio-222","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Speciation","q":"Speciation occurs when...","a":"Populations become so different they can no longer interbreed","w":["A species goes extinct","Two species merge","A single mutation happens"],"why":"Isolation can cause new species to form."},{"id":"bio-223","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Speciation","q":"Which scientist independently developed a theory of natural selection?","a":"Alfred Russel Wallace","w":["Charles Lyell","Gregor Mendel","Louis Pasteur"],"why":"Wallace studied island populations."},{"id":"bio-224","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Evidence for evolution","q":"Fossils are...","a":"Remains of organisms preserved in rock","w":["Recently dead organisms","DNA extracted from mud","Living relatives"],"why":"Fossils show how organisms changed."},{"id":"bio-225","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Evidence for evolution","q":"MRSA is an example of...","a":"Evolution of antibiotic resistance in bacteria","w":["A virus mutating","An extinct species","A genetically engineered crop"],"why":"Resistant bacteria survive and reproduce."},{"id":"bio-226","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Classification","q":"In binomial naming (e.g. Homo sapiens), the first word is the...","a":"Genus","w":["Species","Family","Kingdom"],"why":"The second word is the species."},{"id":"bio-227","subject":"Biology","unit":"4.6 Inheritance, variation and evolution","topic":"Classification","q":"The three-domain system includes...","a":"Archaea, Bacteria and Eukaryota","w":["Plants, animals and fungi","Kingdom, phylum and class","Vertebrates, invertebrates and plants"],"why":"It was proposed by Carl Woese."},{"id":"bio-228","subject":"Biology","unit":"4.7 Ecology","topic":"Communities and interdependence","q":"An ecosystem is...","a":"A community of organisms interacting with the non-living parts of their environment","w":["All members of one species in an area","A single food chain","A habitat only"],"why":"It includes biotic and abiotic factors."},{"id":"bio-229","subject":"Biology","unit":"4.7 Ecology","topic":"Communities and interdependence","q":"Which is an abiotic factor?","a":"Temperature","w":["Predation","Competition for food","Disease"],"why":"Abiotic factors are non-living."},{"id":"bio-230","subject":"Biology","unit":"4.7 Ecology","topic":"Adaptations","q":"A camel's large feet are which type of adaptation?","a":"Structural","w":["Behavioural","Functional","Genetic"],"why":"Structural adaptations are features of body shape or structure."},{"id":"bio-231","subject":"Biology","unit":"4.7 Ecology","topic":"Adaptations","q":"Extremophiles are organisms that...","a":"Live in extreme conditions such as high temperature or salt concentration","w":["Only live in deserts","Are extinct","Are all bacteria"],"why":"Some live in hot springs and deep-sea vents."},{"id":"bio-232","subject":"Biology","unit":"4.7 Ecology","topic":"Sampling and distribution","q":"To estimate the population of daisies on a field, you should...","a":"Use randomly placed quadrats and scale up","w":["Count all in one corner","Use a transect only along a path","Count only the biggest plants"],"why":"Random sampling avoids bias."},{"id":"bio-233","subject":"Biology","unit":"4.7 Ecology","topic":"Sampling and distribution","q":"A transect is used to...","a":"Investigate how distribution changes along a gradient","w":["Estimate total population from random samples only","Measure soil pH only","Catch moving animals"],"why":"Use quadrats at regular intervals along the line."},{"id":"bio-234","subject":"Biology","unit":"4.7 Ecology","topic":"Cycling of materials","q":"Which process removes CO2 from the atmosphere?","a":"Photosynthesis","w":["Respiration","Combustion","Decay"],"why":"Respiration and combustion release it."},{"id":"bio-235","subject":"Biology","unit":"4.7 Ecology","topic":"Cycling of materials","q":"In the water cycle, water vapour cooling to form liquid is...","a":"Condensation","w":["Evaporation","Precipitation","Transpiration"],"why":"Rain then falls as precipitation."},{"id":"bio-236","subject":"Biology","unit":"4.7 Ecology","topic":"Decomposition","q":"Decay is fastest when it is...","a":"Warm and moist with plenty of oxygen","w":["Cold and dry","Very hot","Waterlogged with no oxygen"],"why":"Decomposers work best in these conditions."},{"id":"bio-237","subject":"Biology","unit":"4.7 Ecology","topic":"Decomposition","q":"Biogas is mainly...","a":"Methane","w":["Carbon monoxide","Hydrogen","Ethene"],"why":"It is produced by anaerobic decay."},{"id":"bio-238","subject":"Biology","unit":"4.7 Ecology","topic":"Impact of environmental change","q":"A change in species distribution caused by rising temperature is...","a":"Species moving to cooler areas","w":["A new predator arriving","Improved crop yields","Population growth from vaccination"],"why":"Environmental change affects where organisms can live."},{"id":"bio-239","subject":"Biology","unit":"4.7 Ecology","topic":"Biodiversity and human impact","q":"Biodiversity means...","a":"The variety of living organisms in an ecosystem","w":["The number of one species","The size of an ecosystem","The amount of biomass"],"why":"High biodiversity makes ecosystems more stable."},{"id":"bio-240","subject":"Biology","unit":"4.7 Ecology","topic":"Biodiversity and human impact","q":"Which is a cause of water pollution?","a":"Fertiliser and sewage run-off","w":["Planting trees","Recycling","Composting"],"why":"It can cause eutrophication."},{"id":"bio-241","subject":"Biology","unit":"4.7 Ecology","topic":"Land use and deforestation","q":"Destroying peat bogs releases...","a":"Carbon dioxide","w":["Oxygen","Nitrogen","Hydrogen"],"why":"Peat stores a lot of carbon."},{"id":"bio-242","subject":"Biology","unit":"4.7 Ecology","topic":"Land use and deforestation","q":"A reason for deforestation is...","a":"Clearing land for farming","w":["Increasing biodiversity","Absorbing carbon dioxide","Reducing methane"],"why":"It reduces CO2 uptake and biodiversity."},{"id":"bio-243","subject":"Biology","unit":"4.7 Ecology","topic":"Global warming","q":"Which is a greenhouse gas?","a":"Methane","w":["Oxygen","Nitrogen","Argon"],"why":"Carbon dioxide and methane trap heat."},{"id":"bio-244","subject":"Biology","unit":"4.7 Ecology","topic":"Global warming","q":"A biological consequence of global warming is...","a":"Loss of habitats and changes in species distribution","w":["Fewer wildfires","More biodiversity in polar regions","Increased sea ice"],"why":"Sea levels also rise."},{"id":"bio-245","subject":"Biology","unit":"4.7 Ecology","topic":"Maintaining biodiversity","q":"Which helps maintain biodiversity?","a":"Breeding programmes for endangered species","w":["Clearing forests","Draining wetlands","Using more monocultures"],"why":"Conservation and rewilding also help."},{"id":"bio-246","subject":"Biology","unit":"4.7 Ecology","topic":"Trophic levels and biomass","q":"In grass, rabbit, fox, the rabbit is the...","a":"Primary consumer","w":["Producer","Secondary consumer","Decomposer"],"why":"The fox is the secondary consumer."},{"id":"bio-247","subject":"Biology","unit":"4.7 Ecology","topic":"Trophic levels and biomass","q":"1000 kJ enters one trophic level and 100 kJ reaches the next. What is the efficiency?","a":"10%","w":["1%","90%","100%"],"why":"Efficiency = transferred / supplied x 100."},{"id":"bio-248","subject":"Biology","unit":"4.7 Ecology","topic":"Food security and farming","q":"Mycoprotein is produced from...","a":"A fungus","w":["A bacterium","Soya beans","Algae"],"why":"Quorn is an example."},{"id":"bio-249","subject":"Biology","unit":"4.7 Ecology","t
