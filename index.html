e it."},{"id":"phys-111","subject":"Physics","unit":"6.4 Atomic structure","topic":"Radioactive decay and nuclear radiation","q":"An alpha particle is...","a":"Two protons and two neutrons","w":["A fast-moving electron","A high-energy electromagnetic wave","A single neutron"],"why":"Alpha decay reduces the mass number by 4 and the atomic number by 2."},{"id":"phys-112","subject":"Physics","unit":"6.4 Atomic structure","topic":"Radioactive decay and nuclear radiation","q":"A beta particle is...","a":"A fast-moving electron emitted from the nucleus","w":["A helium nucleus","An electromagnetic wave","A proton"],"why":"A neutron turns into a proton."},{"id":"phys-113","subject":"Physics","unit":"6.4 Atomic structure","topic":"Half-life","q":"What is the half-life of a radioactive isotope?","a":"The time for the activity (or number of nuclei) to halve","w":["The time for the isotope to decay completely","Half the time it takes to be safe","The time for the mass to double"],"why":"It cannot be changed by temperature or pressure."},{"id":"phys-114","subject":"Physics","unit":"6.4 Atomic structure","topic":"Half-life","q":"A sample has an activity of 800 Bq and a half-life of 2 hours. What is its activity after 6 hours?","a":"100 Bq","w":["400 Bq","200 Bq","0 Bq"],"why":"Three half-lives: 800 to 400 to 200 to 100."},{"id":"phys-115","subject":"Physics","unit":"6.4 Atomic structure","topic":"Hazards and uses of radiation; contamination and irradiation","q":"Irradiation is...","a":"Exposure to radiation from a source outside the body","w":["Radioactive atoms getting on or into the body","A source becoming radioactive","A reduction in radioactivity"],"why":"Contamination is when radioactive atoms get on or in an object."},{"id":"phys-116","subject":"Physics","unit":"6.4 Atomic structure","topic":"Hazards and uses of radiation; contamination and irradiation","q":"Which is best for a medical tracer injected into the body?","a":"A gamma emitter with a short half-life","w":["An alpha emitter with a long half-life","A beta emitter with a long half-life","An alpha emitter with a short half-life"],"why":"Gamma can leave the body and a short half-life limits the dose."},{"id":"phys-117","subject":"Physics","unit":"6.4 Atomic structure","topic":"Background radiation and half-life uses","q":"What is the largest source of natural background radiation in the UK?","a":"Radon gas from rocks","w":["Cosmic rays","Nuclear power stations","Medical X-rays"],"why":"Radon is released from certain rocks."},{"id":"phys-118","subject":"Physics","unit":"6.4 Atomic structure","topic":"Background radiation and half-life uses","q":"Carbon-14 dating can be used to date...","a":"Once-living material","w":["Any rock","Metals","Plastic"],"why":"Living things take in carbon-14. It decays after death."},{"id":"phys-119","subject":"Physics","unit":"6.4 Atomic structure","topic":"Nuclear fission and fusion","q":"Nuclear fission is...","a":"The splitting of a large, unstable nucleus","w":["The joining of two light nuclei","The decay of an electron","The emission of a gamma ray only"],"why":"It releases energy and neutrons."},{"id":"phys-120","subject":"Physics","unit":"6.4 Atomic structure","topic":"Nuclear fission and fusion","q":"Nuclear fusion is...","a":"The joining of two light nuclei to form a heavier nucleus","w":["The splitting of a heavy nucleus","The absorption of neutrons","Radioactive decay"],"why":"It powers the Sun."},{"id":"phys-121","subject":"Physics","unit":"6.4 Atomic structure","topic":"Nuclear fission and fusion","q":"In a nuclear reactor, the chain reaction is controlled by...","a":"Control rods that absorb neutrons","w":["Moderator water flowing faster","Adding more uranium","Heating the reactor"],"why":"The moderator slows neutrons down."},{"id":"phys-122","subject":"Physics","unit":"6.5 Forces","topic":"Scalar and vector quantities","q":"Which of these is a vector quantity?","a":"Velocity","w":["Speed","Mass","Time"],"why":"Vectors have magnitude and direction."},{"id":"phys-123","subject":"Physics","unit":"6.5 Forces","topic":"Scalar and vector quantities","q":"Which of these is a scalar quantity?","a":"Speed","w":["Velocity","Displacement","Force"],"why":"Scalars only have magnitude."},{"id":"phys-124","subject":"Physics","unit":"6.5 Forces","topic":"Contact and non-contact forces; gravity","q":"Which of these is a non-contact force?","a":"Gravity","w":["Friction","Tension","Air resistance"],"why":"Magnetic and electrostatic forces are also non-contact."},{"id":"phys-125","subject":"Physics","unit":"6.5 Forces","topic":"Contact and non-contact forces; gravity","q":"What is the weight of a 5 kg mass? (g = 10 N/kg)","a":"50 N","w":["5 N","0.5 N","15 N"],"why":"W = m x g."},{"id":"phys-126","subject":"Physics","unit":"6.5 Forces","topic":"Resultant forces","q":"A force of 10 N acts right and 4 N acts left. What is the resultant force?","a":"6 N to the right","w":["14 N to the right","6 N to the left","40 N"],"why":"Subtract forces acting in opposite directions."},{"id":"phys-127","subject":"Physics","unit":"6.5 Forces","topic":"Resultant forces","q":"A car travels at a constant velocity. The resultant force on it is...","a":"Zero","w":["In the direction of travel","Backwards","Increasing"],"why":"Balanced forces mean no acceleration."},{"id":"phys-128","subject":"Physics","unit":"6.5 Forces","topic":"Work done and energy transfer","q":"Work done is calculated as...","a":"Force multiplied by distance moved","w":["Force divided by distance","Mass multiplied by speed","Force multiplied by time"],"why":"1 joule is 1 newton-metre."},{"id":"phys-129","subject":"Physics","unit":"6.5 Forces","topic":"Work done and energy transfer","q":"A 20 N force pushes a box 3 m. How much work is done?","a":"60 J","w":["23 J","6.7 J","17 J"],"why":"W = F x s."},{"id":"phys-130","subject":"Physics","unit":"6.5 Forces","topic":"Forces and elasticity","q":"A spring with k = 20 N/m is stretched by 0.5 m. What force is needed?","a":"10 N","w":["40 N","20.5 N","2.5 N"],"why":"F = k x e."},{"id":"phys-131","subject":"Physics","unit":"6.5 Forces","topic":"Forces and elasticity","q":"The limit of proportionality is the point beyond which...","a":"Extension is no longer proportional to force","w":["The spring becomes shorter","The force is zero","The spring returns to its original length"],"why":"Beyond this point the graph curves."},{"id":"phys-132","subject":"Physics","unit":"6.5 Forces","topic":"Moments, levers and gears","q":"A moment is calculated as...","a":"Force multiplied by the perpendicular distance from the pivot","w":["Force divided by distance","Force multiplied by time","Mass multiplied by gravity"],"why":"Measured in newton-metres."},{"id":"phys-133","subject":"Physics","unit":"6.5 Forces","topic":"Moments, levers and gears","q":"A 20 N force acts 2 m to the left of a pivot. What force at 4 m to the right balances it?","a":"10 N","w":["5 N","20 N","40 N"],"why":"20 x 2 = 40 Nm, so F x 4 = 40."},{"id":"phys-134","subject":"Physics","unit":"6.5 Forces","topic":"Pressure in fluids","q":"Pressure is calculated as...","a":"Force divided by area","w":["Force multiplied by area","Area divided by force","Mass divided by volume"],"why":"Measured in pascals (N/m^2)."},{"id":"phys-135","subject":"Physics","unit":"6.5 Forces","topic":"Pressure in fluids","q":"As altitude increases, atmospheric pressure...","a":"Decreases","w":["Increases","Stays the same","Doubles"],"why":"There is less air above you."},{"id":"phys-136","subject":"Physics","unit":"6.5 Forces","topic":"Pressure in fluids","q":"A force of 200 N acts on an area of 4 m^2. What is the pressure?","a":"50 Pa","w":["800 Pa","204 Pa","0.02 Pa"],"why":"P = F / A."},{"id":"phys-137","subject":"Physics","unit":"6.5 Forces","topic":"Distance, displacement, speed and velocity","q":"What is the typical walking speed of a person?","a":"About 1.5 m/s","w":["About 15 m/s","About 0.15 m/s","About 150 m/s"],"why":"Running is about 3 m/s and cycling about 6 m/s."},{"id":"phys-138","subject":"Physics","unit":"6.5 Forces","topic":"Distance, displacement, speed and velocity","q":"A runner covers 100 m in 20 s. What is the average speed?","a":"5 m/s","w":["2000 m/s","0.2 m/s","120 m/s"],"why":"Speed = distance / time."},{"id":"phys-139","subject":"Physics","unit":"6.5 Forces","topic":"Acceleration","q":"A car accelerates from 0 to 20 m/s in 5 s. What is its acceleration?","a":"4 m/s^2","w":["100 m/s^2","25 m/s^2","0.25 m/s^2"],"why":"a = change in velocity / time."},{"id":"phys-140","subject":"Physics","unit":"6.5 Forces","topic":"Acceleration","q":"A skydiver reaches terminal velocity when...","a":"The resultant force is zero","w":["Air resistance is zero","Weight is zero","They stop moving"],"why":"Weight and air resistance are balanced."},{"id":"phys-141","subject":"Physics","unit":"6.5 Forces","topic":"Distance-time and velocity-time graphs","q":"On a distance-time graph, the gradient represents...","a":"Speed","w":["Acceleration","Distance travelled","Time"],"why":"A horizontal line means the object is stationary."},{"id":"phys-142","subject":"Physics","unit":"6.5 Forces","topic":"Distance-time and velocity-time graphs","q":"On a velocity-time graph, the area under the line represents...","a":"Distance travelled","w":["Acceleration","Speed","Force"],"why":"The gradient gives acceleration."},{"id":"phys-143","subject":"Physics","unit":"6.5 Forces","topic":"Newton's Laws of motion","q":"A 5 kg object accelerates at 2 m/s^2. What is the resultant force?","a":"10 N","w":["2.5 N","7 N","3 N"],"why":"F = m x a."},{"id":"phys-144","subject":"Physics","unit":"6.5 Forces","topic":"Newton's Laws of motion","q":"Newton's Third Law states that...","a":"Every force has an equal and opposite reaction force on a different object","w":["Force equals mass times acceleration","Objects at rest stay at rest","Energy is conserved"],"why":"The two forces act on different objects."},{"id":"phys-145","subject":"Physics","unit":"6.5 Forces","topic":"Newton's Laws of motion","q":"Newton's First Law states that an object with no resultant force...","a":"Stays at rest or keeps moving at constant velocity","w":["Always slows down","Always accelerates","Moves in a circle"],"why":"This is the idea of inertia."},{"id":"phys-146","subject":"Physics","unit":"6.5 Forces","topic":"Stopping distance","q":"Stopping distance is equal to...","a":"Thinking distance plus braking distance","w":["Braking distance minus thinking distance","Speed multiplied by time","Reaction time divided by speed"],"why":"Both parts increase with speed."},{"id":"phys-147","subject":"Physics","unit":"6.5 Forces","topic":"Stopping distance","q":"Which factor increases the thinking distance?","a":"Being tired or having taken alcohol","w":["Worn brakes","A wet road","Worn tyres"],"why":"Brakes, tyres and road condition affect braking distance."},{"id":"phys-148","subject":"Physics","unit":"6.5 Forces","topic":"Momentum","q":"What is the momentum of a 2 kg object moving at 3 m/s?","a":"6 kg m/s","w":["1.5 kg m/s","5 kg m/s","18 kg m/s"],"why":"p = m x v."},{"id":"phys-149","subject":"Physics","unit":"6.5 Forces","topic":"Momentum","q":"In a closed system, the total momentum before a collision is...","a":"Equal to the total momentum after","w":["Greater than after","Less than after","Always zero"],"why":"This is the conservation of momentum."},{"id":"rp-001","subject":"Required Practicals","unit":"Biology","topic":"RP1: Microscopy","q":"Which objective lens should you start with when using a light microscope?","a":"The lowest power lens","w":["The highest power lens","Whichever is clearest","The oil immersion lens"],"why":"Start low to find the specimen, then increase magnification."},{"id":"rp-002","subject":"Required Practicals","unit":"Biology","topic":"RP1: Microscopy","q":"Why is a cover slip lowered onto the slide at an angle?","a":"To avoid trapping air bubbles","w":["To squash the cells","To stain the cells","To keep the slide warm"],"why":"Air bubbles would hide the cells."},{"id":"rp-003","subject":"Required Practicals","unit":"Biology","topic":"RP1: Microscopy","q":"Why is a stain, such as iodine, added to a specimen?","a":"To make structures easier to see","w":["To kill bacteria","To magnify the image","To stop the cells moving"],"why":"Stain adds contrast."},{"id":"rp-004","subject":"Required Practicals","unit":"Biology","topic":"RP1: Microscopy","q":"Which focusing knob do you use first to bring the specimen into focus?","a":"The coarse focus","w":["The fine focus","The stage clips","The diaphragm"],"why":"Then use the fine focus to sharpen the image."},{"id":"rp-005","subject":"Required Practicals","unit":"Biology","topic":"RP1: Microscopy","q":"When drawing what you see through a microscope, what should you do?","a":"Use a sharp pencil, clear lines and no shading, and label the drawing","w":["Use coloured pens and shading","Draw only the nucleus","Draw as small as possible"],"why":"Include a title and the magnification."},{"id":"rp-006","subject":"Required Practicals","unit":"Biology","topic":"RP2: Microbiology (Triple only)","q":"Why is the inoculating loop passed through a flame before use?","a":"To sterilise it and kill unwanted microorganisms","w":["To make it cool","To make it stick to agar","To add nutrients"],"why":"It prevents contamination (aseptic technique)."},{"id":"rp-007","subject":"Required Practicals","unit":"Biology","topic":"RP2: Microbiology (Triple only)","q":"Why are school cultures incubated at about 25°C?","a":"To reduce the chance of growing harmful pathogens","w":["Because bacteria cannot grow at 37°C","To kill the bacteria","To speed up growth to the maximum"],"why":"Human pathogens grow best at about 37°C."},{"id":"rp-008","subject":"Required Practicals","unit":"Biology","topic":"RP2: Microbiology (Triple only)","q":"How can you tell which antibiotic is most effective on an agar plate?","a":"It has the largest clear zone around its disc","w":["It has the smallest clear zone","The agar turns green","There are the most bacteria"],"why":"Bacteria cannot grow in the clear zone."},{"id":"rp-009","subject":"Required Practicals","unit":"Biology","topic":"RP2: Microbiology (Triple only)","q":"What is the purpose of a control disc soaked in sterile water?","a":"To show that the clear zones are caused by the antibiotics, not the paper","w":["To feed the bacteria","To sterilise the plate","To mark the position of the antibiotic"],"why":"It gives a comparison with no antibiotic."},{"id":"rp-010","subject":"Required Practicals","unit":"Biology","topic":"RP2: Microbiology (Triple only)","q":"Why is the lid of the Petri dish taped on after inoculating?","a":"To stop microorganisms entering or escaping","w":["To keep the plate warm","To keep air out completely","To stop condensation"],"why":"Tape in two places only; the dish is not sealed completely."},{"id":"rp-011","subject":"Required Practicals","unit":"Biology","topic":"RP3: Osmosis","q":"In the potato osmosis experiment, what is the independent variable?","a":"The concentration of the sucrose solution","w":["The mass of the potato","The time","The temperature"],"why":"The dependent variable is the change in mass."},{"id":"rp-012","subject":"Required Practicals","unit":"Biology","topic":"RP3: Osmosis","q":"Why are the potato cylinders blotted with a paper towel before weighing?","a":"To remove excess liquid from the surface","w":["To warm them","To make them smaller","To stop osmosis"],"why":"Water on the surface would give a false mass."},{"id":"rp-013","subject":"Required Practicals","unit":"Biology","topic":"RP3: Osmosis","q":"Why is the percentage change in mass calculated rather than just the change in mass?","a":"The cylinders may have different starting masses","w":["It is quicker","It removes the need to weigh","It makes the graph steeper"],"why":"It allows a fair comparison."},{"id":"rp-014","subject":"Required Practicals","unit":"Biology","topic":"RP3: Osmosis","q":"What does the point where the graph crosses the x-axis (no change in mass) tell you?","a":"The concentration of the solution inside the potato cells","w":["The mass of the potato","The temperature","The rate of diffusion"],"why":"There is no net movement of water."},{"id":"rp-015","subject":"Required Practicals","unit":"Biology","topic":"RP3: Osmosis","q":"Name one control variable in the potato osmosis experiment.","a":"The size (surface area and length) of the potato cylinders","w":["The sucrose concentration","The mass change","The colour"],"why":"Also volume of solution, temperature and time."},{"id":"rp-016","subject":"Required Practicals","unit":"Biology","topic":"RP4: Food tests","q":"What colour does Benedict's solution turn with reducing sugar when heated?","a":"Brick red (via green, yellow and orange)","w":["Blue-black","Purple","Colourless"],"why":"Heat in a water bath."},{"id":"rp-017","subject":"Required Practicals","unit":"Biology","topic":"RP4: Food tests","q":"What colour does iodine solution turn when starch is present?","a":"Blue-black","w":["Brick red","Purple","Colourless"],"why":"It stays orange-brown if no starch."},{"id":"rp-018","subject":"Required Practicals","unit":"Biology","topic":"RP4: Food tests","q":"What colour does Biuret solution turn when protein is present?","a":"Purple (lilac)","w":["Brick red","Blue-black","Cloudy white"],"why":"It starts blue."},{"id":"rp-019","subject":"Required Practicals","unit":"Biology","topic":"RP4: Food tests","q":"Which test shows that lipids are present?","a":"Sudan III stain, which forms a red layer on top (or the ethanol emulsion test)","w":["Benedict's solution","Iodine solution","Biuret solution"],"why":"Lipids do not dissolve in water."},{"id":"rp-020","subject":"Required Practicals","unit":"Biology","topic":"RP4: Food tests","q":"Why must you wear eye protection when carrying out the Benedict's test?","a":"The solution is hot and can splash","w":["It is radioactive","It makes the eyes dry","The test gives off toxic gas"],"why":"Use a water bath and tongs."},{"id":"rp-021","subject":"Required Practicals","unit":"Biology","topic":"RP5: Enzymes","q":"In the amylase and pH experiment, what does it mean if iodine solution stays orange-brown?","a":"The starch has been broken down","w":["There is still starch","The enzyme has been denatured","The sample is too hot"],"why":"Amylase digests starch."},{"id":"rp-022","subject":"Required Practicals","unit":"Biology","topic":"RP5: Enzymes","q":"Why are buffer solutions used in the enzyme experiment?","a":"To keep the pH constant at each value","w":["To change the temperature","To speed up the enzyme","To add starch"],"why":"pH is the independent variable."},{"id":"rp-023","subject":"Required Practicals","unit":"Biology","topic":"RP5: Enzymes","q":"Why should the mixtures be kept in a water bath?","a":"To keep the temperature constant","w":["To change the pH","To dissolve the starch","To kill the enzyme"],"why":"Temperature is a control variable."},{"id":"rp-024","subject":"Required Practicals","unit":"Biology","topic":"RP5: Enzymes","q":"How can you calculate the rate of the reaction from the time taken for starch to disappear?","a":"Rate = 1 ÷ time","w":["Rate = time ÷ 1","Rate = time × 2","Rate = time − 1"],"why":"Shorter time means a faster rate."},{"id":"rp-025","subject":"Required Practicals","unit":"Biology","topic":"RP5: Enzymes","q":"Why are samples tested on a spotting tile at regular intervals?","a":"To find the time when the starch is all broken down","w":["To make a colour chart","To heat the enzyme","To stop the reaction"],"why":"Test every 30 seconds with iodine."},{"id":"rp-026","subject":"Required Practicals","unit":"Biology","topic":"RP6: Photosynthesis","q":"In the pondweed experiment, what is the independent variable when the lamp is moved?","a":"The distance of the lamp (light intensity)","w":["The number of bubbles","The temperature","The type of pondweed"],"why":"The dependent variable is the number of bubbles per minute."},{"id":"rp-027","subject":"Required Practicals","unit":"Biology","topic":"RP6: Photosynthesis","q":"What gas is given off as bubbles by pondweed during photosynthesis?","a":"Oxygen","w":["Carbon dioxide","Hydrogen","Nitrogen"],"why":"Oxygen is a product of photosynthesis."},{"id":"rp-028","subject":"Required Practicals","unit":"Biology","topic":"RP6: Photosynthesis","q":"Why is a beaker of water placed between the lamp and the pondweed?","a":"To absorb heat so the temperature stays constant","w":["To increase light intensity","To add carbon dioxide","To make bubbles larger"],"why":"Temperature is a control variable."},{"id":"rp-029","subject":"Required Practicals","unit":"Biology","topic":"RP6: Photosynthesis","q":"Why is sodium hydrogencarbonate added to the water?","a":"It provides carbon dioxide so it is not a limiting factor","w":["It adds oxygen","It reduces light","It kills bacteria"],"why":"Carbon dioxide is needed for photosynthesis."},{"id":"rp-030","subject":"Required Practicals","unit":"Biology","topic":"RP6: Photosynthesis","q":"How could the measurement of oxygen be made more accurate than counting bubbles?","a":"Collect the gas in a gas syringe or measuring tube and measure its volume","w":["Count the bubbles faster","Use a bigger lamp","Use more plants"],"why":"Bubbles vary in size."},{"id":"rp-031","subject":"Required Practicals","unit":"Biology","topic":"RP7: Reaction time","q":"In the ruler drop test, what is measured to find the reaction time?","a":"The distance the ruler falls before it is caught","w":["The time on a stopwatch","The weight of the ruler","The speed of the hand"],"why":"The distance is converted to a time."},{"id":"rp-032","subject":"Required Practicals","unit":"Biology","topic":"RP7: Reaction time","q":"Why should the test be repeated and a mean calculated?","a":"To reduce the effect of random errors","w":["To make the results bigger","To remove the need for a control","To change the variable"],"why":"More repeats improve reliability."},{"id":"rp-033","subject":"Required Practicals","unit":"Biology","topic":"RP7: Reaction time","q":"Name one control variable in a reaction-time investigation.","a":"The same person drops the ruler, and the same hand is used to catch it","w":["The distance the ruler falls","The person's age only","The result"],"why":"Keep everything else the same."},{"id":"rp-034","subject":"Required Practicals","unit":"Biology","topic":"RP7: Reaction time","q":"Which part of the nervous system processes the signal from the eyes to the hand in the ruler test?","a":"The brain and spinal cord (the CNS)","w":["The hormones","The muscles only","The sensory organs only"],"why":"Reaction time is the time between stimulus and response."},{"id":"rp-035","subject":"Required Practicals","unit":"Biology","topic":"RP8: Plant responses (Triple only)","q":"What is phototropism?","a":"Growth of a plant shoot towards light","w":["Growth of roots towards water","Growth away from gravity","Growth of leaves in the dark"],"why":"Shoots show positive phototropism."},{"id":"rp-036","subject":"Required Practicals","unit":"Biology","topic":"RP8: Plant responses (Triple only)","q":"Which plant hormone causes cells on the shaded side of a shoot to elongate?","a":"Auxin","w":["Insulin","Adrenaline","Chlorophyll"],"why":"Auxin moves to the shaded side."},{"id":"rp-037","subject":"Required Practicals","unit":"Biology","topic":"RP8: Plant responses (Triple only)","q":"What would be a suitable control in a phototropism experiment?","a":"Seedlings with light from all sides (or in the dark)","w":["Seedlings with light from one side only","No seedlings","Seedlings in the fridge"],"why":"The control shows growth without a one-sided stimulus."},{"id":"rp-038","subject":"Required Practicals","unit":"Biology","topic":"RP9: Field investigation","q":"Why should quadrats be placed randomly?","a":"To avoid bias in the results","w":["To save time","To find the most plants","To make results look neat"],"why":"Use random numbers as coordinates."},{"id":"rp-039","subject":"Required Practicals","unit":"Biology","topic":"RP9: Field investigation","q":"How can you estimate the population size of a plant in a field using quadrats?","a":"Mean number per quadrat ÷ quadrat area × total area","w":["Total number counted × 2","Highest count in any quadrat","Sum of all quadrat areas"],"why":"Use enough quadrats for a good estimate."},{"id":"rp-040","subject":"Required Practicals","unit":"Biology","topic":"RP9: Field investigation","q":"When would you use a transect instead of random quadrats?","a":"To investigate how a species changes along a gradient, such as away from a tree","w":["To count every plant","To avoid bias","To measure soil mass"],"why":"Place quadrats at regular intervals along a line."},{"id":"rp-041","subject":"Required Practicals","unit":"Biology","topic":"RP9: Field investigation","q":"Why should a large number of quadrats be used?","a":"To give more reliable, representative results","w":["To save time","To make the area look larger","To include rare species only"],"why":"Small samples may not be typical."},{"id":"rp-042","subject":"Required Practicals","unit":"Biology","topic":"RP9: Field investigation","q":"What could you use to measure light intensity in a field investigation?","a":"A light meter","w":["A pH probe","A thermometer","A metre ruler"],"why":"Other factors: soil pH, moisture and temperature."},{"id":"rp-043","subject":"Required Practicals","unit":"Biology","topic":"RP10: Rate of decay (Triple only)","q":"In the milk and lipase experiment, why does the indicator change colour?","a":"Fatty acids are produced and lower the pH","w":["The milk warms up","Lactose is made","Carbon dioxide forms"],"why":"Phenolphthalein turns from pink to colourless in acid."},{"id":"rp-044","subject":"Required Practicals","unit":"Biology","topic":"RP10: Rate of decay (Triple only)","q":"Why are water baths used in the decay experiment?","a":"To keep each reaction mixture at a fixed temperature","w":["To change the pH","To add enzyme","To make bubbles"],"why":"Temperature is the independent variable."},{"id":"rp-045","subject":"Required Practicals","unit":"Biology","topic":"RP10: Rate of decay (Triple only)","q":"What is measured in the milk and lipase decay practical?","a":"The time taken for the indicator to change colour","w":["The mass of milk","The volume of lipase","The number of bacteria"],"why":"Rate = 1 ÷ time."},{"id":"rp-046","subject":"Required Practicals","unit":"Chemistry","topic":"RP1: Making a soluble salt","q":"Why is excess copper oxide added to the acid?","a":"To make sure all the acid reacts","w":["To make the reaction cooler","To make the salt insoluble","To change the colour"],"why":"The unreacted solid is filtered off."},{"id":"rp-047","subject":"Required Practicals","unit":"Chemistry","topic":"RP1: Making a soluble salt","q":"How is the unreacted copper oxide removed from the mixture?","a":"Filtration","w":["Distillation","Chromatography","Evaporation"],"why":"The salt solution passes through the filter paper."},{"id":"rp-048","subject":"Required Practicals","unit":"Chemistry","topic":"RP1: Making a soluble salt","q":"Why is the solution not evaporated to dryness?","a":"Crystals form better when the solution is left to crystallise slowly from a saturated solution","w":["The acid would explode","The salt would burn","The filtrate would turn blue"],"why":"Heat to the point of crystallisation, then leave to cool."},{"id":"rp-049","subject":"Required Practicals","unit":"Chemistry","topic":"RP1: Making a soluble salt","q":"Why is the sulfuric acid warmed before adding copper oxide?","a":"To speed up the reaction","w":["To make it more concentrated","To neutralise it","To filter it"],"why":"Use a water bath, not a flame."},{"id":"rp-050","subject":"Required Practicals","unit":"Chemistry","topic":"RP2: Titration","q":"Which piece of equipment measures exactly 25.0 cm³ of alkali into the conical flask?","a":"A pipette","w":["A beaker","A burette","A measuring cylinder"],"why":"The burette adds the acid."},{"id":"rp-051","subject":"Required Practicals","unit":"Chemistry","topic":"RP2: Titration","q":"Why is a white tile placed under the conical flask?","a":"To make the colour change easier to see","w":["To keep the flask warm","To neutralise spills","To weigh the flask"],"why":"It improves the accuracy."},{"id":"rp-052","subject":"Required Practicals","unit":"Chemistry","topic":"RP2: Titration","q":"Why is the acid added drop by drop near the end-point?","a":"To avoid adding too much","w":["To make the reaction faster","To save acid","To mix the indicator"],"why":"A single drop can change the colour."},{"id":"rp-053","subject":"Required Practicals","unit":"Chemistry","topic":"RP2: Titration","q":"What colour is methyl orange in an alkali?","a":"Yellow","w":["Red","Orange","Colourless"],"why":"It is red in acid and orange at the end-point."},{"id":"rp-054","subject":"Required Practicals","unit":"Chemistry","topic":"RP2: Titration","q":"What are concordant results?","a":"Results that agree to within 0.10 cm³","w":["Results that are identical","Results that are too high","Results that use different indicators"],"why":"Take a mean of the concordant results only."},{"id":"rp-055","subject":"Required Practicals","unit":"Chemistry","topic":"RP3: Electrolysis","q":"What is the test for hydrogen gas?","a":"A lit splint makes a squeaky pop","w":["A glowing splint relights","Damp litmus paper is bleached","Limewater turns cloudy"],"why":"Hydrogen forms at the cathode in most aqueous solutions."},{"id":"rp-056","subject":"Required Practicals","unit":"Chemistry","topic":"RP3: Electrolysis","q":"What is the test for oxygen gas?","a":"A glowing splint relights","w":["A lit splint makes a squeaky pop","Damp litmus paper is bleached","Limewater turns milky"],"why":"Oxygen forms at the anode when no halide is present."},{"id":"rp-057","subject":"Required Practicals","unit":"Chemistry","topic":"RP3: Electrolysis","q":"What is the test for chlorine gas?","a":"It bleaches damp litmus paper","w":["It relights a glowing splint","It makes a squeaky pop","It turns limewater cloudy"],"why":"Chlorine forms at the anode from chloride solutions."},{"id":"rp-058","subject":"Required Practicals","unit":"Chemistry","topic":"RP3: Electrolysis","q":"Why are inert (graphite) electrodes used in electrolysis of solutions?","a":"They do not react with the products","w":["They are cheaper","They melt easily","They are magnetic"],"why":"Reactive electrodes would take part in the reaction."},{"id":"rp-059","subject":"Required Practicals","unit":"Chemistry","topic":"RP4: Temperature changes","q":"Why is a polystyrene cup used in a temperature change experiment?","a":"It is a good insulator and reduces energy loss to the surroundings","w":["It is a conductor","It reacts with acids","It is transparent"],"why":"A lid reduces losses further."},{"id":"rp-060","subject":"Required Practicals","unit":"Chemistry","topic":"RP4: Temperature changes","q":"Why is the mixture stirred?","a":"To make sure the temperature is even throughout","w":["To make it react faster only","To mix in air","To stop the reaction"],"why":"The thermometer then gives a reliable reading."},{"id":"rp-061","subject":"Required Practicals","unit":"Chemistry","topic":"RP4: Temperature changes","q":"What do you record in a neutralisation temperature change experiment?","a":"The highest temperature reached","w":["The final volume","The starting pH","The time only"],"why":"The temperature change shows how much energy was released."},{"id":"rp-062","subject":"Required Practicals","unit":"Chemistry","topic":"RP5: Rates of reaction","q":"In the sodium thiosulfate and acid reaction, why does the solution turn cloudy?","a":"Solid sulfur forms","w":["Carbon dioxide forms","Hydrogen forms","The acid is neutralised"],"why":"The cross disappears from view."},{"id":"rp-063","subject":"Required Practicals","unit":"Chemistry","topic":"RP5: Rates of reaction","q":"How do you calculate the rate in the disappearing cross experiment?","a":"Rate = 1 ÷ time taken for the cross to disappear","w":["Rate = time × 2","Rate = mass ÷ time","Rate = volume × time"],"why":"A shorter time means a faster rate."},{"id":"rp-064","subject":"Required Practicals","unit":"Chemistry","topic":"RP5: Rates of reaction","q":"What happens to the rate of reaction if the concentration of a reactant is increased?","a":"It increases, because there are more frequent collisions","w":["It decreases","It stays the same","It stops"],"why":"More particles per volume."},{"id":"rp-065","subject":"Required Practicals","unit":"Chemistry","topic":"RP5: Rates of reaction","q":"What can be used to measure the rate when a gas is produced?","a":"A gas syringe, collecting the volume in a set time","w":["A thermometer only","A filter paper","A burette"],"why":"Or measure the loss of mass on a balance."},{"id":"rp-066","subject":"Required Practicals","unit":"Chemistry","topic":"RP6: Chromatography","q":"Why is the start line drawn in pencil rather than pen?","a":"Pencil does not dissolve in the solvent","w":["Pencil is darker","Pen runs faster","Pencil dries quicker"],"why":"Ink would run up the paper."},{"id":"rp-067","subject":"Required Practicals","unit":"Chemistry","topic":"RP6: Chromatography","q":"Why must the start line be above the level of the solvent?","a":"So the samples don't dissolve into the solvent","w":["To keep the paper dry","To slow the solvent","To make larger spots"],"why":"The solvent rises up the paper."},{"id":"rp-068","subject":"Required Practicals","unit":"Chemistry","topic":"RP6: Chromatography","q":"A spot travels 3 cm while the solvent travels 6 cm. What is the Rf value?","a":"0.5","w":["2","18","0.3"],"why":"Rf = distance moved by spot ÷ distance moved by solvent."},{"id":"rp-069","subject":"Required Practicals","unit":"Chemistry","topic":"RP6: Chromatography","q":"What does a single spot on a chromatogram suggest?","a":"The substance is probably pure","w":["It is a mixture","It has a high Rf","It contains ink"],"why":"A mixture gives more than one spot."},{"id":"rp-070","subject":"Required Practicals","unit":"Chemistry","topic":"RP7: Identifying ions (Triple only)","q":"What colour is a sodium flame test?","a":"Yellow","w":["Lilac","Crimson","Green"],"why":"Potassium is lilac, lithium crimson, calcium orange-red, copper green."},{"id":"rp-071","subject":"Required Practicals","unit":"Chemistry","topic":"RP7: Identifying ions (Triple only)","q":"What colour is a potassium flame test?","a":"Lilac","w":["Yellow","Orange-red","Green"],"why":"Use a clean wire loop."},{"id":"rp-072","subject":"Required Practicals","unit":"Chemistry","topic":"RP7: Identifying ions (Triple only)","q":"What colour precipitate forms when sodium hydroxide is added to copper(II) ions?","a":"Blue","w":["Green","Brown","White"],"why":"Iron(II) is green and iron(III) is brown."},{"id":"rp-073","subject":"Required Practicals","unit":"Chemistry","topic":"RP7: Identifying ions (Triple only)","q":"Which test shows that a solution contains sulfate ions?","a":"Add dilute hydrochloric acid, then barium chloride: a white precipitate forms","w":["Add silver nitrate: a cream precipitate","Add limewater","Add sodium hydroxide: a blue precipitate"],"why":"The acid removes carbonate ions first."},{"id":"rp-074","subject":"Required Practicals","unit":"Chemistry","topic":"RP7: Identifying ions (Triple only)","q":"What colour precipitate does silver nitrate give with chloride ions?","a":"White","w":["Cream","Yellow","Blue"],"why":"Bromide gives cream and iodide gives yellow."},{"id":"rp-075","subject":"Required Practicals","unit":"Chemistry","topic":"RP8: Water purification (Triple only)","q":"What is removed from salty water by distillation?","a":"The dissolved salt (water is boiled off and condensed)","w":["The water","The sodium ions only","The colour"],"why":"The pure water is collected in the condenser."},{"id":"rp-076","subject":"Required Practicals","unit":"Chemistry","topic":"RP8: Water purification (Triple only)","q":"How can you test whether distilled water is pure?","a":"It boils at exactly 100°C and leaves no residue when evaporated","w":["It turns blue","It has a pH of 10","It conducts electricity"],"why":"Pure water boils at 100°C."},{"id":"rp-077","subject":"Required Practicals","unit":"Chemistry","topic":"RP8: Water purification (Triple only)","q":"What is potable water?","a":"Water that is safe to drink","w":["Pure water","Distilled water","Sea water"],"why":"It need not be pure: it can contain dissolved substances."},{"id":"rp-078","subject":"Required Practicals","unit":"Physics","topic":"RP1: Specific heat capacity","q":"Why is the block wrapped in insulation?","a":"To reduce energy transferred to the surroundings","w":["To make it heavier","To make it heat more slowly","To protect the thermometer"],"why":"This makes the result more accurate."},{"id":"rp-079","subject":"Required Practicals","unit":"Physics","topic":"RP1: Specific heat capacity","q":"Why is a little oil placed in the thermometer hole of the block?","a":"To improve thermal contact so the thermometer reads the block's temperature","w":["To reduce friction","To stop the block overheating","To lubricate the heater"],"why":"Air is a poor conductor."},{"id":"rp-080","subject":"Required Practicals","unit":"Physics","topic":"RP1: Specific heat capacity","q":"A 40 W heater is on for 100 s and a 0.5 kg block rises by 10°C. What is the specific heat capacity?","a":"800 J/kg°C","w":["80 J/kg°C","8000 J/kg°C","200 J/kg°C"],"why":"E = 40 × 100 = 4000 J; c = 4000 ÷ (0.5 × 10)."},{"id":"rp-081","subject":"Required Practicals","unit":"Physics","topic":"RP2: Thermal insulation (Physics only)","q":"In a thermal insulation experiment, how do you decide which material is the best insulator?","a":"The beaker with the smallest temperature drop in the same time","w":["The beaker that cools fastest","The heaviest material","The cheapest material"],"why":"Insulators reduce energy transfer."},{"id":"rp-082","subject":"Required Practicals","unit":"Physics","topic":"RP2: Thermal insulation (Physics only)","q":"Name two control variables in an insulation investigation.","a":"Starting temperature of the water and the volume of water","w":["The type of insulation and the temperature drop","The colour of the beaker and the type of insulation","The time and the temperature drop"],"why":"Thickness of insulation and room temperature must also be the same."},{"id":"rp-083","subject":"Required Practicals","unit":"Physics","topic":"RP3: Resistance","q":"In the resistance of a wire experiment, why should the current be kept low?","a":"A large current would heat the wire and change its resistance","w":["To save the ammeter","To make the wire longer","To stop the battery draining"],"why":"Temperature changes resistance."},{"id":"rp-084","subject":"Required Practicals","unit":"Physics","topic":"RP3: Resistance","q":"How should an ammeter and a voltmeter be connected to the wire?","a":"Ammeter in series, voltmeter in parallel","w":["Both in series","Both in parallel","Ammeter in parallel, voltmeter in series"],"why":"The voltmeter measures the potential difference across the wire."},{"id":"rp-085","subject":"Required Practicals","unit":"Physics","topic":"RP3: Resistance","q":"What does a graph of resistance against length for a wire look like?","a":"A straight line through the origin","w":["A curve","A horizontal line","A downward curve"],"why":"Resistance is directly proportional to length."},{"id":"rp-086","subject":"Required Practicals","unit":"Physics","topic":"RP4: I-V characteristics","q":"What is the purpose of the variable resistor in an I-V circuit?","a":"To change the current and potential difference","w":["To measure current","To measure potential difference","To increase resistance of the lamp"],"why":"Several readings are needed to plot a graph."},{"id":"rp-087","subject":"Required Practicals","unit":"Physics","topic":"RP4: I-V characteristics","q":"Which component gives a straight line through the origin on an I-V graph?","a":"A fixed resistor at constant temperature","w":["A filament lamp","A diode","A thermistor"],"why":"It is an ohmic conductor."},{"id":"rp-088","subject":"Required Practicals","unit":"Physics","topic":"RP4: I-V characteristics","q":"What does the I-V graph of a diode show?","a":"Current only flows in one direction","w":["Resistance is constant","Current flows equally in both directions","Resistance falls as current rises in both directions"],"why":"Almost no current flows in reverse."},{"id":"rp-089","subject":"Required Practicals","unit":"Physics","topic":"RP4: I-V characteristics","q":"Why does the I-V graph of a filament lamp curve?","a":"Its resistance increases as it gets hotter","w":["Its resistance decreases as it heats","Its current is constant","It is a diode"],"why":"Greater ion vibration means more collisions."},{"id":"rp-090","subject":"Required Practicals","unit":"Physics","topic":"RP5: Density","q":"How can you find the volume of an irregular solid?","a":"Submerge it in a displacement (eureka) can and measure the water displaced","w":["Measure its sides with a ruler","Weigh it","Heat it"],"why":"Use a measuring cylinder to collect the water."},{"id":"rp-091","subject":"Required Practicals","unit":"Physics","topic":"RP5: Density","q":"An object has a mass of 120 g and a volume of 40 cm³. What is its density?","a":"3 g/cm³","w":["0.33 g/cm³","80 g/cm³","4800 g/cm³"],"why":"Density = mass ÷ volume."},{"id":"rp-092","subject":"Required Practicals","unit":"Physics","topic":"RP5: Density","q":"How do you find the mass of a liquid using a measuring cylinder and balance?","a":"Weigh the empty cylinder, then weigh it with the liquid and subtract","w":["Weigh only the liquid","Measure its volume only","Heat the liquid"],"why":"Subtract the container's mass."},{"id":"rp-093","subject":"Required Practicals","unit":"Physics","topic":"RP6: Force and extension","q":"How is the extension of a spring calculated?","a":"New length minus original length","w":["New length plus original length","Original length only","The force divided by the length"],"why":"Measure with the ruler at eye level."},{"id":"rp-094","subject":"Required Practicals","unit":"Physics","topic":"RP6: Force and extension","q":"What does Hooke's law say about a spring?","a":"Extension is directly proportional to force, up to the limit of proportionality","w":["Extension is inversely proportional to force","Force is constant","Extension is the same for any force"],"why":"The graph is a straight line through the origin."},{"id":"rp-095","subject":"Required Practicals","unit":"Physics","topic":"RP6: Force and extension","q":"What does the gradient of a force–extension graph (in the linear region) represent?","a":"The spring constant","w":["The original length","The elastic limit","The work done"],"why":"F = k × e."},{"id":"rp-096","subject":"Required Practicals","unit":"Physics","topic":"RP6: Force and extension","q":"Why should the ruler be read at eye level?","a":"To avoid parallax error","w":["To make it faster","To keep the spring still","To reduce friction"],"why":"Looking from an angle changes the apparent reading."},{"id":"rp-097","subject":"Required Practicals","unit":"Physics","topic":"RP7: Acceleration","q":"In the trolley acceleration experiment, why are masses moved from the trolley to the hanger rather than added?","a":"To keep the total mass of the system constant","w":["To make the trolley heavier","To reduce friction","To increase the time"],"why":"Only the force changes."},{"id":"rp-098","subject":"Required Practicals","unit":"Physics","topic":"RP7: Acceleration","q":"In the acceleration experiment investigating force, what is the independent variable?","a":"The force (weight on the hanger)","w":["The acceleration","The trolley's mass","The time"],"why":"The dependent variable is acceleration."},{"id":"rp-099","subject":"Required Practicals","unit":"Physics","topic":"RP7: Acceleration","q":"Which equipment can be used to find the trolley's speed at two points?","a":"Light gates connected to a data logger","w":["A thermometer","A balance","A newtonmeter"],"why":"Acceleration = change in speed ÷ time."},{"id":"rp-100","subject":"Required Practicals","unit":"Physics","topic":"RP8: Waves","q":"A wave has a frequency of 5 Hz and a wavelength of 2 cm. What is its speed?","a":"10 cm/s","w":["2.5 cm/s","7 cm/s","0.4 cm/s"],"why":"v = f × λ."},{"id":"rp-101","subject":"Required Practicals","unit":"Physics","topic":"RP8: Waves","q":"How can you make a more accurate measurement of wavelength in a ripple tank?","a":"Measure the length of several wavelengths and divide by the number","w":["Measure just one wavelength","Use a longer lamp","Use fewer waves"],"why":"This reduces the error in one measurement."},{"id":"rp-102","subject":"Required Practicals","unit":"Physics","topic":"RP8: Waves","q":"How can you measure the frequency of ripples in a ripple tank?","a":"Count the number of waves passing a point in a set time","w":["Measure the water depth","Weigh the water","Measure the amplitude"],"why":"Frequency = waves per second."},{"id":"rp-103","subject":"Required Practicals","unit":"Physics","topic":"RP9: Reflection and refraction (Physics only)","q":"From which line are angles of incidence and refraction measured?","a":"The normal","w":["The surface of the block","The ray box","The tangent"],"why":"The normal is at 90° to the surface."},{"id":"rp-104","subject":"Required Practicals","unit":"Physics","topic":"RP9: Reflection and refraction (Physics only)","q":"What happens to a ray of light as it enters a glass block from air?","a":"It bends towards the normal","w":["It bends away from the normal","It does not change direction","It reflects completely"],"why":"Light slows down in the denser material."},{"id":"rp-105","subject":"Required Practicals","unit":"Physics","topic":"RP9: Ref ,"unit":"6.2 Electricity"},{"subject":"Physics","unit":"6.3 Particle model of matter"},{"subject":"Physics","unit":"6.4 Atomic structure"},{"subject":"Physics","unit":"6.5 Forces"},{"subject":"Computer Science","unit":"3.1 Fundamentals of algorithms"},{"subject":"Computer Science","unit":"3.2 Programming"},{"subject":"Computer Science","unit":"3.3 Fundamentals of data representation"},{"subject":"Computer Science","unit":"3.4 Computer systems"},{"subject":"Computer Science","unit":"3.5 Systems architecture"},{"subject":"Computer Science","unit":"3.6 Fundamentals of computer networks"},{"subject":"Computer Science","unit":"3.7 Cyber security"},{"subject":"Computer Science","unit":"3.8 Relational databases and SQL"},{"subject":"Computer Science","unit":"3.9 Ethical, legal and environmental impacts"},{"subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present"},{"subject":"GCSE History","unit":"Paper 1: The British sector of the Western Front, 1914-18"},{"subject":"GCSE History","unit":"Paper 2: Superpower relations and the Cold War, 1941-91"},{"subject":"GCSE History","unit":"Paper 2: Anglo-Saxon and Norman England, c1060-88"},{"subject":"GCSE History","topic":"The Weimar Republic, 1918-29"},{"subject":"English Literature","unit":"Component 1A: Shakespeare - Macbeth"},{"subject":"English Literature","unit":"Component 1B: Poetry Anthology (1789-present)"},{"subject":"English Literature","unit":"Component 2A: Post-1914 prose/drama - An Inspector Calls"},{"subject":"English Literature","unit":"Component 2B: 19th-century prose - A Christmas Carol"},{"subject":"English Literature","unit":"Component 2C: Unseen poetry"},{"subject":"French","topic":"Present tense"},{"subject":"French","topic":"Perfect and imperfect tense"},{"subject":"French","topic":"Near future, future and conditional"},{"subject":"French","topic":"Imperative and verb constructions"},{"subject":"French","topic":"Foundation and Higher word lists"},{"subject":"German","unit":"Theme 1: People uired Practicals","topic":"RP1: Making a soluble salt"},{"subject":"Required Practicals","topic":"RP2: Titration"},{"subject":"Required Practicals","topic":"RP3: Electrolysis"},{"subject":"Required Practicals","topic":"RP4: Temperature changes"},{"subject":"Required Practicals","topic":"RP1: Specific heat capacity"},{"subject":"Required Practicals","topic":"RP2: Thermal insulation (Physics only)"},{"subject":"Required Practicals","topic":"RP3: Resistance"},{"subject":"Required Practicals","topic":"RP4: I-V characteristics"},{"subject":"Required Practicals","topic":"RP5: Density"}]}}</script><!--EMBED_END-->

<script>
(function () {
  'use strict';

  // The daily quiz had 10 questions until 4 Oct 2026; from 5 Oct it has 20. Subject quizzes and practice rounds are always 20.
  var N = 20, DAILY_OLD = 10, DAILY_FROM = '2026-10-05';
  function dailyCount(dateStr) { return dateStr >= DAILY_FROM ? N : DAILY_OLD; }
  var KEY = 'gcseDailyQuiz.v1';
  var params = new URLSearchParams(location.search);
  var SUBJECT_COLOURS = {
    'Biology': '#2e7d32', 'Chemistry': '#e07b00', 'Physics': '#1565c0',
    'Computer Science': '#6a1b9a', 'GCSE History': '#8d5a2b', 'English Literature': '#b71c1c',
    'Maths': '#00838f', 'German': '#37474f', 'French': '#283593', 'English Language': '#ad1457',
    'Required Practicals': '#558b2f'
  };
  function niceSubject(s) { return s === 'GCSE History' ? 'History' : s; }

  // ---------- storage ----------
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.days) return s; } catch (e) {}
    return { days: {}, seen: {} };
  }
  function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }

  // ---------- dates (UK time) ----------
  function ukDate(d) {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d || new Date());
  }
  function prettyDate(d) {
    return new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', weekday: 'long', day: 'numeric', month: 'long' }).format(d || new Date());
  }
  function dayDiff(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000); }
  function addDays(dateStr, n) { var t = Date.parse(dateStr + 'T00:00:00Z') + n * 86400000; return new Date(t).toISOString().slice(0, 10); }

  // ---------- seeded random ----------
  function seedFrom(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function rngFor(str) {
    var a = seedFrom(str);
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rng) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  // ---------- question selection ----------
  // Take questions topic by topic in turn, so a topic with hundreds of questions (such as vocabulary)
  // doesn't crowd out the smaller topics in the same subject.
  function interleaveTopics(list, rng) {
    var BIG = 120, total = {}, seenN = {}, by = {}, order = [];
    list.forEach(function (q) { total[q.topic] = (total[q.topic] || 0) + 1; });
    list.forEach(function (q) {
      var n = seenN[q.topic] = (seenN[q.topic] || 0) + 1;
      var slices = Math.ceil(total[q.topic] / BIG);
      var key = slices > 1 ? q.topic + '#' + (n % slices) : q.topic;
      if (!by[key]) { by[key] = []; order.push(key); }
      by[key].push(q);
    });
    order = shuffle(order, rng);
    var out = [], more = true;
    while (more) {
      more = false;
      order.forEach(function (t) { if (by[t].length) { out.push(by[t].shift()); more = true; } });
    }
    return out;
  }

  function pickSet(pool, rng, seen, today, n) {
    var by = {};
    pool.forEach(function (q) { (by[q.subject] = by[q.subject] || []).push(q); });
    var subjects = shuffle(Object.keys(by), rng);
    var lists = {};
    subjects.forEach(function (s) {
      var sh = shuffle(by[s], rng);
      var fresh = sh.filter(function (q) { return !(seen[q.id] && dayDiff(seen[q.id], today) < 14); });
      var stale = sh.filter(function (q) { return seen[q.id] && dayDiff(seen[q.id], today) < 14; });
      lists[s] = interleaveTopics(fresh, rng).concat(interleaveTopics(stale, rng));
    });
    var chosen = [], usedTopics = {};
    var progressed = true;
    while (chosen.length < n && progressed) {
      progressed = false;
      for (var i = 0; i < subjects.length && chosen.length < n; i++) {
        var L = lists[subjects[i]];
        if (!L.length) continue;
        var idx = -1;
        for (var k = 0; k < L.length; k++) { if (!usedTopics[L[k].subject + '|' + L[k].topic]) { idx = k; break; } }
        if (idx < 0) idx = 0;
        var q = L.splice(idx, 1)[0];
        chosen.push(q); usedTopics[q.subject + '|' + q.topic] = 1; progressed = true;
      }
    }
    return shuffle(chosen, rng);
  }

  // One subject only: spread the questions across its topics.
  function pickFromSubject(pool, rng, n) {
    return shuffle(interleaveTopics(shuffle(pool, rng), rng).slice(0, n), rng);
  }

  // ---------- app state ----------
  var store = load();
  var today = /^\d{4}-\d{2}-\d{2}$/.test(params.get('today') || '') ? params.get('today') : ukDate();   // ?today=YYYY-MM-DD is for testing
  var bank = {};       // id -> question
  var studied = [];
  var mock = null;     // { until: 'YYYY-MM-DD', entries: [...] } from studied.json
  var run = null;      // { mode, ids, opts, answers, idx, done, score }
  var app = document.getElementById('app');

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function clear() { while (app.firstChild) app.removeChild(app.firstChild); }
  function chip(subject) {
    var c = el('span', { class: 'chip', text: niceSubject(subject) });
    c.style.background = SUBJECT_COLOURS[subject] || '#1f4e79';
    return c;
  }

  function listMatches(list, q) {
    return list.some(function (s) {
      if (s.subject !== q.subject) return false;
      if (!s.unit && !s.topic) return true;
      return (s.unit && s.unit === q.unit) || (s.topic && s.topic === q.topic);
    });
  }
  // Mock-revision mode: until the date in studied.json, only the mock topics are asked (add ?mock=0 to switch it off).
  function mockOn() {
    return !params.get('all') && params.get('mock') !== '0' && !!(mock && mock.entries && mock.entries.length) && today <= mock.until;
  }
  function isStudied(q) {
    if (params.get('all')) return true;
    if (!listMatches(studied, q)) return false;
    return !mockOn() || listMatches(mock.entries, q);
  }
  function mockNote() {
    var d = new Intl.DateTimeFormat('en-GB', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(mock.until + 'T12:00:00Z'));
    return 'Mock revision mode: questions come only from your mock topics until ' + d + '.';
  }

  function persistDay() {
    if (run.mode !== 'daily') return;
    store.days[today] = { ids: run.ids, opts: run.opts, answers: run.answers, done: run.done, score: run.score };
    save(store);
  }

  function newRun(mode, seedStr, subject) {
    var pool = Object.keys(bank).map(function (k) { return bank[k]; }).filter(isStudied);
    if (subject) pool = pool.filter(function (q) { return q.subject === subject; });
    if (!pool.length) return null;
    var rng = rngFor(seedStr);
    var qs = subject ? pickFromSubject(pool, rng, N)
      : pickSet(pool, rng, store.seen || {}, today, mode === 'daily' ? dailyCount(today) : N);
    var opts = {};
    qs.forEach(function (q) { opts[q.id] = shuffle([q.a].concat(q.w), rngFor(seedStr + '|' + q.id)); });
    return { mode: mode, subject: subject || null, ids: qs.map(function (q) { return q.id; }), opts: opts, answers: {}, idx: 0, done: false, score: 0 };
  }

  function streakInfo() {
    var n = 0, d = today;
    if (!(store.days[d] && store.days[d].done)) d = addDays(d, -1);
    while (store.days[d] && store.days[d].done) { n++; d = addDays(d, -1); }
    return n;
  }
  function updateHeader() {
    document.getElementById('date').textContent = prettyDate();
    var s = streakInfo(), e = document.getElementById('streak');
    if (s > 0) { e.hidden = false; e.textContent = s + (s === 1 ? ' day streak' : ' day streak'); }
    else e.hidden = true;
  }

  // ---------- screens ----------
  function renderEmpty() {
    clear();
    app.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: 'Nothing to ask yet', style: 'margin:0 0 6px;font-size:18px' }),
      el('div', { class: 'muted', text: 'No studied topics are set up. Tell Claude what you have studied and it will update studied.json.' })
    ]));
  }

  function renderStart() {
    clear();
    var qs = run.ids.map(function (id) { return bank[id]; });
    var subjects = [];
    qs.forEach(function (q) { if (subjects.indexOf(q.subject) < 0) subjects.push(q.subject); });
    var card = el('div', { class: 'card' });
    card.appendChild(el('div', { style: 'font-size:20px;font-weight:700', text: qs.length + ' questions today' }));
    card.appendChild(el('div', { class: 'muted', style: 'margin-top:4px', text: 'Multiple choice. You will only see your score at the end.' }));
    if (mockOn()) card.appendChild(el('div', { class: 'small', style: 'margin-top:8px;font-weight:600;color:var(--accent)', text: mockNote() }));
    var chips = el('div', { class: 'chips' });
    subjects.forEach(function (s) { chips.appendChild(chip(s)); });
    card.appendChild(chips);
    if (qs.length < dailyCount(today)) card.appendChild(el('div', { class: 'small muted', style: 'margin-top:10px', text: 'Only ' + qs.length + ' questions are available from your studied topics so far.' }));
    card.appendChild(el('button', { class: 'primary', text: 'Start quiz', onclick: function () { renderQuestion(); } }));
    app.appendChild(card);
    app.appendChild(subjectCard());
    renderHistory();
  }

  function availableSubjects() {
    var counts = {};
    Object.keys(bank).forEach(function (k) { var q = bank[k]; if (isStudied(q)) counts[q.subject] = (counts[q.subject] || 0) + 1; });
    var order = Object.keys(SUBJECT_COLOURS);
    return Object.keys(counts).sort(function (a, b) {
      var ia = order.indexOf(a), ib = order.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    }).map(function (s) { return { subject: s, count: counts[s] }; });
  }

  function subjectCard() {
    var card = el('div', { class: 'card' });
    card.appendChild(el('div', { style: 'font-weight:700', text: 'Subject quiz' }));
    card.appendChild(el('div', { class: 'small muted', style: 'margin-top:3px', text: 'Pick one subject and answer ' + N + ' questions on it.' }));
    card.appendChild(el('button', { class: 'ghost', style: 'width:100%;margin-top:12px', text: 'Choose a subject', onclick: renderSubjectMenu }));
    return card;
  }

  function renderSubjectMenu() {
    clear();
    var card = el('div', { class: 'card' });
    card.appendChild(el('div', { style: 'font-size:20px;font-weight:700', text: 'Subject quiz' }));
    card.appendChild(el('div', { class: 'muted', style: 'margin-top:4px', text: 'Choose a subject for ' + N + ' random questions from the topics you have studied. These do not count towards your daily streak or history.' }));
    if (mockOn()) card.appendChild(el('div', { class: 'small', style: 'margin-top:8px;font-weight:600;color:var(--accent)', text: mockNote() }));
    availableSubjects().forEach(function (x) {
      var dot = el('span', { class: 'l', text: '' });
      dot.style.background = SUBJECT_COLOURS[x.subject] || '#1f4e79';
      var b = el('button', { class: 'opt', style: 'margin-top:10px', onclick: function () {
        var r = newRun('subject', 'subject|' + x.subject + '|' + Date.now(), x.subject);
        if (r) { run = r; renderQuestion(); }
      } }, [dot, el('span', { text: niceSubject(x.subject) + '  (' + x.count + ' questions available)' })]);
      card.appendChild(b);
    });
    card.appendChild(el('button', { class: 'ghost', style: 'width:100%;margin-top:14px', text: 'Back', onclick: showDaily }));
    app.appendChild(card);
    window.scrollTo(0, 0);
  }

  function renderHistory() {
    var card = el('div', { class: 'card' });
    card.appendChild(el('div', { class: 'small muted', text: 'Last 7 days' }));
    var h = el('div', { class: 'hist' });
    for (var i = 6; i >= 0; i--) {
      var d = addDays(today, -i);
      var rec = store.days[d];
      var dow = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', weekday: 'short' }).format(new Date(d + 'T12:00:00Z'));
      var b = el('b', { text: rec && rec.done ? rec.score + '/' + rec.ids.length : '-', style: 'font-size:12px' });
      if (!(rec && rec.done)) b.className = 'empty';
      h.appendChild(el('div', null, [dow, b]));
    }
    card.appendChild(h);
    app.appendChild(card);
  }

  function renderQuestion() {
    clear();
    if (run.idx >= run.ids.length) run.idx = run.ids.length - 1;
    var q = bank[run.ids[run.idx]];
    var total = run.ids.length;
    var opts = run.opts[q.id];
    var card = el('div', { class: 'card' });
    card.appendChild(el('div', { class: 'qmeta' }, [
      el('span', { text: 'Question ' + (run.idx + 1) + ' of ' + total }),
      chip(q.subject)
    ]));
    var bar = el('div', { class: 'bar' }, [el('i', { style: 'width:' + Math.round((run.idx / total) * 100) + '%' })]);
    card.appendChild(bar);
    card.appendChild(el('div', { class: 'small muted', text: q.topic }));
    card.appendChild(el('div', { class: 'q', text: q.q }));
    var letters = ['A', 'B', 'C', 'D'];
    opts.forEach(function (o, i) {
      var b = el('button', { class: 'opt' + (run.answers[q.id] === i ? ' sel' : ''), 'aria-pressed': run.answers[q.id] === i ? 'true' : 'false', onclick: function () {
        run.answers[q.id] = i; persistDay(); renderQuestion();
      } }, [el('span', { class: 'l', text: letters[i] }), el('span', { text: o })]);
      card.appendChild(b);
    });
    if (run.mode !== 'daily') card.appendChild(el('button', { class: 'ghost', style: 'width:100%;margin-top:12px', text: 'Leave quiz', onclick: function () { if (confirm('Leave this quiz? Your answers so far will be lost.')) showDaily(); } }));
    app.appendChild(card);

    var answered = run.answers[q.id] !== undefined;
    var last = run.idx === total - 1;
    var nav = el('div', { class: 'navbar' });
    var row = el('div', { class: 'row' });
    if (run.idx > 0) row.appendChild(el('button', { class: 'ghost', text: 'Back', style: 'flex:0 0 32%', onclick: function () { run.idx--; renderQuestion(); } }));
    var next = el('button', { class: 'primary', text: last ? 'Finish and mark' : 'Next', onclick: function () {
      if (last) finish(); else { run.idx++; renderQuestion(); }
    } });
    if (!answered) next.disabled = true;
    row.appendChild(next);
    nav.appendChild(row);
    app.appendChild(nav);
    window.scrollTo(0, 0);
  }

  function finish() {
    var score = 0;
    run.ids.forEach(function (id) {
      var q = bank[id];
      if (run.opts[id][run.answers[id]] === q.a) score++;
    });
    run.score = score; run.done = true;
    if (run.mode === 'daily') {
      store.seen = store.seen || {};
      run.ids.forEach(function (id) { store.seen[id] = today; });
    }
    persistDay();
    if (run.mode === 'daily') save(store);
    updateHeader();
    renderResults();
  }

  function renderResults() {
    clear();
    var total = run.ids.length, s = run.score;
    var pct = total ? s / total : 0;
    var verdict = pct >= 0.9 ? 'Brilliant.' : pct >= 0.7 ? 'Solid work.' : pct >= 0.5 ? 'Getting there.' : 'Worth revisiting these topics.';
    var card = el('div', { class: 'card' });
    card.appendChild(el('div', { class: 'score' }, [el('b', { text: String(s) }), el('span', { text: '/' + total })]));
    card.appendChild(el('div', { class: 'verdict', text: verdict }));
    if (run.mode === 'practice') card.appendChild(el('div', { class: 'small muted', style: 'text-align:center', text: 'Practice round - not saved to your history' }));
    if (run.mode === 'subject') card.appendChild(el('div', { class: 'small muted', style: 'text-align:center', text: niceSubject(run.subject) + ' quiz - not saved to your history' }));

    var wrong = [];
    run.ids.forEach(function (id) {
      var q = bank[id];
      if (run.opts[id][run.answers[id]] !== q.a) wrong.push(q);
    });
    if (wrong.length) {
      var seenT = {}, list = el('ul');
      wrong.forEach(function (q) {
        var k = q.subject + '|' + q.topic;
        if (seenT[k]) return; seenT[k] = 1;
        list.appendChild(el('li', { text: niceSubject(q.subject) + ': ' + q.topic }));
      });
      card.appendChild(el('div', { class: 'revise' }, [el('b', { text: 'Topics to revise' }), list]));
    }
    app.appendChild(card);

    var rev = el('div', { class: 'card' });
    run.ids.forEach(function (id, n) {
      var q = bank[id];
      var chosen = run.opts[id][run.answers[id]];
      var ok = chosen === q.a;
      var item = el('div', { class: 'rev ' + (ok ? 'ok' : 'no') });
      item.appendChild(el('div', { class: 'tag', text: (n + 1) + '. ' + niceSubject(q.subject) + ' - ' + q.topic }));
      item.appendChild(el('h3', { text: q.q }));
      if (ok) {
        item.appendChild(el('div', { class: 'ans-ok', text: '✓ ' + q.a }));
      } else {
        item.appendChild(el('div', { class: 'ans-no', text: '✗ Your answer: ' + chosen }));
        item.appendChild(el('div', { class: 'ans-ok', text: '✓ Correct: ' + q.a }));
      }
      item.appendChild(el('div', { class: 'why', text: q.why }));
      rev.appendChild(item);
    });
    app.appendChild(rev);

    var subj = run.mode === 'subject' ? run.subject : null;
    var again = el('button', { class: 'primary', text: subj ? 'Another ' + N + ' ' + niceSubject(subj) + ' questions' : 'Practise ' + N + ' more', onclick: function () {
      var r = subj ? newRun('subject', 'subject|' + subj + '|' + Date.now(), subj) : newRun('practice', 'practice|' + Date.now());
      if (r) { run = r; renderQuestion(); }
    } });
    app.appendChild(again);
    app.appendChild(el('button', { class: 'ghost', style: 'width:100%;margin-top:10px', text: 'Subject quiz', onclick: renderSubjectMenu }));
    if (run.mode !== 'daily') app.appendChild(el('button', { class: 'ghost', style: 'width:100%;margin-top:10px', text: 'Back to daily quiz', onclick: showDaily }));
    if (run.mode === 'daily') renderHistory();
  }

  // ---------- boot ----------
  function boot(questions, studiedList, updated, live, mockCfg) {
    questions.forEach(function (q) { bank[q.id] = q; });
    studied = studiedList;
    mock = mockCfg || null;
    document.getElementById('foot').textContent = params.get('all')
      ? 'Test mode: questions from every topic'
      : (mockOn() ? 'Mock revision mode is on' : 'Questions come only from topics you have studied') + (updated ? ' (list updated ' + updated + ')' : '') +
        (live === false ? ' - built-in copy in use' : '');

    if (params.get('reset')) {
      delete store.days[today]; save(store);
      params.delete('reset');
      var qs = params.toString();
      try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '')); } catch (e) {}
    }

    showDaily();
  }

  function showDaily() {
    updateHeader();
    var rec = store.days[today];
    if (rec) {
      var ok = rec.ids.every(function (id) { return bank[id]; });
      if (ok) {
        run = { mode: 'daily', ids: rec.ids, opts: rec.opts, answers: rec.answers || {}, idx: 0, done: !!rec.done, score: rec.score || 0 };
        if (run.done) { renderResults(); return; }
        var first = run.ids.findIndex(function (id) { return run.answers[id] === undefined; });
        run.idx = first < 0 ? run.ids.length - 1 : first;
        if (Object.keys(run.answers).length) { renderQuestion(); return; }
        renderStart(); return;
      }
    }
    var r = newRun('daily', 'daily|' + today + (params.get('all') ? '|all' : ''));
    if (!r) { renderEmpty(); return; }
    run = r; persistDay(); renderStart();
  }

  // The live files are used first so a new studied.json takes effect straight away.
  // If they can't be fetched (e.g. the page was opened as a plain file), fall back to the copy built into this page.
  function getJson(url) {
    return new Promise(function (resolve, reject) {
      try {
        fetch(url + '?v=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(resolve, reject);
      } catch (e) { reject(e); }
    });
  }
  function embeddedCopy() {
    try {
      var d = JSON.parse(document.getElementById('embedded-data').textContent);
      if (d && d.questions && d.questions.length) return d;
    } catch (e) {}
    return null;
  }
  Promise.all([getJson('questions.json'), getJson('studied.json')])
    .then(function (res) { return { questions: res[0], studied: res[1].studied || [], updated: res[1].updated, mock: res[1].mock || null, live: true }; })
    .catch(function () {
      var d = embeddedCopy();
      if (!d) throw new Error('no data');
      d.live = false;
      return d;
    })
    .then(function (d) { boot(d.questions, d.studied || [], d.updated, d.live, d.mock); })
    .catch(function () {
      clear();
      app.appendChild(el('div', { class: 'card' }, [
        el('b', { text: 'Could not load the questions.' }),
        el('div', { class: 'muted', text: 'Open the quiz from its web link, or check your connection and reload.' })
      ]));
    });
})();
</script>
