eimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Who was Kaiser of Germany until November 1918?","a":"Wilhelm II","w":["Friedrich Ebert","Paul von Hindenburg","Gustav Stresemann"],"why":"He abdicated on 9 November 1918 and fled to the Netherlands."},{"id":"hist-002","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Which event in late October and early November 1918 helped to spark the German Revolution?","a":"The mutiny of sailors at Kiel","w":["The Spartacist Uprising","The Kapp Putsch","The invasion of the Ruhr"],"why":"Sailors refused to sail on a last, hopeless battle; the unrest spread across Germany."},{"id":"hist-003","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"When was the armistice that ended the First World War signed?","a":"11 November 1918","w":["9 November 1918","28 June 1919","11 August 1919"],"why":"The new German government agreed to stop fighting, two days after the Kaiser abdicated."},{"id":"hist-004","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Why did the Kaiser abdicate in November 1918?","a":"Germany was close to defeat and a revolution had broken out","w":["He was defeated in a general election","He was assassinated by the Spartacists","The Treaty of Versailles removed him"],"why":"He lost the support of the army, the navy and the people."},{"id":"hist-005","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Who became the first president of the Weimar Republic?","a":"Friedrich Ebert","w":["Paul von Hindenburg","Adolf Hitler","Gustav Stresemann"],"why":"Ebert was leader of the SPD (Social Democratic Party)."},{"id":"hist-006","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Who declared Germany a republic on 9 November 1918?","a":"Philipp Scheidemann","w":["Friedrich Ebert","Rosa Luxemburg","Wolfgang Kapp"],"why":"He announced it from a window of the Reichstag in Berlin."},{"id":"hist-007","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Why did the new government meet in Weimar rather than Berlin?","a":"Berlin was too violent and unstable after the revolution","w":["Weimar was the Kaiser's old capital","The Treaty of Versailles ordered it","Berlin was occupied by France"],"why":"The republic got its name from the town where the National Assembly met."},{"id":"hist-008","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"When was the Weimar Constitution introduced?","a":"1919","w":["1918","1921","1923"],"why":"It set up Germany as a democratic republic."},{"id":"hist-009","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Under the Weimar Constitution, how often was the president elected?","a":"Every 7 years","w":["Every 4 years","Every 5 years","Every 10 years"],"why":"The president could appoint the chancellor and had powerful emergency powers."},{"id":"hist-010","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"What was Article 48 of the Weimar Constitution?","a":"It let the president rule by decree in an emergency","w":["It banned the army from politics","It guaranteed women the vote","It set the level of reparations"],"why":"This was a weakness because it could be used to bypass the Reichstag."},{"id":"hist-011","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Which voting system for the Reichstag made it hard for any party to win a majority?","a":"Proportional representation","w":["First past the post","Rule by decree","A single-party list"],"why":"Seats matched each party's share of votes, so many small parties won seats and coalitions were needed."},{"id":"hist-012","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Which of these was a weakness of the Weimar Constitution?","a":"Coalition governments were often weak and short-lived","w":["Women could not vote","There was no elected parliament","The Kaiser still held real power"],"why":"Proportional representation meant no party won a majority."},{"id":"hist-013","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"What was the Reichsrat?","a":"The body representing the German states","w":["The German army","The president's cabinet","The Nazi Party's council"],"why":"The Reichstag was the main elected parliament."},{"id":"hist-014","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"What voting rights did the Weimar Constitution give?","a":"All men and women aged 20 and over could vote","w":["Only men over 21","Only property owners","Everyone over 16"],"why":"Women voted for the first time in 1919."},{"id":"hist-015","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Which groups from the Kaiser's time stayed in their jobs under the Weimar Republic?","a":"Judges, civil servants and army officers","w":["Only the Kaiser's family","Nobody; they were all replaced","Only the old Reichstag members"],"why":"Many were not loyal to the new republic."},{"id":"hist-016","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"When was the Treaty of Versailles signed?","a":"28 June 1919","w":["11 November 1918","11 August 1919","1 January 1920"],"why":"Germany was not allowed to take part in the negotiations."},{"id":"hist-017","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Why did Germans call the Treaty of Versailles a \"Diktat\"?","a":"They were forced to accept it without negotiation","w":["It was written in German","Hitler wrote it","It was signed by the Kaiser"],"why":"They had to sign or face invasion."},{"id":"hist-018","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"What did the War Guilt Clause (Article 231) say?","a":"Germany had to accept blame for starting the war","w":["Germany had to pay no reparations","Germany had to give up its army","Germany could not join the League of Nations"],"why":"It was the basis for reparations and was hated by Germans."},{"id":"hist-019","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"How much were reparations set at in 1921?","a":"£6.6 billion","w":["£660 million","£66 billion","£1.8 billion"],"why":"Germany was to pay in instalments."},{"id":"hist-020","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"What was the limit on the German army under the Treaty of Versailles?","a":"100,000 men","w":["1 million men","10,000 men","500,000 men"],"why":"Conscription was banned, and Germany could have no tanks or air force."},{"id":"hist-021","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Which area of Germany was demilitarised by the Treaty of Versailles?","a":"The Rhineland","w":["Bavaria","The Ruhr","Silesia"],"why":"No German troops were allowed in this area next to France."},{"id":"hist-022","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"What happened to the Saar under the Treaty of Versailles?","a":"It was run by the League of Nations for 15 years","w":["It went to Poland","It became part of Austria","It was made a free city"],"why":"France took the output of its coal mines."},{"id":"hist-023","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Which territory was returned to France under the Treaty of Versailles?","a":"Alsace-Lorraine","w":["The Saar","Danzig","The Rhineland"],"why":"It had been taken by Germany in 1871."},{"id":"hist-024","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"What was the Polish Corridor?","a":"Land taken from Germany to give Poland access to the sea","w":["A demilitarised strip along the Rhine","A railway line to Russia","A zone run by the League of Nations"],"why":"It separated East Prussia from the rest of Germany."},{"id":"hist-025","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Which of these was banned for Germany by the Treaty of Versailles?","a":"Union (Anschluss) with Austria","w":["Trading with Britain","Having a president","Holding elections"],"why":"Germany also lost all of its overseas colonies."},{"id":"hist-026","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"What were the \"November Criminals\"?","a":"The politicians who signed the armistice (and later the Treaty)","w":["The Spartacist leaders","Members of the Kapp Putsch","The French who occupied the Ruhr"],"why":"Right-wing groups blamed them for betraying Germany."},{"id":"hist-027","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"What was the \"stab in the back\" myth?","a":"The claim that Germany had been betrayed by politicians, not beaten by the army","w":["The claim that Hitler had been poisoned","The idea that the Kaiser was murdered","The belief that France invaded Germany"],"why":"It damaged the reputation of the Weimar government."},{"id":"hist-028","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Which three leaders were known as the \"Big Three\" at the Paris Peace Conference?","a":"Clemenceau, Lloyd George and Wilson","w":["Clemenceau, Churchill and Roosevelt","Stalin, Lloyd George and Wilson","Ebert, Clemenceau and Wilson"],"why":"France, Britain and the USA had different aims."},{"id":"hist-029","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Which group led the Spartacist Uprising of January 1919?","a":"Communists, led by Rosa Luxemburg and Karl Liebknecht","w":["Right-wing army officers","The Nazi Party","Sailors from Kiel"],"why":"They wanted a communist revolution like Russia's."},{"id":"hist-030","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Who did Ebert use to crush the Spartacist Uprising?","a":"The Freikorps","w":["The French army","The Reichstag","The SA"],"why":"The Freikorps were right-wing ex-soldiers; they murdered Luxemburg and Liebknecht."},{"id":"hist-031","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"What did the Kapp Putsch of March 1920 try to do?","a":"Overthrow the Weimar government and restore a right-wing government","w":["Start a communist revolution","Cancel reparations","Bring back the League of Nations"],"why":"Wolfgang Kapp and the Freikorps seized Berlin."},{"id":"hist-032","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"What defeated the Kapp Putsch?","a":"A general strike by Berlin workers","w":["The army fighting the rebels","The French invasion","A new election"],"why":"Gas, water and transport stopped; Kapp fled."},{"id":"hist-033","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"What did the Kapp Putsch show about the army?","a":"It was unwilling to fire on fellow soldiers to defend the government","w":["It was fully loyal to Ebert","It was too small to fight","It had been disbanded"],"why":"The Weimar government had to rely on a strike instead."},{"id":"hist-034","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Which minister was assassinated in 1922 by right-wing extremists?","a":"Walther Rathenau","w":["Gustav Stresemann","Friedrich Ebert","Philipp Scheidemann"],"why":"Matthias Erzberger, who signed the armistice, was killed in 1921."},{"id":"hist-035","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Why did French and Belgian troops occupy the Ruhr in January 1923?","a":"Germany had missed a reparations payment","w":["Germany had invaded Belgium","The Kaiser had returned","There was a communist revolution"],"why":"They took coal and goods as payment."},{"id":"hist-036","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"How did the German government respond to the Ruhr occupation?","a":"It told workers to carry out passive resistance (strike)","w":["It declared war on France","It paid all reparations immediately","It surrendered the Ruhr permanently"],"why":"It printed money to pay the striking workers."},{"id":"hist-037","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"What was the main cause of hyperinflation in 1923?","a":"The government printed huge amounts of money","w":["The Wall Street Crash","Germany's gold ran out because of the Kaiser","Taxes were abolished by Stresemann"],"why":"Prices rose so fast that money became almost worthless."},{"id":"hist-038","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Who suffered most from hyperinflation?","a":"People with savings or fixed incomes, such as pensioners","w":["People who owed money","Foreign investors","Owners of land"],"why":"Savings were wiped out; people with debts could pay them off cheaply."},{"id":"hist-039","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Who benefited from hyperinflation?","a":"People with debts, who could pay them off with worthless money","w":["People living on savings","Pensioners","Workers paid monthly"],"why":"Debts and mortgages became easy to clear."},{"id":"hist-040","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"What was a long-term effect of hyperinflation?","a":"Many middle-class Germans lost trust in the Weimar Republic","w":["Germany stopped paying reparations","The Kaiser returned to power","Unemployment disappeared"],"why":"Some later turned to extremist parties."},{"id":"hist-041","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Which politician led the recovery of the Weimar Republic from 1923?","a":"Gustav Stresemann","w":["Wolfgang Kapp","Friedrich Ebert","Rosa Luxemburg"],"why":"He was chancellor in 1923 and then foreign minister until 1929."},{"id":"hist-042","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"What did Stresemann do in 1923 to stop hyperinflation?","a":"Introduced a new currency, the Rentenmark","w":["Printed more money","Stopped paying wages","Increased reparations"],"why":"It was limited in supply and backed by German land and industry; Hjalmar Schacht helped."},{"id":"hist-043","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Which plan of 1924 reorganised reparation payments and brought American loans to Germany?","a":"The Dawes Plan","w":["The Young Plan","The Locarno Pact","The Kellogg-Briand Pact"],"why":"Payments were spread out to match what Germany could afford."},{"id":"hist-044","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Which country lent money to Germany under the Dawes Plan?","a":"The USA","w":["France","Britain","Russia"],"why":"About 800 million gold marks were loaned."},{"id":"hist-045","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"What was the weakness of the recovery that depended on the Dawes Plan?","a":"It relied on American loans that could be withdrawn","w":["It stopped all trade","It ended the Treaty of Versailles","It ignored industry"],"why":"When the Wall Street Crash happened in 1929, the loans were recalled."},{"id":"hist-046","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"What did the Locarno Pact of 1925 do?","a":"Germany accepted its western borders with France and Belgium","w":["Germany joined the League of Nations","Reparations were cancelled","Germany regained the Saar"],"why":"Britain and Italy guaranteed the agreement."},{"id":"hist-047","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"When did Germany join the League of Nations?","a":"1926","w":["1919","1923","1929"],"why":"This showed that Germany was once again accepted as a major power."},{"id":"hist-048","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"What did the Kellogg-Briand Pact of 1928 say?","a":"Countries agreed not to use war to achieve their aims","w":["Germany would pay no more reparations","Germany could rebuild its army","France would leave the Rhineland"],"why":"Over 60 countries signed it."},{"id":"hist-049","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"What did the Young Plan of 1929 do?","a":"Reduced Germany's total reparations and gave longer to pay","w":["Removed the army limit","Gave the Saar back to Germany","Started the Ruhr occupation"],"why":"It extended payments to 1988 and was attacked by German nationalists."},{"id":"hist-050","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Which of these was a sign of economic recovery between 1924 and 1929?","a":"New houses, factories and public buildings were built using loans","w":["Unemployment benefit was removed","The Rentenmark was abolished","Reparations stopped"],"why":"Unemployment insurance was also introduced in 1927."},{"id":"hist-051","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Which weakness remained in the German economy in the late 1920s?","a":"Farmers had low prices and many were in debt","w":["Industrial output was far below 1913","Germany could not trade abroad","Hyperinflation returned"],"why":"Some groups did not share in the \"golden years\"."},{"id":"hist-052","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"How well did the Nazis do in the 1928 Reichstag election?","a":"Badly, winning about 2.6% of the vote","w":["They won the most seats","They won over 30% of the vote","They did not stand"],"why":"Extremist parties did poorly during the stable years."},{"id":"hist-053","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"What was the Bauhaus?","a":"A German school of art, design and architecture","w":["A political party","A Berlin cabaret","A film studio"],"why":"It was founded by Walter Gropius and was known for functional modern design."},{"id":"hist-054","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Who wrote The Threepenny Opera (1928)?","a":"Bertolt Brecht","w":["Thomas Mann","Walter Gropius","Fritz Lang"],"why":"He used theatre to criticise society."},{"id":"hist-055","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Which artists painted sharp, critical pictures of Weimar society?","a":"Otto Dix and George Grosz","w":["Walter Gropius and Fritz Lang","Claude Monet and Pablo Picasso","Max Weber and Karl Marx"],"why":"This style is often called the \"New Objectivity\"."},{"id":"hist-056","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Which German film of 1927 was directed by Fritz Lang?","a":"Metropolis","w":["The Blue Angel","All Quiet on the Western Front","Cabaret"],"why":"It showed a futuristic city and was an example of Weimar cinema."},{"id":"hist-057","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Which novel of 1929 by Erich Maria Remarque showed the horror of the First World War?","a":"All Quiet on the Western Front","w":["Mein Kampf","Buddenbrooks","The Magic Mountain"],"why":"It was hugely popular and later banned by the Nazis."},{"id":"hist-058","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Why did many conservative Germans dislike Weimar culture?","a":"They saw it as decadent and against traditional values","w":["It was only available to the rich","It had been banned by Ebert","It copied Nazi art"],"why":"They preferred traditional German art, music and morals."},{"id":"hist-059","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"What new opportunities did women have in the Weimar Republic?","a":"They could vote and stand for election, and more worked in offices and professions","w":["They were banned from voting","They all had to stay at home","They could join the army"],"why":"Attitudes were still traditional in many places."},{"id":"hist-060","subject":"GCSE History","unit":"Paper 3: Weimar and Nazi Germany, 1918-39","topic":"The Weimar Republic, 1918-29","q":"Which feature of Berlin life in the 1920s is often described as part of the \"Golden Age\"?","a":"A lively nightlife with cabarets, jazz and clubs","w":["Strict curfews","Banned theatres","A ban on foreign music"],"why":"Berlin became one of Europe's cultural centres."},{"id":"hist-061","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"Medieval medicine, c1250-c1500","q":"Which four humours did medieval doctors believe controlled the body?","a":"Blood, phlegm, yellow bile and black bile","w":["Blood, sweat, tears and bile","Air, fire, water and earth","Blood, phlegm, urine and pus"],"why":"Illness was thought to be caused by an imbalance of the humours."},{"id":"hist-062","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"Medieval medicine, c1250-c1500","q":"Miasma theory said that disease was caused by...","a":"Bad air from rotting matter","w":["Tiny living organisms","An imbalance of the humours only","Poor diet only"],"why":"It made people try to clean up smells."},{"id":"hist-063","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"Medieval medicine, c1250-c1500","q":"Which ancient Greek doctor is linked to the Four Humours and careful observation of patients?","a":"Hippocrates","w":["Galen","Vesalius","Harvey"],"why":"Galen later built on his ideas."},{"id":"hist-064","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"Medieval medicine, c1250-c1500","q":"The Black Death reached England in...","a":"1348","w":["1066","1250","1665"],"why":"It killed roughly a third to a half of the population."},{"id":"hist-065","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"Medieval medicine, c1250-c1500","q":"Why did the Church support Galen's ideas?","a":"His belief in a single creator fitted Christian teaching","w":["Galen was a bishop","Galen had discovered germs","The Church paid him"],"why":"This helped his ideas dominate for over a thousand years."},{"id":"hist-066","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"The Medical Renaissance, c1500-c1700","q":"Andreas Vesalius published On the Fabric of the Human Body in...","a":"1543","w":["1628","1665","1796"],"why":"He challenged Galen by carrying out dissections."},{"id":"hist-067","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"The Medical Renaissance, c1500-c1700","q":"What did William Harvey show?","a":"The heart pumps blood around the body in a circuit","w":["Blood is made in the liver and used up","The body contains four humours","Germs cause disease"],"why":"He published his findings in 1628."},{"id":"hist-068","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"The Medical Renaissance, c1500-c1700","q":"The Great Plague hit London in...","a":"1665","w":["1348","1854","1918"],"why":"Treatments were still based on ideas like miasma and the humours."},{"id":"hist-069","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"The Medical Renaissance, c1500-c1700","q":"Which invention helped new medical ideas to spread in the Renaissance?","a":"The printing press","w":["The steam engine","The telegraph","The X-ray machine"],"why":"Books with accurate diagrams could be copied quickly."},{"id":"hist-070","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"The Medical Renaissance, c1500-c1700","q":"Which body was set up in 1660 to encourage scientific discussion?","a":"The Royal Society","w":["The British Medical Association","The Board of Health","The National Health Service"],"why":"It supported experimental science."},{"id":"hist-071","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"Medicine in 18th and 19th century Britain","q":"Edward Jenner tested his smallpox vaccination in...","a":"1796","w":["1861","1847","1928"],"why":"He used cowpox to protect against smallpox."},{"id":"hist-072","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"Medicine in 18th and 19th century Britain","q":"Who published the germ theory in 1861?","a":"Louis Pasteur","w":["Robert Koch","Joseph Lister","Edward Jenner"],"why":"He showed that microbes cause decay and disease."},{"id":"hist-073","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"Medicine in 18th and 19th century Britain","q":"Robert Koch is known for...","a":"Identifying the specific bacteria that cause diseases such as anthrax and TB","w":["Discovering penicillin","Inventing chloroform","Founding the NHS"],"why":"His work linked particular microbes to particular diseases."},{"id":"hist-074","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"Medicine in 18th and 19th century Britain","q":"Which anaesthetic did James Simpson introduce in 1847?","a":"Chloroform","w":["Ether","Carbolic acid","Laudanum"],"why":"Anaesthetics stopped pain but infection still killed many patients."},{"id":"hist-075","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"Medicine in 18th and 19th century Britain","q":"Joseph Lister reduced infections in surgery by using...","a":"Carbolic acid as an antiseptic","w":["Penicillin","Chloroform","Mercury"],"why":"He sprayed it on wounds, instruments and hands."},{"id":"hist-076","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"Medicine in 18th and 19th century Britain","q":"In 1854, John Snow traced a cholera outbreak in London to...","a":"A water pump on Broad Street","w":["Bad air","Rats on ships","Overcrowded houses only"],"why":"He mapped the cases and had the pump handle removed."},{"id":"hist-077","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"Medicine in 18th and 19th century Britain","q":"Florence Nightingale is best known for...","a":"Improving hospital cleanliness and nursing standards","w":["Discovering germs","Inventing vaccination","Discovering X-rays"],"why":"She made her name in the Crimean War."},{"id":"hist-078","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"Medicine in 18th and 19th century Britain","q":"The Public Health Act of 1875...","a":"Forced local councils to provide clean water, sewers and rubbish collection","w":["Created the NHS","Introduced vaccination","Banned smoking"],"why":"The 1848 Act had been only voluntary."},{"id":"hist-079","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"Medicine in modern Britain, c1900-present","q":"Who discovered penicillin in 1928?","a":"Alexander Fleming","w":["Howard Florey","Ernst Chain","Paul Ehrlich"],"why":"He noticed that mould killed bacteria on a Petri dish."},{"id":"hist-080","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"Medicine in modern Britain, c1900-present","q":"Which team turned penicillin into a usable drug in the 1940s?","a":"Florey and Chain","w":["Watson and Crick","Pasteur and Koch","Jenner and Simpson"],"why":"The Second World War drove mass production."},{"id":"hist-081","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"Medicine in modern Britain, c1900-present","q":"The National Health Service was founded in...","a":"1948","w":["1911","1965","1979"],"why":"It was set up by Aneurin Bevan."},{"id":"hist-082","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"Medicine in modern Britain, c1900-present","q":"The structure of DNA was described in...","a":"1953","w":["1928","1948","1972"],"why":"Watson and Crick used the work of Franklin and Wilkins."},{"id":"hist-083","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"Medicine in modern Britain, c1900-present","q":"Salvarsan 606, the first 'magic bullet', was developed by...","a":"Paul Ehrlich (and his team)","w":["Alexander Fleming","Robert Koch","Louis Pasteur"],"why":"It treated syphilis."},{"id":"hist-084","subject":"GCSE History","unit":"Paper 1: Medicine in Britain, c1250-present","topic":"Medicine in modern Britain, c1900-present","q":"What did the 1962 Royal College of Physicians report link smoking to?","a":"Lung cancer and other diseases","w":["Malaria","Smallpox","Rickets"],"why":"It led to government anti-smoking campaigns."},{"id":"hist-085","subject":"GCSE History","unit":"Paper 1: The British sector of the Western Front, 1914-18","topic":"Context and the trench system","q":"Which places make up the British sector studied for the Western Front?","a":"Ypres, the Somme, Arras and Cambrai","w":["Verdun, Paris, Calais and Lille","Mons, Dunkirk, Caen and Ypres","Gallipoli, Ypres, Verdun and the Marne"],"why":"The area was in Belgium and northern France."},{"id":"hist-086","subject":"GCSE History","unit":"Paper 1: The British sector of the Western Front, 1914-18","topic":"Context and the trench system","q":"What was 'no man's land'?","a":"The area between the opposing front-line trenches","w":["The reserve trenches","A hospital area","German territory"],"why":"It was often muddy and full of barbed wire and shell holes."},{"id":"hist-087","subject":"GCSE History","unit":"Paper 1: The British sector of the Western Front, 1914-18","topic":"Conditions requiring medical treatment","q":"Trench foot was caused by...","a":"Standing in cold, wet, muddy conditions for long periods","w":["Poison gas","Shrapnel","Rats"],"why":"Feet became swollen and could develop gangrene."},{"id":"hist-088","subject":"GCSE History","unit":"Paper 1: The British sector of the Western Front, 1914-18","topic":"Conditions requiring medical treatment","q":"Which gas was first used at Ypres in 1915?","a":"Chlorine","w":["Mustard gas","Phosgene","Carbon monoxide"],"why":"Mustard gas was used from 1917."},{"id":"hist-089","subject":"GCSE History","unit":"Paper 1: The British sector of the Western Front, 1914-18","topic":"Conditions requiring medical treatment","q":"What is shell shock?","a":"A psychological condition caused by prolonged exposure to bombardment","w":["A wound from shrapnel","A lung disease from gas","A skin infection"],"why":"Symptoms included trembling, nightmares and being unable to speak."},{"id":"hist-090","subject":"GCSE History","unit":"Paper 1: The British sector of the Western Front, 1914-18","topic":"Conditions requiring medical treatment","q":"Why were wounds on the Western Front so often infected?","a":"Bacteria in the heavily manured soil got into wounds","w":["Wounds were left uncovered on purpose","Doctors used dirty water on purpose","The soldiers had no immune systems"],"why":"Gas gangrene and tetanus were serious dangers."},{"id":"hist-091","subject":"GCSE History","unit":"Paper 1: The British sector of the Western Front, 1914-18","topic":"The RAMC and the chain of evacuation","q":"What is the correct order of the chain of evacuation?","a":"Regimental Aid Post, Advanced Dressing Station, Casualty Clearing Station, Base Hospital","w":["Base Hospital, Casualty Clearing Station, Advanced Dressing Station, Regimental Aid Post","Advanced Dressing Station, Regimental Aid Post, Base Hospital, Casualty Clearing Station","Casualty Clearing Station, Regimental Aid Post, Base Hospital, Advanced Dressing Station"],"why":"Each stage was further from the front line."},{"id":"hist-092","subject":"GCSE History","unit":"Paper 1: The British sector of the Western Front, 1914-18","topic":"The RAMC and the chain of evacuation","q":"What does RAMC stand for?","a":"Royal Army Medical Corps","w":["Royal Army Medical Care","Regimental Aid Medical Corps","Royal Air Medical Corps"],"why":"It provided medical care for the British Army."},{"id":"hist-093","subject":"GCSE History","unit":"Paper 1: The British sector of the Western Front, 1914-18","topic":"The RAMC and the chain of evacuation","q":"What was the FANY?","a":"A voluntary women's organisation providing nursing and ambulance driving","w":["The army's stretcher-bearer unit","A German medical corps","The Red Cross training school"],"why":"It stands for First Aid Nursing Yeomanry."},{"id":"hist-094","subject":"GCSE History","unit":"Paper 1: The British sector of the Western Front, 1914-18","topic":"Medical developments on the Western Front","q":"The Thomas splint was used to treat...","a":"Broken thigh bones (femurs)","w":["Head wounds","Broken ribs","Gas poisoning"],"why":"It cut the death rate for femur fractures sharply."},{"id":"hist-095","subject":"GCSE History","unit":"Paper 1: The British sector of the Western Front, 1914-18","topic":"Medical developments on the Western Front","q":"Where was the first blood depot set up in 1917?","a":"Cambrai","w":["Ypres","The Somme","Arras"],"why":"It was set up by Captain Oswald Robertson."},{"id":"hist-096","subject":"GCSE History","unit":"Paper 1: The British sector of the Western Front, 1914-18","topic":"Medical developments on the Western Front","q":"Which chemical helped stop blood clotting during transfusions?","a":"Sodium citrate","w":["Sodium chloride","Carbolic acid","Chlorine"],"why":"It allowed blood to be stored."},{"id":"hist-097","subject":"GCSE History","unit":"Paper 1: The British sector of the Western Front, 1914-18","topic":"Medical developments on the Western Front","q":"Who pioneered mobile X-ray units on the Western Front?","a":"Marie Curie","w":["Florence Nightingale","Alexander Fleming","Rosalind Franklin"],"why":"The vehicles were nicknamed 'petites Curies'."},{"id":"hist-098","subject":"GCSE History","unit":"Paper 1: The British sector of the Western Front, 1914-18","topic":"Medical developments on the Western Front","q":"What is debridement?","a":"Cutting away dead or infected tissue from a wound","w":["Sewing a wound closed","Amputating a limb","Giving a blood transfusion"],"why":"It helped to prevent infection."},{"id":"hist-099","subject":"GCSE History","unit":"Paper 1: The British sector of the Western Front, 1914-18","topic":"Knowledge, selection and use of sources","q":"When judging how useful a source is, historians consider its nature, origin and...","a":"Purpose","w":["Colour","Price","Size"],"why":"The content is also compared with what you know."},{"id":"hist-100","subject":"GCSE History","unit":"Paper 2: Superpower relations and the Cold War, 1941-91","topic":"The origins of the Cold War, 1941-58","q":"Who were the 'Big Three' at the Yalta Conference in 1945?","a":"Churchill, Roosevelt and Stalin","w":["Churchill, Truman and Stalin","Attlee, Truman and Stalin","Roosevelt, Stalin and Hitler"],"why":"Truman replaced Roosevelt by the Potsdam Conference."},{"id":"hist-101","subject":"GCSE History","unit":"Paper 2: Superpower relations and the Cold War, 1941-91","topic":"The origins of the Cold War, 1941-58","q":"The Truman Doctrine (1947) pledged to...","a":"Support countries resisting communism","w":["Withdraw US troops from Europe","Give Eastern Europe to the USSR","Build an atomic bomb"],"why":"This was the policy of containment."},{"id":"hist-102","subject":"GCSE History","unit":"Paper 2: Superpower relations and the Cold War, 1941-91","topic":"The origins of the Cold War, 1941-58","q":"The Marshall Plan offered...","a":"US economic aid to rebuild European countries","w":["Military support to the USSR","A blockade of Berlin","A new alliance called NATO"],"why":"Stalin refused it for the Eastern bloc."},{"id":"hist-103","subject":"GCSE History","unit":"Paper 2: Superpower relations and the Cold War, 1941-91","topic":"The origins of the Cold War, 1941-58","q":"The Berlin Blockade lasted from...","a":"1948 to 1949","w":["1945 to 1946","1961 to 1962","1956 to 1957"],"why":"The Western Allies responded with the Berlin Airlift."},{"id":"hist-104","subject":"GCSE History","unit":"Paper 2: Superpower relations and the Cold War, 1941-91","topic":"The origins of the Cold War, 1941-58","q":"NATO was formed in...","a":"1949","w":["1945","1955","1961"],"why":"The Warsaw Pact followed in 1955."},{"id":"hist-105","subject":"GCSE History","unit":"Paper 2: Superpower relations and the Cold War, 1941-91","topic":"The origins of the Cold War, 1941-58","q":"The Hungarian uprising of 1956 was crushed by...","a":"Soviet forces","w":["NATO troops","US forces","The United Nations"],"why":"Hungary had tried to leave the Warsaw Pact under Imre Nagy."},{"id":"hist-106","subject":"GCSE History","unit":"Paper 2: Superpower relations and the Cold War, 1941-91","topic":"Cold War crises, 1958-70","q":"The Berlin Wall was built in...","a":"1961","w":["1948","1958","1969"],"why":"It stopped East Germans fleeing to the West."},{"id":"hist-107","subject":"GCSE History","unit":"Paper 2: Superpower relations and the Cold War, 1941-91","topic":"Cold War crises, 1958-70","q":"The Cuban Missile Crisis took place in...","a":"1962","w":["1960","1965","1958"],"why":"It was the closest the world came to nuclear war."},{"id":"hist-108","subject":"GCSE History","unit":"Paper 2: Superpower relations and the Cold War, 1941-91","topic":"Cold War crises, 1958-70","q":"What was the US response to Soviet missiles on Cuba?","a":"A naval quarantine (blockade) of Cuba","w":["An immediat oviet Union collapsed in 1991."},{"id":"hist-120","subject":"GCSE History","unit":"Paper 2: Anglo-Saxon and Norman England, c1060-88","topic":"Anglo-Saxon England and the Norman Conquest, 1060-66","q":"Which three men claimed the English throne after Edward the Confessor died?","a":"Harold Godwinson, William of Normandy and Harald Hardrada","w":["Edwin, Morcar and William","Tostig, Cnut and William","Harold, William and Robert Curthose"],"why":"Edward died in January 1066 without an heir."},{"id":"hist-121","subject":"GCSE History","unit":"Paper 2: Anglo-Saxon and Norman England, c1060-88","topic":"Anglo-Saxon England and the Norman Conquest, 1060-66","q":"What was the Witan?","a":"A council of nobles and bishops that advised the king","w":["A type of castle","A Norman tax","The royal guard"],"why":"It chose the next king when there was no clear heir."},{"id":"hist-122","subject":"GCSE History","unit":"Paper 2: Anglo-Saxon and Norman England, c1060-88","topic":"Anglo-Saxon England and the Norman Conquest, 1060-66","q":"Where did Harold Godwinson defeat Harald Hardrada in September 1066?","a":"Stamford Bridge","w":["Gate Fulford","Hastings","Ely"],"why":"Hardrada had beaten Edwin and Morcar at Gate Fulford."},{"id":"hist-123","subject":"GCSE History","unit":"Paper 2: Anglo-Saxon and Norman England, c1060-88","topic":"Anglo-Saxon England and the Norman Conquest, 1060-66","q":"Edward the Confessor died in...","a":"January 1066","w":["October 1066","1064","1087"],"why":"Harold was crowned soon after."},{"id":"hist-124","subject":"GCSE History","unit":"Paper 2: Anglo-Saxon and Norman England, c1060-88","topic":"William I in power: securing the kingdom, 1066-87","q":"The Battle of Hastings took place on...","a":"14 October 1066","w":["25 September 1066","25 December 1066","1 January 1067"],"why":"William was crowned king on Christmas Day 1066."},{"id":"hist-125","subject":"GCSE History","unit":"Paper 2: Anglo-Saxon and Norman England, c1060-88","topic":"William I in power: securing the kingdom, 1066-87","q":"What was the Harrying of the North?","a":"William's brutal campaign in 1069-70 to crush rebellion in northern England","w":["The Norman invasion of Scotland","A tax on northern lords","The building of Durham Cathedral"],"why":"Villages were burned and crops destroyed."},{"id":"hist-126","subject":"GCSE History","unit":"Paper 2: Anglo-Saxon and Norman England, c1060-88","topic":"William I in power: securing the kingdom, 1066-87","q":"Why did the Normans build motte and bailey castles?","a":"To control the conquered land quickly","w":["To store the Domesday Book","To house the English earls","To defend against the Vikings only"],"why":"They could be built quickly out of earth and timber."},{"id":"hist-127","subject":"GCSE History","unit":"Paper 2: Anglo-Saxon and Norman England, c1060-88","topic":"William I in power: securing the kingdom, 1066-87","q":"Where did Hereward the Wake lead resistance against William?","a":"The Isle of Ely","w":["Durham","York","Exeter"],"why":"He was defeated in 1071."},{"id":"hist-128","subject":"GCSE History","unit":"Paper 2: Anglo-Saxon and Norman England, c1060-88","topic":"William I in power: securing the kingdom, 1066-87","q":"The Revolt of the Earls took place in...","a":"1075","w":["1066","1088","1086"],"why":"It was led by Ralph de Gael, Roger de Breteuil and Waltheof."},{"id":"hist-129","subject":"GCSE History","unit":"Paper 2: Anglo-Saxon and Norman England, c1060-88","topic":"William I in power: securing the kingdom, 1066-87","q":"Why did William win the Battle of Hastings?","a":"Harold's tired army broke the shield wall after Norman feigned retreats","w":["The Normans outnumbered the English by four to one","Harold refused to fight","The English fleet was destroyed"],"why":"Harold had just marched south after Stamford Bridge."},{"id":"hist-130","subject":"GCSE History","unit":"Paper 2: Anglo-Saxon and Norman England, c1060-88","topic":"Norman England, 1066-88","q":"The Domesday Book was compiled in...","a":"1086","w":["1066","1070","1087"],"why":"It recorded land, resources and ownership for taxation."},{"id":"hist-131","subject":"GCSE History","unit":"Paper 2: Anglo-Saxon and Norman England, c1060-88","topic":"Norman England, 1066-88","q":"In the feudal system, tenants-in-chief held their land directly from...","a":"The king","w":["The Pope","The barons","The peasants"],"why":"They provided knights in return."},{"id":"hist-132","subject":"GCSE History","unit":"Paper 2: Anglo-Saxon and Norman England, c1060-88","topic":"Norman England, 1066-88","q":"Who did William appoint Archbishop of Canterbury in 1070?","a":"Lanfranc","w":["Stigand","Odo","Anselm"],"why":"Stigand had been removed."},{"id":"hist-133","subject":"GCSE History","unit":"Paper 2: Anglo-Saxon and Norman England, c1060-88","topic":"Norman England, 1066-88","q":"William I died in...","a":"1087","w":["1086","1066","1100"],"why":"His sons Robert and William Rufus divided his lands."},{"id":"hist-134","subject":"GCSE History","unit":"Paper 2: Anglo-Saxon and Norman England, c1060-88","topic":"Norman England, 1066-88","q":"Who became king of England after William I died?","a":"William Rufus (William II)","w":["Robert Curthose","Henry","Stephen"],"why":"Robert Curthose received Normandy."},{"id":"hist-135","subject":"GCSE History","unit":"Paper 2: Anglo-Saxon and Norman England, c1060-88","topic":"Norman England, 1066-88","q":"Who was Odo of Bayeux?","a":"William's half-brother, who led a rebellion in 1088","w":["The Archbishop of York","An Anglo-Saxon earl","William's eldest son"],"why":"He was Earl of Kent and Bishop of Bayeux."},{"id":"hist-136","subject":"GCSE History","unit":"Paper 2: Anglo-Saxon and Norman England, c1060-88","topic":"Norman England, 1066-88","q":"Which group was at the bottom of the feudal system?","a":"Peasants","w":["Knights","Barons","Bishops"],"why":"They worked the land for their lord."},{"id":"hist-137","subject":"GCSE History","unit":"Paper 2: Anglo-Saxon and Norman England, c1060-88","topic":"Norman England, 1066-88","q":"What was the role of a sheriff?","a":"A royal official who ran a shire, collecting taxes and keeping order","w":["A church official","A Norman knight","A tenant-in-chief"],"why":"Sheriffs reported to the king."},{"id":"phys-001","subject":"Physics","unit":"6.1 Energy","topic":"Energy stores and systems","q":"An electric kettle heats water. What is the main energy transfer?","a":"Electrical to thermal","w":["Chemical to kinetic","Kinetic to sound","Nuclear to light"],"why":"Energy is transferred to the thermal store of the water."},{"id":"phys-002","subject":"Physics","unit":"6.1 Energy","topic":"Energy stores and systems","q":"What is a closed system?","a":"A system where no energy enters or leaves, so the total energy does not change","w":["A system that loses energy to the surroundings","A system with no energy","A system that makes energy"],"why":"Energy can still be transferred between stores inside it."},{"id":"phys-003","subject":"Physics","unit":"6.1 Energy","topic":"Kinetic and potential energy","q":"What is the kinetic energy of a 1000 kg car travelling at 20 m/s?","a":"200 000 J","w":["20 000 J","400 000 J","10 000 J"],"why":"KE = ½ × m × v² = 0.5 × 1000 × 400."},{"id":"phys-004","subject":"Physics","unit":"6.1 Energy","topic":"Kinetic and potential energy","q":"A 2 kg object is lifted 5 m. How much gravitational potential energy does it gain? (g = 10 N/kg)","a":"100 J","w":["10 J","50 J","20 J"],"why":"GPE = m × g × h."},{"id":"phys-005","subject":"Physics","unit":"6.1 Energy","topic":"Kinetic and potential energy","q":"A spring (k = 100 N/m) is stretched by 0.2 m. How much elastic potential energy is stored?","a":"2 J","w":["20 J","4 J","0.4 J"],"why":"E = ½ × k × e² = 0.5 × 100 × 0.04."},{"id":"phys-006","subject":"Physics","unit":"6.1 Energy","topic":"Specific heat capacity","q":"How much energy is needed to heat 0.5 kg of water by 20°C? (c = 4200 J/kg°C)","a":"42 000 J","w":["4200 J","84 000 J","2100 J"],"why":"ΔE = m × c × Δθ."},{"id":"phys-007","subject":"Physics","unit":"6.1 Energy","topic":"Specific heat capacity","q":"What does a high specific heat capacity tell you about a material?","a":"A lot of energy is needed to raise its temperature","w":["It heats up very quickly","It conducts well","It melts easily"],"why":"Water has a high specific heat capacity."},{"id":"phys-008","subject":"Physics","unit":"6.1 Energy","topic":"Power","q":"3000 J of energy is transferred in 60 s. What is the power?","a":"50 W","w":["180 000 W","20 W","500 W"],"why":"P = E ÷ t."},{"id":"phys-009","subject":"Physics","unit":"6.1 Energy","topic":"Power","q":"One watt is equal to one...","a":"Joule per second","w":["Joule per metre","Newton per second","Volt per amp"],"why":"Power is the rate of energy transfer."},{"id":"phys-010","subject":"Physics","unit":"6.1 Energy","topic":"Conservation and dissipation of energy","q":"How does thicker wall insulation affect the rate of thermal energy loss?","a":"It reduces it because the material has a lower thermal conductivity or is thicker","w":["It increases it","It does not change it","It stops all energy loss"],"why":"A lower conductivity or greater thickness reduces energy transfer."},{"id":"phys-011","subject":"Physics","unit":"6.1 Energy","topic":"Conservation and dissipation of energy","q":"Why does lubrication make a machine more efficient?","a":"It reduces friction and so wasted thermal energy","w":["It increases friction","It adds electrical energy","It makes the machine heavier"],"why":"Less energy is dissipated to the surroundings."},{"id":"phys-012","subject":"Physics","unit":"6.1 Energy","topic":"Efficiency","q":"A device wastes 120 J out of 160 J supplied. What is its efficiency?","a":"25%","w":["75%","40%","120%"],"why":"Useful output = 40 J; 40 ÷ 160 = 0.25."},{"id":"phys-013","subject":"Physics","unit":"6.1 Energy","topic":"National and global energy resources","q":"Which energy resource is non-renewable?","a":"Natural gas","w":["Wind","Tidal","Geothermal"],"why":"Fossil fuels and nuclear fuels will run out."},{"id":"phys-014","subject":"Physics","unit":"6.1 Energy","topic":"National and global energy resources","q":"Why is wind power considered unreliable?","a":"It depends on the weather","w":["It produces pollution","It uses fossil fuels","It is always too expensive"],"why":"Tidal power, by contrast, is predictable."},{"id":"phys-015","subject":"Physics","unit":"6.1 Energy","topic":"National and global energy resources","q":"Which advantage do nuclear power stations have over coal-fired stations?","a":"They produce no carbon dioxide during operation","w":["They produce no waste","They are cheap to decommission","They are renewable"],"why":"They do produce radioactive waste."},{"id":"phys-016","subject":"Physics","unit":"6.2 Electricity","topic":"Standard circuit diagram symbols","q":"An ammeter should be connected...","a":"In series with the component","w":["In parallel with the component","Across the battery only","It doesn't matter"],"why":"A voltmeter is connected in parallel."},{"id":"phys-017","subject":"Physics","unit":"6.2 Electricity","topic":"Standard circuit diagram symbols","q":"Which component's resistance decreases as light intensity increases?","a":"LDR","w":["Thermistor","Diode","Fuse"],"why":"It is used in automatic lights."},{"id":"phys-018","subject":"Physics","unit":"6.2 Electricity","topic":"Charge and current","q":"A current of 2 A flows for 30 s. How much charge flows?","a":"60 C","w":["15 C","32 C","0.07 C"],"why":"Q = I × t."},{"id":"phys-019","subject":"Physics","unit":"6.2 Electricity","topic":"Charge and current","q":"What is electric current?","a":"The rate of flow of electric charge","w":["The energy of a charge","The push of a battery","The opposition to charge flow"],"why":"1 A = 1 C/s."},{"id":"phys-020","subject":"Physics","unit":"6.2 Electricity","topic":"Current, resistance and potential difference","q":"A 3 Ω resistor has a current of 2 A. What is the potential difference across it?","a":"6 V","w":["1.5 V","5 V","0.67 V"],"why":"V = I × R."},{"id":"phys-021","subject":"Physics","unit":"6.2 Electricity","topic":"Current, resistance and potential difference","q":"If the length of a wire is doubled, its resistance...","a":"Doubles","w":["Halves","Stays the same","Quadruples"],"why":"Resistance is proportional to length."},{"id":"phys-022","subject":"Physics","unit":"6.2 Electricity","topic":"Resistance of components","q":"What does the I-V graph of a resistor at constant temperature look like?","a":"A straight line through the origin","w":["A curve","A horizontal line","A line that bends upwards"],"why":"It is an ohmic conductor."},{"id":"phys-023","subject":"Physics","unit":"6.2 Electricity","topic":"Resistance of components","q":"Why does the resistance of a filament lamp increase as the current increases?","a":"The filament gets hotter, so the ions vibrate more and electrons collide with them more","w":["The filament gets longer","Electrons are used up","The wire gets thicker"],"why":"The I-V graph curves."},{"id":"phys-024","subject":"Physics","unit":"6.2 Electricity","topic":"Series and parallel circuits","q":"A 4 Ω and a 6 Ω resistor are connected in series. What is the total resistance?","a":"10 Ω","w":["2.4 Ω","24 Ω","5 Ω"],"why":"Add the resistances in series."},{"id":"phys-025","subject":"Physics","unit":"6.2 Electricity","topic":"Series and parallel circuits","q":"Two identical 10 Ω resistors are connected in parallel. What is their total resistance?","a":"5 Ω","w":["20 Ω","10 Ω","2.5 Ω"],"why":"Total resistance in parallel is less than either resistor."},{"id":"phys-026","subject":"Physics","unit":"6.2 Electricity","topic":"Series and parallel circuits","q":"In a parallel circuit, the potential difference across each branch is...","a":"The same as the supply","w":["Shared between branches","Zero","Doubled"],"why":"The current splits between branches."},{"id":"phys-027","subject":"Physics","unit":"6.2 Electricity","topic":"Mains electricity","q":"Which is the colour of the neutral wire?","a":"Blue","w":["Brown","Green and yellow","Red"],"why":"Live is brown; earth is green and yellow."},{"id":"phys-028","subject":"Physics","unit":"6.2 Electricity","topic":"Mains electricity","q":"What happens in a fuse if the current is too high?","a":"The wire melts and breaks the circuit","w":["The current doubles","The potential difference increases","The earth wire disconnects"],"why":"It prevents overheating and fires."},{"id":"phys-029","subject":"Physics","unit":"6.2 Electricity","topic":"Mains electricity","q":"Why is touching a live wire dangerous?","a":"There is a large potential difference between the live wire and the Earth, so current can flow through you","w":["The wire is blue","The wire has no current","It is always grounded"],"why":"The neutral wire is at about 0 V."},{"id":"phys-030","subject":"Physics","unit":"6.2 Electricity","topic":"Energy transfers and power","q":"A kettle has 230 V across it and a current of 5 A. What is its power?","a":"1150 W","w":["46 W","235 W","11 500 W"],"why":"P = V × I."},{"id":"phys-031","subject":"Physics","unit":"6.2 Electricity","topic":"Energy transfers and power","q":"A 2 kW kettle is on for 3 minutes. How much energy does it transfer?","a":"360 000 J","w":["6000 J","120 J","6 000 000 J"],"why":"E = P × t = 2000 × 180."},{"id":"phys-032","subject":"Physics","unit":"6.2 Electricity","topic":"Energy transfers and power","q":"A current of 2 A flows through a 5 Ω resistor. What is the power dissipated?","a":"20 W","w":["10 W","50 W","2.5 W"],"why":"P = I² × R = 4 × 5."},{"id":"phys-033","subject":"Physics","unit":"6.2 Electricity","topic":"The National Grid","q":"Why is the potential difference stepped down near homes?","a":"For safety, and so that appliances can use the lower voltage","w":["To increase the current","To make cables thinner","To increase power losses"],"why":"Step-down transformers reduce the potential difference to 230 V."},{"id":"phys-034","subject":"Physics","unit":"6.2 Electricity","topic":"The National Grid","q":"What is the effect of a step-up transformer on current?","a":"It reduces the current, so less energy is lost as heat in the cables","w":["It increases the current","It has no effect on current","It stops the current"],"why":"Power = V × I, so higher V means lower I for the same power."},{"id":"phys-035","subject":"Physics","unit":"6.2 Electricity","topic":"Static electricity","q":"A polythene rod is rubbed with a cloth and becomes negatively charged. What happened?","a":"Electrons moved from the cloth to the rod","w":["Protons moved to the rod","Electrons moved from the rod to the cloth","Neutrons moved to the cloth"],"why":"Only electrons move in static charging."},{"id":"phys-036","subject":"Physics","unit":"6.2 Electricity","topic":"Static electricity","q":"Why does earthing remove a static charge?","a":"Electrons flow to or from the Earth","w":["Protons flow to the Earth","The charge disappears","The rod cools"],"why":"Earthing allows charge to flow to the ground."},{"id":"phys-037","subject":"Physics","unit":"6.2 Electricity","topic":"Electric fields","q":"Where is the electric field strength strongest around a charged object?","a":"Closest to the object","w":["Far from the object","It is the same everywhere","Only inside the object"],"why":"Field strength falls with distance."},{"id":"phys-038","subject":"Physics","unit":"6.3 Particle model of matter","topic":"Density of materials","q":"A block has a mass of 800 g and a volume of 100 cm³. What is its density?","a":"8 g/cm³","w":["0.125 g/cm³","80 g/cm³","700 g/cm³"],"why":"Density = mass ÷ volume."},{"id":"phys-039","subject":"Physics","unit":"6.3 Particle model of matter","topic":"Density of materials","q":"How can the volume of an irregular solid be found?","a":"By displacement of water","w":["By weighing it","With a ruler only","By heating it"],"why":"The rise in water level equals its volume."},{"id":"phys-040","subject":"Physics","unit":"6.3 Particle model of matter","topic":"Changes of state and internal energy","q":"What is internal energy?","a":"The total kinetic and potential energy of all the particles in a system","w":["The kinetic energy of the container","The temperature","The energy of one particle"],"why":"Heating a system increases its internal energy."},{"id":"phys-041","subject":"Physics","unit":"6.3 Particle model of matter","topic":"Changes of state and internal energy","q":"Why is a change of state a physical change?","a":"The material recovers its original properties and mass when the change is reversed","w":["A new substance forms","Mass is lost","It cannot be reversed"],"why":"The particles are just rearranged."},{"id":"phys-042","subject":"Physics","unit":"6.3 Particle model of matter","topic":"Specific latent heat","q":"How much energy is needed to melt 0.5 kg of ice? (L = 334 kJ/kg)","a":"167 kJ","w":["334 kJ","668 kJ","83.5 kJ"],"why":"E = m × L."},{"id":"phys-043","subject":"Physics","unit":"6.3 Particle model of matter","topic":"Specific latent heat","q":"During boiling, the temperature stays constant because...","a":"Energy goes into breaking the bonds between particles, not raising temperature","w":["The heat is lost","The water cools","The pressure falls"],"why":"Latent heat changes the potential energy of the particles."},{"id":"phys-044","subject":"Physics","unit":"6.3 Particle model of matter","topic":"Particle motion in gases","q":"Why does heating a gas at constant volume increase its pressure?","a":"Particles move faster, colliding with the walls more often and with greater force","w":["Particles get bigger","There are more particles","Particles stop moving"],"why":"The average kinetic energy increases with temperature."},{"id":"phys-045","subject":"Physics","unit":"6.3 Particle model of matter","topic":"Particle motion in gases","q":"What does the temperature of a gas measure?","a":"The average kinetic energy of its particles","w":["The number of particles","The size of the particles","The volume of the gas"],"why":"Higher temperature means faster particles."},{"id":"phys-046","subject":"Physics","unit":"6.3 Particle model of matter","topic":"Pressure in gases","q":"A gas at 100 kPa and 4 dm³ is compressed to 2 dm³ at constant temperature. What is the new pressure?","a":"200 kPa","w":["50 kPa","400 kPa","100 kPa"],"why":"pV = constant."},{"id":"phys-047","subject":"Physics","unit":"6.3 Particle model of matter","topic":"Pressure in gases","q":"Why does a bicycle pump get warm when it is used?","a":"Work is done on the gas, increasing its internal energy","w":["Friction on the handle only","The gas is cooled","The air is heavier"],"why":"Compressing a gas transfers energy to it."},{"id":"phys-048","subject":"Physics","unit":"6.4 Atomic structure","topic":"The structure of an atom","q":"What is the approximate radius of a nucleus compared with an atom?","a":"Less than 1/10 000 of the atom's radius","w":["About half","About one tenth","The same"],"why":"Most of an atom is empty space."},{"id":"phys-049","subject":"Physics","unit":"6.4 Atomic structure","topic":"The structure of an atom","q":"What happens when an electron absorbs electromagnetic radiation?","a":"It moves to a higher energy level","w":["It leaves the nucleus","It becomes a neutron","It turns into a proton"],"why":"It emits radiation when it falls back."},{"id":"phys-050","subject":"Physics","unit":"6.4 Atomic structure","topic":"Development of the model of the atom","q":"Which model came before Rutherford's nuclear model?","a":"The plum pudding model","w":["The Bohr model","The quantum model","The Dalton model of the nucleus"],"why":"Thomson proposed the plum pudding model."},{"id":"phys-051","subject":"Physics","unit":"6.4 Atomic structure","topic":"Radioactive decay and nuclear radiation","q":"What happens to the mass number and atomic number when an atom emits an alpha particle?","a":"Mass number falls by 4 and atomic number by 2","w":["Mass number falls by 2 and atomic number by 4","Both stay the same","Mass number is unchanged and atomic number rises by 1"],"why":"An alpha particle is 2 protons and 2 neutrons."},{"id":"phys-052","subject":"Physics","unit":"6.4 Atomic structure","topic":"Radioactive decay and nuclear radiation","q":"What happens to the nucleus during beta decay?","a":"A neutron turns into a proton and an electron is emitted","w":["A proton turns into a neutron","Two protons are lost","Nothing changes"],"why":"The mass number stays the same; the atomic number goes up by 1."},{"id":"phys-053","subject":"Physics","unit":"6.4 Atomic structure","topic":"Radioactive decay and nuclear radiation","q":"What stops beta particles?","a":"A few millimetres of aluminium","w":["A sheet of paper","A few centimetres of lead","Nothing; they pass through everything"],"why":"Alpha is stopped by paper; gamma needs thick lead or concrete."},{"id":"phys-054","subject":"Physics","unit":"6.4 Atomic structure","topic":"Half-life","q":"A sample has an activity of 1600 Bq and a half-life of 5 days. What is its activity after 15 days?","a":"200 Bq","w":["800 Bq","400 Bq","100 Bq"],"why":"15 days is 3 half-lives: 1600 → 800 → 400 → 200."},{"id":"phys-055","subject":"Physics","unit":"6.4 Atomic structure","topic":"Half-life","q":"After 3 half-lives, what fraction of the original radioactive nuclei remains?","a":"1/8","w":["1/3","1/6","1/4"],"why":"Each half-life halves the number."},{"id":"phys-056","subject":"Physics","unit":"6.4 Atomic structure","topic":"Hazards and uses of radiation; contamination and irradiation","q":"Which is the key difference between contamination and irradiation?","a":"Contamination is radioactive atoms getting on or in an object; irradiation is exposure without contact","w":["They are the same thing","Irradiation is only caused by alpha","Contamination only happens in labs"],"why":"Contamination continues to irradiate the person."},{"id":"phys-057","subject":"Physics","unit":"6.4 Atomic structure","topic":"Hazards and uses of radiation; contamination and irradiation","q":"Why are medical tracers made from gamma emitters with short half-lives?","a":"Gamma passes out of the body and short half-lives limit exposure","w":["Alpha is more penetrating","Beta is stopped by skin","Short half-lives make the source last longer"],"why":"They must be detected outside the body and not stay radioactive for long."},{"id":"phys-058","subject":"Physics","unit":"6.4 Atomic structure","topic":"Background radiation and half-life uses","q":"Which is a natural source of background radiation?","a":"Radon gas from rocks","w":["Nuclear power stations","X-rays","Smoke alarms"],"why":"Cosmic rays and food also contribute."},{"id":"phys-059","subject":"Physics","unit":"6.4 Atomic structure","topic":"Background radiation and half-life uses","q":"Which type of radiation is used in smoke alarms?","a":"Alpha","w":["Beta","Gamma","X-rays"],"why":"Alpha ionises the air; smoke reduces the current and triggers the alarm."},{"id":"phys-060","subject":"Physics","unit":"6.4 Atomic structure","topic":"Nuclear fission and fusion","q":"What is the role of control rods in a nuclear reactor?","a":"They absorb neutrons to control the chain reaction","w":["They slow neutrons down","They cool the reactor","They carry the fuel"],"why":"Boron or cadmium rods are lowered or raised."},{"id":"phys-061","subject":"Physics","unit":"6.4 Atomic structure","topic":"Nuclear fission and fusion","q":"Why does nuclear fusion need very high temperatures and pressures?","a":"To overcome the electrostatic repulsion between nuclei","w":["To split nuclei","To slow neutrons","To make the nuclei stable"],"why":"This is why fusion occurs in stars."},{"id":"phys-062","subject":"Physics","unit":"6.1 Energy","topic":"Energy stores and systems","q":"A ball rolls down a hill. Which energy transfer happens?","a":"Gravitational potential to kinetic","w":["Kinetic to gravitational potential","Chemical to elastic","Thermal to nuclear"],"why":"Some energy is also dissipated as thermal energy by friction."},{"id":"phys-063","subject":"Physics","unit":"6.1 Energy","topic":"Energy stores and systems","q":"Which of these is an energy store?","a":"Elastic potential","w":["Heating","Waves","Electric current"],"why":"Heating, waves and current are ways energy is transferred."},{"id":"phys-064","subject":"Physics","unit":"6.1 Energy","topic":"Kinetic and potential energy","q":"What is the kinetic energy of a 2 kg object moving at 3 m/s?","a":"9 J","w":["6 J","18 J","3 J"],"why":"KE = 0.5 x m x v^2 = 0.5 x 2 x 9."},{"id":"phys-065","subject":"Physics","unit":"6.1 Energy","topic":"Kinetic and potential energy","q":"What is the gravitational potential energy gained by a 5 kg mass raised 2 m? (g = 10 N/kg)","a":"100 J","w":["10 J","50 J","25 J"],"why":"GPE = m x g x h = 5 x 10 x 2."},{"id":"phys-066","subject":"Physics","unit":"6.1 Energy","topic":"Kinetic and potential energy","q":"Which equation gives the elastic potential energy of a stretched spring?","a":"0.5 x k x e^2","w":["k x e","0.5 x m x v^2","m x g x h"],"why":"k is the spring constant and e is the extension."},{"id":"phys-067","subject":"Physics","unit":"6.1 Energy","topic":"Specific heat capacity","q":"What is the unit of specific heat capacity?","a":"J/kg C","w":["J/kg","J C","kg/J"],"why":"It is the energy needed to raise 1 kg by 1 C."},{"id":"phys-068","subject":"Physics","unit":"6.1 Energy","topic":"Specific heat capacity","q":"How much energy is needed to heat 2 kg of water by 10 C? (c = 4200 J/kg C)","a":"84 000 J","w":["8400 J","42 000 J","420 000 J"],"why":"E = m x c x change in temperature = 2 x 4200 x 10."},{"id":"phys-069","subject":"Physics","unit":"6.1 Energy","topic":"Power","q":"Power is...","a":"The rate of energy transfer","w":["The total energy transferred","Force multiplied by distance","Energy multiplied by time"],"why":"Measured in watts (J/s)."},{"id":"phys-070","subject":"Physics","unit":"6.1 Energy","topic":"Power","q":"A 60 W bulb is on for 10 s. How much energy does it transfer?","a":"600 J","w":["6 J","70 J","0.17 J"],"why":"E = P x t = 60 x 10."},{"id":"phys-071","subject":"Physics","unit":"6.1 Energy","topic":"Conservation and dissipation of energy","q":"Energy cannot be created or destroyed, only...","a":"Transferred or dissipated","w":["Created","Destroyed","Used up"],"why":"This is the principle of conservation of energy."},{"id":"phys-072","subject":"Physics","unit":"6.1 Energy","topic":"Conservation and dissipation of energy","q":"Which reduces unwanted energy transfer by friction?","a":"Lubricating moving parts","w":["Adding more friction","Using thinner insulation","Increasing the speed"],"why":"Thermal insulation reduces heat loss."},{"id":"phys-073","subject":"Physics","unit":"6.1 Energy","topic":"Efficiency","q":"A motor takes in 200 J and gives 150 J of useful output. What is its efficiency?","a":"75%","w":["25%","133%","50%"],"why":"Efficiency = useful output / total input."},{"id":"phys-074","subject":"Physics","unit":"6.1 Energy","topic":"Efficiency","q":"Efficiency can never be...","a":"More than 100%","w":["Less than 50%","Zero","A decimal"],"why":"Some energy is always dissipated."},{"id":"phys-075","subject":"Physics","unit":"6.1 Energy","topic":"National and global energy resources","q":"Which is a renewable energy resource?","a":"Wind","w":["Coal","Oil","Natural gas"],"why":"Renewable resources will not run out."},{"id":"phys-076","subject":"Physics","unit":"6.1 Energy","topic":"National and global energy resources","q":"A disadvantage of solar power is that it...","a":"Only works well when it is sunny","w":["Produces carbon dioxide","Needs uranium","Uses up fuel"],"why":"It also has a high initial cost."},{"id":"phys-077","subject":"Physics","unit":"6.2 Electricity","topic":"Standard circuit diagram symbols","q":"Which component measures current?","a":"An ammeter connected in series","w":["A voltmeter connected in series","A thermistor","A resistor"],"why":"A voltmeter is connected in parallel."},{"id":"phys-078","subject":"Physics","unit":"6.2 Electricity","topic":"Charge and current","q":"A current of 3 A flows for 10 s. How much charge flows?","a":"30 C","w":["0.3 C","13 C","3.3 C"],"why":"Q = I x t."},{"id":"phys-079","subject":"Physics","unit":"6.2 Electricity","topic":"Current, resistance and potential difference","q":"A component has 12 V across it and 3 A through it. What is its resistance?","a":"4 ohms","w":["36 ohms","0.25 ohms","9 ohms"],"why":"R = V / I."},{"id":"phys-080","subject":"Physics","unit":"6.2 Electricity","topic":"Current, resistance and potential difference","q":"Which equation links potential difference, current and resistance?","a":"V = I x R","w":["V = I / R","I = V x R","R = I x V"],"why":"Potential difference is measured in volts."},{"id":"phys-081","subject":"Physics","unit":"6.2 Electricity","topic":"Resistance of components","q":"As temperature increases, the resistance of a thermistor...","a":"Decreases","w":["Increases","Stays the same","Doubles"],"why":"Thermistors are used in temperature sensors."},{"id":"phys-082","subject":"Physics","unit":"6.2 Electricity","topic":"Resistance of components","q":"The I-V graph of a filament lamp is...","a":"Curved, because resistance increases as it heats up","w":["A straight line through the origin","A horizontal line","A vertical line"],"why":"A fixed resistor gives a straight line."},{"id":"phys-083","subject":"Physics","unit":"6.2 Electricity","topic":"Resistance of components","q":"A diode allows current to flow...","a":"In one direction only","w":["In both directions","In neither direction","Only when it is hot"],"why":"Diodes have very high resistance in the reverse direction."},{"id":"phys-084","subject":"Physics","unit":"6.2 Electricity","topic":"Series and parallel circuits","q":"In a series circuit, the current is...","a":"The same everywhere","w":["Shared between components","Greatest at the start","Zero at the end"],"why":"The potential difference is shared."},{"id":"phys-085","subject":"Physics","unit":"6.2 Electricity","topic":"Series and parallel circuits","q":"Two 6 ohm resistors are connected in series. What is the total resistance?","a":"12 ohms","w":["3 ohms","6 ohms","36 ohms"],"why":"Resistances in series add together."},{"id":"phys-086","subject":"Physics","unit":"6.2 Electricity","topic":"Series and parallel circuits","q":"Adding another resistor in parallel makes the total resistance...","a":"Smaller","w":["Larger","The same","Infinite"],"why":"Current has more paths to flow through."},{"id":"phys-087","subject":"Physics","unit":"6.2 Electricity","topic":"Mains electricity","q":"What are the potential difference and frequency of UK mains?","a":"230 V and 50 Hz","w":["110 V and 60 Hz","230 V and 60 Hz","12 V and 50 Hz"],"why":"Mains supply is alternating current."},{"id":"phys-088","subject":"Physics","unit":"6.2 Electricity","topic":"Mains electricity","q":"What colour is the live wire?","a":"Brown","w":["Blue","Green and yellow","Black"],"why":"Neutral is blue and earth is green and yellow."},{"id":"phys-089","subject":"Physics","unit":"6.2 Electricity","topic":"Mains electricity","q":"What is the purpose of the earth wire?","a":"To stop the casing becoming live if there is a fault","w":["To carry current back to the supply","To increase the current","To make the appliance work faster"],"why":"It carries current safely to the ground."},{"id":"phys-090","subject":"Physics","unit":"6.2 Electricity","topic":"Energy transfers and power","q":"What is the power of a device with 230 V across it and 2 A through it?","a":"460 W","w":["115 W","232 W","4600 W"],"why":"P = V x I."},{"id":"phys-091","subject":"Physics","unit":"6.2 Electricity","topic":"Energy transfers and power","q":"How much energy is transferred when 5 C of charge moves through 12 V?","a":"60 J","w":["2.4 J","17 J","0.42 J"],"why":"E = Q x V."},{"id":"phys-092","subject":"Physics","unit":"6.2 Electricity","topic":"The National Grid","q":"Why does the National Grid transmit electricity at high potential difference?","a":"To reduce the current, so less energy is lost as heat","w":["To increase the current","To use thicker cables","To avoid using transformers"],"why":"Power loss depends on I^2 x R."},{"id":"phys-093","subject":"Physics","unit":"6.2 Electricity","topic":"The National Grid","q":"A step-up transformer is used at the power station to...","a":"Increase the potential difference for transmission","w":["Decrease the potential difference","Increase the current","Store electricity"],"why":"Step-down transformers near homes reduce it again."},{"id":"phys-094","subject":"Physics","unit":"6.2 Electricity","topic":"Static electricity","q":"When a balloon is rubbed on hair, it becomes charged because...","a":"Electrons are transferred from one surface to the other","w":["Protons move between them","Electrons are created","Charge is destroyed"],"why":"The object that gains electrons becomes negative."},{"id":"phys-095","subject":"Physics","unit":"6.2 Electricity","topic":"Static electricity","q":"Two positively charged objects will...","a":"Repel each other","w":["Attract each other","Have no effect on each other","Swap charge"],"why":"Like charges repel and unlike charges attract."},{"id":"phys-096","subject":"Physics","unit":"6.2 Electricity","topic":"Electric fields","q":"Electric field lines around a positive charge point...","a":"Away from the charge","w":["Towards the charge","In circles around it","Parallel to each other"],"why":"The field is strongest where the lines are closest."},{"id":"phys-097","subject":"Physics","unit":"6.3 Particle model of matter","topic":"Density of materials","q":"Density is calculated by...","a":"Mass divided by volume","w":["Volume divided by mass","Mass multiplied by volume","Weight divided by area"],"why":"Density = m / V."},{"id":"phys-098","subject":"Physics","unit":"6.3 Particle model of matter","topic":"Density of materials","q":"A block has a mass of 100 g and a volume of 50 cm3. What is its density?","a":"2 g/cm3","w":["0.5 g/cm3","5000 g/cm3","150 g/cm3"],"why":"100 / 50 = 2."},{"id":"phys-099","subject":"Physics","unit":"6.3 Particle model of matter","topic":"Changes of state and internal energy","q":"Internal energy is...","a":"The total kinetic and potential energy of all the particles","w":["Only the kinetic energy of the particles","The temperature of a substance","The energy stored in the bonds only"],"why":"Heating increases internal energy."},{"id":"phys-100","subject":"Physics","unit":"6.3 Particle model of matter","topic":"Changes of state and internal energy","q":"During melting, the temperature of a substance...","a":"Stays constant","w":["Rises steadily","Falls","Doubles"],"why":"The energy goes into breaking bonds, not raising temperature."},{"id":"phys-101","subject":"Physics","unit":"6.3 Particle model of matter","topic":"Specific latent heat","q":"Specific latent heat of fusion is the energy to...","a":"Change 1 kg of a substance from solid to liquid with no temperature change","w":["Change 1 kg from liquid to gas","Raise 1 kg by 1 C","Change 1 kg from gas to liquid"],"why":"Vaporisation is liquid to gas."},{"id":"phys-102","subject":"Physics","unit":"6.3 Particle model of matter","topic":"Specific latent heat","q":"How much energy is needed to melt 2 kg of ice? (L = 300 kJ/kg)","a":"600 kJ","w":["150 kJ","302 kJ","1200 kJ"],"why":"E = m x L."},{"id":"phys-103","subject":"Physics","unit":"6.3 Particle model of matter","topic":"Particle motion in gases","q":"Gas pressure is caused by...","a":"Particles colliding with the walls of the container","w":["Particles colliding with each other","The mass of the gas","Gravity on the particles"],"why":"More collisions or harder collisions mean higher pressure."},{"id":"phys-104","subject":"Physics","unit":"6.3 Particle model of matter","topic":"Particle motion in gases","q":"If a gas in a sealed container is heated, the pressure...","a":"Increases","w":["Decreases","Stays the same","Falls to zero"],"why":"The particles move faster and hit the walls harder and more often."},{"id":"phys-105","subject":"Physics","unit":"6.3 Particle model of matter","topic":"Pressure in gases","q":"At constant temperature, if the volume of a gas is halved, the pressure...","a":"Doubles","w":["Halves","Stays the same","Quadruples"],"why":"pressure x volume = constant."},{"id":"phys-106","subject":"Physics","unit":"6.4 Atomic structure","topic":"The structure of an atom","q":"What is the approximate radius of an atom?","a":"1 x 10^-10 m","w":["1 x 10^-15 m","1 x 10^-6 m","1 x 10^-2 m"],"why":"The nucleus is about 10,000 times smaller."},{"id":"phys-107","subject":"Physics","unit":"6.4 Atomic structure","topic":"The structure of an atom","q":"An electron moves to a higher energy level by...","a":"Absorbing electromagnetic radiation","w":["Emitting electromagnetic radiation","Gaining a proton","Losing a neutron"],"why":"It emits radiation when it falls back down."},{"id":"phys-108","subject":"Physics","unit":"6.4 Atomic structure","topic":"Development of the model of the atom","q":"Rutherford's scattering experiment showed that an atom has...","a":"A small, dense, positively charged nucleus","w":["Electrons spread through a ball of positive charge","Neutrons in the outer shell","A negative nucleus"],"why":"This replaced the plum pudding model."},{"id":"phys-109","subject":"Physics","unit":"6.4 Atomic structure","topic":"Radioactive decay and nuclear radiation","q":"Which type of radiation is the most ionising?","a":"Alpha","w":["Beta","Gamma","Radio waves"],"why":"Alpha is the least penetrating: a few cm of air stops it."},{"id":"phys-110","subject":"Physics","unit":"6.4 Atomic structure","topic":"Radioactive decay and nuclear radiation","q":"Which type of radiation is the most penetrating?","a":"Gamma","w":["Alpha","Beta","They are all equal"],"why":"Thick lead or concrete is needed to reduc
